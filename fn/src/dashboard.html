<script>
/**
 * Sheet display dates: ISO "2026-11-25" (as typed by the form) or Thai-locale day-first
 * "25/11/2026", "25/11/2569", "25-11-2026 10:00". Never month-first. Buddhist years (> 2400) -> AD.
 */
function parseSheetDate(v) {
  let s = String(v == null ? '' : v).trim(), y, m, d;
  let iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  let dmy = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
  if (iso) { y = +iso[1]; m = +iso[2]; d = +iso[3]; }
  else if (dmy) { d = +dmy[1]; m = +dmy[2]; y = +dmy[3]; }
  else return null;
  if (y > 2400) y -= 543;
  if (m < 1 || m > 12 || d < 1 || d > 31) return null;
  return new Date(y, m - 1, d);
}

function renderDashboard() {
  if (!window.globalData) return;
  
  const approvedData = window.globalData.filter(r => ['อนุมัติแล้ว', 'รอเปิด SO', 'รอเปิด Invoice', 'เสร็จสมบูรณ์'].includes(r[32]));
  
  // --- 1. Monthly Data ---
  const monthCounts = {};
  const monthNames = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  // FIX: เก็บ timestamp ด้วยเพื่อ sort ลำดับเวลาได้ถูกต้อง
  const monthTimestamps = {};
  approvedData.forEach(r => {
    let dateStr = r[1];
    if (dateStr) {
      let d = parseSheetDate(dateStr);
      if (d) {
        let m = d.getMonth();
        let y = d.getFullYear() + 543; // Thai year
        let key = monthNames[m] + ' ' + y.toString().substring(2);
        monthCounts[key] = (monthCounts[key] || 0) + 1;
        // เก็บ timestamp สำหรับ sort (ใช้วันที่ 1 ของเดือนนั้น)
        if (!monthTimestamps[key]) {
          monthTimestamps[key] = new Date(d.getFullYear(), m, 1).getTime();
        }
      }
    }
  });

  // FIX: sort เดือนตามลำดับเวลาจริง ไม่ใช้ Object.keys() ที่ไม่รับประกัน order
  const sortedMonthEntries = Object.entries(monthCounts).sort((a, b) => monthTimestamps[a[0]] - monthTimestamps[b[0]]);
  const sortedMonthLabels = sortedMonthEntries.map(e => e[0]);
  const sortedMonthValues = sortedMonthEntries.map(e => e[1]);

  
  // --- 2. Top Models ---
  const modelCounts = {};
  approvedData.forEach(r => {
    let model = r[15];
    if (model) {
      modelCounts[model] = (modelCounts[model] || 0) + 1;
    }
  });
  let sortedModels = Object.entries(modelCounts).sort((a, b) => b[1] - a[1]);
  
  // --- 3. Top 10 Branches ---
  const branchCounts = {};
  approvedData.forEach(r => {
    let branch = r[2];
    if (branch) {
      branchCounts[branch] = (branchCounts[branch] || 0) + 1;
    }
  });
  let sortedBranches = Object.entries(branchCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);
  
  // Render Charts
  // FIX: ใช้ sortedMonthLabels/Values ที่เรียงตามลำดับเวลาแล้ว
  renderChart('monthlyChart', 'bar', sortedMonthLabels, sortedMonthValues, 'ยอดขาย (รายการ)');

  renderChart('modelChart', 'doughnut', sortedModels.map(x => x[0]), sortedModels.map(x => x[1]), 'ยอดขาย (เครื่อง)');
  const financeCounts = {};
  approvedData.forEach(r => { const f = financeOf(r); financeCounts[f] = (financeCounts[f] || 0) + 1; });
  const sortedFinance = Object.entries(financeCounts).sort((a, b) => b[1] - a[1]);
  renderChart('financeChart', 'doughnut', sortedFinance.map(x => x[0]), sortedFinance.map(x => x[1]), 'จำนวน (รายการ)');
  renderChart('branchChart', 'bar', sortedBranches.map(x => x[0]), sortedBranches.map(x => x[1]), 'ยอดขาย (รายการ)');
}

let chartInstances = {};
function renderChart(canvasId, type, labels, data, label) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  
  if (chartInstances[canvasId]) {
    chartInstances[canvasId].destroy();
  }
  
  // one hue family for bars; a muted categorical set only where categories must be told apart (doughnut)
  const ACCENT = '#4b38b3';
  const CATEGORICAL = ['#4b38b3', '#45cb85', '#299cdb', '#ffbe0b', '#f06548', '#3577f1', '#878a99', '#7f6fd1', '#0ab39c', '#f7b84b'];
  const isDoughnut = type === 'doughnut';
  const font = { family: "'IBM Plex Sans Thai', system-ui, sans-serif", size: 12 };
  Chart.defaults.font = font;
  Chart.defaults.color = '#6b7785';

  chartInstances[canvasId] = new Chart(ctx, {
    type: type,
    data: {
      labels: labels,
      datasets: [{
        label: label,
        data: data,
        backgroundColor: isDoughnut ? CATEGORICAL : ACCENT,
        hoverBackgroundColor: isDoughnut ? CATEGORICAL : '#402fa0',
        borderColor: isDoughnut ? '#ffffff' : ACCENT,
        borderWidth: isDoughnut ? 2 : 0,
        borderRadius: isDoughnut ? 0 : 4,
        maxBarThickness: 36
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: isDoughnut ? '62%' : undefined,
      plugins: {
        legend: { display: isDoughnut, position: 'right', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'rectRounded' } },
        tooltip: { backgroundColor: '#17212b', padding: 10, cornerRadius: 6, displayColors: isDoughnut }
      },
      scales: isDoughnut ? {} : {
        x: { grid: { display: false }, border: { color: '#e3e7ec' } },
        y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#eef1f4' }, border: { display: false } }
      }
    }
  });
}
</script>

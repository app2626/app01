<script>
$(document).ready(function () {
  // Pre-2026-11 builds kept the role in localStorage with no server session; drop those keys.
  storageRemove('userName');
  storageRemove('userRole');

  if (!getToken()) {
    switchView('login-view');
    loadingEnd();
    return;
  }
  loadingStart();
  applyRoleUI(storageGet(FN_KEYS.role), storageGet(FN_KEYS.name));
  switchView('table-view');
  // Startup: an expired session goes straight to the login page instead of a dialog.
  callServerWith({ relogin: false }, 'getData', []).then(function (rows) {
    showData(rows);
    loadAllDropdowns();
  }).catch(function (err) {
    loadingEnd();
    if (/AUTH_REQUIRED/.test(errorText(err))) { resetRoleUI(); switchView('login-view'); return; }
    showError(err, 'ไม่สามารถโหลดข้อมูลได้');
  });
});

function login() {
  $('#login-error').hide();
  loadingStart();
  var username = $('#username').val();
  var pwd = $('#password').val();
  runServer('login', [username, pwd]).then(function (s) {
    $('#password').val('');
    if (!s) {
      loadingEnd();
      $('#login-error').show();
      return;
    }
    saveSession(s);
    applyRoleUI(s.role, s.name);
    switchView('table-view');
    getData();
    loadAllDropdowns();
  }).catch(function (err) {
    showError(err, 'ไม่สามารถเข้าสู่ระบบได้');
  });
}

// ---------- Self-registration (no token yet, so runServer like login) ----------
function showRegister() {
  $('#login-panel, #forgot-panel').hide(); $('#register-panel').show(); $('#register-error').hide();
  var $sel = $('#reg-branch');
  if (!$sel.data('select2')) {
    $sel.select2({ theme: 'bootstrap-5', width: '100%', placeholder: 'เลือกสาขา (พิมพ์เพื่อค้นหา)', closeOnSelect: false });
  }
  runServer('getRegisterOptions', []).then(function (o) {
    var keep = $sel.val() || [];
    $sel.empty();
    (o.branches || []).forEach(function (b) { $sel.append(new Option(b, b, false, keep.indexOf(b) >= 0)); });
    $sel.trigger('change');
  }).catch(function (err) { showError(err, 'โหลดรายชื่อสาขาไม่สำเร็จ'); });
  document.getElementById('reg-empId').focus();
}

function showLogin() {
  $('#register-panel, #forgot-panel').hide(); $('#login-panel').show();
}

// ---------- Forgot password: emailed 6-digit code, then a new password (no token) ----------
function showForgot() {
  $('#login-panel, #register-panel').hide(); $('#forgot-panel').show();
  if (!$('#fg-empId').val()) $('#fg-empId').val($('#username').val());
  forgotStep(1);
  document.getElementById('fg-empId').focus();
}

function forgotStep(n) {
  $('#forgot-error').hide();
  $('#forgot-form-1').toggle(n === 1);
  $('#forgot-form-2').toggle(n === 2);
  $('#forgot-sub').text(n === 1
    ? 'กรอกรหัสพนักงานและอีเมลที่ใช้ลงทะเบียน ระบบจะส่งรหัสยืนยัน 6 หลักไปที่อีเมลนั้น'
    : 'กรอกรหัสยืนยันจากอีเมล แล้วตั้งรหัสผ่านใหม่');
}

function forgotFail(msg, fieldId) {
  $('#forgot-error').html('<i class="fa-solid fa-circle-exclamation me-1"></i> ' + escHtml(msg)).show();
  if (fieldId) document.getElementById(fieldId).focus();
}

function sendResetCode() {
  var empId = $('#fg-empId').val().trim(), email = $('#fg-email').val().trim();
  $('#forgot-error').hide();
  if (!empId) return forgotFail('กรุณากรอกรหัสพนักงาน', 'fg-empId');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return forgotFail('รูปแบบอีเมลไม่ถูกต้อง', 'fg-email');
  var btn = document.getElementById('fg-send');
  btn.disabled = true;
  runServer('requestPasswordReset', [empId, email]).then(function (res) {
    btn.disabled = false;
    forgotStep(2);
    $('#forgot-sub').text(res.message);
    document.getElementById('fg-code').focus();
  }).catch(function (err) { btn.disabled = false; forgotFail(errorText(err)); });
}

function submitNewPassword() {
  var empId = $('#fg-empId').val().trim(), code = $('#fg-code').val().trim();
  var pwd = $('#fg-pwd').val(), pwd2 = $('#fg-pwd2').val();
  $('#forgot-error').hide();
  if (!/^\d{6}$/.test(code)) return forgotFail('รหัสยืนยันเป็นตัวเลข 6 หลัก', 'fg-code');
  if (pwd.length < 6) return forgotFail('รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร', 'fg-pwd');
  if (pwd !== pwd2) return forgotFail('ยืนยันรหัสผ่านไม่ตรงกัน', 'fg-pwd2');
  var btn = document.getElementById('fg-save');
  btn.disabled = true;
  runServer('resetPasswordWithCode', [empId, code, pwd]).then(function () {
    btn.disabled = false;
    $('#forgot-form-1')[0].reset(); $('#forgot-form-2')[0].reset();
    showLogin();
    $('#username').val(empId); $('#password').val('').focus();
    Swal.fire({ icon: 'success', title: 'ตั้งรหัสผ่านใหม่แล้ว', text: 'เข้าสู่ระบบด้วยรหัสผ่านใหม่ได้เลย' });
  }).catch(function (err) { btn.disabled = false; forgotFail(errorText(err)); });
}

function registerFail(msg, fieldId) {
  $('#register-error').html('<i class="fa-solid fa-circle-exclamation me-1"></i> ' + escHtml(msg)).show();
  if (fieldId) document.getElementById(fieldId).focus();
}

function submitRegister() {
  var v = function (id) { return document.getElementById(id).value.trim(); };
  var form = { empId: v('reg-empId'), name: v('reg-name'), email: v('reg-email'), phone: v('reg-phone').replace(/[\s-]/g, ''),
    branches: $('#reg-branch').val() || [], password: document.getElementById('reg-password').value };
  $('#register-error').hide();
  if (!/^[A-Za-z0-9._-]{2,30}$/.test(form.empId)) return registerFail('รหัสพนักงานใช้ได้เฉพาะ A-Z, 0-9, . _ - ยาว 2-30 ตัว', 'reg-empId');
  if (!form.name) return registerFail('กรุณากรอกชื่อ-สกุล', 'reg-name');
  if (!form.branches.length) { registerFail('กรุณาเลือกสาขาอย่างน้อย 1 สาขา'); $('#reg-branch').select2('open'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) return registerFail('รูปแบบอีเมลไม่ถูกต้อง', 'reg-email');
  if (!normalizePhone(form.phone)) return registerFail('เบอร์ติดต่อไม่ถูกต้อง: ' + PHONE_RULE_TEXT, 'reg-phone');
  if (form.password.length < 6) return registerFail('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'reg-password');
  if (form.password !== document.getElementById('reg-password2').value) return registerFail('ยืนยันรหัสผ่านไม่ตรงกัน', 'reg-password2');

  var btn = document.getElementById('register-submit');
  btn.disabled = true;
  runServer('register', [form]).then(function () {
    btn.disabled = false;
    document.getElementById('register-form').reset();
    $('#reg-branch').val(null).trigger('change');
    showLogin();
    $('#username').val(form.empId);
    Swal.fire({ icon: 'success', title: 'ส่งคำขอลงทะเบียนแล้ว',
      html: 'รหัสพนักงาน <b>' + escHtml(form.empId) + '</b><br>กรุณารอแอดมินอนุมัติ แล้วเข้าสู่ระบบด้วยรหัสพนักงานและรหัสผ่านที่ตั้งไว้' });
  }).catch(function (err) {
    btn.disabled = false;
    registerFail(errorText(err).replace(/^Error:\s*/, ''));
  });
}

function loadingStart() { $('#loading').removeClass('invisible'); }
function loadingEnd() { $('#loading').addClass('invisible'); }

function resetRoleUI() {
  $('.logout, .admin-only, .table-only, .dashboard-only').hide();
}

function logout() {
  Swal.fire({
    position: 'top',
    title: 'คุณต้องการออกจากระบบ?',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#198754',
    cancelButtonColor: '#d33',
    cancelButtonText: 'ยกเลิก',
    confirmButtonText: 'ตกลง'
  }).then(function (result) {
    if (!result.isConfirmed) return;
    var token = getToken();
    if (token) runServer('logout', [token]).catch(function () { });
    clearSession();
    // the next user must not inherit this user's half-filled request or employee details
    var f = document.getElementById('myForm');
    if (f) { f.reset(); $('#myForm .select2').val('').trigger('change'); }
    if (typeof profileApplied !== 'undefined') { profileApplied = {}; myProfile = null; }
    resetRoleUI();
    switchView('login-view');
    loadingEnd();
  });
}
</script>

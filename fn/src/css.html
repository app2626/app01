<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap');

  /* ---------- Design tokens (admin-dashboard style: indigo primary, navy header, white sidebar) ---------- */
  :root {
    --ink: #212529;
    --ink-2: #495057;
    --muted: #878a99;
    --line: #e9ebec;
    --line-soft: #f3f6f9;
    --surface: #ffffff;
    --canvas: #f3f3f9;
    --header: #1c1c36;
    --accent: #4b38b3;
    --accent-hover: #402fa0;
    --accent-soft: #e4e1f4;
    --ring: rgba(75, 56, 179, .25);
    --success: #45cb85;
    --radius-sm: 4px;
    --radius: 6px;
    --radius-lg: 8px;
    --shadow-sm: 0 1px 2px rgba(56, 65, 74, .15);
    --shadow: 0 5px 10px rgba(30, 32, 37, .12);
    --sidebar-w: 250px;
    --header-h: 64px;
    --z-nav: 1020;
    --z-loading: 1090;
    --z-swal: 1100;

    /* status palette (soft background / strong text) */
    --st-wait-bg: #fff5da;  --st-wait: #b07f00;
    --st-so-bg: #dff0fa;    --st-so: #1d7fb8;
    --st-inv-bg: #e4e1f4;   --st-inv: #4b38b3;
    --st-done-bg: #dff6ea;  --st-done: #2a9d63;
    --st-rej-bg: #fde8e4;   --st-rej: #d0472c;
    --st-all-bg: #eceef2;   --st-all: #495057;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', 'IBM Plex Sans Thai', system-ui, sans-serif;
    font-size: .84rem;
    line-height: 1.55;
    color: var(--ink);
    background-color: var(--canvas);
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4, h5, h6 { color: var(--ink); font-weight: 600; }
  .num, .kpi-value, input[type=number], table.dataTable td { font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }

  .swal2-container { z-index: var(--z-swal); }

  /* ---------- Bootstrap 5.1 overrides ---------- */
  .text-primary { color: var(--accent) !important; }
  .badge.bg-primary { background-color: var(--accent-soft) !important; color: var(--accent); font-weight: 500; }
  .btn { border-radius: var(--radius-sm); font-weight: 500; font-size: .84rem; transition: background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease; }
  .btn-sm { font-size: .78rem; }
  .btn:focus-visible, .form-control:focus, .form-select:focus { box-shadow: 0 0 0 .2rem var(--ring) !important; }
  .btn-primary { background-color: var(--accent); border-color: var(--accent); box-shadow: 0 3px 3px rgba(56, 65, 74, .1); }
  .btn-primary:hover, .btn-primary:focus { background-color: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-outline-primary { color: var(--accent); border-color: var(--accent); }
  .btn-outline-primary:hover { background-color: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-success { background-color: var(--success); border-color: var(--success); }
  .btn-light { background: var(--line-soft); border-color: var(--line-soft); color: var(--ink); }
  .btn-light:hover { background: #e9ecef; border-color: #e9ecef; }
  .nav-tabs .nav-link { color: var(--ink-2); font-weight: 500; border: none; border-bottom: 2px solid transparent; padding: .6rem 1rem; }
  .nav-tabs .nav-link:hover { color: var(--accent); border-bottom-color: transparent; }
  .nav-tabs .nav-link.active { color: var(--accent); background: transparent; border-bottom-color: var(--accent); }
  .nav-tabs { border-bottom: 1px solid var(--line); flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }

  /* ---------- Forms ---------- */
  label { font-size: .82rem; font-weight: 500; color: var(--ink); margin-bottom: .35rem; }
  .form-control, .form-select { border-color: #ced4da; border-radius: var(--radius-sm); padding: .47rem .9rem; font-size: .84rem; }
  .form-control:focus, .form-select:focus { border-color: #a59bd9; }
  .form-control[readonly] { background-color: var(--line-soft); }
  .input-group-text { background: var(--line-soft); border-color: #ced4da; color: var(--muted); }
  .select2-container--bootstrap-5 .select2-selection { border-color: #ced4da; border-radius: var(--radius-sm); min-height: calc(1.5em + .94rem + 2px); font-size: .84rem; }

  /* ---------- Surfaces ---------- */
  .card { border: none; border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; }
  .card-header { background: var(--surface); border-bottom: 1px solid var(--line); font-weight: 600; padding: 1rem 1.25rem; }
  .card-header:first-child { border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
  .card-body { padding: 1.25rem; }
  .section-title { font-size: .95rem; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: .6rem; margin: 0; }
  .section-title i { width: 32px; height: 32px; border-radius: var(--radius-sm); display: inline-grid; place-items: center; font-size: .85rem; color: var(--tone, var(--accent)); background: var(--tone-bg, var(--accent-soft)); flex-shrink: 0; }
  .section-sub { font-size: .78rem; color: var(--muted); font-weight: 400; }

  .page { width: 100%; padding: 1.5rem 1.5rem 2.5rem; }
  .page-narrow { max-width: 900px; margin: 0 auto; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .page-head h1 { font-size: 1rem; font-weight: 700; margin: 0; text-transform: uppercase; letter-spacing: .02em; }
  .page-head p { margin: .2rem 0 0; color: var(--muted); font-size: .8rem; }

  /* ---------- App shell: white sidebar + navy header ---------- */
  .min-w-0 { min-width: 0; }
  .app-sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; width: var(--sidebar-w); z-index: calc(var(--z-nav) + 1);
    background: var(--surface); box-shadow: 0 2px 4px rgba(15, 34, 58, .12);
    display: flex; flex-direction: column;
  }
  .app-sidebar .brand { height: var(--header-h); padding: 0 1.25rem; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .app-sidebar nav { padding: .75rem 0; overflow-y: auto; flex: 1; }
  .menu-title { font-size: .7rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #919da9; padding: .75rem 1.5rem .4rem; }
  .side-foot { padding: 1rem 1.25rem; border-top: 1px solid var(--line); }

  .topbar {
    position: fixed; top: 0; right: 0; left: var(--sidebar-w); height: var(--header-h); z-index: var(--z-nav);
    background: var(--header); box-shadow: 0 3px 3px rgba(56, 65, 74, .1);
  }
  .topbar-inner { height: 100%; padding: 0 1.5rem; display: flex; align-items: center; gap: .75rem; }
  .topbar .page-title { color: #fff; font-weight: 600; font-size: .9rem; letter-spacing: .01em; }
  .topbar .page-title small { display: block; color: rgba(255, 255, 255, .55); font-weight: 400; font-size: .72rem; }
  body.has-shell { padding-top: var(--header-h); padding-left: var(--sidebar-w); }
  body.has-shell, .topbar { transition: padding-left .2s ease, left .2s ease; }
  @media (min-width: 992px) {
    body.sidebar-collapsed .app-sidebar { display: none !important; }
    body.sidebar-collapsed .topbar { left: 0; }
    body.has-shell.sidebar-collapsed { padding-left: 0; }
  }

  .brand { display: flex; align-items: center; gap: .6rem; min-width: 0; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: var(--radius); flex-shrink: 0;
    background: var(--accent); color: #fff; display: grid; place-items: center;
    font-weight: 700; font-size: .78rem; letter-spacing: .02em;
  }
  .brand-name { font-weight: 700; font-size: .98rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  .brand-sub { font-size: .7rem; color: var(--muted); line-height: 1.2; }

  .user-chip { display: flex; align-items: center; gap: .6rem; margin-left: auto; height: 100%; padding: 0 1rem; background: rgba(255, 255, 255, .05); }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-weight: 600; font-size: .85rem; flex-shrink: 0;
  }
  .user-meta { line-height: 1.2; text-align: left; }
  .user-meta .n { font-weight: 600; font-size: .82rem; color: #fff; }
  .user-meta .r { font-size: .72rem; color: rgba(255, 255, 255, .55); }
  .icon-btn {
    width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%;
    border: none; background: transparent; color: rgba(255, 255, 255, .75); transition: background-color .15s, color .15s;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, .1); color: #fff; }

  /* ---------- Sidebar links ---------- */
  .side-link {
    display: flex; align-items: center; gap: .75rem; padding: .62rem 1.5rem;
    color: #6d7080; text-decoration: none; font-size: .9rem; font-weight: 500;
    transition: color .15s;
  }
  .side-link i { width: 18px; text-align: center; font-size: 1rem; }
  .side-link:hover { color: var(--accent); }
  .side-link.active { color: var(--accent); background: linear-gradient(90deg, var(--accent-soft), transparent 85%); box-shadow: inset 3px 0 0 var(--accent); }

  /* ---------- KPI tiles (tile-box: label, value, soft icon avatar on the right) ---------- */
  .kpi {
    position: relative; background: var(--surface); border: none; border-radius: var(--radius-sm);
    box-shadow: var(--shadow-sm); padding: 1rem 4.25rem 1rem 1.1rem; height: 100%; cursor: pointer; text-align: left; width: 100%;
    transition: box-shadow .2s, transform .2s;
    display: flex; flex-direction: column; gap: .4rem;
  }
  .kpi:hover { box-shadow: var(--shadow); transform: translateY(-3px); }
  .kpi.active { box-shadow: 0 0 0 2px var(--kpi-c), var(--shadow-sm); }
  .kpi-label { font-size: .72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .kpi-dot {
    position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: var(--radius); display: grid; place-items: center; font-size: 1.15rem;
    background: var(--kpi-bg); color: var(--kpi-c);
  }
  .kpi-value { font-size: 1.5rem; font-weight: 600; line-height: 1.1; color: var(--ink); }
  .kpi-wait { --kpi-bg: var(--st-wait-bg); --kpi-c: var(--st-wait); }
  .kpi-so   { --kpi-bg: var(--st-so-bg);   --kpi-c: var(--st-so); }
  .kpi-inv  { --kpi-bg: var(--st-inv-bg);  --kpi-c: var(--st-inv); }
  .kpi-done { --kpi-bg: var(--st-done-bg); --kpi-c: var(--st-done); }
  .kpi-rej  { --kpi-bg: var(--st-rej-bg);  --kpi-c: var(--st-rej); }
  .kpi-all  { --kpi-bg: var(--st-all-bg);  --kpi-c: var(--st-all); }

  /* ---------- Status badges (soft) ---------- */
  .st {
    display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .55rem; border-radius: var(--radius-sm);
    font-size: .72rem; font-weight: 600; white-space: nowrap; line-height: 1.3;
  }
  .st i { font-size: .68rem; }
  .st-wait { background: var(--st-wait-bg); color: var(--st-wait); }
  .st-so   { background: var(--st-so-bg);   color: var(--st-so); }
  .st-inv  { background: var(--st-inv-bg);  color: var(--st-inv); }
  .st-done { background: var(--st-done-bg); color: var(--st-done); }
  .st-rej  { background: var(--st-rej-bg);  color: var(--st-rej); }
  .sfont { font-size: .82rem; font-weight: 500; }
  .fin { display: inline-block; padding: .25rem .55rem; border-radius: var(--radius-sm); font-size: .72rem; font-weight: 600; white-space: nowrap; background: var(--accent-soft); color: var(--accent); }
  .finance-filter { width: auto; min-width: 170px; }

  /* ---------- Data table ---------- */
  .table-card { background: var(--surface); border-radius: var(--radius-sm); padding: 1.25rem; box-shadow: var(--shadow-sm); overflow-x: auto; }
  table.dataTable { border-collapse: separate !important; border-spacing: 0; width: 100% !important; }
  table.dataTable thead th {
    background: var(--line-soft) !important; color: var(--ink); font-weight: 600; font-size: .8rem;
    border-bottom: 1px solid var(--line) !important; padding: .75rem .9rem !important; white-space: nowrap;
  }
  table.dataTable tbody td { padding: .75rem .9rem !important; vertical-align: middle; border-bottom: 1px solid var(--line); color: var(--ink); }
  table.dataTable tbody tr:hover { background-color: var(--line-soft) !important; }
  table.dataTable.stripe tbody tr.odd, table.dataTable.display tbody tr.odd { background-color: var(--surface); }
  table.dataTable.display tbody tr.odd > *, table.dataTable.display tbody tr.even > * { box-shadow: none !important; }
  table.dataTable.no-footer { border-bottom: none; }
  table.dataTable td img { border-radius: var(--radius-sm); border: 1px solid var(--line); cursor: zoom-in; }
  .dataTables_wrapper .dataTables_filter input, .dataTables_wrapper .dataTables_length select {
    border: 1px solid #ced4da; border-radius: var(--radius-sm); padding: .3rem .6rem; background: var(--surface);
  }
  .dataTables_wrapper .dataTables_filter input:focus { outline: none; border-color: #a59bd9; box-shadow: 0 0 0 .2rem var(--ring); }
  .dataTables_wrapper .dataTables_info, .dataTables_wrapper .dataTables_length, .dataTables_wrapper .dataTables_filter { color: var(--muted); font-size: .8rem; margin-bottom: .75rem; }
  .dataTables_wrapper .dataTables_paginate .paginate_button { border-radius: var(--radius-sm) !important; border: 1px solid var(--line) !important; color: var(--ink-2) !important; margin-left: 4px; }
  .dataTables_wrapper .dataTables_paginate .paginate_button:hover { background: var(--line-soft) !important; color: var(--accent) !important; }
  .dataTables_wrapper .dataTables_paginate .paginate_button.current,
  .dataTables_wrapper .dataTables_paginate .paginate_button.current:hover { background: var(--accent) !important; color: #fff !important; border-color: var(--accent) !important; }
  table.dataTable.dtr-inline.collapsed > tbody > tr > td.dtr-control:before,
  table.dataTable.dtr-inline.collapsed > tbody > tr > th.dtr-control:before { background-color: var(--accent); box-shadow: none; border: none; }
  .btn-manage { background: var(--accent-soft); border: none; color: var(--accent); font-size: .76rem; padding: .3rem .7rem; }
  .btn-manage:hover { background: var(--accent); color: #fff; }

  /* responsive detail modal (above the fixed shell) */
  div.dtr-modal { z-index: 1060; }
  div.dtr-modal-display {
    height: 85vh !important; width: 80vw !important; max-width: 720px;
    border-radius: var(--radius-lg) !important; box-shadow: 0 24px 48px -12px rgba(30, 32, 37, .3) !important;
    border: none !important; padding: 1.5rem !important;
  }
  div.dtr-modal-content h2 { font-size: 1rem; margin-bottom: 1rem; }
  div.dtr-modal-close {
    border-radius: 50% !important; background: var(--line-soft) !important; color: var(--ink-2) !important;
    border: none !important; width: 32px !important; height: 32px !important; line-height: 32px !important;
    top: 10px !important; right: 10px !important; font-size: 18px !important;
  }
  div.dtr-modal-close:hover { background: var(--line) !important; }

  /* ---------- Request form stepper ---------- */
  .stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; margin-bottom: 1.5rem; list-style: none; padding: 0; }
  .stepper li { display: flex; align-items: center; gap: .6rem; padding: .7rem .85rem; border-radius: var(--radius-sm); background: var(--surface); box-shadow: var(--shadow-sm); color: var(--muted); font-size: .8rem; font-weight: 500; min-width: 0; }
  .stepper li span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stepper .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--line-soft); font-size: .75rem; font-weight: 600; flex-shrink: 0; }
  .stepper li.current { color: var(--ink); box-shadow: inset 0 -2px 0 var(--tone, var(--accent)), var(--shadow-sm); }
  .stepper li.current .n { background: var(--tone, var(--accent)); color: #fff; }
  .stepper li.done { color: var(--ink-2); }
  .stepper li.done .n { background: var(--tone-bg, var(--accent-soft)); color: var(--tone, var(--accent)); }
  .step-card .card-header { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
  .step-actions { display: flex; justify-content: space-between; gap: .5rem; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px dashed var(--line); }
  .step-actions.end { justify-content: flex-end; }
  .subpanel { background: var(--line-soft); border: 1px dashed #ced4da; border-radius: var(--radius-sm); padding: 1rem; }
  .net-price { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 700; font-size: 1rem; }

  /* ---------- Login ---------- */
  #login-view { min-height: calc(100dvh - 3rem); align-items: center; justify-content: center; padding: 1.5rem 1rem; }
  .login-shell { width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); }
  .login-aside {
    background: linear-gradient(135deg, var(--header) 0%, #2e2466 55%, var(--accent) 100%);
    color: #d9d6ef; padding: 2.5rem; display: flex; flex-direction: column; justify-content: space-between; gap: 2rem; position: relative;
  }
  .login-aside .brand-mark { background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .25); }
  .login-aside .brand-name { color: #fff; }
  .login-aside .login-headline { color: #fff; font-weight: 600; font-size: 1.4rem; line-height: 1.4; margin: 0 0 .5rem; text-wrap: balance; }
  .login-aside p:not(.login-headline) { color: #bdb7e3; font-size: .85rem; margin: 0; max-width: 36ch; }
  .login-flow { list-style: none; padding: 0; margin: 0; display: grid; gap: .55rem; font-size: .8rem; color: #d9d6ef; }
  .login-flow li { display: flex; align-items: center; gap: .6rem; }
  .login-flow i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .12); font-size: .7rem; }
  .login-form { padding: 2.5rem; display: flex; flex-direction: column; justify-content: center; }
  .login-form h1 { font-size: 1.15rem; margin-bottom: .25rem; color: var(--accent); }
  .login-form .lead-sub { color: var(--muted); font-size: .82rem; margin-bottom: 1.75rem; }
  .login-form .btn-primary { padding: .6rem; background: var(--success); border-color: var(--success); }
  .login-form .btn-primary:hover { background: #3ab577; border-color: #3ab577; }
  .login-error { background: var(--st-rej-bg); color: var(--st-rej); border-radius: var(--radius-sm); padding: .55rem .75rem; font-size: .82rem; }
  .login-foot { margin-top: 1.75rem; font-size: .74rem; color: var(--muted); }
  .login-switch { margin-top: 1rem; text-align: center; font-size: .85rem; color: var(--muted); }
  .login-switch a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .login-switch a:hover { text-decoration: underline; }
  #register-panel label { font-size: .82rem; margin-bottom: .2rem; }

  /* ---------- Dashboard ---------- */
  .chart-box { position: relative; height: 300px; }

  /* ---------- Loading ---------- */
  #loading {
    position: fixed; inset: 0; z-index: var(--z-loading);
    background-color: rgba(243, 243, 249, .7); backdrop-filter: blur(3px);
  }
  .loader-card { background: var(--surface); border-radius: var(--radius-sm); padding: .9rem 1.25rem; display: flex; align-items: center; gap: .75rem; box-shadow: var(--shadow); font-size: .84rem; color: var(--ink-2); }
  .loader-card .spinner-border { width: 1.25rem; height: 1.25rem; border-width: .18em; color: var(--accent); }

  /* ---------- SweetAlert2 ---------- */
  .swal2-popup { border-radius: var(--radius-lg) !important; font-family: inherit !important; }
  .swal2-title { font-size: 1.1rem !important; font-weight: 600 !important; color: var(--ink) !important; }
  .swal2-input, .swal2-textarea, .swal2-select { border-color: #ced4da !important; border-radius: var(--radius-sm) !important; font-size: .9rem !important; box-shadow: none !important; }
  .swal2-input:focus, .swal2-textarea:focus { border-color: #a59bd9 !important; box-shadow: 0 0 0 .2rem var(--ring) !important; }
  .swal2-styled { border-radius: var(--radius-sm) !important; font-weight: 500 !important; }
  .swal2-styled.swal2-confirm { background-color: var(--accent) !important; }
  .swal2-styled:focus { box-shadow: 0 0 0 .2rem var(--ring) !important; }

  .app-foot { width: 100%; padding: 1rem 1.5rem; font-size: .76rem; color: var(--muted); border-top: 1px solid var(--line); background: var(--surface); }

  /* ---------- Section hues (soft icon chips, one per section) ---------- */
  .tone-teal   { --tone: #4b38b3; --tone-bg: #e4e1f4; }
  .tone-blue   { --tone: #1d7fb8; --tone-bg: #dff0fa; }
  .tone-amber  { --tone: #b07f00; --tone-bg: #fff5da; }
  .tone-violet { --tone: #2a9d63; --tone-bg: #dff6ea; }
  .tone-rose   { --tone: #d0472c; --tone-bg: #fde8e4; }
  .card[class*="tone-"] > .card-header .section-sub { color: var(--tone); }

  .stepper li[data-step="1"] { --tone: #4b38b3; --tone-bg: #e4e1f4; }
  .stepper li[data-step="2"] { --tone: #1d7fb8; --tone-bg: #dff0fa; }
  .stepper li[data-step="3"] { --tone: #b07f00; --tone-bg: #fff5da; }

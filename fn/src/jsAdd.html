<script>
let premiumOptions = []; // Store premium options globally

function getFileBase64(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    let reader = new FileReader();
    reader.onload = () => resolve({
      base64: reader.result.split(',')[1],
      mimeType: file.type,
      name: file.name
    });
    reader.onerror = error => reject(error);
    reader.readAsDataURL(file);
  });
}

async function addData(form) {

  let premiumSelects = document.querySelectorAll('.premium-select');
  let premiumValues = [];
  premiumSelects.forEach(select => {
    if (select.value) premiumValues.push(select.value);
  });
  
  let formObj = {};
  new FormData(form).forEach((value, key) => {
    if (value instanceof File) return;
    formObj[key] = value;
  });
  formObj.premium_combined = premiumValues.join(", ");

  Swal.fire({
    position: 'top',
    icon: 'info',
    title: 'กำลังบันทึกข้อมูล กรุณารอสักครู่ (อาจใช้เวลาอัปโหลดรูปและ PDF)...',
    showConfirmButton: false,
    allowOutsideClick: false,
  });
  Swal.showLoading();

  try {
    let file1 = document.getElementById('myFile').files[0];
    let file2 = document.getElementById('myFile2').files[0];
    
    formObj.file1Data = await getFileBase64(file1);
    formObj.file2Data = await getFileBase64(file2);

    callServer('saveRequest', formObj).then(() => {
      getData();
      $('#myForm')[0].reset();
      $('.select2').val('').trigger('change');
      profileApplied = {};
      applyMyProfile(); // next request starts with today + my details again

      const container = document.getElementById('premium-container');
      container.innerHTML = '';
      addPremium();

      resetSteps(); // กลับไปหน้าแรกเสมอเมื่อบันทึกเสร็จ

      if (typeof switchView === 'function') switchView('table-view');

      const Toast = Swal.mixin({
        toast: true, position: 'top-end', showConfirmButton: false,
        timer: 3000, timerProgressBar: true,
        didOpen: (toast) => {
          toast.addEventListener('mouseenter', Swal.stopTimer)
          toast.addEventListener('mouseleave', Swal.resumeTimer)
        }
      });
      Toast.fire({ icon: 'success', title: 'บันทึกข้อมูลเรียบร้อย' });
    }).catch((error) => {
      showError(error, 'ไม่สามารถบันทึกข้อมูลได้');
    });
  } catch (err) {
    Swal.fire('ข้อผิดพลาด', 'อ่านไฟล์ล้มเหลว: ' + err, 'error');
  }
}

 
// ---- Dynamic Premium Functions ----
function addPremium() {
  const container = document.getElementById('premium-container');
  const div = document.createElement('div');
  div.className = 'input-group mb-2 premium-row';
  
  let selectHTML = '<select class="form-control premium-select select2" name="premium_dynamic">';
  selectHTML += '<option disabled selected value="">เลือกของแถม</option>';
  premiumOptions.forEach(opt => {
    selectHTML += `<option value="${escHtml(opt[0])}">${escHtml(opt[0])}</option>`;
  });
  selectHTML += '</select>';
  
  div.innerHTML = selectHTML + '<button class="btn btn-outline-danger" type="button" onclick="removePremium(this)"><i class="fa-solid fa-trash"></i></button>';
  container.appendChild(div);
  
  // Re-initialize select2 for new element
  $(div.querySelector('.select2')).select2({ theme: 'bootstrap-5' });
}

function removePremium(btn) {
  const container = document.getElementById('premium-container');
  if (container.children.length > 1) {
    btn.parentElement.remove();
  } else {
    Swal.fire('แจ้งเตือน', 'ต้องมีของแถมอย่างน้อย 1 ช่อง (หากไม่มีให้เลือก "ไม่มี")', 'warning');
  }
}

// ---- Dropdown Loaders ----
$(document).ready(function() {
  $('.select2').select2({ theme: 'bootstrap-5' });
});

function fillSelect(select, items) {
  // keep the disabled placeholder, drop previously loaded options (re-login reloads them)
  Array.from(select.querySelectorAll('option:not([disabled])')).forEach(o => o.remove());
  items.forEach(item => {
    let opt = document.createElement("option");
    opt.value = item[0]; opt.text = item[0];
    select.appendChild(opt);
  });
}

/** Location dropdown; a relief employee's own branches are grouped at the top. */
function fillLocation(items, myBranches) {
  let select = document.getElementById('location');
  Array.from(select.querySelectorAll('option:not([disabled]), optgroup')).forEach(o => o.remove());
  let all = items.map(r => String(r[0]));
  let mine = (myBranches || []).filter(b => all.indexOf(b) >= 0);
  let add = (parent, name) => { let o = document.createElement('option'); o.value = name; o.text = name; parent.appendChild(o); };
  // a scoped พนักงาน already receives only their own branches from the server: no grouping needed
  if (mine.length > 1 && !(myProfile && myProfile.scoped)) {
    let gMine = document.createElement('optgroup'); gMine.label = 'สาขาที่ลงทะเบียนไว้';
    let gAll = document.createElement('optgroup'); gAll.label = 'สาขาอื่น';
    all.forEach(n => add(mine.indexOf(n) >= 0 ? gMine : gAll, n));
    select.appendChild(gMine); if (gAll.children.length) select.appendChild(gAll);
  } else {
    all.forEach(n => add(select, n));
  }
}

/** Today in the browser's local time (toISOString would give yesterday before 07:00 in Thailand). */
function todayLocal() {
  let d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

var myProfile = null;    // from getAllDropdownData().me
var profileApplied = {}; // values we last filled in, so a different user's login replaces them

/**
 * Prefills date (today) and the employee section from the registration profile. A field is only
 * written when it is empty or still holds what we filled before, so the user's own edits survive.
 */
function applyMyProfile() {
  let me = myProfile || {};
  let one = (me.branches || []).length === 1 ? me.branches[0] : '';
  let set = (id, value, isSelect) => {
    let el = document.getElementById(id);
    if (!el) return;
    let cur = el.value || '';
    if (cur !== '' && cur !== (profileApplied[id] || '')) return;
    if (isSelect && value && !Array.from(el.options).some(o => o.value === value)) value = '';
    if (isSelect) $(el).val(value || '').trigger('change'); else el.value = value || '';
    profileApplied[id] = value || '';
  };
  set('date', todayLocal());
  set('emp_id', me.empId);
  set('emp_name', me.name);
  set('emp_phone', me.phone);
  set('location', one, true);
  checkPhoneField(document.getElementById('emp_phone')); // set programmatically: no input event
  let warn = document.getElementById('no-branch-warning');
  if (warn) warn.style.display = (me.scoped && !(me.branches || []).length) ? 'block' : 'none';
}

function loadAllDropdowns() {
  return callServer('getAllDropdownData').then(function(data) {
    myProfile = data.me || null;
    fillLocation(data.location, myProfile && myProfile.branches);
    fillSelect(document.getElementById("productname"), data.product);
    premiumOptions = data.premium; // Store globally for addPremium()
    document.querySelectorAll(".premium-select").forEach(select => fillSelect(select, data.premium));
    fillSelect(document.getElementById("guarantee"), data.guarantee);
    fillSelect(document.getElementById("finance"), data.finance || []);
    window.financeOptions = (data.finance || []).map(function (r) { return r[0]; });
    applyMyProfile();
    if (window.globalData && typeof fillFinanceFilter === 'function') fillFinanceFilter(window.globalData);
  }).catch(function(err) { showError(err, 'โหลดตัวเลือกไม่สำเร็จ'); });
}
</script>

<script>
// ---- General Config Settings ----
function addEmailInput(type, value = '') {
  let container = document.getElementById(type === 'to' ? 'emailToContainer' : 'emailCcContainer');
  let className = type === 'to' ? 'email-to-input' : 'email-cc-input';
  let div = document.createElement('div');
  div.className = "input-group mb-2";
  div.innerHTML = `
    <input type="email" class="form-control ${className}" placeholder="example@gmail.com" value="${escHtml(value)}">
    <button class="btn btn-outline-danger" type="button" onclick="this.parentElement.remove()"><i class="fa-solid fa-minus"></i></button>
  `;
  container.appendChild(div);
}

function loadGeneralConfig() {
  callServer('getConfigProperties').then(function(config) {
    document.getElementById('notifyNewToken').value = config.notifyNewToken || '';
    document.getElementById('notifyNewChatId').value = config.notifyNewChatId || '';
    document.getElementById('notifyApproveToken').value = config.notifyApproveToken || '';
    document.getElementById('notifyApproveChatId').value = config.notifyApproveChatId || '';
    document.getElementById('driveFolderId').value = config.driveFolderId || '';
    
    let toContainer = document.getElementById('emailToContainer');
    toContainer.innerHTML = '';
    let toEmails = config.emailTo ? config.emailTo.split(',') : [''];
    toEmails.forEach((email, index) => {
       if (index === 0) {
         toContainer.innerHTML = `<input type="email" class="form-control email-to-input mb-2" placeholder="example@gmail.com" value="${escHtml(email)}">`;
       } else {
         addEmailInput('to', email);
       }
    });

    let ccContainer = document.getElementById('emailCcContainer');
    ccContainer.innerHTML = '';
    let ccEmails = config.emailCc ? config.emailCc.split(',') : [''];
    ccEmails.forEach((email, index) => {
       if (index === 0) {
         ccContainer.innerHTML = `<input type="email" class="form-control email-cc-input mb-2" placeholder="example@gmail.com" value="${escHtml(email)}">`;
       } else {
         addEmailInput('cc', email);
       }
    });
  }).catch(function(err) { showError(err, 'โหลดการตั้งค่าไม่สำเร็จ'); });
}

function saveGeneralConfig() {
  let toEmails = Array.from(document.querySelectorAll('.email-to-input')).map(el => el.value.trim()).filter(v => v !== '');
  let ccEmails = Array.from(document.querySelectorAll('.email-cc-input')).map(el => el.value.trim()).filter(v => v !== '');
  
  let config = {
    notifyNewToken: document.getElementById('notifyNewToken').value,
    notifyNewChatId: document.getElementById('notifyNewChatId').value,
    notifyApproveToken: document.getElementById('notifyApproveToken').value,
    notifyApproveChatId: document.getElementById('notifyApproveChatId').value,
    emailTo: toEmails.join(','),
    emailCc: ccEmails.join(','),
    driveFolderId: document.getElementById('driveFolderId').value
  };
  
  Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
  callServer('setConfigProperties', config).then(function() {
    Swal.fire('บันทึกสำเร็จ!', 'อัปเดตการตั้งค่าแล้ว', 'success');
    loadGeneralConfig();
  }).catch(function(err) { showError(err, 'บันทึกการตั้งค่าไม่สำเร็จ'); });
}

// ---- Admin Settings Scripts ----

var settingsCache = {};

function loadSettingsData(sheetName) {
  return callServer('getSettingsData', sheetName).then(function(data) {
    settingsCache[sheetName] = data;
    let tbody = document.querySelector('#table-' + sheetName + ' tbody');
    if(!tbody) return;
    tbody.innerHTML = '';
    let checkAll = document.getElementById('checkAll-' + sheetName);
    if (checkAll) { checkAll.checked = false; checkAll.indeterminate = false; checkAll.disabled = data.length === 0; }
    updateBulkDelete(sheetName);

    if (data.length === 0) {
      let colCount = sheetName === 'Admin' ? 8 : 3;
      tbody.innerHTML = `<tr><td colspan="${colCount}" class="text-center text-muted">ไม่มีข้อมูล</td></tr>`;
      return;
    }

    data.forEach((row, index) => {
      let tr = document.createElement('tr');
      if (sheetName === 'Admin') {
        let pending = row[7] === 'รออนุมัติ';
        let contact = [row[4] ? '<div><i class="fa-regular fa-envelope me-1 text-muted"></i>' + escHtml(row[4]) + '</div>' : '',
          row[5] ? '<div><i class="fa-solid fa-phone me-1 text-muted"></i>' + escHtml(row[5]) + '</div>' : ''].join('') || '<span class="text-muted">-</span>';
        let blocked = row[7] === 'ระงับ';
        if (pending) tr.className = 'table-warning';
        if (blocked) tr.className = 'table-secondary text-muted';
        let statusBadge = pending ? '<span class="st st-wait">รออนุมัติ</span>'
          : blocked ? '<span class="st st-rej"><i class="fa-solid fa-ban me-1"></i>ระงับ</span>'
          : '<span class="st st-done">ใช้งาน</span>';
        let toggleBtn = pending ? ''
          : blocked ? `<button class="btn btn-sm btn-outline-success me-1" onclick="setUserStatusRow(${index}, 'ใช้งาน')" title="เปิดใช้งาน" aria-label="เปิดใช้งาน"><i class="fa-solid fa-unlock"></i> เปิด</button>`
          : `<button class="btn btn-sm btn-outline-warning me-1" onclick="setUserStatusRow(${index}, 'ระงับ')" title="ระงับการเข้าใช้งาน" aria-label="ระงับการเข้าใช้งาน"><i class="fa-solid fa-ban"></i> บล็อค</button>`;
        tr.innerHTML = `
          <td class="text-center">${pending ? `<input type="checkbox" class="form-check-input setting-check" value="${index}" onchange="updateBulkDelete('Admin')" aria-label="เลือก ${escHtml(row[0])}">` : ''}</td>
          <td class="fw-semibold">${escHtml(row[0])}</td>
          <td>${escHtml(row[2])}</td>
          <td class="small">${contact}</td>
          <td class="small">${splitBranches(row[6]).map(b => '<div>' + escHtml(b) + '</div>').join('') || '<span class="text-muted">-</span>'}</td>
          <td><span class="badge bg-primary">${escHtml(row[3])}</span></td>
          <td>${statusBadge}</td>
          <td class="text-center text-nowrap">
            ${pending ? `<button class="btn btn-sm btn-success me-1" onclick="approveUserRow(${index})" title="อนุมัติ"><i class="fa-solid fa-user-check"></i> อนุมัติ</button>` : ''}
            ${toggleBtn}
            <button class="btn btn-sm btn-outline-primary me-1" onclick="editSetting('${sheetName}', ${index})" title="แก้ไข" aria-label="แก้ไข"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-sm btn-outline-secondary me-1" onclick="resetUserPassword(${index})" title="รีเซ็ตรหัสผ่าน" aria-label="รีเซ็ตรหัสผ่าน"><i class="fa-solid fa-key"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteSetting('${sheetName}', ${index})" title="${pending ? 'ปฏิเสธ / ลบ' : 'ลบ'}" aria-label="ลบ"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
      } else {
        tr.innerHTML = `
          <td class="text-center"><input type="checkbox" class="form-check-input setting-check" value="${index}" onchange="updateBulkDelete('${sheetName}')" aria-label="เลือก ${escHtml(row[0])}"></td>
          <td>${escHtml(row[0])}</td>
          <td class="text-center text-nowrap">
            <button class="btn btn-sm btn-outline-primary me-1" onclick="editSetting('${sheetName}', ${index})" title="แก้ไข" aria-label="แก้ไข"><i class="fa-solid fa-pen"></i> แก้ไข</button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteSetting('${sheetName}', ${index})" title="ลบ" aria-label="ลบ"><i class="fa-solid fa-trash"></i> ลบ</button>
          </td>
        `;
      }
      tbody.appendChild(tr);
    });
    updateBulkDelete(sheetName); // now that the row checkboxes exist
  }).catch(function(err) { showError(err, 'โหลดข้อมูลไม่สำเร็จ'); });
}

function resetUserPassword(index) {
  let row = (settingsCache['Admin'] || [])[index];
  if (!row) return;
  Swal.fire({
    title: 'รีเซ็ตรหัสผ่าน: ' + row[0],
    input: 'password',
    inputPlaceholder: 'รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)',
    showCancelButton: true,
    confirmButtonText: 'บันทึก',
    cancelButtonText: 'ยกเลิก',
    inputValidator: (v) => { if (!v || v.length < 6) return 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'; }
  }).then((r) => {
    if (!r.isConfirmed) return;
    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    callServer('resetPassword', row[0], r.value).then(() => {
      Swal.fire('รีเซ็ตรหัสผ่านแล้ว', '', 'success');
    }).catch((err) => showError(err));
  });
}

function setUserStatusRow(index, status) {
  let row = (settingsCache['Admin'] || [])[index];
  if (!row) return;
  let block = status === 'ระงับ';
  Swal.fire({
    title: (block ? 'ระงับการเข้าใช้งาน ' : 'เปิดใช้งาน ') + row[0] + '?',
    html: '<div class="small">' + escHtml(row[2]) + (row[6] ? '<br>สาขา: ' + escHtml(row[6]) : '') + '</div>' +
      '<div class="small text-muted mt-2">' + (block
        ? 'ผู้ใช้จะหลุดจากระบบทันทีและเข้าสู่ระบบไม่ได้จนกว่าจะเปิดใช้งานอีกครั้ง คำขอที่บันทึกไว้แล้วไม่ถูกลบ'
        : 'ผู้ใช้จะเข้าสู่ระบบได้ตามปกติด้วยรหัสผ่านเดิม') + '</div>',
    icon: block ? 'warning' : 'question', showCancelButton: true,
    confirmButtonText: block ? 'บล็อค' : 'เปิดใช้งาน', cancelButtonText: 'ยกเลิก',
    confirmButtonColor: block ? '#d97706' : '#198754'
  }).then((r) => {
    if (!r.isConfirmed) return;
    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    callServer('setUserStatus', row[0], status).then(() => {
      Swal.fire(block ? 'ระงับแล้ว' : 'เปิดใช้งานแล้ว', row[0] + (block ? ' เข้าใช้งานไม่ได้แล้ว' : ' เข้าใช้งานได้แล้ว'), 'success');
      loadSettingsData('Admin');
    }).catch((err) => { showError(err, 'เปลี่ยนสถานะไม่สำเร็จ'); loadSettingsData('Admin'); });
  });
}

function approveUserRow(index) {
  let row = (settingsCache['Admin'] || [])[index];
  if (!row) return;
  Swal.fire({
    title: 'อนุมัติบัญชี ' + row[0] + '?',
    html: '<div class="text-start small">' + escHtml(row[2]) + '<br>สาขา: ' + escHtml(row[6] || '-') +
      '<br>อีเมล: ' + escHtml(row[4] || '-') + '<br>เบอร์: ' + escHtml(row[5] || '-') +
      '<div class="text-muted mt-2">ได้สิทธิ์ ' + escHtml(row[3]) + ' (เปลี่ยนได้ที่ปุ่มแก้ไข) ระบบจะส่งอีเมลแจ้งผู้ใช้</div></div>',
    icon: 'question', showCancelButton: true, confirmButtonText: 'อนุมัติ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#198754'
  }).then((r) => {
    if (!r.isConfirmed) return;
    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    callServer('approveUser', row[0]).then(() => {
      Swal.fire('อนุมัติแล้ว', row[0] + ' เข้าสู่ระบบได้แล้ว', 'success');
      loadSettingsData('Admin');
    }).catch((err) => { showError(err, 'อนุมัติไม่สำเร็จ'); loadSettingsData('Admin'); });
  });
}

function loadAllSettings() {
  loadGeneralConfig();
  ['Admin', 'location', 'Product', 'Premium', 'guarantee', 'Finance'].forEach(sheet => loadSettingsData(sheet));
}

// ---- สร้าง Sheet ทั้งหมด ----
function initAllSheets() {
  let btn = document.getElementById('btnInitSheets');
  let resultBox = document.getElementById('initSheetsResult');
  
  // Loading state
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> กำลังสร้าง...';
  resultBox.style.display = 'none';

  callServer('initializeAllSheets')
    .then(function(results) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-database"></i> สร้าง Sheet ทั้งหมด &amp; ตั้งหัวตาราง';

      // สร้างตารางผลลัพธ์
      let sheetColors = {
        'Data':      '#1a73e8',
        'Log':       '#34a853',
        'Admin':     '#ea4335',
        'Config':    '#5f6368',
        'location':  '#fbbc04',
        'Product':   '#9334e6',
        'Premium':   '#ff6d00',
        'guarantee': '#00897b',
        'Finance':   '#4b38b3'
      };

      let rows = results.map(r => {
        let color = sheetColors[r.name] || '#888';
        let isDone = r.status.includes('✅');
        return `
          <tr>
            <td><span class="badge" style="background:${color};font-size:.8rem;">${escHtml(r.name)}</span></td>
            <td class="${isDone ? 'text-success fw-bold' : 'text-muted'}">${escHtml(r.status)}</td>
          </tr>`;
      }).join('');

      resultBox.innerHTML = `
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-success text-white py-2">
            <i class="fa-solid fa-circle-check"></i> ดำเนินการเสร็จสิ้น
          </div>
          <div class="card-body p-0">
            <table class="table table-sm table-hover mb-0">
              <thead class="table-light">
                <tr><th>Sheet</th><th>ผลลัพธ์</th></tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`;
      resultBox.style.display = 'block';

      // Reload settings tables
      loadAllSettings();
    })
    .catch(function(error) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-database"></i> สร้าง Sheet ทั้งหมด &amp; ตั้งหัวตาราง';
      resultBox.innerHTML = `<div class="alert alert-danger"><i class="fa-solid fa-circle-xmark"></i> เกิดข้อผิดพลาด: ${escHtml(errorText(error))}</div>`;
      resultBox.style.display = 'block';
    });
}


// ---------- Bulk upload (Excel / CSV, first column) ----------
var SETTING_HEADERS = { location: 'ชื่อสาขา', Product: 'ชื่อสินค้ารุ่นต่างๆ', Premium: 'รายการของแถม' };
var SHEETJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
var uploadTarget = '';
var sheetJsPromise = null;

function loadSheetJs() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!sheetJsPromise) {
    sheetJsPromise = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = SHEETJS_URL;
      s.onload = function () { resolve(window.XLSX); };
      s.onerror = function () { sheetJsPromise = null; reject(new Error('โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่')); };
      document.head.appendChild(s);
    });
  }
  return sheetJsPromise;
}

function pickSettingFile(sheetName) {
  uploadTarget = sheetName;
  var input = document.getElementById('settingFileInput');
  input.value = '';
  input.click();
}

/** CSV: UTF-8 first, fall back to Windows-874 (Thai Excel "Save as CSV") when UTF-8 decoding fails. */
function decodeCsv(buf) {
  var text = new TextDecoder('utf-8').decode(buf);
  if (text.indexOf('�') >= 0) {
    try { text = new TextDecoder('windows-874').decode(buf); } catch (e) { }
  }
  return text.replace(/^﻿/, '');
}

function readSettingFile(input) {
  var file = input.files && input.files[0];
  var sheetName = uploadTarget;
  if (!file || !sheetName) return;
  if (file.size > 5 * 1024 * 1024) { Swal.fire('ไฟล์ใหญ่เกินไป', 'รองรับไฟล์ไม่เกิน 5 MB', 'error'); return; }
  Swal.fire({ title: 'กำลังอ่านไฟล์...', allowOutsideClick: false, didOpen: function () { Swal.showLoading(); } });
  Promise.all([loadSheetJs(), file.arrayBuffer()]).then(function (res) {
    var XLSX = res[0], buf = res[1];
    var wb = /\.csv$/i.test(file.name) ? XLSX.read(decodeCsv(buf), { type: 'string' }) : XLSX.read(buf, { type: 'array' });
    var ws = wb.Sheets[wb.SheetNames[0]];
    var rows = ws ? XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' }) : [];
    var names = rows.map(function (r) { return String(r[0] == null ? '' : r[0]).trim(); });
    if (names.length && names[0] === SETTING_HEADERS[sheetName]) names.shift();
    previewSettingUpload(sheetName, file.name, names);
  }).catch(function (err) { showError(err, 'อ่านไฟล์ไม่สำเร็จ'); });
}

function previewSettingUpload(sheetName, fileName, names) {
  var existing = {};
  (settingsCache[sheetName] || []).forEach(function (r) { existing[String(r[0]).trim()] = true; });
  var fresh = [], dup = 0, blank = 0;
  names.forEach(function (n) {
    if (!n) { blank++; return; }
    if (existing[n]) { dup++; return; }
    existing[n] = true; fresh.push(n);
  });
  if (names.length > 2000) { Swal.fire('ไฟล์มีรายการมากเกินไป', 'อัปโหลดได้ครั้งละไม่เกิน 2,000 รายการ (ไฟล์นี้มี ' + names.length + ' แถว)', 'error'); return; }
  if (!fresh.length) {
    Swal.fire('ไม่มีรายการใหม่', 'ทุกรายการในไฟล์ "' + fileName + '" มีอยู่แล้วหรือเป็นแถวว่าง', 'info');
    return;
  }
  var sample = fresh.slice(0, 10).map(function (n) { return '<li>' + escHtml(n) + '</li>'; }).join('');
  Swal.fire({
    title: 'นำเข้า ' + sheetName,
    html: '<div class="text-start">' +
      '<div class="mb-2 small text-muted">' + escHtml(fileName) + '</div>' +
      '<div class="d-flex gap-2 flex-wrap mb-3">' +
        '<span class="st st-done">เพิ่มใหม่ ' + fresh.length + ' รายการ</span>' +
        (dup ? '<span class="st st-wait">ซ้ำ ข้าม ' + dup + '</span>' : '') +
        (blank ? '<span class="fin">แถวว่าง ' + blank + '</span>' : '') +
      '</div>' +
      '<div class="small fw-semibold mb-1">ตัวอย่าง' + (fresh.length > 10 ? ' (10 รายการแรก)' : '') + '</div>' +
      '<ol class="small mb-0 ps-3">' + sample + '</ol></div>',
    showCancelButton: true,
    confirmButtonText: 'นำเข้า ' + fresh.length + ' รายการ',
    cancelButtonText: 'ยกเลิก'
  }).then(function (r) {
    if (!r.isConfirmed) return;
    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: function () { Swal.showLoading(); } });
    callServer('addSettingDataBulk', sheetName, fresh).then(function (res) {
      Swal.fire('นำเข้าสำเร็จ', 'เพิ่ม ' + res.added.length + ' รายการ' + (res.skipped ? ' (ข้ามซ้ำ ' + res.skipped + ')' : ''), 'success');
      loadSettingsData(sheetName); loadAllDropdowns();
    }).catch(function (err) { showError(err, 'นำเข้าไม่สำเร็จ'); loadSettingsData(sheetName); });
  });
}

/** Branch names from the loaded location list, plus the user's current one if it was since removed. */
function splitBranches(v) {
  return String(v || '').split(',').map(s => s.trim()).filter(Boolean);
}

function branchNames(current) {
  let names = (settingsCache['location'] || []).map(r => String(r[0]).trim()).filter(Boolean);
  splitBranches(current).forEach(b => { if (names.indexOf(b) < 0) names.unshift(b); });
  return names;
}

// ---------- Multi-row delete (list sheets, not Admin) ----------
function settingChecks(sheetName) {
  return Array.from(document.querySelectorAll('#table-' + sheetName + ' tbody .setting-check'));
}

function toggleAllSettings(sheetName, checked) {
  settingChecks(sheetName).forEach(function (c) { c.checked = checked; });
  updateBulkDelete(sheetName);
}

/** Shows the bulk button (ลบที่เลือก on lists, อนุมัติที่เลือก on Admin) with the ticked count. */
function updateBulkDelete(sheetName) {
  var btn = document.getElementById('bulkDel-' + sheetName) || document.getElementById('bulkApprove-' + sheetName);
  if (!btn) return;
  var checks = settingChecks(sheetName);
  var all0 = document.getElementById('checkAll-' + sheetName);
  if (all0 && sheetName === 'Admin') all0.disabled = checks.length === 0; // only pending rows have a box
  var n = checks.filter(function (c) { return c.checked; }).length;
  btn.classList.toggle('d-none', n === 0);
  btn.querySelector('.bulk-count').textContent = n;
  var all = document.getElementById('checkAll-' + sheetName);
  if (all) { all.checked = n > 0 && n === checks.length; all.indeterminate = n > 0 && n < checks.length; }
}

function deleteSelectedSettings(sheetName) {
  var rows = settingsCache[sheetName] || [];
  var names = settingChecks(sheetName).filter(function (c) { return c.checked; })
    .map(function (c) { var r = rows[Number(c.value)]; return r ? String(r[0]) : ''; })
    .filter(function (n) { return n.trim() !== ''; });
  if (!names.length) return;
  var sample = names.slice(0, 10).map(function (n) { return '<li>' + escHtml(n) + '</li>'; }).join('');
  Swal.fire({
    title: 'ลบ ' + names.length + ' รายการ?',

      (names.length > 10 ? '<div class="small text-muted">และอีก ' + (names.length - 10) + ' รายการ</div>' : '') +
      '<div class="small text-muted mt-2">คำขอที่บันทึกไว้แล้วจะยังแสดงชื่อเดิม</div></div>',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#d33',
    cancelButtonColor: '#6c757d',
    confirmButtonText: 'ลบ ' + names.length + ' รายการ',
    cancelButtonText: 'ยกเลิก'
  }).then(function (r) {
    if (!r.isConfirmed) return;
    Swal.fire({ title: 'กำลังลบ...', allowOutsideClick: false, didOpen: function () { Swal.showLoading(); } });
    callServer('deleteSettingDataBulk', sheetName, names).then(function (res) {
      Swal.fire('ลบสำเร็จ', 'ลบ ' + res.deleted + ' รายการ' + (res.missing ? ' (ไม่พบ ' + res.missing + ' รายการ อาจถูกลบไปแล้ว)' : ''), 'success');

    var ws = XLSX.utils.aoa_to_sheet([[header]].concat(SETTING_SAMPLES[sheetName].map(function (n) { return [n]; })));

// ฟังก์ชั่นสำหรับเปลี่ยนหน้าฟอร์ม (Step-by-step)
function nextStep(current) {
  const stepDiv = document.getElementById('step' + current);
  const inputs = stepDiv.querySelectorAll('input, select, textarea');
  let isValid = true;
  
  // Validate current step
  for (let i = 0; i < inputs.length; i++) {
    if (!inputs[i].checkValidity()) {
      inputs[i].reportValidity();
      isValid = false;
      break;
    }
  }

  if (isValid) {
    stepDiv.style.display = 'none';
    document.getElementById('step' + (current + 1)).style.display = 'block';
    setStepper(current + 1);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function prevStep(current) {
  document.getElementById('step' + current).style.display = 'none';
  document.getElementById('step' + (current - 1)).style.display = 'block';
  setStepper(current - 1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetSteps() {
  document.querySelectorAll('.step-card').forEach(card => card.style.display = 'none');
  document.getElementById('step1').style.display = 'block';
  setStepper(1);
}

function setStepper(active) {
  document.querySelectorAll('#stepper li').forEach(function (li) {
    var n = Number(li.getAttribute('data-step'));
    li.classList.toggle('current', n === active);
    li.classList.toggle('done', n < active);
    if (n === active) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
  });
}

// ฟังก์ชั่นคำนวณราคาสุทธิ
function calculateNetPrice() {
  let price = parseFloat(document.getElementById('price').value) || 0;
  let down = parseFloat(document.getElementById('down').value) || 0;
  let discountais = parseFloat(document.getElementById('discountais').value) || 0;
  let discountpromotion = parseFloat(document.getElementById('discountpromotion').value) || 0;
  let discounttradein = parseFloat(document.getElementById('discounttradein').value) || 0;
  let discounttradeup = parseFloat(document.getElementById('discounttradeup').value) || 0;
  let discountbigc = parseFloat(document.getElementById('discountbigc').value) || 0;
  
  let dues = parseFloat(document.getElementById('dues').value) || 0;
  let netprice = price - down - discountais - discountpromotion - discounttradein - discounttradeup - discountbigc + dues;
  document.getElementById('netprice').value = netprice;
}

// ---- Live checks for ID / passport and phone numbers (nextStep() uses checkValidity, so the
// custom message blocks the step and shows on the field). The server re-validates on save.
function markField(el, ok, msg) {
  el.setCustomValidity(ok ? '' : msg);
  el.classList.toggle('is-invalid', !ok);
}

function checkPhoneField(el) {
  if (!el) return;
  let v = el.value.trim();
  markField(el, !v || !!normalizePhone(v), 'เบอร์ไม่ถูกต้อง: ' + PHONE_RULE_TEXT);
}

function checkIdField() {
  let el = document.getElementById('id_card_number');
  if (!el) return;
  let passport = document.getElementById('id_type').value === 'พาสปอร์ต';
  let v = el.value.trim();
  let msg = passport ? 'เลขพาสปอร์ต: ตัวอักษรภาษาอังกฤษและตัวเลข 6-9 ตัว' : 'เลขบัตรประชาชน 13 หลักไม่ถูกต้อง (ตรวจเลขหลักสุดท้ายอีกครั้ง)';
  el.placeholder = passport ? 'เช่น AA1234567' : 'เลข 13 หลัก';
  el.maxLength = passport ? 12 : 17; // room for spaces / dashes
  document.getElementById('id_card_feedback').textContent = msg;
  markField(el, !v || !!(passport ? passportNo(v) : thaiIdNo(v)), msg);
}

function checkIdentityFields() {
  checkIdField();
  document.querySelectorAll('.phone-input').forEach(checkPhoneField);
}

$(document).ready(function() {
  $('.phone-input').on('input blur', function () { checkPhoneField(this); });
  $('#id_card_number').on('input blur', checkIdField);
  // reset() keeps custom validity messages, so re-check once the fields are empty again
  $('#myForm').on('reset', function () { setTimeout(checkIdentityFields, 0); });
  checkIdentityFields();
});

$(document).ready(function() {
  $('#price, #down, #discountais, #discountpromotion, #discounttradein, #discounttradeup, #discountbigc, #dues').on('input', calculateNetPrice);
});
</script>

<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบเบิกอุปกรณ์สำนักงาน</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }
    
    body {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 100%;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.6s ease-out forwards;
      position: relative;
      box-sizing: border-box;
    }

    #login-container { max-width: 500px; margin: 0 auto; }
    #main-container { display: none; max-width: 1200px; margin: 0 auto; }
    #admin-container { display: none; max-width: 100%; width: 100%; padding: 40px 20px; }
    #history-container { display: none; max-width: 100%; width: 100%; padding: 40px 20px; }

    @media (max-width: 768px) {
      body { padding: 0; align-items: flex-start; }
      .container { padding: 15px; padding-top: 60px; border-radius: 0; margin-top: 0; border-left: none; border-right: none; }
      #login-container, #main-container { margin: 10px; border-radius: 16px; border: 1px solid var(--glass-border); padding: 20px; padding-top: 60px; }
      #login-container { padding-top: 40px; margin-top: 20px; }
      #history-container, #admin-container { padding-left: 0; padding-right: 0; }
      table.admin-table { font-size: 12px; }
      table.admin-table th, table.admin-table td { padding: 6px 4px; }
      h1 { font-size: 22px; margin-bottom: 20px; }
      .btn-logout, .btn-switch, .btn-logout-relative, .btn-switch-relative { padding: 6px 10px; font-size: 11px; }
      .item-row { flex-wrap: wrap; }
      .item-row select { flex: 100%; margin-bottom: 10px; }
      .item-row input { flex: 1; }
      .btn-remove { flex: 0 0 44px; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: center;
      font-weight: 600;
      margin-top: 40px;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-top: -20px;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group { margin-bottom: 24px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); }

    input[type="text"], input[type="password"], input[type="number"], select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 16px;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }
    
    input[readonly] { opacity: 0.7; cursor: not-allowed; }
    select option { background: var(--bg-color); color: var(--text-main); }

    .item-row {
      display: flex; gap: 12px; margin-bottom: 12px; align-items: center;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .item-row select { flex: 2; }
    .item-row input { flex: 1; }

    .btn-remove {
      background: transparent; border: 1px solid var(--danger); color: var(--danger);
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; justify-content: center; align-items: center; cursor: pointer;
      transition: all 0.2s; font-size: 18px;
    }
    .btn-remove:hover { background: var(--danger); color: white; }

    .btn-add {
      background: rgba(255, 255, 255, 0.05); border: 1px dashed var(--glass-border); color: var(--text-main);
      width: 100%; padding: 14px; border-radius: 12px; cursor: pointer;
      font-family: inherit; font-size: 14px; transition: all 0.3s ease; margin-bottom: 24px;
    }
    .btn-add:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--text-muted); }

    .btn-submit {
      background: linear-gradient(135deg, var(--accent), #4f46e5); border: none; color: white;
      width: 100%; padding: 16px; border-radius: 12px; font-family: inherit; font-size: 18px; font-weight: 600;
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 10px 20px -10px var(--accent);
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 15px 25px -10px var(--accent); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .btn-logout, .btn-switch, .btn-logout-relative, .btn-switch-relative {
      background: transparent; border: 1px solid var(--glass-border);
      color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: all 0.3s ease;
    }
    .btn-logout:hover, .btn-switch:hover, .btn-logout-relative:hover, .btn-switch-relative:hover { background: rgba(255,255,255,0.1); color: white; }

    .loader {
      display: none; width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .message {
      margin-top: 20px; padding: 16px; border-radius: 12px; text-align: center;
      display: none; font-weight: 600; font-size: 14px;
    }
    .message.success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
    .message.error { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }

    .loading-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center; border-radius: 24px; z-index: 10;
    }

    /* Admin CSS */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }
    .tab { padding: 10px 20px; cursor: pointer; border-radius: 8px; transition: all 0.2s; color: var(--text-muted); font-size: 14px; }
    .tab:hover { background: rgba(255,255,255,0.05); }
    .tab.active { background: rgba(59, 130, 246, 0.2); color: var(--accent); font-weight: 600; }

    .admin-table-wrapper { overflow-x: auto; margin-bottom: 20px; width: 100%; }
    table.admin-table { width: 100%; border-collapse: collapse; min-width: 100%; table-layout: auto; word-wrap: break-word; }
    table.admin-table th, table.admin-table td { border: 1px solid var(--glass-border); padding: 8px; text-align: left; }
    table.admin-table th { background: rgba(255,255,255,0.05); font-weight: 600; color: var(--text-muted); font-size: 14px; }
    table.admin-table input { width: 100%; padding: 8px; background: transparent; border: 1px solid transparent; color: var(--text-main); font-family: inherit; font-size: 14px; border-radius: 4px; box-sizing: border-box; }
    table.admin-table input:not([readonly]) { border-bottom: 1px solid var(--accent); background: rgba(0,0,0,0.2); }
    table.admin-table input:not([readonly]):focus { outline: none; background: rgba(0,0,0,0.4); }
    
    .btn-status { width: 100%; padding: 8px; border: none; border-radius: 4px; font-family: inherit; font-size: 14px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .btn-status-on { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .btn-status-off { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .btn-status:disabled { opacity: 0.8; cursor: default; }
    
    .btn-action-small { background: transparent; border: none; color: var(--danger); cursor: pointer; font-size: 18px; padding: 4px; }
    .btn-action-small:hover { background: rgba(239, 68, 68, 0.2); border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Login Container -->
  <div class="container" id="login-container">
    <div class="loading-overlay" id="login-loading" style="display: none;">
      <div class="loader" style="display: block; width: 40px; height: 40px; border-width: 4px;"></div>
    </div>
    
    <h1>เข้าสู่ระบบ</h1>
    <div class="subtitle">ระบบเบิกอุปกรณ์สำนักงาน</div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="username">รหัสสาขา (Branch Code)</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label for="password">รหัสผ่าน (Password)</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn-submit" id="btn-login">
        <span id="btn-login-text">เข้าสู่ระบบ</span>
        <div class="loader" id="btn-login-loader"></div>
      </button>
      <div id="login-message" class="message"></div>
    </form>
  </div>

  <!-- Main App Container -->
  <div class="container" id="main-container">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; position: absolute; top: 20px; left: 20px; right: 20px; z-index: 10;">
      <button class="btn-switch-relative" id="btn-goto-history" onclick="switchView('history')">ประวัติการเบิก</button>
      <div style="display: flex; gap: 8px;">
        <button class="btn-switch-relative" id="btn-goto-admin" onclick="switchView('admin')" style="display: none;">ตั้งค่าระบบ</button>
        <button class="btn-logout-relative" onclick="logout()">ออกจากระบบ</button>
      </div>
    </div>
    
    <div class="loading-overlay" id="main-loading">
      <div class="loader" style="display: block; width: 40px; height: 40px; border-width: 4px;"></div>
    </div>
    
    <h1>เบิกอุปกรณ์</h1>
    
    <form id="requisitionForm">
      <div class="form-group">
        <label for="location">สาขาที่เบิก</label>
        <input type="text" id="location" readonly required>
      </div>
      <div class="form-group">
        <label for="requester">ชื่อผู้เบิก</label>
        <input type="text" id="requester" placeholder="ระบุชื่อผู้เบิก" required>
      </div>
      <div class="form-group">
        <label>รายการที่ต้องการเบิก</label>
        <div id="items-container"></div>
      </div>
      
      <button type="button" class="btn-add" id="btn-add-item">+ เพิ่มรายการอุปกรณ์</button>
      
      <button type="submit" class="btn-submit" id="btn-submit">
        <span id="btn-text">ยืนยันการเบิก</span>
        <div class="loader" id="btn-loader"></div>
      </button>
      <div id="main-message" class="message"></div>
    </form>
  </div>


  <div class="container" id="admin-container" style="display: none;">
    <div style="display: flex; justify-content: flex-end; align-items: flex-start; gap: 8px; position: absolute; top: 20px; right: 20px; z-index: 10;">
      <button class="btn-switch-relative" onclick="switchView('main')">เบิกอุปกรณ์</button>
      <button class="btn-logout-relative" onclick="logout()">ออกจากระบบ</button>
    </div>
    
    <div class="loading-overlay" id="admin-loading">
      <div class="loader" style="display: block; width: 40px; height: 40px; border-width: 4px;"></div>
    </div>
    
    <h1>ตั้งค่าระบบ</h1>
    
    <div class="tabs">
      <div class="tab active" onclick="showAdminTab('Users')" id="tab-Users">พนักงาน (Users)</div>
      <div class="tab" onclick="showAdminTab('Location')" id="tab-Location">สาขา (Location)</div>
      <div class="tab" onclick="showAdminTab('Product')" id="tab-Product">สินค้า (Product)</div>
      <div class="tab" onclick="showAdminTab('Order')" id="tab-Order">ประวัติการเบิก (Order)</div>
    </div>
    
    <div class="admin-table-wrapper" id="admin-table-wrapper">
      <!-- Injected table -->
    </div>
    
    <div style="display: flex; gap: 16px;">
      <button class="btn-add" onclick="addAdminRow()" style="margin-bottom: 0; flex: 1;">+ เพิ่มรายการ</button>
      <button class="btn-submit" onclick="saveAdmin()" id="btn-save-admin" style="flex: 2;">
        <span id="btn-save-admin-text">บันทึกข้อมูล</span>
        <div class="loader" id="btn-save-admin-loader"></div>
      </button>
    </div>
    
    <div id="admin-message" class="message"></div>
  </div>

  <!-- History Container -->
  <div class="container" id="history-container" style="display: none;">
    <div style="display: flex; justify-content: flex-end; align-items: flex-start; gap: 8px; position: absolute; top: 20px; right: 20px; z-index: 10;">
      <button class="btn-switch-relative" onclick="switchView('main')">เบิกอุปกรณ์</button>
      <button class="btn-logout-relative" onclick="logout()">ออกจากระบบ</button>
    </div>
    
    <div class="loading-overlay" id="history-loading" style="display: none;">
      <div class="loader" style="display: block; width: 40px; height: 40px; border-width: 4px;"></div>
    </div>
    
    <h1>ประวัติการเบิกอุปกรณ์</h1>
    
    <div id="history-filters" style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
      <input type="text" id="filter-date" placeholder="ค้นหาวัน-เวลา..." oninput="filterHistoryTable()" style="flex: 1; min-width: 120px; padding: 10px; font-size: 14px;">
      
      <input type="text" list="branch-list" id="filter-branch" placeholder="ค้นหาสาขา/ผู้เบิก..." oninput="filterHistoryTable()" style="flex: 1; min-width: 120px; padding: 10px; font-size: 14px;">
      <datalist id="branch-list"></datalist>
      
      <input type="text" list="item-list" id="filter-item" placeholder="ค้นหารายการ..." oninput="filterHistoryTable()" style="flex: 1; min-width: 120px; padding: 10px; font-size: 14px;">
      <datalist id="item-list"></datalist>
      
      <select id="filter-status" onchange="filterHistoryTable()" style="flex: 1; min-width: 120px; padding: 10px; font-family: inherit; font-size: 14px; border-radius: 6px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); color: var(--text-main);">
        <option value="" style="color: var(--text-main);">ทุกสถานะ</option>
        <option value="รอจ่าย" style="color: var(--text-main);">รอจ่าย</option>
        <option value="จ่ายแล้ว" style="color: var(--text-main);">จ่ายแล้ว</option>
        <option value="ยกเลิก" style="color: var(--text-main);">ยกเลิก</option>
      </select>
      
      <button class="btn-submit" style="flex: 0 0 auto; padding: 10px 15px; width: auto; font-size: 14px; background: #10b981;" onclick="downloadHistoryCSV()">📥 ดาวน์โหลด CSV</button>
    </div>
    
    <div class="admin-table-wrapper" id="history-table-wrapper">
      <!-- Injected table -->
    </div>
  </div>

  <script>
    let globalProducts = [];
    let adminDataCache = {};
    let currentAdminTab = 'Users';
    
    // Check login state
    window.onload = function() {
      const savedUser = sessionStorage.getItem('req_user');
      const savedBranchCode = sessionStorage.getItem('req_branchCode');
      const savedBranchName = sessionStorage.getItem('req_branchName');
      const savedRole = sessionStorage.getItem('req_role');
      if (savedUser) {
        showMainApp(savedUser, savedBranchCode, savedBranchName, savedRole);
      }
    };

    // --- Switch View ---
    function switchView(view) {
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('main-container').style.display = 'none';
      document.getElementById('admin-container').style.display = 'none';
      document.getElementById('history-container').style.display = 'none';
      
      if (view === 'main') {
        document.getElementById('main-container').style.display = 'block';
      } else if (view === 'admin') {
        document.getElementById('admin-container').style.display = 'block';
        loadAdminData();
      } else if (view === 'history') {
        document.getElementById('history-container').style.display = 'block';
        loadHistoryData();
      }
    }

    // ----- Login Logic -----
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      
      setLoginLoading(true);
      google.script.run.withSuccessHandler(function(response) {
        setLoginLoading(false);
        if (response.success) {
          sessionStorage.setItem('req_user', response.name);
          sessionStorage.setItem('req_branchCode', response.branchCode);
          sessionStorage.setItem('req_branchName', response.branchName);
          sessionStorage.setItem('req_role', response.role);
          
          if (response.role === 'Admin') {
            switchView('admin');
          } else {
            showMainApp(response.name, response.branchCode, response.branchName, response.role);
          }
        } else {
          showLoginMessage(response.message, 'error');
        }
      }).withFailureHandler(function(error) {
        setLoginLoading(false);
        showLoginMessage('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + error, 'error');
      }).login(user, pass);
    });
    
    function setLoginLoading(isLoading) {
      document.getElementById('btn-login').disabled = isLoading;
      document.getElementById('btn-login-text').style.display = isLoading ? 'none' : 'block';
      document.getElementById('btn-login-loader').style.display = isLoading ? 'block' : 'none';
    }
    
    function showLoginMessage(msg, type) {
      Swal.fire({
        title: type === 'success' ? 'สำเร็จ' : 'ข้อผิดพลาด',
        text: msg,
        icon: type,
        confirmButtonColor: '#3b82f6'
      });
    }
    
    function logout() {
      sessionStorage.clear();
      
      // Clear data caches so next login fetches fresh data based on their role/branch
      globalProducts = [];
      adminDataCache = {};
      document.getElementById('items-container').innerHTML = '';
      document.getElementById('history-table-wrapper').innerHTML = '';
      document.getElementById('branch-list').innerHTML = '';
      document.getElementById('item-list').innerHTML = '';
      document.getElementById('filter-date').value = '';
      document.getElementById('filter-branch').value = '';
      document.getElementById('filter-item').value = '';
      
      document.getElementById('main-container').style.display = 'none';
      document.getElementById('admin-container').style.display = 'none';
      document.getElementById('history-container').style.display = 'none';
      document.getElementById('login-container').style.display = 'block';
      document.getElementById('loginForm').reset();
      document.getElementById('requisitionForm').reset();
      
      const loginMessage = document.getElementById('login-message');
      if(loginMessage) loginMessage.style.display = 'none';
    }

    // ----- Main App Logic -----
    function showMainApp(userName, userBranchCode, userBranchName, role) {
      switchView('main');
      
      if (role === 'Admin') {
        document.getElementById('btn-goto-admin').style.display = 'block';
      } else {
        document.getElementById('btn-goto-admin').style.display = 'none';
      }
      
      document.getElementById('location').value = `ผู้ใช้งาน: ${userName} | ` + (userBranchName || 'ไม่ระบุสาขา') + (userBranchCode ? ` (${userBranchCode})` : '');
      
      if (globalProducts.length === 0) {
        document.getElementById('main-loading').style.display = 'flex';
        google.script.run.withSuccessHandler(function(data) {
          document.getElementById('main-loading').style.display = 'none';
          globalProducts = data.products;
          if(document.getElementById('items-container').children.length === 0) addItemRow();
        }).withFailureHandler(function(error) {
          document.getElementById('main-loading').style.display = 'none';
          showMainMessage('ไม่สามารถดึงข้อมูลได้: ' + error, 'error');
        }).getInitialData(userBranchCode);
      }
    }

    function addItemRow() {
      const container = document.getElementById('items-container');
      const row = document.createElement('div');
      row.className = 'item-row';
      
      const select = document.createElement('select');
      select.required = true;
      select.className = 'product-select';
      select.innerHTML = '<option value="">-- เลือกอุปกรณ์ --</option>';
      
      const categories = {};
      globalProducts.forEach(p => {
        const cat = p.category || 'อื่นๆ';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(p);
      });
      
      for (const cat in categories) {
        const optgroup = document.createElement('optgroup');
        optgroup.label = cat;
        categories[cat].forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          let label = p.name + (p.unit ? ` (${p.unit})` : '');
          if (p.maxQty > 0) label += ` [จำกัด ${p.maxQty}]`;
          opt.textContent = label;
          opt.setAttribute('data-name', p.name);
          opt.setAttribute('data-category', p.category || '');
          opt.setAttribute('data-maxqty', p.maxQty || 0);
          optgroup.appendChild(opt);
        });
        select.appendChild(optgroup);
      }
      
      const qty = document.createElement('input');
      qty.type = 'number'; qty.min = '1'; qty.step = '1'; qty.placeholder = 'จำนวน';
      qty.required = true; qty.className = 'product-qty';
      
      select.onchange = function() {
        const selectedOption = select.options[select.selectedIndex];
        if (!selectedOption.value) {
          qty.removeAttribute('max');
          return;
        }
        
        const category = selectedOption.getAttribute('data-category') || '';
        const maxQty = parseInt(selectedOption.getAttribute('data-maxqty')) || 0;
        
        if (maxQty > 0) {
          qty.max = maxQty;
        } else {
          qty.removeAttribute('max');
        }
        
        if (category.includes('ถุง')) {
          qty.min = '100';
          qty.step = '100';
          qty.placeholder = 'ทีละ 100';
          if (!qty.value || parseInt(qty.value) < 100) {
            qty.value = '100';
          } else {
            let val = parseInt(qty.value);
            if (val % 100 !== 0) qty.value = Math.ceil(val / 100) * 100;
          }
        } else {
          qty.min = '1';
          qty.step = '1';
          qty.placeholder = 'จำนวน';
          if (!qty.value || parseInt(qty.value) < 1) {
            qty.value = '1';
          }
        }
        
        // Enforce max immediately if exceeded
        if (maxQty > 0 && qty.value && parseInt(qty.value) > maxQty) {
          qty.value = maxQty;
        }
      };
      
      qty.oninput = function() {
        const selectedOption = select.options[select.selectedIndex];
        if (!selectedOption || !selectedOption.value) return;
        const maxQty = parseInt(selectedOption.getAttribute('data-maxqty')) || 0;
        if (maxQty > 0 && parseInt(this.value) > maxQty) {
          this.value = maxQty;
        }
      };
      
      const btnRemove = document.createElement('button');
      btnRemove.type = 'button'; btnRemove.className = 'btn-remove'; btnRemove.innerHTML = '×';
      btnRemove.onclick = function() {
        if (container.children.length > 1) row.remove();
        else { select.value = ''; qty.value = ''; }
      };
      
      row.appendChild(select); row.appendChild(qty); row.appendChild(btnRemove);
      container.appendChild(row);
    }

    document.getElementById('requisitionForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const requester = document.getElementById('requester').value;
      const selects = document.querySelectorAll('.product-select');
      const qtys = document.querySelectorAll('.product-qty');
      
      const items = [];
      for(let i=0; i<selects.length; i++) {
        if(selects[i].value && qtys[i].value) {
          items.push({
            id: selects[i].value,
            name: selects[i].options[selects[i].selectedIndex].getAttribute('data-name'),
            qty: parseInt(qtys[i].value)
          });
        }
      }
      
      if(items.length === 0) return showMainMessage('กรุณาระบุอย่างน้อย 1 รายการ', 'error');
      
      const payload = {
        branchCode: sessionStorage.getItem('req_branchCode'),
        branchName: sessionStorage.getItem('req_branchName'),
        requester: requester,
        items: items
      };
      
      setSubmitLoading(true);
      google.script.run.withSuccessHandler(function(response) {
        setSubmitLoading(false);
        if(response.success) {
          showMainMessage(response.message, 'success');
          document.getElementById('requisitionForm').reset();
          const bc = sessionStorage.getItem('req_branchCode');
          const bn = sessionStorage.getItem('req_branchName');
          const usr = sessionStorage.getItem('req_user');
          document.getElementById('location').value = `ผู้ใช้งาน: ${usr} | ` + (bn || 'ไม่ระบุสาขา') + (bc ? ` (${bc})` : '');
          document.getElementById('items-container').innerHTML = '';
          addItemRow();
          setTimeout(() => { document.getElementById('main-message').style.display = 'none'; }, 5000);
        } else {
          showMainMessage(response.message, 'error');
        }
      }).withFailureHandler(function(error) {
        setSubmitLoading(false);
        showMainMessage('เกิดข้อผิดพลาด: ' + error, 'error');
      }).submitOrder(payload);
    });

    function setSubmitLoading(isLoading) {

      document.getElementById('btn-loader').style.display = isLoading ? 'block' : 'none';

    function showMainMessage(msg, type) {

    // ----- Admin Logic -----

        if (!adminDataCache.Users || adminDataCache.Users.length === 0) {
          adminDataCache.Users = [['Branch Code', 'Password', 'Name', 'Role']];
        }
        if (!adminDataCache.Location || adminDataCache.Location.length === 0) {
          adminDataCache.Location = [['รหัสสาขา', 'ชื่อสาขา', 'ช่องทางการมองเห็น']];

        if (!adminDataCache.Product || adminDataCache.Product.length === 0) {

    function showAdminTab(tabName) {
      saveCurrentTableToCache();
      currentAdminTab = tabName;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      renderAdminTable();
      document.getElementById('admin-message').style.display = 'none';
    }

    function renderAdminTable() {
      const data = adminDataCache[currentAdminTab];
      const wrapper = document.getElementById('admin-table-wrapper');
      
      if (!data || data.length === 0) {
        wrapper.innerHTML = '<p>ไม่มีข้อมูล</p>';
        return;
      }
      
      const headers = data[0];
      const rows = data.slice(1);
      
      let html = '<table class="admin-table" id="admin-table">';
      html += '<thead><tr>';
      headers.forEach(h => html += `<th>${h}</th>`);
      html += '<th style="width: 80px; text-align:center;">จัดการ</th></tr></thead><tbody>';
      
      rows.forEach((row, rIndex) => {
        html += '<tr>';
        headers.forEach((h, cIndex) => {
          if (h.includes('สถานะ') || h.includes('ช่องทางการมองเห็น')) {
            let val = (row[cIndex] || '').toString().trim();
            if (val !== 'ปิด') val = 'เปิด';
            let btnClass = val === 'เปิด' ? 'btn-status-on' : 'btn-status-off';
            html += `<td><button type="button" class="btn-status ${btnClass}" value="${val}" onclick="toggleStatus(this)" disabled>${val}</button></td>`;
          } else {
            html += `<td><input type="text" value="${escapeHtml(row[cIndex] || '')}" readonly /></td>`;
          }
        });
        html += `<td style="text-align:center; white-space:nowrap;">
                  <button type="button" class="btn-action-small edit-btn" onclick="editRow(this)" title="แก้ไข">✏️</button>
                  <button type="button" class="btn-action-small delete-btn" onclick="deleteRow(this)" title="ลบ">🗑️</button>
                 </td></tr>`;
      });
      html += '</tbody></table>';
      wrapper.innerHTML = html;
    }

    function toggleStatus(btn) {
      if (btn.value === 'เปิด') {
        btn.value = 'ปิด';
        btn.textContent = 'ปิด';
        btn.className = 'btn-status btn-status-off';
      } else {
        btn.value = 'เปิด';
        btn.textContent = 'เปิด';
        btn.className = 'btn-status btn-status-on';
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function addAdminRow() {
      const table = document.getElementById('admin-table');
      if (!table) return;
      const headersCount = adminDataCache[currentAdminTab][0].length;
      
      const tbody = table.querySelector('tbody');
      const tr = document.createElement('tr');
      for (let i = 0; i < headersCount; i++) {
        const h = adminDataCache[currentAdminTab][0][i];
        if (h.includes('สถานะ') || h.includes('ช่องทางการมองเห็น')) {
          tr.innerHTML += `<td><button type="button" class="btn-status btn-status-on" value="เปิด" onclick="toggleStatus(this)">เปิด</button></td>`;
        } else {
          tr.innerHTML += `<td><input type="text" value="" /></td>`;
        }
      }
      tr.innerHTML += `<td style="text-align:center; white-space:nowrap;">
                  <button type="button" class="btn-action-small edit-btn editing" onclick="editRow(this)" title="บันทึก">💾</button>
                  <button type="button" class="btn-action-small delete-btn" onclick="deleteRow(this)" title="ลบ">🗑️</button>
                 </td>`;
      tbody.appendChild(tr);
    }

    function deleteRow(btn) {
      Swal.fire({
        title: 'ยืนยันการลบ',
        text: 'คุณต้องการลบรายการนี้ใช่หรือไม่?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#94a3b8',
        confirmButtonText: 'ใช่, ลบเลย!',
        cancelButtonText: 'ยกเลิก'
      }).then((result) => {
        if (result.isConfirmed) {
          btn.closest('tr').remove();
          saveAdmin(true);
        }
      });
    }

    function editRow(btn) {
      const tr = btn.closest('tr');
      if (btn.classList.contains('editing')) {
        Swal.fire({
          title: 'ยืนยันการแก้ไข',
          text: 'คุณต้องการยืนยันการแก้ไขข้อมูลใช่หรือไม่?',
          icon: 'question',
          showCancelButton: true,
          confirmButtonColor: '#10b981',
          cancelButtonColor: '#94a3b8',
          confirmButtonText: 'ใช่, บันทึก',
          cancelButtonText: 'ยกเลิก'
        }).then((result) => {
          if (result.isConfirmed) {
             tr.querySelectorAll('input').forEach(inp => inp.readOnly = true);
             tr.querySelectorAll('.btn-status').forEach(b => b.disabled = true);
             btn.classList.remove('editing');
             btn.innerHTML = '✏️';
             btn.title = 'แก้ไข';
             saveAdmin(true);
          }
        });
      } else {
        tr.querySelectorAll('input').forEach(inp => inp.readOnly = false);
        tr.querySelectorAll('.btn-status').forEach(b => b.disabled = false);
        btn.classList.add('editing');
        btn.innerHTML = '💾';
        btn.title = 'บันทึก';
      }
    }

    function saveCurrentTableToCache() {
      const table = document.getElementById('admin-table');
      if (!table) return;
      
      const headers = adminDataCache[currentAdminTab][0];
      const newData = [headers];
      
      const rows = table.querySelectorAll('tbody tr');
      rows.forEach(tr => {
        const inputs = tr.querySelectorAll('input, .btn-status');
        const rowData = [];
        let hasData = false;
        inputs.forEach(input => {
          rowData.push(input.value);
          if (input.value.trim() !== '') hasData = true;
        });
        if (hasData) newData.push(rowData);
      });
      
      adminDataCache[currentAdminTab] = newData;
    }

    function saveAdmin(skipConfirm = false) {
      if(!skipConfirm) {
        Swal.fire({
          title: 'ยืนยันการบันทึก',
          text: 'คุณต้องการบันทึกการเปลี่ยนแปลงข้อมูลใช่หรือไม่?',
          icon: 'question',
          showCancelButton: true,
          confirmButtonColor: '#3b82f6',
          cancelButtonColor: '#94a3b8',
          confirmButtonText: 'ใช่, บันทึก',
          cancelButtonText: 'ยกเลิก'
        }).then((result) => {
          if (result.isConfirmed) {
            executeSaveAdmin();
          }
        });
        return;
      }
      executeSaveAdmin();
    }

    function executeSaveAdmin() {
      saveCurrentTableToCache();
      const sheetName = currentAdminTab;
      const dataToSave = adminDataCache[sheetName];
      
      const btn = document.getElementById('btn-save-admin');
      const text = document.getElementById('btn-save-admin-text');
      const loader = document.getElementById('btn-save-admin-loader');
      
      btn.disabled = true;
      text.style.display = 'none';
      loader.style.display = 'block';
      
      google.script.run.withSuccessHandler(function(res) {
        btn.disabled = false;
        text.style.display = 'block';
        loader.style.display = 'none';
        
        if (res.success) {
          showAdminMessage(res.message, 'success');
          // Update globalProducts if product saved
          if (sheetName === 'Product') {
            globalProducts = []; // force reload on main view
          }
          setTimeout(() => { document.getElementById('admin-message').style.display = 'none'; }, 3000);
        } else {
          showAdminMessage(res.message, 'error');
        }
      }).withFailureHandler(function(err) {
        btn.disabled = false;
        text.style.display = 'block';
        loader.style.display = 'none';
        showAdminMessage('เกิดข้อผิดพลาด: ' + err, 'error');
      }).saveAdminData(sheetName, dataToSave);
    }

    function showAdminMessage(msg, type) {
      Swal.fire({
        title: type === 'success' ? 'สำเร็จ' : 'ข้อผิดพลาด',
        text: msg,

        confirmButtonColor: '#3b82f6'

    function updateDispenseStatus(rowIdx, selectEl) {

            text: 'อัพเดทสถานะจ่ายเรียบร้อยแล้ว',

            timer: 1500,
            showConfirmButton: false
          });

    function toggleAllHistoryCheckboxes(masterCheckbox) {

        if (row.style.display !== 'none') {
          const cb = row.querySelector('.history-row-checkbox');
          if (cb) cb.checked = masterCheckbox.checked;
        }
      });

    function applyBatchStatus() {
      const checkboxes = document.querySelectorAll('.history-row-checkbox:checked');

        Swal.fire('แจ้งเตือน', 'กรุณาเลือกรายการที่ต้องการอัพเดทอย่างน้อย 1 รายการ', 'warning');
        return;

      const newStatus = document.getElementById('batch-status-select').value;

      Swal.fire({

      }).then((result) => {

    function deleteSelectedHistory() {
      const checkboxes = document.querySelectorAll('.history-row-checkbox:checked');
      if (checkboxes.length === 0) {
        Swal.fire('แจ้งเตือน', 'กรุณาเลือกรายการที่ต้องการลบอย่างน้อย 1 รายการ', 'warning');
        return;
      }
      
      const rowIndices = [];
      checkboxes.forEach(cb => {
        rowIndices.push(parseInt(cb.value));
      });
      
      Swal.fire({
        title: 'ยืนยันการลบ',
        text: `คุณต้องการลบข้อมูลประวัติการเบิกจำนวน ${rowIndices.length} รายการใช่หรือไม่? การกระทำนี้ไม่สามารถยกเลิกได้`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#94a3b8',
        confirmButtonText: 'ใช่, ลบเลย',
        cancelButtonText: 'ยกเลิก'
      }).then((result) => {
        if (result.isConfirmed) {
          document.getElementById('history-loading').style.display = 'flex';
          google.script.run.withSuccessHandler(function(res) {
            document.getElementById('history-loading').style.display = 'none';
            if (res.success) {
              Swal.fire('ลบสำเร็จ', 'ข้อมูลถูกลบเรียบร้อยแล้ว', 'success');
              loadHistoryData();
            } else {
              Swal.fire('ข้อผิดพลาด', res.message, 'error');
            }
          }).withFailureHandler(function(err) {
            document.getElementById('history-loading').style.display = 'none';
            Swal.fire('ข้อผิดพลาด', String(err), 'error');
          }).deleteMultipleOrderRows(rowIndices);
        }
      });
    }
    function filterHistoryTable() {
      const dateFilter = document.getElementById('filter-date').value.toLowerCase();
      const branchFilter = document.getElementById('filter-branch').value.toLowerCase();
      const itemFilter = document.getElementById('filter-item').value.toLowerCase();
      const statusFilter = document.getElementById('filter-status').value;
      
      const table = document.querySelector('#history-table-wrapper table.admin-table');
      if (!table) return;
      
      const rows = table.querySelectorAll('tbody tr');
      const role = sessionStorage.getItem('req_role');
      
      rows.forEach(row => {
        let offset = (role === 'Admin') ? 1 : 0;
        
        let dateCell = row.cells[0 + offset];
        let reqCell = row.cells[1 + offset];
        let branchCodeCell = row.cells[2 + offset];
        let branchNameCell = row.cells[3 + offset];
        let itemCodeCell = row.cells[4 + offset];
        let itemNameCell = row.cells[5 + offset];
        let statusCell = row.cells[7 + offset];
        
        if (!dateCell) return;
        
        const dateText = dateCell.textContent.toLowerCase();
        const branchText = `${reqCell.textContent} ${branchCodeCell.textContent} ${branchNameCell.textContent}`.toLowerCase();
        const itemText = `${itemCodeCell.textContent} ${itemNameCell.textContent}`.toLowerCase();
        
        let statusText = '';
        if (statusCell) {
          const selectEl = statusCell.querySelector('select');
          if (selectEl) {
            statusText = selectEl.value;
          } else {
            statusText = statusCell.textContent;
          }
        }
        const matchesStatus = statusFilter === '' || statusText.includes(statusFilter);
        
        if (dateText.includes(dateFilter) && branchText.includes(branchFilter) && itemText.includes(itemFilter) && matchesStatus) {
          row.style.display = '';
        } else {
          row.style.display = 'none';
        }
      });
    }

    function downloadHistoryCSV() {
      const table = document.querySelector('#history-table-wrapper table.admin-table');
      if (!table) return;
      
      let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
      const rows = table.querySelectorAll('tr');
      
      rows.forEach(row => {
        if (row.style.display === 'none') return; 
        
        let rowData = [];
        const cells = row.querySelectorAll('th, td');
        
        cells.forEach((cell) => {
          if (cell.querySelector('.history-row-checkbox') || (cell.querySelector('input[type="checkbox"]') && cell.tagName === 'TH')) return;
          if (cell.tagName === 'TH' && cell.textContent.trim() === 'จัดการ') return;
          if (cell.querySelector('.edit-btn')) return; 
          
          let text = cell.textContent.trim().replace(/\n/g, ' ').replace(/\s+/g, ' ');
          if (cell.querySelector('select')) {
            text = cell.querySelector('select').value;
          }
          rowData.push(`"${text.replace(/"/g, '""')}"`);
        });
        
        if (rowData.length > 0) {
          csvContent += rowData.join(",") + "\r\n";
        }
      });
      
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      
      const dateStr = new Date().toISOString().slice(0, 10);
      link.setAttribute("download", `ประวัติการเบิก_${dateStr}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>

<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเบิกอุปกรณ์สำนักงาน</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --bg: #F7F8FA;
      --surface: #FFFFFF;
      --border: #6B7280;
      --divider: #E2E8F0;
      --ink: #0B1220;
      --muted: #44475A;
      --primary: #1D4ED8;
      --primary-2: #1E40AF;
      --primary-hover: #1E3FAE;
      --primary-soft: rgba(29, 78, 216, 0.1);
      --accent: var(--primary);
      --accent-hover: var(--primary-hover);
      --text-main: var(--ink);
      --text-muted: var(--muted);
      --danger: #B91C1C;
      --danger-dark: #991B1B;
      --danger-soft: rgba(185, 28, 28, 0.09);
      --success: #15803D;
      --success-dark: #14532D;
      --success-soft: rgba(21, 128, 61, 0.1);
      --warning: #B45309;
      --warning-dark: #92400E;
      --warning-soft: rgba(180, 83, 9, 0.1);
      --radius: 18px;
      --radius-sm: 10px;
      --shadow-sm: 0 1px 2px rgba(11, 18, 32, 0.06);
      --shadow-md: 0 10px 28px rgba(11, 18, 32, 0.10);
      --focus-ring: 0 0 0 5px rgba(29, 78, 216, 0.22);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      line-height: 1.5;
      font-size: 16px;
    }

    /* Visible, high-contrast focus indicator on every interactive element */
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
    [tabindex]:focus-visible, .tab:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
      box-shadow: var(--focus-ring);
      border-radius: 4px;
    }
    input:focus-visible, select:focus-visible { border-radius: var(--radius-sm); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }

    .container {
      width: 100%;
      max-width: 100%;
      background: var(--surface);
      border: 1px solid var(--divider);
      border-radius: var(--radius);
      padding: 40px;
      box-shadow: var(--shadow-sm), var(--shadow-md);
      animation: slideUp 0.4s ease-out forwards;
      position: relative;
      box-sizing: border-box;
    }

    #login-container { max-width: 500px; margin: 0 auto; }
    #main-container { display: none; max-width: 1200px; margin: 0 auto; padding-top: 64px; }
    #admin-container { display: none; max-width: 100%; width: 100%; padding: 40px 20px; padding-top: 64px; }
    #history-container { display: none; max-width: 100%; width: 100%; padding: 40px 20px; padding-top: 64px; }

    @media (max-width: 768px) {
      body { padding: 0; align-items: flex-start; background: var(--bg); }
      .container { padding: 15px; padding-top: 60px; border-radius: 0; margin-top: 0; box-shadow: none; border-left: none; border-right: none; }
      #login-container, #main-container { margin: 10px; padding: 20px; padding-top: 60px; box-shadow: var(--shadow-md); border: 1px solid var(--divider); border-radius: var(--radius-sm); }
      #login-container { padding-top: 40px; margin-top: 20px; }
      #history-container, #admin-container { padding-left: 0; padding-right: 0; }
      table.admin-table { font-size: 13px; }
      table.admin-table th, table.admin-table td { padding: 8px 6px; }
      h1 { font-size: 24px; margin-bottom: 20px; }
      .btn-logout, .btn-switch, .btn-logout-relative, .btn-switch-relative { padding: 8px 12px; font-size: 12px; }
      .item-row { flex-wrap: wrap; }
      .item-row select { flex: 100%; margin-bottom: 10px; }
      .item-row input { flex: 1; }
      .btn-remove { flex: 0 0 44px; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: left;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-top: 0;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 28px;
      line-height: 1.25;
    }

    .subtitle {
      text-align: left;
      color: var(--muted);
      margin-top: 0;
      margin-bottom: 32px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
    }

    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }

    input[type="text"], input[type="password"], input[type="number"], select {
      width: 100%;
      padding: 13px 16px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.15s ease;
      box-sizing: border-box;
      min-height: 44px;
    }

    input:focus, select:focus {
      outline: 3px solid var(--primary);
      outline-offset: 1px;
      border-color: var(--primary);
    }

    input[readonly] { opacity: 0.75; cursor: not-allowed; background: var(--bg); }
    select option { background: var(--surface); color: var(--ink); }

    input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary); }

    .item-row {
      display: flex; gap: 12px; margin-bottom: 12px; align-items: center;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .item-row select { flex: 2; }
    .item-row input { flex: 1; }

    .btn-remove {
      background: var(--danger-soft); border: 1.5px solid transparent; color: var(--danger);
      width: 44px; height: 44px; min-width: 44px; border-radius: var(--radius-sm);
      display: flex; justify-content: center; align-items: center; cursor: pointer;
      transition: all 0.15s; font-size: 20px; font-weight: 700;
    }
    .btn-remove:hover { background: var(--danger); color: white; }

    .btn-add {
      background: var(--surface); border: 1.5px dashed var(--border); color: var(--muted);
      width: 100%; padding: 13px; border-radius: var(--radius-sm); cursor: pointer;
      font-family: inherit; font-size: 15px; font-weight: 600; transition: all 0.15s ease; margin-bottom: 24px;
      min-height: 44px;
    }
    .btn-add:hover { border-style: solid; border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

    .btn-submit {
      background: var(--primary); border: 1.5px solid var(--primary); color: white;
      width: 100%; padding: 15px; border-radius: var(--radius-sm); font-family: inherit; font-size: 17px; font-weight: 700;
      cursor: pointer; transition: background 0.15s, transform 0.15s; min-height: 48px;
    }
    .btn-submit:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .btn-logout, .btn-switch, .btn-logout-relative, .btn-switch-relative {
      background: var(--surface); border: 1.5px solid var(--border);
      color: var(--ink); padding: 10px 16px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.15s ease;
      min-height: 40px;
    }
    .btn-logout:hover, .btn-switch:hover, .btn-logout-relative:hover, .btn-switch-relative:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

    .loader {
      display: none; width: 26px; height: 26px; border: 3px solid var(--primary-soft);
      border-radius: 50%; border-top-color: var(--primary); animation: spin 0.8s linear infinite; margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .message {
      margin-top: 20px; padding: 14px 16px; border-radius: var(--radius-sm); text-align: left;
      display: none; font-weight: 600; font-size: 15px; line-height: 1.5;
      border: 1.5px solid transparent;
    }
    .message.success { background: var(--success-soft); color: var(--success-dark); border-color: rgba(21, 128, 61, 0.35); }
    .message.error { background: var(--danger-soft); color: var(--danger-dark); border-color: rgba(185, 28, 28, 0.35); }

    .status-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .status-chip { padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; border: 1.5px solid transparent; white-space: nowrap; }
    .status-chip-total { background: var(--bg); color: var(--ink); border-color: var(--divider); }
    .status-chip-pending { background: var(--warning-soft); color: var(--warning-dark); border-color: rgba(180, 83, 9, 0.35); }
    .status-chip-success { background: var(--success-soft); color: var(--success-dark); border-color: rgba(21, 128, 61, 0.35); }
    .status-chip-danger { background: var(--danger-soft); color: var(--danger-dark); border-color: rgba(185, 28, 28, 0.35); }

    .loading-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.9);
      display: flex; justify-content: center; align-items: center; border-radius: var(--radius); z-index: 10;
    }
    .loading-overlay .loader { border-color: var(--primary-soft); border-top-color: var(--primary); }

    /* Admin CSS */
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--bg); padding: 4px; border-radius: var(--radius-sm); width: fit-content; border: 1px solid var(--divider); }
    .tab { padding: 10px 18px; cursor: pointer; border-radius: 7px; transition: all 0.15s; color: var(--muted); font-size: 14px; font-weight: 600; min-height: 40px; }
    .tab:hover { color: var(--ink); }
    .tab.active { background: var(--primary); color: white; }

    .admin-table-wrapper { overflow-x: auto; overflow-y: auto; max-height: 65vh; margin-bottom: 20px; width: 100%; border: 1px solid var(--divider); border-radius: var(--radius-sm); }
    table.admin-table { width: 100%; border-collapse: collapse; min-width: 100%; table-layout: auto; word-wrap: break-word; }
    table.admin-table th, table.admin-table td { border: none; border-bottom: 1px solid var(--divider); padding: 12px 10px; text-align: left; }
    table.admin-table tbody tr:last-child td { border-bottom: none; }
    table.admin-table tbody tr:hover { background: var(--primary-soft); }
    table.admin-table th { background: var(--bg); font-weight: 700; color: var(--ink); font-size: 13px; position: sticky; top: 0; z-index: 2; box-shadow: inset 0 -1px 0 var(--divider); }

    /* History table: batch-action toolbar frozen above the column headers */
    table.admin-table thead tr.history-batch-row th.history-batch-cell {
      background: var(--surface);
      padding: 0;
      z-index: 3;
      box-shadow: inset 0 -1px 0 var(--divider);
    }
    .history-batch-bar {
      display: flex; gap: 10px; align-items: center; flex-wrap: nowrap;
      height: 56px; box-sizing: border-box; padding: 0 12px;
      overflow-x: auto;
    }
    table.admin-table thead tr.history-batch-row + tr th { top: 56px; }
    table.admin-table input { width: 100%; padding: 8px; background: transparent; border: none; color: var(--ink); font-family: inherit; font-size: 15px; border-radius: 8px; box-sizing: border-box; }
    table.admin-table input:not([readonly]) { background: var(--surface); box-shadow: 0 0 0 1.5px var(--primary) inset; }
    table.admin-table input:not([readonly]):focus { outline: none; }

    .btn-status { width: 100%; padding: 8px; border: 1.5px solid transparent; border-radius: 999px; font-family: inherit; font-size: 13px; cursor: pointer; font-weight: 700; transition: all 0.15s; min-height: 36px; }
    .btn-status-on { background: var(--success-soft); color: var(--success-dark); border-color: rgba(21, 128, 61, 0.35); }
    .btn-status-off { background: var(--danger-soft); color: var(--danger-dark); border-color: rgba(185, 28, 28, 0.35); }
    .btn-status:disabled { opacity: 0.9; cursor: default; }

    .btn-action-small { background: var(--bg); border: 1.5px solid var(--divider); color: var(--ink); cursor: pointer; font-size: 15px; padding: 8px; border-radius: 9px; min-width: 40px; min-height: 40px; }
    .btn-action-small:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  </style>
</head>
<body>

  <!-- Login Container -->
  <div class="container" id="login-container">
    <div class="loading-overlay" id="login-loading" style="display: none;">
      <div class="loader" style="display: block; width: 40px; height: 40px; border-width: 4px;"></div>
    </div>
    
    <h1>เข้าสู่ระบบ</h1>
    <div class="subtitle">ระบบเบิกอุปกรณ์สำนักงาน</div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="username">รหัสสาขา (Branch Code)</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label for="password">รหัสผ่าน (Password)</label>
        <input type="password" id="password" required>
      </div>
      <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px;">
        <input type="checkbox" id="remember-login" style="width: auto;">
        <label for="remember-login" style="margin-bottom: 0; cursor: pointer;">จดจำรหัสสาขาและรหัสผ่าน</label>
      </div>
      <button type="submit" class="btn-submit" id="btn-login">
        <span id="btn-login-text">เข้าสู่ระบบ</span>
        <div class="loader" id="btn-login-loader"></div>
      </button>
      <div id="login-message" class="message" role="status" aria-live="polite"></div>
    </form>
  </div>

  <!-- Main App Container -->
  <div class="container" id="main-container">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; position: absolute; top: 20px; left: 20px; right: 20px; z-index: 10;">
      <button class="btn-switch-relative" id="btn-goto-history" onclick="switchView('history')">ประวัติการเบิก</button>
      <div style="display: flex; gap: 8px;">
        <button class="btn-switch-relative" id="btn-goto-admin" onclick="switchView('admin')" style="display: none;">ตั้งค่าระบบ</button>
        <button class="btn-logout-relative" onclick="logout()">ออกจากระบบ</button>
      </div>
    </div>
    
    <div class="loading-overlay" id="main-loading">
      <div class="loader" style="display: block; width: 40px; height: 40px; border-width: 4px;"></div>
    </div>
    
    <h1>เบิกอุปกรณ์</h1>

    <div id="pending-order-banner" class="message error" style="display: none;">สาขานี้มีรายการเบิกที่ยังรอจ่ายอยู่ ไม่สามารถเบิกรายการใหม่ได้จนกว่าจะจ่ายแล้ว</div>

    <form id="requisitionForm">
      <div class="form-group">
        <label for="location">สาขาที่เบิก</label>
        <input type="text" id="location" readonly required>
      </div>
      <div class="form-group">
        <label for="requester">ชื่อผู้เบิก</label>
        <input type="text" id="requester" placeholder="ระบุชื่อผู้เบิก" required>
      </div>
      <div class="form-group">
        <label>รายการที่ต้องการเบิก</label>
        <div id="items-container"></div>
      </div>
      
      <button type="button" class="btn-add" id="btn-add-item">+ เพิ่มรายการอุปกรณ์</button>
      
      <button type="submit" class="btn-submit" id="btn-submit">
        <span id="btn-text">ยืนยันการเบิก</span>
        <div class="loader" id="btn-loader"></div>
      </button>
      <div id="main-message" class="message" role="status" aria-live="polite"></div>
    </form>
  </div>


  <div class="container" id="admin-container" style="display: none;">
    <div style="display: flex; justify-content: flex-end; align-items: flex-start; gap: 8px; position: absolute; top: 20px; right: 20px; z-index: 10;">
      <button class="btn-switch-relative" onclick="gotoMainApp()">เบิกอุปกรณ์</button>
      <button class="btn-logout-relative" onclick="logout()">ออกจากระบบ</button>
    </div>
    
    <div class="loading-overlay" id="admin-loading">
      <div class="loader" style="display: block; width: 40px; height: 40px; border-width: 4px;"></div>
    </div>
    
    <h1>ตั้งค่าระบบ</h1>
    
    <div class="tabs">
      <div class="tab active" onclick="showAdminTab('Users')" id="tab-Users">พนักงาน (Users)</div>
      <div class="tab" onclick="showAdminTab('Location')" id="tab-Location">สาขา (Location)</div>
      <div class="tab" onclick="showAdminTab('Product')" id="tab-Product">สินค้า (Product)</div>
    </div>
    
    <div style="margin-bottom: 15px;">
      <input type="text" id="admin-search" placeholder="ค้นหาข้อมูล..." aria-label="ค้นหาข้อมูล" oninput="filterAdminTable()" style="width: 100%; padding: 10px 14px; font-family: inherit; font-size: 16px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-main); box-sizing: border-box;">
    </div>

    <div id="admin-batch-bar" style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <button type="button" class="btn-submit" style="width: auto; padding: 8px 16px; font-size: 13px;" onclick="enableBatchEditSelected()">แก้ไขรายการที่เลือก</button>
      <button type="button" class="btn-submit" id="btn-save-batch" style="width: auto; padding: 8px 16px; font-size: 13px; background: #15803D; display: none;" onclick="saveBatchEdits()">บันทึกการแก้ไข</button>
      <button type="button" class="btn-submit" id="btn-cancel-batch" style="width: auto; padding: 8px 16px; font-size: 13px; background: #44475A; display: none;" onclick="cancelBatchEdits()">ยกเลิก</button>
      <button type="button" class="btn-submit" style="width: auto; padding: 8px 16px; font-size: 13px; background: #B91C1C;" onclick="deleteSelectedAdminRows()">ลบรายการที่เลือก</button>
    </div>

    <div class="admin-table-wrapper" id="admin-table-wrapper">
      <!-- Injected table -->
    </div>

    <div style="display: flex; gap: 16px;">
      <button class="btn-add" onclick="addAdminRow()" style="margin-bottom: 0; flex: 1;">+ เพิ่มรายการ</button>
    </div>
    
    <div id="admin-message" class="message" role="status" aria-live="polite"></div>
  </div>

  <!-- History Container -->
  <div class="container" id="history-container" style="display: none;">
    <div style="display: flex; justify-content: flex-end; align-items: flex-start; gap: 8px; position: absolute; top: 20px; right: 20px; z-index: 10;">
      <button class="btn-switch-relative" onclick="gotoMainApp()">เบิกอุปกรณ์</button>
      <button class="btn-logout-relative" onclick="logout()">ออกจากระบบ</button>
    </div>
    
    <div class="loading-overlay" id="history-loading" style="display: none;">
      <div class="loader" style="display: block; width: 40px; height: 40px; border-width: 4px;"></div>
    </div>
    
    <h1>ประวัติการเบิกอุปกรณ์</h1>
    
    <div id="history-filters" style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
      <input type="date" id="filter-date" title="ค้นหาวันที่" aria-label="ค้นหาวันที่" onchange="filterHistoryTable(true)" style="flex: 1; min-width: 120px; padding: 10px; font-family: inherit; font-size: 16px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-main);">
      
      <input type="text" list="branch-list" id="filter-branch" placeholder="ค้นหาสาขา/ผู้เบิก..." aria-label="ค้นหาสาขาหรือผู้เบิก" oninput="filterHistoryTable(true)" style="flex: 1; min-width: 120px; padding: 10px; font-size: 16px;">
      <datalist id="branch-list"></datalist>
      
      <input type="text" list="item-list" id="filter-item" placeholder="ค้นหารายการ..." aria-label="ค้นหารายการสินค้า" oninput="filterHistoryTable(true)" style="flex: 1; min-width: 120px; padding: 10px; font-size: 16px;">
      <datalist id="item-list"></datalist>
      
      <select id="filter-status" aria-label="กรองตามสถานะ" onchange="filterHistoryTable(true)" style="flex: 1; min-width: 120px; padding: 10px; font-family: inherit; font-size: 16px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-main);">
        <option value="" style="color: var(--text-main);">ทุกสถานะ</option>
        <option value="รอจ่าย" style="color: var(--text-main);">รอจ่าย</option>
        <option value="จ่ายแล้ว" style="color: var(--text-main);">จ่ายแล้ว</option>
        <option value="ยกเลิก" style="color: var(--text-main);">ยกเลิก</option>
      </select>
      
      <button class="btn-submit" style="flex: 0 0 auto; padding: 10px 15px; width: auto; font-size: 14px; background: #15803D;" onclick="downloadHistoryCSV()">📥 ดาวน์โหลด CSV</button>
    </div>

    <div id="history-status-summary" class="status-summary" role="status" aria-live="polite"></div>

    <div class="admin-table-wrapper" id="history-table-wrapper">
      <!-- Injected table -->
    </div>
  </div>

  <script>
    let globalProducts = [];
    let adminDataCache = {};
    let currentAdminTab = 'Users';
    
    // Check login state
    window.onload = function() {
      const savedUser = sessionStorage.getItem('req_user');
      const savedToken = sessionStorage.getItem('req_token');
      const savedBranchCode = sessionStorage.getItem('req_branchCode');
      const savedBranchName = sessionStorage.getItem('req_branchName');
      const savedRole = sessionStorage.getItem('req_role');
      if (savedUser && savedToken) {
        showMainApp(savedUser, savedBranchCode, savedBranchName, savedRole);
      }

      const rememberedUser = localStorage.getItem('req_remember_user');
      const rememberedPass = localStorage.getItem('req_remember_pass');
      if (rememberedUser && rememberedPass) {
        document.getElementById('username').value = rememberedUser;
        document.getElementById('password').value = rememberedPass;
        document.getElementById('remember-login').checked = true;
      }
    };

    function getToken() {
      return sessionStorage.getItem('req_token') || '';
    }

    function isAuthError(err) {
      const msg = String((err && err.message) || err || '');
      return msg.indexOf('เซสชันหมดอายุ') !== -1 || msg.indexOf('ไม่มีสิทธิ์') !== -1;
    }

    // Returns true (and forces logout) if the error was an auth/session failure, so
    // the caller can skip showing its own generic error message.
    function handleAuthError(err) {
      if (isAuthError(err)) {
        Swal.fire('หมดเวลาการใช้งาน', String((err && err.message) || err), 'warning').then(() => {
          logout();
        });
        return true;
      }
      return false;
    }

    // --- Switch View ---
    function switchView(view) {
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('main-container').style.display = 'none';
      document.getElementById('admin-container').style.display = 'none';
      document.getElementById('history-container').style.display = 'none';
      
      if (view === 'main') {
        document.getElementById('main-container').style.display = 'block';
      } else if (view === 'admin') {
        document.getElementById('admin-container').style.display = 'block';
        loadAdminData();
      } else if (view === 'history') {
        document.getElementById('history-container').style.display = 'block';
        loadHistoryData();
      }
    }

    // ----- Login Logic -----
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      
      setLoginLoading(true);
      google.script.run.withSuccessHandler(function(response) {
        setLoginLoading(false);
        if (response.success) {
          sessionStorage.setItem('req_user', response.name);
          sessionStorage.setItem('req_token', response.token);
          sessionStorage.setItem('req_branchCode', response.branchCode);
          sessionStorage.setItem('req_branchName', response.branchName);
          sessionStorage.setItem('req_role', response.role);

          if (document.getElementById('remember-login').checked) {
            localStorage.setItem('req_remember_user', user);
            localStorage.setItem('req_remember_pass', pass);
          } else {
            localStorage.removeItem('req_remember_user');
            localStorage.removeItem('req_remember_pass');
          }

          if (response.role === 'Admin') {
            switchView('admin');
          } else {
            showMainApp(response.name, response.branchCode, response.branchName, response.role);
          }
        } else {
          showLoginMessage(response.message, 'error');
        }
      }).withFailureHandler(function(error) {
        setLoginLoading(false);
        showLoginMessage('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + error, 'error');
      }).login(user, pass);
    });
    
    function setLoginLoading(isLoading) {
      document.getElementById('btn-login').disabled = isLoading;
      document.getElementById('btn-login-text').style.display = isLoading ? 'none' : 'block';
      document.getElementById('btn-login-loader').style.display = isLoading ? 'block' : 'none';
    }
    
    function showLoginMessage(msg, type) {
      Swal.fire({
        title: type === 'success' ? 'สำเร็จ' : 'ข้อผิดพลาด',
        text: msg,
        icon: type,
        confirmButtonColor: '#1D4ED8'
      });
    }
    
    function logout() {
      if (hasUnsavedBatchEdits()) { warnUnsavedBatchEdits(); return; }
      const token = getToken();
      if (token) {
        google.script.run.logoutSession(token); // best-effort, fire and forget
      }
      sessionStorage.clear();

      // Clear data caches so next login fetches fresh data based on their role/branch
      globalProducts = [];
      adminDataCache = {};
      document.getElementById('items-container').innerHTML = '';
      document.getElementById('history-table-wrapper').innerHTML = '';
      document.getElementById('history-status-summary').innerHTML = '';
      document.getElementById('branch-list').innerHTML = '';
      document.getElementById('item-list').innerHTML = '';
      document.getElementById('filter-date').value = '';
      document.getElementById('filter-branch').value = '';
      document.getElementById('filter-item').value = '';
      setPendingOrderUI([]);

      document.getElementById('main-container').style.display = 'none';
      document.getElementById('admin-container').style.display = 'none';
      document.getElementById('history-container').style.display = 'none';
      document.getElementById('login-container').style.display = 'block';
      document.getElementById('loginForm').reset();
      document.getElementById('requisitionForm').reset();
      
      const loginMessage = document.getElementById('login-message');
      if(loginMessage) loginMessage.style.display = 'none';
    }

    // ----- Main App Logic -----
    function gotoMainApp() {
      if (hasUnsavedBatchEdits()) { warnUnsavedBatchEdits(); return; }
      const u = sessionStorage.getItem('req_user');
      const bc = sessionStorage.getItem('req_branchCode');
      const bn = sessionStorage.getItem('req_branchName');
      const r = sessionStorage.getItem('req_role');
      if (u) showMainApp(u, bc, bn, r);
    }

    function showMainApp(userName, userBranchCode, userBranchName, role) {
      switchView('main');
      
      if (role === 'Admin') {
        document.getElementById('btn-goto-admin').style.display = 'block';
      } else {
        document.getElementById('btn-goto-admin').style.display = 'none';
      }
      
      document.getElementById('location').value = `ผู้ใช้งาน: ${userName} | ` + (userBranchName || 'ไม่ระบุสาขา') + (userBranchCode ? ` (${userBranchCode})` : '');

      google.script.run.withSuccessHandler(function(res) {
        setPendingOrderUI(res.pendingItems);
      }).withFailureHandler(function(error) {
        handleAuthError(error);
      }).checkPendingOrder(getToken());

      if (globalProducts.length === 0) {
        document.getElementById('main-loading').style.display = 'flex';
        google.script.run.withSuccessHandler(function(data) {
          document.getElementById('main-loading').style.display = 'none';
          globalProducts = data.products;
          if(document.getElementById('items-container').children.length === 0) addItemRow();
        }).withFailureHandler(function(error) {
          document.getElementById('main-loading').style.display = 'none';
          if (handleAuthError(error)) return;
          showMainMessage('ไม่สามารถดึงข้อมูลได้: ' + error, 'error');
        }).getInitialData(getToken());
      }
    }

    let pendingItemIds = new Set();

    function setPendingOrderUI(pendingItems) {
      pendingItems = pendingItems || [];
      pendingItemIds = new Set(pendingItems.map(p => String(p.id)));

      const banner = document.getElementById('pending-order-banner');
      if (pendingItems.length > 0) {
        banner.textContent = 'รายการต่อไปนี้ยังรอจ่ายอยู่ ไม่สามารถเบิกซ้ำได้จนกว่าจะจ่ายแล้ว: ' + pendingItems.map(p => p.name).join(', ');
        banner.style.display = 'block';
      } else {
        banner.style.display = 'none';
      }

      applyPendingRestrictionsToSelects();
    }

    function applyPendingRestrictionsToSelects() {
      document.querySelectorAll('.product-select').forEach(select => {
        Array.from(select.options).forEach(opt => {
          if (!opt.value) return;
          opt.disabled = pendingItemIds.has(opt.value);
        });
        // If the currently selected option just became blocked, clear it
        const selectedOption = select.options[select.selectedIndex];
        if (selectedOption && selectedOption.disabled) {
          select.value = '';
          select.dispatchEvent(new Event('change'));
        }
      });
    }

    function addItemRow() {
      const container = document.getElementById('items-container');
      const row = document.createElement('div');
      row.className = 'item-row';
      
      const select = document.createElement('select');
      select.required = true;
      select.className = 'product-select';
      select.innerHTML = '<option value="">-- เลือกอุปกรณ์ --</option>';
      
      const categories = {};
      globalProducts.forEach(p => {
        const cat = p.category || 'อื่นๆ';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(p);
      });
      
      for (const cat in categories) {
        const optgroup = document.createElement('optgroup');
        optgroup.label = cat;
        categories[cat].forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          let label = `${p.id} - ${p.name} ${p.unit ? '('+p.unit+')' : ''}`;
          if (p.maxQty > 0) label += ` [จำกัด ${p.maxQty}]`;
          opt.textContent = label;
          opt.setAttribute('data-name', p.name);
          opt.setAttribute('data-category', cat);
          opt.setAttribute('data-maxqty', p.maxQty);
          optgroup.appendChild(opt);
        });
        select.appendChild(optgroup);
      }
      
      const qty = document.createElement('input');
      qty.type = 'number'; qty.min = '1'; qty.step = '1'; qty.placeholder = 'จำนวน';
      qty.required = true; qty.className = 'product-qty';
      
      select.onchange = function() {
        const selectedOption = select.options[select.selectedIndex];
        if (!selectedOption.value) {
          qty.removeAttribute('max');
          return;
        }
        
        const category = selectedOption.getAttribute('data-category') || '';
        const maxQty = parseInt(selectedOption.getAttribute('data-maxqty')) || 0;
        
        if (maxQty > 0) {
          qty.max = maxQty;
        } else {
          qty.removeAttribute('max');
        }
        
        if (category.includes('ถุง')) {
          qty.min = '100';
          qty.step = '100';
          qty.placeholder = 'ทีละ 100';
          if (!qty.value || parseInt(qty.value) < 100) {
            qty.value = '100';
          } else {
            let val = parseInt(qty.value);
            if (val % 100 !== 0) qty.value = Math.ceil(val / 100) * 100;
          }
        } else {
          qty.min = '1';
          qty.step = '1';
          qty.placeholder = 'จำนวน';
          if (!qty.value || parseInt(qty.value) < 1) qty.value = '1';
        }
        
        // Enforce max immediately if exceeded
        if (maxQty > 0 && qty.value && parseInt(qty.value) > maxQty) {
          qty.value = maxQty;
        }
      };
      
      qty.oninput = function() {
        const selectedOption = select.options[select.selectedIndex];
        if (!selectedOption || !selectedOption.value) return;
        const maxQty = parseInt(selectedOption.getAttribute('data-maxqty')) || 0;
        if (maxQty > 0 && parseInt(this.value) > maxQty) {
          this.value = maxQty;
        }
      };
      
      const btnRemove = document.createElement('button');
      btnRemove.type = 'button'; btnRemove.className = 'btn-remove'; btnRemove.innerHTML = '×';
      btnRemove.setAttribute('aria-label', 'ลบรายการนี้');
      btnRemove.onclick = function() {
        if (container.children.length > 1) row.remove();
        else { select.value = ''; qty.value = ''; }
      };
      
      row.appendChild(select); row.appendChild(qty); row.appendChild(btnRemove);
      container.appendChild(row);
      applyPendingRestrictionsToSelects();
    }

    document.getElementById('btn-add-item').addEventListener('click', addItemRow);

    document.getElementById('requisitionForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const requester = document.getElementById('requester').value;
      const selects = document.querySelectorAll('.product-select');
      const qtys = document.querySelectorAll('.product-qty');
      
      const items = [];
      for(let i=0; i<selects.length; i++) {
        if(selects[i].value && qtys[i].value) {
          items.push({
            id: selects[i].value,
            name: selects[i].options[selects[i].selectedIndex].getAttribute('data-name'),
            qty: parseInt(qtys[i].value)
          });
        }
      }
      
      if(items.length === 0) return showMainMessage('กรุณาระบุอย่างน้อย 1 รายการ', 'error');
      
      const payload = {
        requester: requester,
        items: items
      };

      setSubmitLoading(true);
      google.script.run.withSuccessHandler(function(response) {
        setSubmitLoading(false);
        if(response.success) {
          showMainMessage(response.message, 'success');
          document.getElementById('requisitionForm').reset();
          const bc = sessionStorage.getItem('req_branchCode');
          const bn = sessionStorage.getItem('req_branchName');
          const usr = sessionStorage.getItem('req_user');
          document.getElementById('location').value = `ผู้ใช้งาน: ${usr} | ` + (bn || 'ไม่ระบุสาขา') + (bc ? ` (${bc})` : '');
          document.getElementById('items-container').innerHTML = '';
          addItemRow();
          google.script.run.withSuccessHandler(function(res) {
            setPendingOrderUI(res.pendingItems);
          }).checkPendingOrder(getToken());
          setTimeout(() => { document.getElementById('main-message').style.display = 'none'; }, 5000);
        } else {
          showMainMessage(response.message, 'error');
        }
      }).withFailureHandler(function(error) {
        setSubmitLoading(false);
        if (handleAuthError(error)) return;
        showMainMessage('เกิดข้อผิดพลาด: ' + error, 'error');
      }).submitOrder(getToken(), payload);
    });

    function setSubmitLoading(isLoading) {
      document.getElementById('btn-submit').disabled = isLoading;
      document.getElementById('btn-text').style.display = isLoading ? 'none' : 'block';
      document.getElementById('btn-loader').style.display = isLoading ? 'block' : 'none';
    }

    function showMainMessage(msg, type) {
      Swal.fire({
        title: type === 'success' ? 'สำเร็จ' : 'ข้อผิดพลาด',
        text: msg,
        icon: type,
        confirmButtonColor: '#1D4ED8'
      });
    }

    // ----- Admin Logic -----
    function loadAdminData(force = false) {
      if (!force && Object.keys(adminDataCache).length > 0) {
        renderAdminTable();
        return;
      }
      document.getElementById('admin-loading').style.display = 'flex';
      google.script.run.withSuccessHandler(function(data) {
        document.getElementById('admin-loading').style.display = 'none';
        adminDataCache = data;
        
        // Ensure default headers exist if sheet was empty
        if (!adminDataCache.Users || adminDataCache.Users.length === 0) {
          adminDataCache.Users = [['Branch Code', 'Password', 'Name', 'Role']];
        }
        if (!adminDataCache.Location || adminDataCache.Location.length === 0) {
          adminDataCache.Location = [['รหัสสาขา', 'ชื่อสาขา', 'ช่องทางการมองเห็น']];
        }
        if (!adminDataCache.Product || adminDataCache.Product.length === 0) {
          adminDataCache.Product = [['รหัสสินค้า', 'ชื่อสินค้า', 'หมวดหมู่', 'กำหนดจำนวนเบิก/ครั้ง', 'ช่องทางการมองเห็น', 'หน่วยนับ']];
        }
        
        renderAdminTable();
      }).withFailureHandler(function(error) {
        document.getElementById('admin-loading').style.display = 'none';
        if (handleAuthError(error)) return;
        showAdminMessage('ไม่สามารถโหลดข้อมูลได้: ' + error, 'error');
      }).getAdminData(getToken());
    }

    function hasUnsavedBatchEdits() {
      return batchEditRowIndices.size > 0;
    }

    function warnUnsavedBatchEdits() {
      Swal.fire('แจ้งเตือน', 'กรุณาบันทึกหรือกดยกเลิกการแก้ไขที่ค้างอยู่ก่อน', 'warning');
    }

    function showAdminTab(tabName) {
      if (hasUnsavedBatchEdits()) { warnUnsavedBatchEdits(); return; }
      currentAdminTab = tabName;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');

      // Reset admin pagination and search when switching tab
      currentAdminPage = 1;
      const searchInput = document.getElementById('admin-search');
      if (searchInput) searchInput.value = '';
      adminSearchTerm = '';

      renderAdminTable();
      document.getElementById('admin-message').style.display = 'none';
    }

    let currentAdminPage = 1;
    let adminSearchTerm = '';
    let batchEditRowIndices = new Set();
    const ADMIN_PAGE_SIZE = 20;

    function filterAdminTable() {
      adminSearchTerm = document.getElementById('admin-search').value.toLowerCase();
      currentAdminPage = 1;
      renderAdminTable();
    }

    function renderAdminTable() {
      const data = adminDataCache[currentAdminTab];
      const wrapper = document.getElementById('admin-table-wrapper');

      // Any pending batch edit is discarded whenever the table is re-rendered
      batchEditRowIndices.clear();
      const saveBatchBtn = document.getElementById('btn-save-batch');
      const cancelBatchBtn = document.getElementById('btn-cancel-batch');
      const searchInput = document.getElementById('admin-search');
      if (saveBatchBtn) saveBatchBtn.style.display = 'none';
      if (cancelBatchBtn) cancelBatchBtn.style.display = 'none';
      if (searchInput) searchInput.disabled = false;

      if (!data || data.length === 0) {
        wrapper.innerHTML = '<p>ไม่มีข้อมูล</p>';
        return;
      }

      const headers = data[0];
      let allRows = data.slice(1);

      if (adminSearchTerm) {
        allRows = allRows.filter(row => {
          return headers.some((h, cIndex) => {
            if (currentAdminTab === 'Users' && cIndex === 1) return false; // skip password column
            return String(row[cIndex] || '').toLowerCase().includes(adminSearchTerm);
          });
        });
      }

      const totalPages = Math.ceil(allRows.length / ADMIN_PAGE_SIZE) || 1;
      if (currentAdminPage > totalPages) currentAdminPage = totalPages;
      
      const startIndex = (currentAdminPage - 1) * ADMIN_PAGE_SIZE;
      const endIndex = startIndex + ADMIN_PAGE_SIZE;
      const rows = allRows.slice(startIndex, endIndex);
      
      let html = '<table class="admin-table" id="admin-table">';
      html += '<thead><tr>';
      html += '<th style="width: 30px; text-align:center;"><input type="checkbox" aria-label="เลือกทั้งหมด" onchange="toggleAllAdminCheckboxes(this)"></th>';
      headers.forEach(h => html += `<th>${h}</th>`);
      html += '<th style="width: 80px; text-align:center;">จัดการ</th></tr></thead><tbody>';

      rows.forEach((row) => {
        let rowIdx = row[headers.length];
        html += `<tr data-rowindex="${rowIdx}">`;
        html += `<td style="text-align:center;"><input type="checkbox" class="admin-row-checkbox" aria-label="เลือกแถวนี้" value="${rowIdx}"></td>`;
        headers.forEach((h, cIndex) => {
          if (h.includes('สถานะ') || h.includes('ช่องทางการมองเห็น')) {
            let val = (row[cIndex] || '').toString().trim();
            if (val !== 'ปิด') val = 'เปิด';
            let btnClass = val === 'เปิด' ? 'btn-status-on' : 'btn-status-off';
            html += `<td><button type="button" class="btn-status ${btnClass}" value="${val}" onclick="toggleStatus(this)" disabled>${val}</button></td>`;
          } else {
            let val = (currentAdminTab === 'Users' && cIndex === 1) ? '********' : escapeHtml(row[cIndex] || '');
            html += `<td><input type="text" value="${val}" data-original="${val}" readonly /></td>`;
          }
        });
        html += `<td style="text-align:center; white-space:nowrap;">
                  <button type="button" class="btn-action-small edit-btn" onclick="editRow(this, ${rowIdx})" title="แก้ไข" aria-label="แก้ไขแถวนี้">✏️</button>
                  <button type="button" class="btn-action-small delete-btn" onclick="deleteRow(this, ${rowIdx})" title="ลบ" aria-label="ลบแถวนี้">🗑️</button>
                 </td></tr>`;
      });
      html += '</tbody></table>';
      wrapper.innerHTML = html;
      
      renderAdminPagination(totalPages);
    }
    
    function renderAdminPagination(totalPages) {
       let container = document.getElementById('admin-pagination');
       if (!container) {
          const wrapper = document.getElementById('admin-table-wrapper');
          container = document.createElement('div');
          container.id = 'admin-pagination';
          container.style.marginTop = '15px';
          container.style.display = 'flex';
          container.style.justifyContent = 'center';
          container.style.gap = '10px';
          container.style.alignItems = 'center';
          wrapper.parentNode.insertBefore(container, wrapper.nextSibling);
       }
       
       let html = '';
       html += `<button class="btn-action-small" style="padding:4px 8px; font-size:12px; background:var(--bg);" onclick="changeAdminPage(${currentAdminPage - 1})" ${currentAdminPage === 1 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>&laquo; ก่อนหน้า</button>`;
       html += `<span style="font-size:13px; color:var(--text-main);">หน้า ${currentAdminPage} จาก ${totalPages}</span>`;
       html += `<button class="btn-action-small" style="padding:4px 8px; font-size:12px; background:var(--bg);" onclick="changeAdminPage(${currentAdminPage + 1})" ${currentAdminPage === totalPages ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>ถัดไป &raquo;</button>`;
       
       container.innerHTML = html;
    }
    
    function changeAdminPage(newPage) {
       if (hasUnsavedBatchEdits()) { warnUnsavedBatchEdits(); return; }
       currentAdminPage = newPage;
       renderAdminTable();
    }

    function toggleStatus(btn) {
      if (btn.value === 'เปิด') {
        btn.value = 'ปิด';
        btn.textContent = 'ปิด';
        btn.className = 'btn-status btn-status-off';
      } else {
        btn.value = 'เปิด';
        btn.textContent = 'เปิด';
        btn.className = 'btn-status btn-status-on';
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function addAdminRow() {
      const table = document.getElementById('admin-table');
      if (!table) return;
      const headersCount = adminDataCache[currentAdminTab][0].length;
      
      const tbody = table.querySelector('tbody');
      const tr = document.createElement('tr');
      tr.innerHTML += '<td></td>';
      for (let i = 0; i < headersCount; i++) {
        const h = adminDataCache[currentAdminTab][0][i];
        if (h.includes('สถานะ') || h.includes('ช่องทางการมองเห็น')) {
          tr.innerHTML += `<td><button type="button" class="btn-status btn-status-on" value="เปิด" onclick="toggleStatus(this)">เปิด</button></td>`;
        } else {
          tr.innerHTML += `<td><input type="text" value="" /></td>`;
        }
      }
      tr.innerHTML += `<td style="text-align:center; white-space:nowrap;">
                  <button type="button" class="btn-action-small edit-btn editing" onclick="editRow(this, null)" title="บันทึก" aria-label="บันทึกแถวนี้">💾</button>
                  <button type="button" class="btn-action-small delete-btn" onclick="deleteRow(this, null)" title="ลบ" aria-label="ลบแถวนี้">🗑️</button>
                 </td>`;
      tbody.appendChild(tr);
    }

    function deleteRow(btn, rowIdx) {
      Swal.fire({
        title: 'ยืนยันการลบ',
        text: 'คุณต้องการลบรายการนี้ใช่หรือไม่?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#B91C1C',
        cancelButtonColor: '#44475A',
        confirmButtonText: 'ใช่, ลบเลย!',
        cancelButtonText: 'ยกเลิก'
      }).then((result) => {
        if (result.isConfirmed) {
          if (!rowIdx) {
             btn.closest('tr').remove();
             return;
          }
          document.getElementById('admin-loading').style.display = 'flex';
          google.script.run.withSuccessHandler(function(res) {
             if (res.success) {
               showAdminMessage(res.message, 'success');
               loadAdminData(true);
             } else {
               document.getElementById('admin-loading').style.display = 'none';
               showAdminMessage(res.message, 'error');
             }
          }).withFailureHandler(function(err) {
             document.getElementById('admin-loading').style.display = 'none';
             if (handleAuthError(err)) return;

    let currentHistoryPage = 1;
    const HISTORY_PAGE_SIZE = 20;

    function filterHistoryTable(resetPage = false) {
      if (resetPage === true) currentHistoryPage = 1;
      
      const dateVal = document.getElementById('filter-date').value; // e.g. 2026-08-31
      let dateFilter = '';
      if (dateVal) {
        const parts = dateVal.split('-');
        if (parts.length === 3) {
           dateFilter = `${parts[2]}/${parts[1]}/${parts[0]}`; // '31/08/2026'
        }
      }
      
      const branchFilter = document.getElementById('filter-branch').value.toLowerCase();
      const itemFilter = document.getElementById('filter-item').value.toLowerCase();
      const statusFilter = document.getElementById('filter-status').value;
      
      const table = document.querySelector('#history-table-wrapper table.admin-table');
      if (!table) return;
      
      const rows = table.querySelectorAll('tbody tr');
      const role = sessionStorage.getItem('req_role');

      const matchedRows = [];
      const statusCounts = { 'รอจ่าย': 0, 'จ่ายแล้ว': 0, 'ยกเลิก': 0 };

      rows.forEach(row => {
        let offset = (role === 'Admin') ? 1 : 0;

        let dateCell = row.cells[0 + offset];
        let reqCell = row.cells[1 + offset];
        let branchCodeCell = row.cells[2 + offset];
        let branchNameCell = row.cells[3 + offset];
        let itemCodeCell = row.cells[4 + offset];
        let itemNameCell = row.cells[5 + offset];
        let statusCell = row.cells[7 + offset];

        if (!dateCell) return;

        const dateText = dateCell.textContent.toLowerCase();
        const branchText = `${reqCell.textContent} ${branchCodeCell.textContent} ${branchNameCell.textContent}`.toLowerCase();
        const itemText = `${itemCodeCell.textContent} ${itemNameCell.textContent}`.toLowerCase();

        let statusText = '';
        if (statusCell) {
          const selectEl = statusCell.querySelector('select');
          if (selectEl) {
            statusText = selectEl.value;
          } else {
            statusText = statusCell.textContent;
          }
        }
        const matchesOtherFilters = dateText.includes(dateFilter) && branchText.includes(branchFilter) && itemText.includes(itemFilter);
        const matchesStatus = statusFilter === '' || statusText.includes(statusFilter);

        if (matchesOtherFilters) {
          const statusKey = Object.keys(statusCounts).find(s => statusText.trim().startsWith(s));
          if (statusKey) statusCounts[statusKey]++;
        }

        if (matchesOtherFilters && matchesStatus) {
          row.dataset.filteredOut = 'false';
          matchedRows.push(row);
        } else {
          row.dataset.filteredOut = 'true';
        }

        row.style.display = 'none'; // hide all initially for pagination
      });

      const totalPages = Math.ceil(matchedRows.length / HISTORY_PAGE_SIZE) || 1;
      if (currentHistoryPage > totalPages) currentHistoryPage = totalPages;

      const startIndex = (currentHistoryPage - 1) * HISTORY_PAGE_SIZE;
      const endIndex = startIndex + HISTORY_PAGE_SIZE;

      for (let i = startIndex; i < endIndex && i < matchedRows.length; i++) {
         matchedRows[i].style.display = ''; // show only this page
      }

      renderHistoryPagination(totalPages);
      renderHistoryStatusSummary(statusCounts);
    }

    function renderHistoryStatusSummary(counts) {
      const container = document.getElementById('history-status-summary');
      if (!container) return;
      const total = counts['รอจ่าย'] + counts['จ่ายแล้ว'] + counts['ยกเลิก'];
      container.innerHTML = `
        <span class="status-chip status-chip-total">ทั้งหมด: ${total}</span>
        <span class="status-chip status-chip-pending">รอจ่าย: ${counts['รอจ่าย']}</span>
        <span class="status-chip status-chip-success">จ่ายแล้ว: ${counts['จ่ายแล้ว']}</span>
        <span class="status-chip status-chip-danger">ยกเลิก: ${counts['ยกเลิก']}</span>
      `;
    }

    function renderHistoryPagination(totalPages) {
       let container = document.getElementById('history-pagination');
       if (!container) {
          const wrapper = document.getElementById('history-table-wrapper');
          container = document.createElement('div');
          container.id = 'history-pagination';
          container.style.marginTop = '15px';
          container.style.display = 'flex';
          container.style.justifyContent = 'center';
          container.style.gap = '10px';
          container.style.alignItems = 'center';
          wrapper.parentNode.insertBefore(container, wrapper.nextSibling);
       }
       
       let html = '';
       html += `<button class="btn-action-small" style="padding:4px 8px; font-size:12px; background:var(--bg);" onclick="changeHistoryPage(${currentHistoryPage - 1})" ${currentHistoryPage === 1 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>&laquo; ก่อนหน้า</button>`;
       html += `<span style="font-size:13px; color:var(--text-main);">หน้า ${currentHistoryPage} จาก ${totalPages}</span>`;
       html += `<button class="btn-action-small" style="padding:4px 8px; font-size:12px; background:var(--bg);" onclick="changeHistoryPage(${currentHistoryPage + 1})" ${currentHistoryPage === totalPages ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>ถัดไป &raquo;</button>`;
       
       container.innerHTML = html;
    }
    
    function changeHistoryPage(newPage) {
       currentHistoryPage = newPage;
       filterHistoryTable(); // don't reset page
    }

    function editHistoryRow(btn, rowIdx) {
      const tr = btn.closest('tr');
      // For Admin:
      // cells[0]: checkbox
      // cells[1]: Timestamp
      // cells[2]: ชื่อผู้เบิก
      // cells[3]: รหัสสาขา
      // cells[4]: ชื่อสาขา
      // cells[5]: รหัสสินค้า
      // cells[6]: ชื่อสินค้า
      // cells[7]: จำนวน
      
      const reqName = tr.cells[2].textContent.trim();
      const branchCode = tr.cells[3].textContent.trim();
      const branchName = tr.cells[4].textContent.trim();
      const itemCode = tr.cells[5].textContent.trim();
      const itemName = tr.cells[6].textContent.trim();
      const qty = tr.cells[7].textContent.trim();

      Swal.fire({
        title: 'แก้ไขข้อมูลการเบิก',
        html: `
          <div style="text-align: left; font-size: 14px;">
            <label style="display:block; margin-top:10px; color:var(--text-muted);">ชื่อผู้เบิก</label>
            <input id="swal-reqName" class="swal2-input" style="width: 100%; margin: 5px 0;" value="${escapeHtml(reqName)}">
            <label style="display:block; margin-top:10px; color:var(--text-muted);">รหัสสาขา</label>
            <input id="swal-branchCode" class="swal2-input" style="width: 100%; margin: 5px 0;" value="${escapeHtml(branchCode)}">
            <label style="display:block; margin-top:10px; color:var(--text-muted);">ชื่อสาขา</label>
            <input id="swal-branchName" class="swal2-input" style="width: 100%; margin: 5px 0;" value="${escapeHtml(branchName)}">
            <label style="display:block; margin-top:10px; color:var(--text-muted);">รหัสสินค้า</label>
            <input id="swal-itemCode" class="swal2-input" style="width: 100%; margin: 5px 0;" value="${escapeHtml(itemCode)}">
            <label style="display:block; margin-top:10px; color:var(--text-muted);">ชื่อสินค้า</label>
            <input id="swal-itemName" class="swal2-input" style="width: 100%; margin: 5px 0;" value="${escapeHtml(itemName)}">
            <label style="display:block; margin-top:10px; color:var(--text-muted);">จำนวน</label>
            <input id="swal-qty" type="number" class="swal2-input" style="width: 100%; margin: 5px 0;" value="${escapeHtml(qty)}">
          </div>
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'บันทึก',
        cancelButtonText: 'ยกเลิก',
        preConfirm: () => {
          return {
            requester: document.getElementById('swal-reqName').value,
            branchCode: document.getElementById('swal-branchCode').value,
            branchName: document.getElementById('swal-branchName').value,
            itemCode: document.getElementById('swal-itemCode').value,
            itemName: document.getElementById('swal-itemName').value,
            qty: document.getElementById('swal-qty').value
          }
        }
      }).then((result) => {
        if (result.isConfirmed) {
          document.getElementById('history-loading').style.display = 'flex';
          google.script.run.withSuccessHandler(function(res) {
            document.getElementById('history-loading').style.display = 'none';
            if (res.success) {
              Swal.fire('สำเร็จ', 'แก้ไขข้อมูลเรียบร้อยแล้ว', 'success');
              loadHistoryData();
            } else {
              Swal.fire('ข้อผิดพลาด', res.message, 'error');
            }
          }).withFailureHandler(function(err) {
            document.getElementById('history-loading').style.display = 'none';
            if (handleAuthError(err)) return;
            Swal.fire('ข้อผิดพลาด', String(err), 'error');
          }).updateOrderRowData(getToken(), rowIdx, result.value);
        }
      });
    }

    function deleteHistoryRow(btn, rowIdx) {
      Swal.fire({
        title: 'ยืนยันการลบ',
        text: 'คุณต้องการลบข้อมูลประวัติการเบิกนี้ใช่หรือไม่? การกระทำนี้ไม่สามารถยกเลิกได้',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#B91C1C',
        cancelButtonColor: '#44475A',
        confirmButtonText: 'ใช่, ลบเลย',
        cancelButtonText: 'ยกเลิก'
      }).then((result) => {
        if (result.isConfirmed) {
          document.getElementById('history-loading').style.display = 'flex';
          google.script.run.withSuccessHandler(function(res) {
            document.getElementById('history-loading').style.display = 'none';
            if (res.success) {
              Swal.fire('ลบสำเร็จ', 'ข้อมูลถูกลบเรียบร้อยแล้ว', 'success');
              loadHistoryData();
            } else {
              Swal.fire('ข้อผิดพลาด', res.message, 'error');
            }
          }).withFailureHandler(function(err) {
            document.getElementById('history-loading').style.display = 'none';
            if (handleAuthError(err)) return;
            Swal.fire('ข้อผิดพลาด', String(err), 'error');
          }).deleteOrderRow(getToken(), rowIdx);
        }
      });
    }

    function downloadHistoryCSV() {
      const table = document.querySelector('#history-table-wrapper table.admin-table');
      if (!table) return;
      
      const csvRows = [];
      const rows = table.querySelectorAll('tr');
      
      rows.forEach(row => {
        if (row.dataset.filteredOut === 'true') return; 
        
        let rowData = [];
        const cells = row.querySelectorAll('th, td');
        
        cells.forEach((cell) => {
          if (cell.querySelector('.history-row-checkbox') || (cell.querySelector('input[type="checkbox"]') && cell.tagName === 'TH')) return;
          if (cell.tagName === 'TH' && cell.textContent.trim() === 'จัดการ') return;
          if (cell.querySelector('.edit-btn')) return; 
          
          let text = cell.textContent.trim().replace(/\n/g, ' ').replace(/\s+/g, ' ');
          if (cell.querySelector('select')) {
            text = cell.querySelector('select').value;
          }
          rowData.push(`"${text.replace(/"/g, '""')}"`);
        });
        
        if (rowData.length > 0) {
          csvRows.push(rowData.join(","));
        }
      });

      // Use a Blob instead of a data: URI - data: URIs have a length limit that a large
      // history table can exceed, silently truncating or failing the download.
      const csvContent = '﻿' + csvRows.join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;

      const dateStr = new Date().toISOString().slice(0, 10);
      link.setAttribute("download", `ประวัติการเบิก_${dateStr}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>

<script>
// Split out of JS.html (core). Attaches to window.app; included by Index.html after JS and before JS_Boot.
window.app.pos = {
    cartData: [],
    wishlist: [],
    cartAutoDiscount: 0,
    currentImages: [],
    currentImageIndex: 0,
    // 6A — สถานะ variant ที่เลือกบนการ์ด (per Model, คงอยู่ข้ามการ re-render จาก filter/search)
    cardState: {},
    // 6A — group object ล่าสุดของแต่ละ Model จาก renderProducts (ไว้ re-render การ์ดเดี่ยวตอนสลับ variant)
    cardGroups: {},
    // 6B — ตัวกรอง storefront (ทำงานร่วมกับช่องค้นหา + channel เดิมใน filter())
    storeFilters: { category: '', brand: '', groups: [], capacities: [], colors: [], priceRange: '', priceMin: '', priceMax: '', sort: '', inStock: false },
    storePage: 1,
    storePageSize: 12,
    sidebarOpen: false,
    lastList: [],
    // 6B — ชื่อ popover ที่เปิดอยู่ ('cap'|'price'|'sort'|null) — ปิดด้วยคลิกนอก/Esc
    openPopover: null,
    countdownInterval: null,
    isBookingBlocked: false,
    bookingBlockedMessage: '',
    isSubmitting: false,
    pendingRequestId: null, // idempotency key ของออเดอร์ที่กำลังคีย์ — คงค่าไว้ข้าม retry จนกว่า server ยืนยันบันทึกแล้ว
    // Phase 2 E-Commerce Storefront State (Client-Side Only)
    compareList: [],
    recentSkus: [],
    heroIndex: 0,
    heroTimer: null,
    promoZoneCollapsed: false,

    // Stock จาก getDisplayValues อาจมี comma (เช่น "1,200") — ต้องถอดก่อนเทียบ/คำนวณเสมอ (กฎข้อ 1)
    // ใช้จุดเดียวนี้แทนการเทียบ .Stock ตรงๆ ทั่ว pos module (เดิมพลาดในหลายจุดนอก storefront card)
    stockOf: function(v) {
      return parseInt(String((v && v.Stock) || '0').replace(/[^\d.\-]/g, ''), 10) || 0;
    },

    startCountdown: function() {
      if (this.countdownInterval) clearInterval(this.countdownInterval);
      
      const timerBanner = document.getElementById('posTimerBanner');
      const periodText = document.getElementById('posTimerPeriodText');
      const timerDisplay = document.getElementById('posTimerCountdownDisplay');
      const timerBadge = document.getElementById('posTimerBadge');
      
      if (!timerBanner || !timerDisplay) return;
      
      const settings = window.app.globalData.settings || {};
      const startStr = settings.ReserveStart;
      const endStr = settings.ReserveEnd;
      const campTitleEl = document.getElementById('posCampaignTitleText');
      if (campTitleEl) {
        campTitleEl.innerText = (settings.FlashCampaignTitle || '').toString().trim() || 'SUPER DEAL • จองด่วนจำนวนจำกัด';
      }
      
      timerBanner.classList.remove('hidden');

      if (!startStr || !endStr) {
        if (periodText) periodText.innerText = 'ดีลราคาพิเศษประจำวัน • สินค้าของแท้ประกันศูนย์ 100%';
        if (timerBadge) {
          timerBadge.innerText = 'สถานะแคมเปญ';
          timerBadge.className = 'text-[10px] font-extrabold text-[#FF6B00] mr-1.5 uppercase tracking-wider';
        }
        timerDisplay.innerHTML = `
          <div class="px-3 py-1 rounded-lg bg-[#FF6B00] text-white font-black text-[11px] flex items-center gap-1.5 shadow-sm">
            <i class="fas fa-bolt text-[#E11D48]"></i> เปิดรับจองดีลพิเศษ
          </div>
        `;
        this.togglePOSBookingBlock(false);
        return;
      }
      
      const startDate = new Date(startStr);
      const endDate = new Date(endStr);
      
      const options = { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
      const startFormatted = isNaN(startDate.getTime()) ? startStr : startDate.toLocaleDateString('th-TH', options);
      const endFormatted = isNaN(endDate.getTime()) ? endStr : endDate.toLocaleDateString('th-TH', options);
      if (periodText) periodText.innerText = `ระยะเวลาแคมเปญ: ${startFormatted} - ${endFormatted}`;
      
      const updateTimer = () => {
        const now = new Date();
        
        if (now < startDate) {
          if (timerBadge) {
            timerBadge.innerText = 'สถานะ';
            timerBadge.className = 'text-[10px] font-extrabold text-amber-400 mr-1.5 uppercase tracking-wider';
          }
          timerDisplay.innerHTML = `
            <div class="px-3 py-1.5 rounded-xl bg-amber-500 text-white font-bold text-[11px] flex items-center gap-1.5 shadow-sm">
              <i class="fas fa-clock"></i> เร็วๆ นี้ (ยังไม่เปิดจอง)
            </div>
          `;
          this.togglePOSBookingBlock(true, 'ยังไม่เปิดให้บริการจองสินค้า');
        } else if (now > endDate) {
          if (timerBadge) {
            timerBadge.innerText = 'สถานะ';
            timerBadge.className = 'text-[10px] font-extrabold text-rose-400 mr-1.5 uppercase tracking-wider';
          }
          timerDisplay.innerHTML = `
            <div class="px-3 py-1.5 rounded-xl bg-[#E11D48] text-white font-bold text-[11px] flex items-center gap-1.5 shadow-sm">
              <i class="fas fa-lock"></i> สิ้นสุดเวลา Pre Booking
            </div>
          `;
          this.togglePOSBookingBlock(true, 'สิ้นสุดระยะเวลารับจองสินค้าแล้ว');
        } else {
          if (timerBadge) {
            timerBadge.innerText = 'จบดีลในอีก';
            timerBadge.className = 'text-[10px] font-extrabold text-[#FF6B00] mr-1.5 uppercase tracking-wider';
          }
          
          const diff = endDate - now;
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const secs = Math.floor((diff % (1000 * 60)) / 1000);

          // แคมเปญยาวมาก (เกิน 99 วัน) — นับถอยหลังหลักหมื่นวันดูไม่เป็นมืออาชีพ แสดงวันปิดรับจองแทน
          if (days > 99) {
            if (timerBadge) timerBadge.innerText = 'เปิดรับจอง';
            const endShort = isNaN(endDate.getTime()) ? endStr : endDate.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
            timerDisplay.innerHTML = '<div class="px-3 py-1 rounded-lg bg-white/10 border border-white/15 text-white font-bold text-[11px] flex items-center gap-1.5"><i class="far fa-calendar-check text-[#FF6B00]"></i> ถึง ' + window.app.esc(endShort) + '</div>';
            this.togglePOSBookingBlock(false);
            return;
          }

          timerDisplay.innerHTML = `
            <div class="flex items-center gap-1">
              <div class="bnn-timer-box flex flex-col items-center px-2 py-0.5 rounded-lg min-w-[34px]">
                <span class="text-xs font-black leading-tight">${String(days).padStart(2, '0')}</span>
                <span class="text-[7px] text-slate-500 font-extrabold uppercase -mt-0.5">วัน</span>
              </div>
              <div class="text-[#FF6B00] font-black text-xs">:</div>
              <div class="bnn-timer-box flex flex-col items-center px-2 py-0.5 rounded-lg min-w-[34px]">
                <span class="text-xs font-black leading-tight">${String(hours).padStart(2, '0')}</span>
                <span class="text-[7px] text-slate-500 font-extrabold uppercase -mt-0.5">ชม.</span>
              </div>
              <div class="text-[#FF6B00] font-black text-xs">:</div>
              <div class="bnn-timer-box flex flex-col items-center px-2 py-0.5 rounded-lg min-w-[34px]">
                <span class="text-xs font-black leading-tight">${String(mins).padStart(2, '0')}</span>
                <span class="text-[7px] text-slate-500 font-extrabold uppercase -mt-0.5">นาที</span>
              </div>
              <div class="text-[#FF6B00] font-black text-xs">:</div>
              <div class="bnn-timer-box bnn-timer-sec flex flex-col items-center px-2 py-0.5 rounded-lg min-w-[34px]">
                <span class="text-xs font-black leading-tight">${String(secs).padStart(2, '0')}</span>
                <span class="text-[7px] text-rose-100 font-extrabold uppercase -mt-0.5">วิ</span>
              </div>
            </div>
          `;
          
          this.togglePOSBookingBlock(false);
        }
      };
      
      updateTimer();
      this.countdownInterval = setInterval(updateTimer, 1000);
    },
    
    togglePOSBookingBlock: function(isBlocked, message = '') {
      this.isBookingBlocked = isBlocked;
      this.bookingBlockedMessage = message;
      
      const overlay = document.getElementById('bookingBlockOverlay');
      const titleEl = document.getElementById('bookingBlockTitle');
      if (overlay) {
        if (isBlocked) {
          if (titleEl) titleEl.innerText = message;
          overlay.classList.remove('hidden');
          setTimeout(() => overlay.style.opacity = '1', 10);
        } else {
          overlay.style.opacity = '0';
          setTimeout(() => overlay.classList.add('hidden'), 300);
        }
      }
      
      const checkoutBtn = document.querySelector('[onclick="window.app.pos.openCheckoutModal()"]');
      if (checkoutBtn) {
        if (isBlocked) {
          checkoutBtn.disabled = true;
          checkoutBtn.className = 'w-full h-full bg-slate-200 text-slate-400 text-sm font-bold rounded-xl cursor-not-allowed transition-all flex items-center justify-center';
        } else {
          checkoutBtn.disabled = false;
          checkoutBtn.className = 'w-full h-full bg-[#FF6B00] hover:bg-[#E05300] text-white text-sm font-black rounded-xl shadow-sm transition-all flex items-center justify-center group';
        }
      }
    },

    init: function() {
      // หน้าร้านถูกวาดใหม่ทุกครั้งที่เข้า #pos — แผ่นตัวกรอง (มือถือ) ต้องเริ่มในสถานะปิดเสมอ
      this.sidebarOpen = false; document.documentElement.classList.remove('sf-sheet-open');
      // ตะกร้าใน localStorage อาจเสีย/parse ไม่ได้ (เจอบนมือถือ) — ห้ามปล่อยให้ล้ม ไม่งั้นทั้งหน้า POS ไม่ init ต่อ
      try { const c = localStorage.getItem('tg_cart'); if(c) this.cartData = JSON.parse(c) || []; }
      catch(e) { console.warn('tg_cart อ่านไม่ได้ — เริ่มตะกร้าใหม่:', e); this.cartData = []; localStorage.removeItem('tg_cart'); }
      const chSel = document.getElementById('posChannelSelect'); const bSel = document.getElementById('posBranchSelect');
      if(!chSel || !bSel) return;
      
      if(window.app.user.Role === 'Sales') {
        chSel.innerHTML = '<option value="' + window.app.esc(window.app.user.Channel) + '">' + window.app.esc(window.app.user.Channel) + '</option>';
        bSel.innerHTML = '<option value="' + window.app.esc(window.app.user['Branch Code']) + '">' + window.app.esc(window.app.user['Branch Name']) + ' (' + window.app.esc(window.app.user['Branch Code']) + ')</option>';
        chSel.disabled = true; bSel.disabled = true;
      } else {
        const channels = [...new Set(window.app.globalData.branches.map(b => b.Channel))].filter(Boolean);
        let chHtml = '<option value="">-- เลือกช่องทาง --</option>';
        channels.forEach(ch=>{ chHtml += '<option value="' + window.app.esc(ch) + '">' + window.app.esc(ch) + '</option>'; });
        chSel.innerHTML = chHtml;
        

        bSel.innerHTML='<option value="">-- เลือกช่องทางก่อน --</option>'; 
        chSel.disabled = false; bSel.disabled = false;
      }
      try { const r = localStorage.getItem('bnn_recent_skus'); if(r) this.recentSkus = JSON.parse(r) || []; }
      catch(e) { this.recentSkus = []; localStorage.removeItem('bnn_recent_skus'); }
      this.initWishlist(); this.populateSelects(); this.renderPosHeroAndVouchers(); this.renderStoreHeader(); this.renderRecentlyViewed(); this.renderCompareBar(); this.filter(); this.renderCart(); this.renderCompanions(); this.checkCriteria();
      this.startCountdown();
      this.initStickyHeader();
      window.app.renderSiteHeader();
      this._lastUrlKey = '{}';
      this.loadUrlState();
    },
    populateSelects: function() {
      const pContainer = document.getElementById('cartPromosContainer');
      if(pContainer) {
        pContainer.innerHTML = '';
        this.addPromoRow();
      }
      const intContainer=document.getElementById('dynamicInterests'); 
      if(intContainer) { 
          let intHtml = ''; 
          window.app.globalData.interests.forEach((i, idx)=>{ if(i.Status==='เปิด') intHtml += '<div class="p-2 border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors bg-white"><label class="flex items-center space-x-3 cursor-pointer w-full"><input type="checkbox" class="form-check-input w-5 h-5 text-indigo-600 bg-slate-100 border-slate-300 rounded focus:ring-indigo-500" id="chkInt' + idx + '" value="' + window.app.esc(i['Interest Name']) + '"><span class="text-sm font-bold text-slate-700 select-none">' + window.app.esc(i['Interest Name']) + '</span></label></div>'; });
          intContainer.innerHTML = intHtml;
      }
    },
    addPromoRow: function() {
      const container = document.getElementById('cartPromosContainer');
      if(!container) return;
      
      const row = document.createElement('div');
      row.className = 'flex items-center gap-2 mb-2 animate-fade-in';
      
      let optionsHtml = '<option value="">-- ไม่ใช้ส่วนลด --</option>';
      window.app.globalData.promotions.forEach(p => {
        if(['เปิด','open','active','on','true'].includes((p.Status || '').toString().trim().toLowerCase())) {
          // โปร Percent เก็บชนิดไว้ใน data attribute — มูลค่าส่วนลดจริงคำนวณจาก subtotal ใน getPromoDiscounts
          const dType = /percent|%/i.test((p['Discount Type'] || '').toString()) ? 'Percent' : 'Fixed';
          const dVal = parseFloat((p.Value || 0).toString().replace(/[^\d.\-]/g, '')) || 0;
          const label = dType === 'Percent' ? p['Promo Name'] + ' (' + dVal + '%)' : p['Promo Name'];
          optionsHtml += `<option value="${dVal}" data-dtype="${window.app.esc(dType)}" data-name="${window.app.esc(p['Promo Name'])}">${window.app.esc(label)}</option>`;
        }
      });
      
      row.innerHTML = `
        <select class="cart-promo-select flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm transition-all" onchange="window.app.pos.updateTotal()">
           ${optionsHtml}
        </select>
        <button type="button" onclick="window.app.pos.removePromoRow(this)" class="w-8 h-8 flex items-center justify-center text-rose-500 bg-rose-50 hover:bg-rose-100 rounded-xl border border-rose-100 transition-colors shrink-0 shadow-sm" title="ลบส่วนลดนี้">
           <i class="fas fa-trash-alt text-[0.7rem]"></i>
        </button>
      `;
      
      container.appendChild(row);
      this.updateTotal();
    },
    removePromoRow: function(btn) {
      const row = btn.parentElement;
      if(row) {
        row.remove();
      }
      this.updateTotal();
    },
    // แหล่งความจริงเดียวของส่วนลดจาก dropdown (ใช้ทั้ง updateTotal และ submitCheckout)
    // Fixed = จำนวนบาทตรงๆ / Percent = pct% ของยอดรวมสินค้าในตะกร้า ณ ขณะนั้น
    // โค้ดคูปองที่ตรวจผ่านแล้วในตะกร้า — เก็บ {code, type, value, minSpend} มูลค่าส่วนลดคำนวณใหม่จากยอดตะกร้าเสมอ (server ตรวจซ้ำตอนจอง)
    appliedCoupons: [],
    getCartSubtotal: function() {
      let subtotal = 0;
      this.cartData.forEach(i => { let pr = parseFloat((i.Price||'0').toString().replace(/[^\d.\-]/g,'')); subtotal += (isNaN(pr)?0:pr) * i.qty; });
      return subtotal;
    },
    getCouponDiscounts: function() {
      const subtotal = this.getCartSubtotal();
      const list = [];
      (this.appliedCoupons || []).forEach(c => {
        if (c.minSpend > 0 && subtotal < c.minSpend) return;
        let v = c.type === 'Percent' ? (subtotal * c.value / 100) : c.value;
        v = Math.min(Math.round(v * 100) / 100, subtotal);
        if (v > 0) list.push({ name: 'COUPON:' + c.code, value: v });
      });
      return list;
    },
    getPromoDiscounts: function() {
      return this.getSelectPromoDiscounts().concat(this.getCouponDiscounts());
    },
    applyCouponCode: async function() {
      const inp = document.getElementById('cartCouponInput');
      if (!inp) return;
      const code = inp.value.trim().toUpperCase();
      if (!code) return;
      if ((this.appliedCoupons || []).some(c => c.code.toUpperCase() === code)) {
        return Swal.fire('แจ้งเตือน', 'ใช้โค้ดนี้ในตะกร้าแล้ว', 'info');
      }
      const subtotal = this.getCartSubtotal();
      if (subtotal <= 0) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกสินค้าลงตะกร้าก่อนใช้โค้ดคูปอง', 'info');
      try {
        const res = await window.app.api('VALIDATE_COUPON', { code: code, subtotal: subtotal });
        if (!res || res.status !== 'success') {
          return Swal.fire('ใช้โค้ดไม่ได้', (res && res.message) ? res.message : 'ตรวจสอบโค้ดไม่สำเร็จ', 'warning');
        }
        this.appliedCoupons.push({ code: res.coupon.code, type: res.coupon.type, value: res.coupon.value, minSpend: res.coupon.minSpend || 0 });
        inp.value = '';
        this.renderCouponChips();
        this.updateTotal();
        window.app.toast('ใช้โค้ด ' + res.coupon.code + ' ลด ฿' + Number(res.coupon.discount).toLocaleString(), 'success');
      } catch (e) {
        Swal.fire('ระบบขัดข้อง', 'ตรวจสอบโค้ดไม่สำเร็จ กรุณาลองใหม่', 'error');
      }
    },
    removeCoupon: function(code) {
      this.appliedCoupons = (this.appliedCoupons || []).filter(c => c.code !== code);
      this.renderCouponChips();
      this.updateTotal();
    },
    renderCouponChips: function() {
      const box = document.getElementById('cartCouponChips');
      if (!box) return;
      const esc = window.app.esc, escJs = window.app.escAttrJs;
      box.innerHTML = (this.appliedCoupons || []).map(c =>
        '<span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-emerald-50 border border-emerald-200 text-[11px] font-black text-emerald-700"><i class="fas fa-ticket-alt"></i>' + esc(c.code) +
        ' <span class="font-bold text-emerald-600">(' + (c.type === 'Percent' ? c.value + '%' : '฿' + Number(c.value).toLocaleString()) + ')</span>' +
        '<button type="button" onclick="window.app.pos.removeCoupon(\'' + escJs(c.code) + '\')" class="ml-0.5 text-rose-500 hover:text-rose-700" title="ยกเลิกโค้ด"><i class="fas fa-times"></i></button></span>'
      ).join('');
    },
    getSelectPromoDiscounts: function() {
      let subtotal = 0;
      this.cartData.forEach(i => { let pr = parseFloat((i.Price||'0').toString().replace(/[^\d.\-]/g,'')); subtotal += (isNaN(pr)?0:pr) * i.qty; });
      const list = [];
      document.querySelectorAll('.cart-promo-select').forEach(el => {
        if (!el.value) return;
        const opt = el.options[el.selectedIndex];
        const raw = parseFloat(el.value || 0);
        if (isNaN(raw) || raw <= 0) return;
        const dType = opt ? (opt.getAttribute('data-dtype') || 'Fixed') : 'Fixed';
        const name = opt ? (opt.getAttribute('data-name') || opt.text) : '';
        const value = dType === 'Percent' ? (subtotal * raw / 100) : raw;
        if (value > 0) list.push({ name: name, value: value });
      });
      return list;
    },
    onChannelChange: function() {
      const ch = document.getElementById('posChannelSelect').value; const bSel = document.getElementById('posBranchSelect');
      if(!bSel) return;
      let bHtml = '<option value="">-- กรุณาเลือกสาขา --</option>';
      if(ch) { window.app.globalData.branches.filter(b => b.Channel === ch).forEach(b => { bHtml += '<option value="' + window.app.esc(b['Branch Code']) + '">' + window.app.esc(b['Branch Name']) + ' (' + window.app.esc(b['Branch Code']) + ')</option>'; }); }
      bSel.innerHTML = bHtml;
      
      
      this.checkCriteria(); this.renderVoucherStrip(); this.filter();
    },
    checkCriteria: function() {
      const ch = document.getElementById('posChannelSelect'); const br = document.getElementById('posBranchSelect'); const ov = document.getElementById('criteriaOverlay');
      if(!ch || !br || !ov) return;
      if(ch.value && br.value) {
          ov.style.opacity = '0'; setTimeout(()=>ov.classList.add('hidden'), 300);
      } else {
          ov.classList.remove('hidden'); setTimeout(()=>ov.style.opacity = '1', 10);
      }
    },

    // =========================================================================
    // Phase 2 E-Commerce Upgrade: Hero Carousel, Voucher Strip, Compare, Recent
    // =========================================================================
    togglePromoZone: function() {
      const zone = document.getElementById('posEcomHeroZone');
      const ico = document.getElementById('icoTogglePosPromo');
      if (!zone) return;
      this.promoZoneCollapsed = !this.promoZoneCollapsed;
      if (this.promoZoneCollapsed) {
        zone.classList.add('hidden');
        if (ico) ico.className = 'fas fa-chevron-down text-[9px]';
      } else {
        zone.classList.remove('hidden');
        if (ico) ico.className = 'fas fa-chevron-up text-[9px]';
        this.renderPosHeroAndVouchers();
      }
    },

    renderPosHeroAndVouchers: function() {
      if (this.heroTimer) { clearInterval(this.heroTimer); this.heroTimer = null; }
      const wrap = document.getElementById('posHeroBannerWrap');
      const track = document.getElementById('posHeroTrack');
      const dots = document.getElementById('posHeroDots');
      const vWrap = document.getElementById('posVoucherStripWrap');
      const esc = window.app.esc, escJs = window.app.escAttrJs;

      const parseBannerObj = (b) => {
        if (!b) return null;
        if (typeof b === 'string') return { url: b.trim(), title: '', sub: '', link: '' };
        const u = (b.url || b['Image URL'] || b.URL || '').toString().trim();
        if (!u) return null;
        const st = (b.status || b.Status || 'เปิด').toString().trim().toLowerCase();
        if (st === 'deleted' || st === 'ปิด' || st === 'inactive') return null;
        return {
          url: u,
          title: (b.title || b.Title || '').toString().trim(),
          sub: (b.details || b.Subtitle || b.Details || '').toString().trim(),
          link: (b.link || b.targetLink || b['Link URL'] || '').toString().trim()
        };
      };

      let banners = (window.app.globalData.heroBanners || []).map(parseBannerObj).filter(Boolean);
      if (banners.length === 0) {
        banners = (window.app.globalData.gridBanners || []).map(parseBannerObj).filter(Boolean);
      }

      if (wrap && track && dots) {
        if (banners.length > 0) {
          wrap.classList.remove('hidden');
          if (vWrap) { vWrap.classList.remove('lg:col-span-12'); vWrap.classList.add('lg:col-span-7'); }
          this.heroIndex = 0;
          let slidesHtml = '';
          let dotsHtml = '';
          banners.forEach((b, idx) => {
            // แบนเนอร์หลักกว้างเต็มหน้า (สูงสุด ~1320px, จอ retina 2 เท่า) — ขนาดเริ่มต้น w500 ของรูป Drive จะถูกยืดจนเบลอ
            const img = window.app.formatImageUrl(b.url, 'w2000');
            const title = b.title || '';
            const sub = b.sub || '';
            const link = b.link || '';
            const clickAttr = link
              ? (link.startsWith('http') ? 'onclick="window.open(\'' + escJs(link) + '\',\'_blank\')"' : 'onclick="window.app.pos.applyBannerSearch(\'' + escJs(link) + '\')"')
              : (title ? 'onclick="window.app.pos.applyBannerSearch(\'' + escJs(title) + '\')"' : '');
            slidesHtml += '<div class="w-full h-full shrink-0 relative cursor-pointer select-none" ' + clickAttr + '>'
              + '<img src="' + esc(img) + '" alt="' + esc(title || 'Pre Booking Banner') + '" class="w-full h-full object-cover">'
              + ((title || sub)
                  ? '<div class="pm-hero-cap">'
                    + '<div>'
                    + (title ? '<div class="pm-hero-title">' + esc(title) + '</div>' : '')
                    + (sub ? '<div class="pm-hero-sub line-clamp-1">' + esc(sub) + '</div>' : '')
                    + '</div>'
                    + '<span class="pm-hero-cta">ดูสินค้า <i class="fas fa-arrow-right"></i></span>'
                    + '</div>'
                  : '')
              + '</div>';
            dotsHtml += '<button type="button" onclick="window.app.pos.goToHero(' + idx + ')" class="pm-hdot' + (idx === 0 ? ' on' : '') + '" aria-label="สไลด์ ' + (idx + 1) + '"></button>';
          });
          track.innerHTML = slidesHtml;
          track.style.transform = 'translateX(0%)';
          dots.innerHTML = banners.length > 1 ? dotsHtml : '';
          if (banners.length > 1) {
            this.heroTimer = setInterval(() => this.stepHero(1), 5000);
          }
        } else {
          wrap.classList.add('hidden');
          if (vWrap) { vWrap.classList.remove('lg:col-span-7'); vWrap.classList.add('lg:col-span-12'); }
        }
      }
      this.renderVoucherStrip();
    },

    applyBannerSearch: function(keyword) {
      const s = document.getElementById('searchProduct');
      if (!s || !keyword) return;
      s.value = keyword;
      this.filter();
    },

    stepHero: function(dir) {
      const track = document.getElementById('posHeroTrack');
      if (!track || !track.children.length) return;
      const count = track.children.length;
      this.heroIndex = (this.heroIndex + dir + count) % count;
      this.goToHero(this.heroIndex);
    },

    goToHero: function(idx) {
      const track = document.getElementById('posHeroTrack');
      const dots = document.getElementById('posHeroDots');
      if (!track || !track.children.length) return;
      const count = track.children.length;
      this.heroIndex = Math.max(0, Math.min(idx, count - 1));
      track.style.transform = 'translateX(-' + (this.heroIndex * 100) + '%)';
      if (dots && dots.children.length === count) {
        Array.from(dots.children).forEach((d, i) => {
          d.className = 'pm-hdot' + (i === this.heroIndex ? ' on' : '');
        });
      }
    },

    applyVoucher: function(promoName) {
      if (!promoName) return;
      const container = document.getElementById('cartPromosContainer');
      if (!container) return;

      // ถ้าเลือกคูปองนี้อยู่แล้ว กดซ้ำ = ยกเลิกคูปองนั้น
      const selects = Array.from(container.querySelectorAll('.cart-promo-select'));
      for (let i = 0; i < selects.length; i++) {
        const sel = selects[i];
        const opt = sel.options[sel.selectedIndex];
        const curName = opt ? (opt.getAttribute('data-name') || '') : '';
        if (sel.value && curName === promoName) {
          if (selects.length > 1 && sel.parentElement) {
            sel.parentElement.remove();
          } else {
            sel.value = '';
          }
          this.updateTotal();
          window.app.toast('ยกเลิกคูปอง ' + promoName, 'info');
          return;
        }
      }

      // หาช่อง select ที่ยังว่าง ถ้าไม่มีให้เพิ่มแถวใหม่
      let targetSelect = selects.find(s => !s.value);
      if (!targetSelect) {
        this.addPromoRow();
        const updatedSelects = Array.from(container.querySelectorAll('.cart-promo-select'));
        targetSelect = updatedSelects[updatedSelects.length - 1];
      }
      if (!targetSelect) return;

      let matched = false;
      Array.from(targetSelect.options).forEach((opt, idx) => {
        if (opt.getAttribute('data-name') === promoName) {
          targetSelect.selectedIndex = idx;
          matched = true;
        }
      });

      if (matched) {
        this.updateTotal();
        window.app.toast('ใช้คูปอง "' + promoName + '" แล้ว!', 'success');
      }
    },

    // คำนวณจำนวนของแถมที่มีสิทธิ์ได้รับของสินค้า 1 ตัว (ตรงตามเงื่อนไข GiftMappings + Channel ปัจจุบัน)
    countEligibleGifts: function(prod, currentChannel) {
      const res = { total: 0, brandCount: 0, channelCount: 0, giftNames: [] };
      if (!prod) return res;
      const sku = (prod.SKU || '').toString().trim().toLowerCase();
      const productNameLower = (prod['Product Name'] || '').toString().trim().toLowerCase();
      const groupLower = (prod['Product Group'] || '').toString().trim().toLowerCase();
      const chLower = (currentChannel || '').toString().trim().toLowerCase();

      const mappings = (window.app.globalData.giftMappings || []).filter(m => {
        if (m.Status !== 'เปิด') return false;
        const mCh = (m.Channel || '').trim().toLowerCase();
        const mChTokens = mCh.split(',').map(v => v.trim()).filter(Boolean);
        const chMatch = (mCh === 'all' || mCh === '' || !chLower || mChTokens.includes(chLower));
        if (!chMatch) return false;

        const target = (m['Target Mobile (SKU or Group)'] || '').trim();
        if (target === '*' || target.toUpperCase() === 'ALL') return true;
        const targets = target.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
        return targets.includes(sku) || (groupLower !== '' && targets.includes(groupLower)) ||
          targets.some(t => t !== '*' && productNameLower !== '' && productNameLower.includes(t));
      });

      if (mappings.length === 0) return res;
      const allowedBrand = [];
      const allowedChannel = [];
      mappings.forEach(m => {
        if (m['Brand Gifts']) allowedBrand.push(...m['Brand Gifts'].split(',').map(s => s.trim().toLowerCase()).filter(Boolean));
        if (m['Channel Gifts']) allowedChannel.push(...m['Channel Gifts'].split(',').map(s => s.trim().toLowerCase()).filter(Boolean));
      });

      (window.app.globalData.products || []).forEach(p => {
        if (p.Status !== 'เปิด') return;
        const pName = (p['Product Name'] || '').toString();
        const pNameLower = pName.toLowerCase();
        if (p.Category === 'ของแถมแบรนด์' && allowedBrand.some(g => g === '*' || pNameLower.includes(g))) {
          res.brandCount++;
          res.giftNames.push(pName);
        } else if (p.Category === 'ของแถมช่องทาง' && allowedChannel.some(g => g === '*' || pNameLower.includes(g))) {
          res.channelCount++;
          res.giftNames.push(pName);
        }
      });
      res.total = res.brandCount + res.channelCount;
      return res;
    },

    // และหากคอลัมน์ใดในชีตยังว่างอยู่ จะวิเคราะห์จากชื่อรุ่น/ซีรีส์/ช่วงราคาเป็นค่า fallback ให้ครบทุกมิติ

      const v = (item && item.variant) ? item.variant : (item || {});

        };
      }

      // 1) ตระกูล Apple iPhone
      if (n.includes('iphone')) {

    // ระบบเปรียบเทียบสเปคสินค้า (สูงสุด 3 รุ่น)

    toggleCompare: function(cardKey, ev) {
      if (ev) ev.stopPropagation();
      if (!cardKey) return;
      const idx = this.compareList.indexOf(cardKey);
      let justAdded = false;
      if (idx >= 0) {
        this.compareList.splice(idx, 1);
      } else {
        if (this.compareList.length >= 3) {
          window.app.toast('เปรียบเทียบได้สูงสุด 3 รุ่นพร้อมกัน', 'warning');
          this.openCompareModal();
          return;
        }
        this.compareList.push(cardKey);
        justAdded = true;
      }
      this.renderCompareBar();
      // อัปเดตปุ่มเทียบสเปคบนการ์ดทันทีโดยไม่ต้อง re-render ทั้งกริด
      if (cardKey.startsWith('SKU:')) {
        this.filter();
      } else if (this.cardGroups[cardKey]) {
        this.updateCardVariant(cardKey);
      } else {
        this.filter();
      }
      // เปิดหน้าต่างตารางเปรียบเทียบสเปคทันทีเมื่อกดเพิ่มสินค้าเข้าเทียบ
      if (justAdded) {
        this.openCompareModal();
      }
    },

    // เพิ่มรุ่นเปรียบเทียบจาก dropdown ในหน้าต่าง Compare Modal โดยตรง
    addCompareFromSelect: function(cardKey) {
      if (!cardKey) return;
      if (!this.compareList.includes(cardKey) && this.compareList.length < 3) {
        this.compareList.push(cardKey);
        this.renderCompareBar();
        this.filter();
      }
      this.openCompareModal();
    },

    clearCompare: function() {
      this.compareList = [];
      this.renderCompareBar();
      this.filter();
    },

    resolveCardKeyProduct: function(cardKey) {
      const prods = (window.app.globalData.products || []).filter(p => ['เปิด','open','active','on','true'].includes((p.Status || '').toString().trim().toLowerCase()));
      if (cardKey.startsWith('SKU:')) {
        const sku = cardKey.substring(4);
        const p = prods.find(x => x.SKU == sku);
        if (!p) return null;
        return { cardKey: cardKey, dispName: p['Product Name'], variant: p, variants: [p], totalStock: this.stockOf(p) };
      }
      const vars = prods.filter(x => x.Model === cardKey);
      if (vars.length === 0) return null;
      const st = this.cardState[cardKey] || {};
      const variant = vars.find(v => v.Color === st.color && v.Capacity === st.cap) || vars.find(v => this.stockOf(v) > 0) || vars[0];
      const totalStock = vars.reduce((s, v) => s + this.stockOf(v), 0);
      return { cardKey: cardKey, dispName: cardKey, variant: variant, variants: vars, totalStock: totalStock };
    },

    renderCompareBar: function() {
      const bar = document.getElementById('posCompareBar');
      const slots = document.getElementById('posCompareSlots');
      const cnt = document.getElementById('posCompareCount');
      if (!bar || !slots) return;
      const esc = window.app.esc, escJs = window.app.escAttrJs;

      const resolved = this.compareList.map(k => this.resolveCardKeyProduct(k)).filter(Boolean);
      if (resolved.length === 0) {
        bar.classList.add('hidden');
        return;
      }
      bar.classList.remove('hidden');
      if (cnt) cnt.textContent = '(' + resolved.length + '/3)';

      let html = '';
      resolved.forEach(item => {
        const img = window.app.formatImageUrl(item.variant['Image URL']);
        const pr = (parseFloat(String(item.variant.Price || '0').replace(/[^\d.\-]/g, '')) || 0).toLocaleString();
        html += '<div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 shrink-0 max-w-[180px]">'
          + '<img src="' + esc(img) + '" alt="" onerror="this.remove()" class="w-7 h-7 object-contain bg-white rounded-md p-0.5 shrink-0">'
          + '<div class="min-w-0 flex-1">'
          + '  <div class="text-[10px] font-bold text-slate-800 truncate">' + esc(item.dispName) + '</div>'
          + '  <div class="text-[9px] font-black text-[#E05300]">฿' + pr + '</div>'
          + '</div>'
          + '<button type="button" onclick="window.app.pos.toggleCompare(\'' + escJs(item.cardKey) + '\', event)" class="text-slate-400 hover:text-rose-400 text-xs px-1" aria-label="นำออก"><i class="fas fa-times"></i></button>'
          + '</div>';
      });
      slots.innerHTML = html;
    },

    openCompareModal: function() {
      const resolved = this.compareList.map(k => this.resolveCardKeyProduct(k)).filter(Boolean);
      if (resolved.length < 1) {
        window.app.hideModal('compareModal');
        return;
      }
      const body = document.getElementById('compareModalBody');
      if (!body) return;
      const esc = window.app.esc, escJs = window.app.escAttrJs;
      const currentChannel = (document.getElementById('posChannelSelect') || {}).value || '';

      // รวบรวมรายชื่อรุ่นสินค้าอื่นๆ ในร้านเพื่อใช้เป็นตัวเลือก "+ เพิ่มรุ่นเปรียบเทียบ" ในหน้าต่างนี้ได้ทันที
      const allActive = (window.app.globalData.products || []).filter(p => p.Status === 'เปิด' && !(p.Category || '').includes('ของแถม'));
      const candidateKeys = [];
      const seenKeys = new Set(this.compareList);
      allActive.forEach(p => {
        const k = (p.Model && p.Model !== '-') ? p.Model : ('SKU:' + p.SKU);
        if (!seenKeys.has(k)) {
          seenKeys.add(k);
          const pr = (parseFloat(String(p.Price || '0').replace(/[^\d.\-]/g, '')) || 0).toLocaleString();
          candidateKeys.push({ key: k, label: ((p.Model && p.Model !== '-') ? p.Model : p['Product Name']) + ' (฿' + pr + ')' });
        }
      });

      const canAddMore = resolved.length < 3 && candidateKeys.length > 0;
      const specsList = resolved.map(item => this.getDeviceSpecs(item));

      // 3. วิเคราะห์ป้ายแนะนำรุ่นคุ้มค่าที่สุด (Best Value) และรุ่นสเปคเรือธง (Top Spec) เมื่อเทียบตั้งแต่ 2 รุ่นขึ้นไป
      const prices = resolved.map(item => parseFloat(String(item.variant.Price || '0').replace(/[^\d.\-]/g, '')) || 0);
      const minPrice = Math.min(...prices);
      const maxPrice = Math.max(...prices);
      const diffOnly = !!this.compareDiffOnly;
      const diffBtnLbl = document.getElementById('lblCompareDiffToggle');
      if (diffBtnLbl) diffBtnLbl.textContent = diffOnly ? 'แสดงสเปคทั้งหมด' : 'ไฮไลต์เฉพาะจุดต่าง';

      let html = '';
      // แถบเลือกเพิ่มรุ่นเปรียบเทียบด้านบน (กรณีเลือกไว้ 1 หรือ 2 รุ่น สามารถกดเลือกรุ่นที่ 2-3 จากใน Modal ได้ทันที)

    filterTimer: null,
    // 5B.1 — debounce 250ms กันการ render การ์ดใหม่ทุก keystroke (ปุ่มล้างคำค้นเรียก filter() ตรงได้เลย)
    filterDebounced: function() {
      clearTimeout(this.filterTimer);
      this.filterTimer = setTimeout(() => this.filter(), 250);
    },
    filter: function() {
      const searchEl = document.getElementById('searchProduct');
      if(!searchEl) return;
      const term = searchEl.value.trim().toLowerCase();
      const currentChannel = document.getElementById('posChannelSelect').value;
      window.app.globalData.products = window.app.globalData.products || [];
      // 6B — ตัวกรอง storefront ทำงานร่วมกับคำค้น + channel เดิม; ราคาจากชีตอาจมี comma ต้องถอดก่อน parse
      const f = this.storeFilters;
      // parse ทนต่อเซลล์ที่ format เป็นสกุลเงิน (เช่น "฿49,900.00") — ตัดทุกอย่างที่ไม่ใช่ตัวเลข/จุด/ลบ
      const priceOf = (p) => parseFloat(String(p.Price || '0').replace(/[^\d.\-]/g, '')) || 0;
      const inPrice = (p) => {
        const v = priceOf(p);
        if (f.priceRange === 'lt10' && !(v < 10000)) return false;
        if (f.priceRange === '10-30' && !(v >= 10000 && v <= 30000)) return false;
        if (f.priceRange === '30-50' && !(v > 30000 && v <= 50000)) return false;
        if (f.priceRange === 'gt50' && !(v > 50000)) return false;
        if (f.priceMin !== '' && v < f.priceMin) return false;
        if (f.priceMax !== '' && v > f.priceMax) return false;
        return true;
      };
      const list = window.app.globalData.products.filter(p => {
        const matchType = p.Status==='เปิด';
        // ค้นได้ทั้ง ชื่อสินค้า / SKU / รุ่น / กลุ่มสินค้า (case-insensitive)
        const matchSearch = !term || ['Product Name', 'SKU', 'Model', 'Product Group'].some(k => (p[k] || '').toString().toLowerCase().includes(term));
        // 'ALL'/'*' = ทุกช่องทาง ใช้กับสินค้าขายปกติเท่านั้น — ของแถมที่ setupDatabase ตั้งเป็น 'ALL' ต้องไม่โผล่เป็นการ์ดขายในหน้าร้าน (พฤติกรรมเดิมของของแถมคงไว้)
        const isGiftRow = (p.Category || '').toString().includes('ของแถม');
        const matchChannel = isGiftRow ? ((currentChannel && p.Channel) ? p.Channel.includes(currentChannel) : true) : window.app.channelOk(p.Channel, currentChannel);
        // ตัวกรองหลายค่า: ค่าในกลุ่มเดียวกันเป็น OR, ต่างกลุ่มเป็น AND
        return matchType && matchSearch && matchChannel
          && (!f.category || (p.Category || '').trim() === f.category)
          && (!f.brand || this.brandOf(p) === f.brand)
          && (!f.groups.length || f.groups.includes((p['Product Group'] || '').trim()))
          && (!f.capacities.length || f.capacities.includes((p.Capacity || '').trim()))
          && (!f.colors.length || f.colors.includes((p.Color || '').trim()))
          && inPrice(p)
          && (!f.inStock || this.stockOf(p) > 0);
      });
      // เรียงลำดับ: แนะนำ = ตามลำดับชีต (ไม่แตะ), ราคาต่ำ-สูง / สูง-ต่ำ เรียงก่อน group เพื่อให้ตำแหน่งการ์ดตามราคา variant แรก
      // การ์ดรวมทุก SKU ของรุ่นเดียวกันและโชว์ราคาต่ำสุดของรุ่น — ต้องเรียงด้วยราคาต่ำสุดของรุ่นเช่นกัน ไม่งั้นลำดับการ์ดสลับเมื่อรุ่นมีหลายราคา
      if (!f.sort) {
        // ค่าเริ่มต้น: จัดกลุ่มตามหมวด โมบาย > แท็บเล็ต > สมาร์ทวอทช์ > หูฟัง > ของแถมแบรนด์ > ของแถมช่องทาง (stable sort — ภายในหมวดยังคงลำดับตามชีต)
        const order = ['โมบาย', 'แท็บเล็ต', 'สมาร์ทวอทช์', 'หูฟัง', 'ของแถมแบรนด์', 'ของแถมช่องทาง'];
        const rank = (p) => { const i = order.indexOf((p.Category || '').trim()); return i === -1 ? order.length : i; };
        list.sort((a, b) => rank(a) - rank(b));
      }
      if (f.sort === 'asc' || f.sort === 'desc') {
        const gKey = (p) => (p.Model && p.Model !== '-') ? 'M:' + p.Model : 'S:' + p.SKU;
        const gMin = {};
        list.forEach(p => { const k = gKey(p), v = priceOf(p); if (!(k in gMin) || v < gMin[k]) gMin[k] = v; });
        const dir = f.sort === 'asc' ? 1 : -1;
        list.sort((a, b) => dir * (gMin[gKey(a)] - gMin[gKey(b)]));
      }
      this.storePage = 1; // ทุกครั้งที่ตัวกรอง/คำค้นเปลี่ยน กลับหน้า 1 (การเปลี่ยนหน้าเรียก renderProducts ตรง ไม่ผ่าน filter)
      this.renderProducts(list);
      this.syncUrl();
      this.renderPopularShelf();
      this.renderBrandStrip(); this.renderNewShelf(); this.renderNewsShelf();
    },
    // 6B — มี filter storefront ตัวใดตัวหนึ่ง active อยู่ไหม (ใช้โชว์ปุ่มล้างตัวกรอง + เลือก empty state)
    storeFiltersActive: function() {
      const f = this.storeFilters;
      return !!(f.category || f.brand || f.groups.length || f.capacities.length || f.colors.length || f.priceRange || f.priceMin !== '' || f.priceMax !== '' || f.sort || f.inStock);
    },
    // 6B — header ของ storefront: แถว category tiles (BNN Flash Sale Pills) → แถว sub-chips รุ่น (Product Group) → แถว filter chips
    // re-render ทั้งแถบทุกครั้งที่ตัวกรองเปลี่ยน (popover ถูกสร้างใหม่ในสถานะปิดเสมอ)
    // ตรึง header ร้านค้า: sentinel ใต้ขอบบนของ viewport = header กำลังลอยตรึงอยู่ -> เติมคลาส is-stuck (ย่อ header บนมือถือ)
    // sentinel อยู่เหนือ header เสมอ จึงไม่ถูกกระทบตอน header เปลี่ยนความสูง (กันกระพริบวนลูป)
    initStickyHeader: function() {
      try {
        if (this._stickyObs) { this._stickyObs.disconnect(); this._stickyObs = null; }
        const s = document.getElementById('posStoreSentinel');
        const h = document.getElementById('posStoreHeader');
        if (!s || !h || typeof IntersectionObserver === 'undefined') return;
        // หน้าร้านเป็นโหมดเว็บไซต์ (html.sf-site) — ไม่มีแถบบนของแอปบนมือถือแล้ว header จึงตรึงที่ขอบบนสุดทุกขนาดจอ
        const topPx = (window.innerWidth < 1024 && !document.documentElement.classList.contains('sf-site')) ? 61 : 1;
        this._stickyObs = new IntersectionObserver(function(entries) {
          h.classList.toggle('is-stuck', !entries[0].isIntersecting && entries[0].boundingClientRect.top < topPx);
        }, { rootMargin: '-' + topPx + 'px 0px 0px 0px', threshold: 0 });
        this._stickyObs.observe(s);
      } catch (e) { /* ไม่รองรับ IntersectionObserver — header ยังตรึงได้ แค่ไม่ย่อ */ }
    },

    // ไอคอนไทล์หมวดสินค้า (Font Awesome 6 free) — เดาจากชื่อหมวด ไม่ตรงกฎใดใช้กล่องสินค้า; '' = "ทั้งหมด"
    catIcon: function(name) {
      const n = (name || '').toString().toLowerCase();
      if (!n) return 'fa-table-cells-large';
      if (/แท็บเล็ต|tablet|ipad/.test(n)) return 'fa-tablet-screen-button';
      if (/วอทช์|watch|นาฬิกา/.test(n)) return 'fa-clock';
      if (/หูฟัง|buds|earphone|headphone|airpods/.test(n)) return 'fa-headphones';
      if (/ลำโพง|speaker/.test(n)) return 'fa-volume-high';
      if (/ทีวี|\btv\b|จอ/.test(n)) return 'fa-tv';
      if (/โน้ตบุ|แล็ปท็อป|laptop|notebook|คอม/.test(n)) return 'fa-laptop';
      if (/อุปกรณ์เสริม|accessor|เคส|สายชาร์จ|ชาร์จ/.test(n)) return 'fa-plug';
      if (/โมบาย|มือถือ|โทรศัพท์|สมาร์ทโฟน|phone|mobile/.test(n)) return 'fa-mobile-screen-button';
      return 'fa-box-open';
    },

    // ชั้น "ยอดนิยมตอนนี้": รุ่นที่ถูกจองมากสุด (server ส่ง globalData.popularModels = ชื่อรุ่นเรียงอันดับ ไม่มีตัวเลขยอด/ข้อมูลลูกค้า)
    // โชว์เฉพาะหน้าแรกที่ยังไม่ค้น/ไม่กรอง และเฉพาะรุ่นที่ขายได้ในช่องทางนี้และมีของ — ต้องได้ >= 3 รุ่นถึงโชว์ (น้อยกว่านั้นดูโล่ง ไม่น่าเชื่อถือ)
    renderPopularShelf: function() {
      const el = document.getElementById('posPopular');
      if (!el) return;
      const esc = window.app.esc, escJs = window.app.escAttrJs;
      const searchEl = document.getElementById('searchProduct');
      const chEl = document.getElementById('posChannelSelect');
      const channel = chEl ? chEl.value : '';
      const idle = !(searchEl && searchEl.value.trim() !== '') && !this.storeFiltersActive() && (this.storePage || 1) === 1;
      const g = window.app.globalData || {};
      const priceOf = (p) => parseFloat(String(p.Price || '0').replace(/[^\d.\-]/g, '')) || 0;
      const items = [];
      if (idle) {
        const prods = (g.products || []).filter(p => p.Status === 'เปิด' && !(p.Category || '').includes('ของแถม') && window.app.channelOk(p.Channel, channel));
        (g.popularModels || []).forEach(model => {
          if (items.length >= 8) return;
          const inStock = prods.filter(p => p.Model === model && this.stockOf(p) > 0);
          if (!inStock.length) return;
          const rep = inStock.reduce((a, b) => priceOf(b) < priceOf(a) ? b : a);
          items.push({ rank: items.length + 1, sku: rep.SKU, name: String(rep['Product Name'] || rep['Marketing Model'] || model).replace(/\s*\([^)]*\)\s*$/, '').replace(/^SAMSUNG\s+/i, ''), img: rep['Image URL'], price: priceOf(rep) });
        });
      }
      const show = items.length >= 3;
      const sig = show ? JSON.stringify(items.map(i => [i.sku, i.price])) : '';
      if (el.dataset.sig === sig) return; // ไม่เปลี่ยน = ไม่วาดใหม่ (กันกะพริบตอนพิมพ์ค้น/สลับหน้า)
      el.dataset.sig = sig;
      if (!show) { el.classList.add('hidden'); el.innerHTML = ''; return; }
      let html = '<div class="pm-sec-head"><h2 class="pm-sec-title">ยอดนิยมตอนนี้</h2><span class="pm-sec-sub">รุ่นที่ถูกจองมากสุด</span></div>';
      html += '<div class="sf-pop-row custom-scrollbar">';
      items.forEach(it => {
        html += '<button type="button" class="sf-pop-card" onclick="window.app.pos.openAddToCartModal(\'' + escJs(it.sku) + '\')" aria-label="' + esc(it.name) + ' อันดับ ' + it.rank + '">'
          + '<span class="sf-pop-rank' + (it.rank <= 3 ? ' top' : '') + '">' + it.rank + '</span>'
          + '<img src="' + esc(window.app.formatImageUrl(it.img)) + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=window.app.NO_IMG;">'
          + '<span class="sf-pop-name">' + esc(it.name) + '</span>'
          + '<span class="sf-pop-price">฿' + it.price.toLocaleString() + '</span></button>';
      });
      html += '</div>';
      el.classList.remove('hidden');
      el.innerHTML = html;
    },

    // ข่าวสารร้าน: globalData.news (server กรองเฉพาะ Active + อยู่ในช่วงวันที่ และไม่ส่งข้อมูลผู้สร้าง)
    // โชว์เฉพาะหน้าแรกที่ยังไม่ค้น/ไม่กรอง/ไม่ใช่หน้า 2+ เหมือนชั้นยอดนิยม — กดการ์ดเปิดรายละเอียดเต็ม
    renderNewsShelf: function() {
      const el = document.getElementById('posNews');
      if (!el) return;
      const esc = window.app.esc;
      const searchEl = document.getElementById('searchProduct');
      const idle = !(searchEl && searchEl.value.trim() !== '') && !this.storeFiltersActive() && (this.storePage || 1) === 1;
      const g = window.app.globalData || {};
      const list = idle && Array.isArray(g.news) ? g.news.filter(n => n && n.id && n.title).slice(0, 12) : [];
      const sig = JSON.stringify(list.map(n => [n.id, n.title, n.imageUrl]));
      if (el.dataset.sig === sig) return;
      el.dataset.sig = sig;
      if (!list.length) { el.classList.add('hidden'); el.innerHTML = ''; return; }
      let html = '<div class="pm-sec-head"><h2 class="pm-sec-title">ข่าวสาร</h2><span class="pm-sec-sub">อัปเดตล่าสุดจากร้าน</span></div>';
      html += '<div class="sf-news-row custom-scrollbar">';
      list.forEach(n => {
        const img = n.imageUrl ? '<img src="' + esc(window.app.formatImageUrl(n.imageUrl)) + '" alt="" loading="lazy" onerror="this.onerror=null;this.style.display=\'none\';">' : '<span class="sf-news-noimg"><i class="fas fa-newspaper"></i></span>';
        html += '<button type="button" class="sf-news-card" data-news-id="' + esc(n.id) + '" onclick="window.app.pos.openNews(this.getAttribute(\'data-news-id\'))">'
          + '<span class="sf-news-img">' + img + '</span>'
          + (n.category ? '<span class="sf-news-cat">' + esc(n.category) + '</span>' : '')
          + '<span class="sf-news-title">' + esc(n.title) + '</span></button>';
      });
      html += '</div>';
      el.classList.remove('hidden');
      el.innerHTML = html;
    },
    // เปิดรายละเอียดข่าว (ข้อความล้วน — ผ่าน esc ทุกช่อง); ลิงก์ http(s) เปิดแท็บใหม่, #route ไปหน้านั้นในแอป
    openNews: function(id) {
      const n = ((window.app.globalData || {}).news || []).find(x => x && x.id === id);
      if (!n) return;
      const esc = window.app.esc;
      const link = String(n.link || '');
      const internal = /^#[A-Za-z0-9_-]{1,40}$/.test(link), external = /^https?:\/\/[^\s<>"']+$/i.test(link);
      const html = (n.imageUrl ? '<img src="' + esc(window.app.formatImageUrl(n.imageUrl)) + '" alt="" style="max-width:100%;max-height:260px;border-radius:12px;margin:0 auto 12px;display:block;object-fit:contain" onerror="this.onerror=null;this.style.display=\'none\';">' : '')
        + (n.category ? '<div style="font-size:11px;font-weight:800;color:#FF6B00;margin-bottom:6px">' + esc(n.category) + '</div>' : '')
        + '<div style="text-align:left;white-space:pre-line;font-size:13px;line-height:1.6">' + esc(n.detail || '') + '</div>';
      Swal.fire({
        title: esc(n.title), html: html, showCloseButton: true,
        showConfirmButton: internal || external, confirmButtonText: 'ดูเพิ่มเติม', showCancelButton: true, cancelButtonText: 'ปิด'
      }).then(r => {
        if (!r.isConfirmed) return;
        if (internal) window.location.hash = link;
        else if (external) window.open(link, '_blank', 'noopener');
      });
    },

    // หมวดสินค้าที่เปิดขาย เรียง โมบาย → แท็บเล็ต → วอทช์ → หูฟัง → อื่นๆ → ของแถม (ใช้ร่วมกัน: แถบกรอง, ไทล์, เมนูหมวดใน header, footer)
    storeCategories: function(prods) {
      const list = prods || (window.app.globalData.products || []).filter(p => ['เปิด','open','active','on','true'].includes((p.Status || '').toString().trim().toLowerCase()));
      const order = ['โมบาย', 'แท็บเล็ต', 'สมาร์ทวอทช์', 'หูฟัง', 'ของแถมแบรนด์', 'ของแถมช่องทาง'];
      const rank = c => { const i = order.indexOf(c); return i === -1 ? order.length : i; };
      return [...new Set(list.map(p => (p.Category || '').trim()).filter(Boolean))].sort((a, b) => rank(a) - rank(b));
    },
    // เมนูหมวดใน header (เดสก์ท็อป) — ทำงานเหมือนไทล์ แต่เป็นลิงก์ข้อความแบบเว็บร้านค้า; หมวดของแถมไม่ขึ้นเมนู (ไม่มีการ์ดขาย)
    renderCatNav: function(cats) {
      const nav = document.getElementById('sfCatNav');
      if (!nav) return;
      const esc = window.app.esc, escJs = window.app.escAttrJs, cur = this.storeFilters.category;
      const item = (val, label, ico) => '<button type="button" class="sf-nav-a' + (cur === val ? ' on' : '') + '" aria-current="' + (cur === val ? 'page' : 'false') + '" onclick="window.app.pos.setStoreCategory(\'' + escJs(val) + '\')">' + (ico ? '<i class="fas ' + ico + '"></i>' : '') + esc(label) + '</button>';
      nav.innerHTML = item('', 'สินค้าทั้งหมด', 'fa-bars') + cats.filter(c => !c.includes('ของแถม')).map(c => item(c, c, '')).join('')
        + '<button type="button" class="sf-nav-a sf-nav-promo" onclick="window.app.pos.openPromoHub()"><i class="fas fa-fire"></i>โปรโมชั่น</button>';
    },
    renderStoreHeader: function() {
      const bar = document.getElementById('storeFilterBar');
      const side = document.getElementById('storeSidebar');
      if (!bar) return;
      this.openPopover = null;
      const esc = window.app.esc, escJs = window.app.escAttrJs;
      const f = this.storeFilters;
      const prods = (window.app.globalData.products || []).filter(p => ['เปิด','open','active','on','true'].includes((p.Status || '').toString().trim().toLowerCase()));
      const cats = this.storeCategories(prods);
      const groupSource = f.category ? prods.filter(p => (p.Category || '').trim() === f.category) : prods;
      const groups = [...new Set(groupSource.map(p => (p['Product Group'] || '').trim()).filter(g => g && g !== '-'))];
      // สี/ความจุ แสดงเฉพาะที่มีจริงในหมวด (และซีรีส์ที่เลือก) ปัจจุบัน — ค่าที่เลือกค้างอยู่แต่ไม่อยู่ในขอบเขตยังโชว์ไว้เพื่อให้กดยกเลิกได้
      const optSource = this.optionScope_(prods);
      const colors = [...new Set(optSource.map(p => (p.Color || '').trim()).filter(c => c && c !== '-').concat(f.colors))];
      const capVal = (c) => {
        const m = String(c).match(/([\d.]+)\s*(TB|GB|MB)?/i);
        if (!m) return Number.MAX_VALUE;
        let v = parseFloat(m[1]);
        const u = (m[2] || 'GB').toUpperCase();
        if (u === 'TB') v *= 1024; else if (u === 'MB') v /= 1024;
        return v;
      };
      const caps = [...new Set(optSource.map(p => (p.Capacity || '').trim()).filter(c => c && c !== '-').concat(f.capacities))].sort((a, b) => capVal(a) - capVal(b));
      const priceOpts = [
        { val: '', label: 'ทุกช่วงราคา' }, { val: 'lt10', label: 'ต่ำกว่า ฿10,000' }, { val: '10-30', label: '฿10,000 - ฿30,000' },
        { val: '30-50', label: '฿30,000 - ฿50,000' }, { val: 'gt50', label: 'มากกว่า ฿50,000' }
      ];
      const sortOpts = [ { val: '', label: 'เกี่ยวข้อง' }, { val: 'asc', label: 'ราคา: ต่ำ → สูง' }, { val: 'desc', label: 'ราคา: สูง → ต่ำ' } ];

      // --- แถบกรองด้านซ้าย (สไตล์หน้าหมวด BNN: กลุ่มพับได้ + checkbox เลือกได้หลายค่า) ---
      const opt = (checked, label, onclick, prefixHtml) => '<button type="button" class="sf-opt' + (checked ? ' on' : '') + '" onclick="' + onclick + '" aria-pressed="' + (checked ? 'true' : 'false') + '">'
        + '<span class="sf-box">' + (checked ? '<i class="fas fa-check"></i>' : '') + '</span>' + (prefixHtml || '') + '<span class="sf-lbl">' + esc(label) + '</span></button>';
      const grp = (title, body) => '<details open class="sf-group"><summary><span>' + title + '</span><i class="fas fa-chevron-down"></i></summary><div class="sf-body">' + body + '</div></details>';
      let sh = '<div class="sf-sheet-head"><strong>ตัวกรอง</strong><button type="button" aria-label="ปิดตัวกรอง" onclick="window.app.pos.toggleStoreSidebar(false)"><i class="fas fa-xmark"></i></button></div><div class="sf-panel">';
      sh += '<div class="sf-title"><i class="fas fa-sliders"></i> กรองข้อมูลสินค้า</div>';
      sh += '<button type="button" class="sf-switch' + (f.inStock ? ' on' : '') + '" onclick="window.app.pos.setStoreFilter(\'inStock\', ' + (f.inStock ? 'false' : 'true') + ')" role="switch" aria-checked="' + (f.inStock ? 'true' : 'false') + '"><span>แสดงสินค้าพร้อมขาย</span><span class="sf-knob"></span></button>';
      sh += grp('หมวดสินค้า', opt(f.category === '', 'สินค้าทั้งหมด', "window.app.pos.setStoreCategory('')")
        + cats.filter(c => !c.includes('ของแถม') || f.category === c).map(c => opt(f.category === c, c, "window.app.pos.setStoreCategory('" + escJs(c) + "')")).join(''));
      if (groups.length > 0) {
        sh += grp('ซีรีส์ / รุ่น', groups.map(g => opt(f.groups.includes(g), g, "window.app.pos.setStoreGroup('" + escJs(g) + "')")).join(''));
      }
      const minV = f.priceMin === '' ? '' : f.priceMin, maxV = f.priceMax === '' ? '' : f.priceMax;
      sh += grp('ช่วงราคา',
        '<div class="sf-price"><input type="number" min="0" inputmode="numeric" id="sfPriceMin" placeholder="ต่ำสุด" value="' + esc(minV) + '" onkeydown="if(event.key===\'Enter\')window.app.pos.applyPriceInputs()" aria-label="ราคาต่ำสุด">'
        + '<span>-</span><input type="number" min="0" inputmode="numeric" id="sfPriceMax" placeholder="สูงสุด" value="' + esc(maxV) + '" onkeydown="if(event.key===\'Enter\')window.app.pos.applyPriceInputs()" aria-label="ราคาสูงสุด">'
        + '<button type="button" class="sf-price-go" onclick="window.app.pos.applyPriceInputs()">ตกลง</button></div>'
        + priceOpts.map(o => opt(f.priceRange === o.val && f.priceMin === '' && f.priceMax === '', o.label, "window.app.pos.setStoreFilter('priceRange','" + o.val + "')")).join(''));
      if (caps.length > 0) {
        sh += grp('ความจุ', caps.map(c => opt(f.capacities.includes(c), c, "window.app.pos.setStoreFilter('capacity','" + escJs(c) + "')")).join(''));
      }
      if (colors.length > 0) {
        sh += grp('สี', colors.map(c => opt(f.colors.includes(c), c, "window.app.pos.setStoreFilter('color','" + escJs(c) + "')", '<span class="sf-swatch" style="background:' + esc(this.colorHex(c)) + '"></span>')).join(''));
      }
      sh += '<button type="button" class="sf-clear" onclick="window.app.pos.clearStoreFilters(false)"' + (this.storeFiltersActive() ? '' : ' disabled') + '>ลบการกรองสินค้าที่เลือก</button>';
      sh += '</div>';
      sh += '<div class="sf-sheet-foot"><button type="button" class="sf-btn-2" onclick="window.app.pos.clearStoreFilters(false)"' + (this.storeFiltersActive() ? '' : ' disabled') + '>ล้างทั้งหมด</button><button type="button" class="sf-sheet-go" onclick="window.app.pos.toggleStoreSidebar(false)">ดูสินค้า <span id="sfSheetCount"></span></button></div>';
      if (side) {
        side.innerHTML = sh;
        side.classList.toggle('hidden', !this.sidebarOpen);
        side.classList.add('lg:block');
        this.syncSheetCount();
      }

      // --- ส่วนหัวรายการ: breadcrumb + ชื่อหมวด + จำนวน + แถบเรียงตาม ---
      const title = f.groups.length === 1 ? f.groups[0] : (f.category || 'สินค้าทั้งหมด');
      // ไทล์ไอคอนหมวด (ยังเป็นปุ่ม .sf-chip เดิม ข้อความในปุ่ม = ชื่อหมวดล้วน — ไอคอนเป็น <i> ไม่มีข้อความ); หมวดของแถมไม่ขึ้นเป็นไทล์เพราะไม่มีการ์ดขายให้กดดู (ยังเลือกได้ที่แถบตัวกรองด้านข้างเหมือนเดิม)
      const catChip = (val, label) => '<button type="button" class="sf-chip sf-tile' + (f.category === val ? ' on' : '') + '" onclick="window.app.pos.setStoreCategory(\'' + escJs(val) + '\')" aria-pressed="' + (f.category === val ? 'true' : 'false') + '"><i class="fas ' + this.catIcon(val) + ' sf-tile-ic" aria-hidden="true"></i><span class="sf-tile-lb">' + esc(label) + '</span></button>';
      let html = '<div class="sf-catchips sf-cattiles" aria-label="หมวดสินค้า">' + catChip('', 'ทั้งหมด') + cats.filter(c => !c.includes('ของแถม')).map(c => catChip(c, c)).join('') + '</div>';
      html += '<nav class="sf-crumb" aria-label="breadcrumb"><span>หน้าหลัก</span><i class="fas fa-chevron-right"></i><span' + (f.category ? '' : ' class="cur"') + '>สินค้าทั้งหมด</span>'
        + (f.category ? '<i class="fas fa-chevron-right"></i><span' + (f.groups.length ? '' : ' class="cur"') + '>' + esc(f.category) + '</span>' : '')
        + (f.groups.length ? '<i class="fas fa-chevron-right"></i><span class="cur">' + esc(f.groups.join(', ')) + '</span>' : '') + '</nav>';
      html += '<div class="sf-head"><h2 class="sf-h1">' + esc(title) + '</h2><span id="storeResultCount" class="sf-count"></span></div>';
      html += '<div class="sf-sortbar">'
        + '<button type="button" class="sf-filter-btn lg:hidden" onclick="window.app.pos.toggleStoreSidebar()"><i class="fas fa-sliders"></i> ตัวกรอง' + (this.storeFiltersActive() ? ' <span class="sf-dot"></span>' : '') + '</button>'
        + '<label class="sf-sort"><span>เรียงตาม:</span><select onchange="window.app.pos.setStoreFilter(\'sort\', this.value)" aria-label="เรียงตาม">'
        + sortOpts.map(o => '<option value="' + o.val + '"' + (f.sort === o.val ? ' selected' : '') + '>' + esc(o.label) + '</option>').join('')
        + '</select></label></div>';
      html += this.activeChipsHtml();
      bar.innerHTML = html;
      this.renderCatNav(cats);
    },
    // ป้ายตัวกรองที่เลือกอยู่ (ใต้แถบเรียงตาม) — กดที่ป้าย = เอาตัวกรองนั้นออก; ไม่รวมการเรียงลำดับและคำค้น
    activeChipsHtml: function() {
      const f = this.storeFilters, esc = window.app.esc, escJs = window.app.escAttrJs, chips = [];
      const add = (label, onclick) => chips.push('<button type="button" class="sf-achip" onclick="' + onclick + '" aria-label="' + esc('เอาออก ' + label) + '"><span>' + esc(label) + '</span><i class="fas fa-xmark" aria-hidden="true"></i></button>');
      const baht = (n) => '฿' + Number(n).toLocaleString('en-US');
      if (f.category) add(f.category, "window.app.pos.setStoreCategory('')");
      if (f.brand) add(f.brand, "window.app.pos.setStoreFilter('brand','')");
      f.groups.forEach(g => add(g, "window.app.pos.setStoreGroup('" + escJs(g) + "')"));
      f.capacities.forEach(c => add(c, "window.app.pos.setStoreFilter('capacity','" + escJs(c) + "')"));
      f.colors.forEach(c => add(c, "window.app.pos.setStoreFilter('color','" + escJs(c) + "')"));
      const pr = { lt10: 'ต่ำกว่า ' + baht(10000), '10-30': baht(10000) + ' - ' + baht(30000), '30-50': baht(30000) + ' - ' + baht(50000), gt50: 'มากกว่า ' + baht(50000) }[f.priceRange];
      if (pr) add(pr, "window.app.pos.setStoreFilter('priceRange','')");
      else if (f.priceMin !== '' || f.priceMax !== '') add(f.priceMin !== '' && f.priceMax !== '' ? baht(f.priceMin) + ' - ' + baht(f.priceMax) : (f.priceMin !== '' ? 'ตั้งแต่ ' + baht(f.priceMin) : 'ไม่เกิน ' + baht(f.priceMax)), "window.app.pos.setStoreFilter('priceRange','')");
      if (f.inStock) add('พร้อมขาย', "window.app.pos.setStoreFilter('inStock', false)");
      if (!chips.length) return '';
      return '<div class="sf-achips" id="storeActiveChips" aria-label="ตัวกรองที่เลือกอยู่">' + chips.join('') + (chips.length > 1 ? '<button type="button" class="sf-achip-clear" onclick="window.app.pos.clearStoreFilters(false)">ล้างทั้งหมด</button>' : '') + '</div>';
    },
    // จอ < 1024px: แถบตัวกรองเป็นแผ่นเลื่อนขึ้นจากขอบล่าง (CSS บล็อก INTL 4) + ฉากหลัง #storeSheetBackdrop; จอกว้างแถบข้างแสดงตลอด (lg:block) ค่านี้ไม่มีผล
    toggleStoreSidebar: function(open) {
      this.sidebarOpen = typeof open === 'boolean' ? open : !this.sidebarOpen;
      const side = document.getElementById('storeSidebar');
      if (side) side.classList.toggle('hidden', !this.sidebarOpen);
      const bd = document.getElementById('storeSheetBackdrop');
      if (bd) bd.classList.toggle('hidden', !this.sidebarOpen);
      document.documentElement.classList.toggle('sf-sheet-open', this.sidebarOpen);
      if (this.sidebarOpen) this.syncSheetCount();
    },
    syncSheetCount: function() {
      const el = document.getElementById('sfSheetCount'), src = document.getElementById('storeResultCount');
      if (el && src) el.textContent = (src.textContent || '').trim();
    },
    goStorePage: function(n) {
      this.storePage = n;
      this.renderProducts(this.lastList);
      this.syncUrl();
      this.renderPopularShelf();
      this.renderBrandStrip(); this.renderNewShelf(); this.renderNewsShelf();
      const row = document.getElementById('productGrid');
      if (row) { row.scrollTop = 0; if (row.scrollIntoView && window.innerWidth < 1024) row.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
    },
    // ===== แบรนด์ / สินค้าใหม่ / ขายดี (ไอเดียจาก jaymartstore.com) — ไม่ต้องมีคอลัมน์ Brand: ดึงแบรนด์จากคำแรกของ Marketing Model =====
    NEW_DAYS_: 30,
    BRAND_ALIAS_: { IPHONE: 'APPLE', IPAD: 'APPLE', AIRPODS: 'APPLE', MACBOOK: 'APPLE', IMAC: 'APPLE', GALAXY: 'SAMSUNG', REDMI: 'XIAOMI', POCO: 'XIAOMI', RENO: 'OPPO', PIXEL: 'GOOGLE' },
    BRAND_LABEL_: { SAMSUNG: 'Samsung', APPLE: 'Apple', OPPO: 'OPPO', VIVO: 'vivo', HUAWEI: 'Huawei', XIAOMI: 'Xiaomi', REALME: 'realme', HONOR: 'HONOR', TECNO: 'TECNO', INFINIX: 'Infinix', NOKIA: 'Nokia', GOOGLE: 'Google', ONEPLUS: 'OnePlus', ASUS: 'ASUS', JBL: 'JBL', SONY: 'Sony', ANKER: 'Anker' },
    // คำทั่วไปที่ขึ้นต้นชื่อสินค้า (ไม่ใช่ชื่อแบรนด์) — ไม่นับเป็นแบรนด์ เช่น "Case ..." "Cable ..."
    BRAND_GENERIC_: ['CASE', 'ADAPTER', 'CABLE', 'CHARGER', 'POWER', 'POWERBANK', 'BANK', 'BAG', 'FILM', 'GLASS', 'SCREEN', 'STAND', 'HOLDER', 'EARBUDS', 'HEADPHONE', 'HEADSET', 'SPEAKER', 'WATCH', 'SMARTWATCH', 'TABLET', 'PHONE', 'MOBILE', 'KEYBOARD', 'MOUSE', 'MEMORY', 'CARD', 'USB', 'TYPE', 'WIRELESS', 'BLUETOOTH', 'NEW', 'THE', 'PB', 'TG', 'COVER', 'STRAP', 'BAND'],
    // คีย์แบรนด์ (ตัวพิมพ์ใหญ่) ของสินค้า; ของแถม/ชื่อที่ไม่ขึ้นต้นด้วยตัวอักษรละติน = '' (ไม่นับเป็นแบรนด์)
    brandOf: function(p) {
      if (!p || (p.Category || '').toString().includes('ของแถม')) return '';
      const src = String(p['Marketing Model'] || p['Product Name'] || p.Model || '').trim();
      const w = (src.split(/\s+/)[0] || '').toUpperCase();
      if (!/^[A-Z]{2,}$/.test(w) || this.BRAND_GENERIC_.indexOf(w) !== -1) return '';
      return this.BRAND_ALIAS_[w] || w;
    },
    brandLabel_: function(k) { return this.BRAND_LABEL_[k] || (k.charAt(0) + k.slice(1).toLowerCase()); },
    // สินค้าขายปกติที่เปิดอยู่และขายได้ในช่องทางที่เลือก (ไม่รวมของแถม)
    sellable_: function() {
      const ch = (document.getElementById('posChannelSelect') || {}).value || '';
      return (window.app.globalData.products || []).filter(p => p.Status === 'เปิด' && !(p.Category || '').toString().includes('ของแถม') && window.app.channelOk(p.Channel, ch));
    },
    // อายุสินค้าเป็นวันนับจาก Launch Date (yyyy-MM-dd เวลาไทย); null = ไม่มีวันที่ — ค่าติดลบ = ยังไม่ถึงวันวางขาย (ถือเป็นของใหม่ เหมาะกับ Pre Booking)
    launchAgeDays_: function(p) {
      const s = String((p && p['Launch Date']) || '').trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
      const t = Date.parse(s + 'T00:00:00+07:00');
      return isNaN(t) ? null : (Date.now() - t) / 864e5;
    },
    isNew: function(p) { const a = this.launchAgeDays_(p); return a !== null && a <= this.NEW_DAYS_; },
    // รุ่นขายดี = 4 อันดับแรกของ globalData.popularModels (server คำนวณจากยอดจอง)
    isHot: function(p) {
      const m = p && p.Model;
      if (!m || m === '-') return false;
      return ((window.app.globalData || {}).popularModels || []).slice(0, 4).indexOf(m) !== -1;
    },
    setBrand: function(k) {
      const f = this.storeFilters;
      f.brand = (f.brand === k) ? '' : (k || '');
      this.renderStoreHeader();
      this.filter();
    },
    // แถบแบรนด์ (เลื่อนแนวนอน): นับเป็นจำนวนรุ่น เฉพาะสินค้าในหมวดที่เลือกอยู่ + ช่องทางนี้; ต้องมี >= 2 แบรนด์ (หรือเลือกแบรนด์ค้างอยู่) ถึงแสดง
    renderBrandStrip: function() {
      const el = document.getElementById('posBrands');
      if (!el) return;
      const f = this.storeFilters;
      const byBrand = {};
      this.sellable_().forEach(p => {
        if (f.category && (p.Category || '').trim() !== f.category) return;
        const b = this.brandOf(p);
        if (!b) return;
        (byBrand[b] = byBrand[b] || {})[(p.Model && p.Model !== '-') ? 'M:' + p.Model : 'S:' + p.SKU] = 1;
      });
      const list = Object.keys(byBrand).map(b => ({ key: b, n: Object.keys(byBrand[b]).length })).sort((a, b) => (b.n - a.n) || a.key.localeCompare(b.key));
      const show = list.length >= 2 || !!f.brand;
      const sig = show ? JSON.stringify([list, f.brand]) : '';
      if (el.dataset.sig === sig) return;
      el.dataset.sig = sig;
      if (!show) { el.classList.add('hidden'); el.innerHTML = ''; return; }
      const esc = window.app.esc, escJs = window.app.escAttrJs;
      const hue = (k) => { let h = 0; for (let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) % 360; return h; };
      let html = '<div class="pm-sec-head"><h2 class="pm-sec-title">แบรนด์ที่ขาย</h2><span class="pm-sec-sub">เลือกแบรนด์เพื่อดูเฉพาะรุ่นของแบรนด์นั้น</span></div>';
      html += '<div class="sf-brand-row custom-scrollbar" role="group" aria-label="เลือกแบรนด์">';
      html += '<button type="button" class="sf-brand-chip' + (f.brand ? '' : ' on') + '" aria-pressed="' + (f.brand ? 'false' : 'true') + '" onclick="window.app.pos.setBrand(\'\')"><span class="sf-brand-ic" style="--h:20"><i class="fas fa-border-all"></i></span><span class="sf-brand-nm">ทั้งหมด</span></button>';
      list.forEach(it => {
        const on = f.brand === it.key;
        html += '<button type="button" class="sf-brand-chip' + (on ? ' on' : '') + '" aria-pressed="' + (on ? 'true' : 'false') + '" onclick="window.app.pos.setBrand(\'' + escJs(it.key) + '\')">'
          + '<span class="sf-brand-ic" style="--h:' + hue(it.key) + '">' + esc(it.key.charAt(0)) + '</span>'
          + '<span class="sf-brand-nm">' + esc(this.brandLabel_(it.key)) + '</span><span class="sf-brand-n">' + it.n + '</span></button>';
      });
      html += '</div>';
      el.classList.remove('hidden');
      el.innerHTML = html;
    },
    // ชั้น "สินค้าใหม่": รุ่นที่ Launch Date อยู่ใน 30 วัน (หรือยังไม่ถึงวันวางขาย) เรียงใหม่สุดก่อน; หน้าแรกที่ไม่ค้น/ไม่กรองเท่านั้น; ต้องมี >= 2 รุ่นที่มีของ
    renderNewShelf: function() {
      const el = document.getElementById('posNewArrivals');
      if (!el) return;
      const searchEl = document.getElementById('searchProduct');
      const idle = !(searchEl && searchEl.value.trim() !== '') && !this.storeFiltersActive() && (this.storePage || 1) === 1;
      const priceOf = (p) => parseFloat(String(p.Price || '0').replace(/[^\d.\-]/g, '')) || 0;
      const items = [];
      if (idle) {
        const byModel = {};
        this.sellable_().forEach(p => {
          if (!this.isNew(p) || this.stockOf(p) <= 0) return;
          const k = (p.Model && p.Model !== '-') ? 'M:' + p.Model : 'S:' + p.SKU;
          const cur = byModel[k];
          if (!cur || priceOf(p) < priceOf(cur)) byModel[k] = p;
        });
        Object.keys(byModel).map(k => byModel[k])
          .sort((a, b) => this.launchAgeDays_(a) - this.launchAgeDays_(b))
          .slice(0, 8)
          .forEach(rep => items.push({ sku: rep.SKU, name: String(rep['Product Name'] || rep['Marketing Model'] || rep.Model || '').replace(/\s*\([^)]*\)\s*$/, '').replace(/^SAMSUNG\s+/i, ''), img: rep['Image URL'], price: priceOf(rep) }));
      }
      const show = items.length >= 2;
      const sig = show ? JSON.stringify(items.map(i => [i.sku, i.price])) : '';
      if (el.dataset.sig === sig) return;
      el.dataset.sig = sig;
      if (!show) { el.classList.add('hidden'); el.innerHTML = ''; return; }
      const esc = window.app.esc, escJs = window.app.escAttrJs;
      let html = '<div class="pm-sec-head"><h2 class="pm-sec-title">สินค้าใหม่</h2><span class="pm-sec-sub">เปิดตัวล่าสุด จองได้เลย</span></div><div class="sf-pop-row custom-scrollbar">';
      items.forEach(it => {
        html += '<button type="button" class="sf-pop-card sf-new-card" onclick="window.app.pos.openAddToCartModal(\'' + escJs(it.sku) + '\')" aria-label="' + esc(it.name) + ' สินค้าใหม่">'
          + '<span class="sf-new-tag">NEW</span>'
          + '<img src="' + esc(window.app.formatImageUrl(it.img)) + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=window.app.NO_IMG;">'
          + '<span class="sf-pop-name">' + esc(it.name) + '</span>'
          + '<span class="sf-pop-price">฿' + it.price.toLocaleString() + '</span></button>';
      });
      html += '</div>';
      el.classList.remove('hidden');
      el.innerHTML = html;
    },
    // ===== หน้าโปรโมชั่นทั้งหมด (ไอเดียจากหน้า /promotions + /vouchers ของ jaymartstore.com): แคมเปญ(แบนเนอร์) + คูปอง + โปรซื้อคู่ ในหน้าต่างเดียว =====
    // ข้อมูลทั้งหมดมาจากที่หน้าร้านโหลดอยู่แล้ว (แบนเนอร์ที่ server กรองเฉพาะช่วงวันที่แสดงอยู่ / Promotions / AutoPromotions) — ไม่มีการเรียก server เพิ่ม
    promoCampaigns_: function() {
      const g = window.app.globalData || {}, seen = {}, out = [];
      [].concat(g.heroBanners || [], g.gridBanners || [], g.popupBanners || []).forEach(b => {
        if (!b) return;
        const o = (typeof b === 'string') ? { url: b } : b;
        const url = String(o.url || o['Image URL'] || '').trim();
        if (!url || seen[url]) return;
        seen[url] = 1;
        out.push({ url: url, title: String(o.title || '').trim(), sub: String(o.details || o.Details || '').trim(), link: String(o.link || o.targetLink || '').trim() });
      });
      return out;
    },
    openPromoHub: function() {
      const body = document.getElementById('promoHubBody');
      if (!body) return;
      const esc = window.app.esc, escJs = window.app.escAttrJs, g = window.app.globalData || {};
      this._promoCamps = this.promoCampaigns_();
      let html = '';
      // 1) แคมเปญ — กดแล้วทำเหมือนแบนเนอร์หลัก (ลิงก์ http = เปิดแท็บใหม่ ไม่งั้นค้นสินค้าด้วยลิงก์/ชื่อแคมเปญ)
      if (this._promoCamps.length) {
        html += '<section><div class="pm-sec-head"><h3 class="pm-sec-title">แคมเปญ</h3><span class="pm-sec-sub">' + this._promoCamps.length + ' รายการที่เปิดอยู่</span></div><div class="sf-promo-grid">';
        this._promoCamps.forEach((c, i) => {
          html += '<button type="button" class="sf-camp" onclick="window.app.pos.openPromoCampaign(' + i + ')" aria-label="' + esc(c.title || 'แคมเปญ ' + (i + 1)) + '">'
            + '<img src="' + esc(window.app.formatImageUrl(c.url)) + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=window.app.NO_IMG;">'
            + ((c.title || c.sub) ? '<span class="sf-camp-cap">' + (c.title ? '<b>' + esc(c.title) + '</b>' : '') + (c.sub ? '<span>' + esc(c.sub) + '</span>' : '') + '</span>' : '')
            + '</button>';
        });
        html += '</div></section>';
      }
      // 2) คูปองส่วนลด — กด "เก็บใช้" = ใส่คูปองในตะกร้า (applyVoucher เดิม) แล้ววาดสถานะ "ใช้อยู่" ใหม่
      const selectedNames = [];
      document.querySelectorAll('.cart-promo-select').forEach(el => {
        if (!el.value) return;
        const opt = el.options[el.selectedIndex];
        const name = opt ? (opt.getAttribute('data-name') || '') : '';
        if (name) selectedNames.push(name);
      });
      const promos = (g.promotions || []).filter(p => ['เปิด', 'open', 'active', 'on', 'true'].includes((p.Status || '').toString().trim().toLowerCase()));
      if (promos.length) {
        html += '<section><div class="pm-sec-head"><h3 class="pm-sec-title">คูปองส่วนลด</h3><span class="pm-sec-sub">กดเพื่อใช้กับตะกร้า</span></div><div class="sf-promo-grid sf-promo-grid-sm">';
        promos.forEach(p => {
          const name = (p['Promo Name'] || '').toString().trim();
          const isPct = /percent|%/i.test((p['Discount Type'] || '').toString());
          const dVal = parseFloat((p.Value || 0).toString().replace(/[^\d.\-]/g, '')) || 0;
          const on = selectedNames.includes(name);
          html += '<div class="bnn-voucher-card sf-promo-coupon' + (on ? ' applied' : '') + '" onclick="window.app.pos.applyVoucher(\'' + escJs(name) + '\');window.app.pos.openPromoHub()">'
            + '<div class="min-w-0"><div class="pm-v-val truncate">' + esc(isPct ? 'ลด ' + dVal + '%' : 'ลด ฿' + dVal.toLocaleString()) + '</div><div class="pm-v-name" title="' + esc(name) + '">' + esc(name) + '</div><div class="pm-v-note">คูปองส่วนลดท้ายบิล</div></div>'
            + '<span class="pm-v-btn shrink-0' + (on ? ' on' : '') + '">' + (on ? '<i class="fas fa-check mr-0.5"></i>ใช้อยู่' : 'เก็บใช้') + '</span></div>';
        });
        html += '</div></section>';
      }
      // 3) ซื้อคู่ลดพิเศษ (AutoPromotions) — ไม่มีกติกาในชีต = ใช้ค่าเริ่มต้นเดียวกับแถบคูปอง
      let rules = (g.autoPromotions || []).filter(r => window.app.statusOn(r.Status));
      if (!rules.length) rules = [{ 'Buy Category': 'โมบาย', 'Get Discount Category': 'อุปกรณ์เสริม', 'Discount Percent': 10 }];
      html += '<section><div class="pm-sec-head"><h3 class="pm-sec-title">ซื้อคู่ลดพิเศษ</h3><span class="pm-sec-sub">ระบบคำนวณส่วนลดให้อัตโนมัติในตะกร้า</span></div><div class="sf-promo-grid sf-promo-grid-sm">';
      rules.forEach(r => {
        const buyCat = (r['Buy Category'] || 'โมบาย').toString().trim();
        const getCat = (r['Get Discount Category'] || 'อุปกรณ์เสริม').toString().trim();
        const pct = parseFloat(r['Discount Percent']) || 10;
        html += '<div class="bnn-voucher-card sf-promo-coupon" onclick="window.app.pos.promoHubCategory(\'' + escJs(getCat) + '\')">'
          + '<div class="min-w-0"><div class="pm-v-val truncate">ซื้อคู่ ลด ' + esc(pct) + '%</div><div class="pm-v-name">ซื้อ ' + esc(buyCat) + ' คู่ ' + esc(getCat) + '</div><div class="pm-v-note">ระบบคำนวณลดอัตโนมัติ</div></div>'
          + '<span class="pm-v-btn shrink-0">ดูสินค้า</span></div>';
      });
      html += '</div></section>';
      body.innerHTML = html;
      window.app.showModal('promoHubModal');
    },
    openPromoCampaign: function(i) {
      const c = (this._promoCamps || [])[i];
      if (!c) return;
      window.app.hideModal('promoHubModal');
      if (c.link && /^https?:/i.test(c.link)) { window.open(c.link, '_blank'); return; }
      const kw = c.link || c.title;
      if (kw) { this.clearStoreFilters(false); this.applyBannerSearch(kw); }
    },
    promoHubCategory: function(cat) {
      window.app.hideModal('promoHubModal');
      this.setStoreCategory(cat);
    },
    emptyStoreFilters: function() {
      return { category: '', brand: '', groups: [], capacities: [], colors: [], priceRange: '', priceMin: '', priceMax: '', sort: '', inStock: false };
    },
    // สินค้าที่เปิดขายในขอบเขตหมวด + ซีรีส์ที่เลือก (ใช้ทำรายการตัวเลือกสี/ความจุ)
    optionScope_: function(prods) {
      const f = this.storeFilters;
      return prods.filter(p => (!f.category || (p.Category || '').trim() === f.category) && (!f.groups.length || f.groups.includes((p['Product Group'] || '').trim())));
    },
    // เปลี่ยนหมวด/ซีรีส์แล้ว ตัดสี/ความจุที่เลือกไว้แต่ไม่มีในขอบเขตใหม่ออก (กันตัวกรองซ่อนค้างจนสินค้าหาย)
    pruneOptionFilters_: function() {
      const f = this.storeFilters;
      const prods = (window.app.globalData.products || []).filter(p => ['เปิด','open','active','on','true'].includes((p.Status || '').toString().trim().toLowerCase()));
      const scope = this.optionScope_(prods);
      const caps = new Set(scope.map(p => (p.Capacity || '').trim())), cols = new Set(scope.map(p => (p.Color || '').trim()));
      f.capacities = f.capacities.filter(c => caps.has(c));
      f.colors = f.colors.filter(c => cols.has(c));
    },
    setStoreCategory: function(cat) {
      this.storeFilters.category = cat;
      this.storeFilters.groups = []; // เปลี่ยนหมวด = รายการรุ่นเปลี่ยน — ล้างตัวเลือกรุ่นเดิม
      this.pruneOptionFilters_();
      this.renderStoreHeader();
      this.filter();
    },
    // เลือก/ยกเลิกค่าในตัวกรองหลายค่า ('' = ล้างทั้งกลุ่ม)
    toggleIn_: function(arr, val) {
      if (val === '') { arr.length = 0; return; }
      const i = arr.indexOf(val);
      if (i > -1) arr.splice(i, 1); else arr.push(val);
    },
    setStoreGroup: function(g) {
      this.toggleIn_(this.storeFilters.groups, g);
      this.pruneOptionFilters_();
      this.renderStoreHeader();
      this.filter();
    },
    setStoreFilter: function(key, val) {
      const f = this.storeFilters;
      if (key === 'capacity') this.toggleIn_(f.capacities, val);
      else if (key === 'color') this.toggleIn_(f.colors, val);
      else if (key in f && !Array.isArray(f[key])) {
        f[key] = val;
        if (key === 'priceRange') { f.priceMin = ''; f.priceMax = ''; } // เลือกช่วงสำเร็จรูป = ล้างช่วงที่พิมพ์เอง
      } else return;
      this.renderStoreHeader(); // สร้าง header ใหม่ = popover ปิดไปด้วย
      this.filter();
    },
    // ช่วงราคาที่ผู้ใช้พิมพ์เอง (ต่ำสุด/สูงสุด) — ค่าว่างหรือไม่ใช่ตัวเลข = ไม่จำกัดด้านนั้น; สลับให้ถ้าใส่กลับด้าน
    applyPriceInputs: function() {
      const num = (id) => { const el = document.getElementById(id); const n = el ? parseFloat(el.value) : NaN; return (isNaN(n) || n < 0) ? '' : n; };
      let lo = num('sfPriceMin'), hi = num('sfPriceMax');
      if (lo !== '' && hi !== '' && lo > hi) { const t = lo; lo = hi; hi = t; }
      this.storeFilters.priceMin = lo; this.storeFilters.priceMax = hi; this.storeFilters.priceRange = '';
      this.renderStoreHeader();
      this.filter();
    },
    // คลิกโลโก้ร้าน = กลับหน้าแรกร้านค้า: ล้างคำค้น/ตัวกรอง แล้วเลื่อนขึ้นบนสุด (ไม่เปลี่ยน hash เพราะอยู่ #pos อยู่แล้ว)
    goHome: function(e) {
      if (e) e.preventDefault();
      this.storePage = 1;
      this.clearStoreFilters(true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    clearStoreFilters: function(alsoSearch) {
      this.storeFilters = this.emptyStoreFilters();
      if (alsoSearch) {
        const s = document.getElementById('searchProduct');
        if (s) s.value = '';
      }
      this.renderStoreHeader();
      this.filter();
    },

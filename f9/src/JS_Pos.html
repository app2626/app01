      this.renderCheckoutSummary();
      // มือถือ: สรุปรายการพับไว้ (เห็นยอดรวมที่หัวกล่อง) เพื่อให้ช่องกรอกแรกอยู่บนจอ
      const sumBox = document.getElementById('coSumBox'); if (sumBox) sumBox.open = window.innerWidth >= 1024;
      window.app.showModal('checkoutModal');
      const sc = document.getElementById('coScroll'); if (sc) sc.scrollTop = 0;
    },
    // สรุปรายการในหน้าสั่งจอง / หน้ายืนยันใบจอง — คำนวณแบบเดียวกับ updateTotal (ราคา x จำนวน - ส่วนลดโปร - ส่วนลดอัตโนมัติ)
    checkoutSummary: function() {
      const esc = window.app.esc;
      const num = (v) => parseFloat(String(v || '0').replace(/[^\d.\-]/g, '')) || 0;
      let sub = 0, html = '<ul class="co-items">';
      this.cartData.forEach(i => {
        const unit = num(i.Price); sub += unit * i.qty;
        const variantTxt = [i.Color, i.Capacity].map(v => (v === null || v === undefined) ? '' : String(v).trim()).filter(v => v && v !== '-').join(' · ');
        const gifts = [].concat(i.brandGifts || [], i.channelGifts || []).map(g => esc(g.name) + (g.qty > 1 ? ' x' + g.qty : ''));
        html += '<li><img src="' + esc(window.app.formatImageUrl(i['Image URL'] || '', 'w200')) + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=window.app.NO_IMG;">'
          + '<div class="co-it"><div class="co-it-n">' + esc(i['Product Name']) + '</div>'
          + (variantTxt ? '<div class="co-it-v">' + esc(variantTxt) + '</div>' : '')
          + '<div class="co-it-v tabular-nums">' + i.qty + ' x ฿' + unit.toLocaleString() + '</div>'
          + (gifts.length ? '<div class="co-it-g"><i class="fas fa-gift" aria-hidden="true"></i> ' + gifts.join(', ') + '</div>' : '')
          + '</div><b class="tabular-nums">฿' + (unit * i.qty).toLocaleString() + '</b></li>';
      });
      html += '</ul><dl class="co-tot"><div><dt>ยอดรวมก่อนลด</dt><dd class="tabular-nums">฿' + sub.toLocaleString() + '</dd></div>';
      let disc = 0;
      this.getPromoDiscounts().forEach(x => { if (x.value > 0) { disc += x.value; html += '<div class="co-disc"><dt>' + esc(x.name) + '</dt><dd class="tabular-nums">-฿' + x.value.toLocaleString() + '</dd></div>'; } });
      const auto = this.cartAutoDiscount || 0;
      if (auto > 0) { disc += auto; html += '<div class="co-disc"><dt>ส่วนลดพิเศษ (Auto Bundle)</dt><dd class="tabular-nums">-฿' + auto.toLocaleString() + '</dd></div>'; }
      const total = Math.max(0, sub - disc);
      html += '<div class="co-grand"><dt>ยอดสุทธิ</dt><dd class="tabular-nums">฿' + total.toLocaleString() + '</dd></div></dl>';
      return { html: html, total: total };
    },
    renderCheckoutSummary: function() {

      const txt = '฿' + s.total.toLocaleString();
      ['coSumMini', 'coBarTotal'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = txt; });
    },
    // หน้ายืนยันหลังบันทึกใบจองสำเร็จ: เลขที่ใบจอง + สรุป + พิมพ์ / คัดลอกลิงก์ติดตาม / กลับหน้าร้าน

    submitCheckout: async function() {
      if (this.isSubmitting) return; // กันกดยืนยันซ้ำระหว่างรอผล CHECKOUT — ออเดอร์ซ้ำ
      const custName = document.getElementById('coCustomer').value;
      const phone = document.getElementById('coPhone').value.replace(/\D/g, '');
      const email = document.getElementById('coEmail').value;
      const idCheck = window.app.validateIdCard(document.getElementById('coIdCard').value);
      const idCard = idCheck.ok ? idCheck.value : '';
      const bkStaffName = document.getElementById('bkStaffName').value.trim();
      const bkPhone = document.getElementById('bkPhone').value.replace(/\D/g, '').trim();
      
      if(!custName || !phone || !email || !idCard || !bkStaffName || !bkPhone) { 
          return window.app.toast('กรุณากรอกข้อมูลที่มีเครื่องหมาย * ให้ครบถ้วน', 'warning'); 
      }
      
      if(!idCheck.ok) { return window.app.toast(idCheck.msg, 'warning'); }
      
      if(phone.length !== 10) {
          return window.app.toast('เบอร์โทรศัพท์ลูกค้าไม่ถูกต้อง (ต้องเป็น 10 หลัก)', 'warning');
      }
      
      if(!email.includes('@')) {
          return window.app.toast('กรุณากรอกอีเมลให้ถูกต้อง (ต้องมีสัญลักษณ์ @)', 'warning');
      }
      
      if(bkPhone.length !== 10) {
          return window.app.toast('เบอร์พนักงานไม่ถูกต้อง (ต้องเป็น 10 หลัก)', 'warning');
      }
      
      let rs=null; document.getElementsByName('resStatus').forEach(r=>{if(r.checked) rs=r.value;}); if(!rs) return Swal.fire('เลือกเงื่อนไขจอง','กรุณาระบุว่าเป็นการจอง T หรือ จอง F','warning');
      // ต้องแจ้งเงื่อนไขการจอง + นโยบายความเป็นส่วนตัวให้ลูกค้าทราบก่อนเก็บข้อมูลส่วนบุคคล (ชื่อ/เบอร์/เลขบัตร)
      const consentEl = document.getElementById('coConsent');
      if (consentEl && !consentEl.checked) { consentEl.focus(); return window.app.toast('กรุณาติ๊กยืนยันว่าลูกค้ารับทราบเงื่อนไขการจองและนโยบายความเป็นส่วนตัว', 'warning'); }

      const receiptNo = (document.getElementById('coReceiptNo') ? document.getElementById('coReceiptNo').value : '').trim();
      const depositAmount = parseFloat(document.getElementById('coDeposit') ? document.getElementById('coDeposit').value : 0) || 0;
      // จอง T (มัดจำจองจริง) บังคับต้องมีใบเสร็จและเงินมัดจำ
      if (rs.includes('จอง T')) {
          if (!receiptNo) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกเลขที่ใบเสร็จรับเงินมัดจำ', 'warning');
          if (depositAmount <= 0) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกจำนวนเงินมัดจำ (ต้องมากกว่า 0)', 'warning');
      }
      
      // ส่วนลดมาจาก getPromoDiscounts ที่เดียว (รองรับโปร Percent) — ชื่อที่ส่ง backend เป็น Promo Name เพียวๆ เพื่อให้ validate ตรงชีตได้
      const discountsList = this.getPromoDiscounts();
      let totalDiscountVal = 0;
      discountsList.forEach(x => { totalDiscountVal += x.value; });
      
      if (this.cartAutoDiscount > 0) {
        discountsList.push({ name: 'ส่วนลดพิเศษ (Auto Bundle ' + (this.autoDiscountDesc || '') + ')', value: this.cartAutoDiscount });
        totalDiscountVal += this.cartAutoDiscount;
      }
      
      const ints=[]; document.querySelectorAll('#dynamicInterests input[type="checkbox"]:checked').forEach(e=>ints.push(e.value));

      // Idempotency key: สร้างครั้งเดียวต่อความพยายามคีย์ออเดอร์นี้ — ถ้ากดยืนยันซ้ำหลัง timeout ต้องส่ง id เดิม
      // เพื่อให้ server จับซ้ำได้ ล้างเฉพาะเมื่อ server ยืนยันว่าบันทึกแล้ว (สำเร็จ/duplicate)
      if (!this.pendingRequestId) {
        this.pendingRequestId = 'REQ-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
      }

      const pay = {
        clientRequestId: this.pendingRequestId,
        cart:this.cartData, channel: document.getElementById('posChannelSelect').value, branch: document.getElementById('posBranchSelect').value, 
        customerName: custName, contactPhone: phone, email: email, idCard: idCard, preOrderNo: document.getElementById('coPreOrderNo').value, pickupDate: document.getElementById('coPickupDate').value, codeHandraiser: document.getElementById('coCodeHandraiser').value,
        customerInterests:ints.join(', '), resStatus:rs, bkStaffName:document.getElementById('bkStaffName').value, bkPhone:document.getElementById('bkPhone').value, remark:document.getElementById('coRemark').value,

             window.app.showLoading('กำลังบันทึกข้อมูล...');

               window.app.pos.isSubmitting = false;
               if (btnSubmit) btnSubmit.disabled = false;
               if(res && res.status==='success'){
                  // server ยืนยันว่าออเดอร์ถูกบันทึกแล้ว (ใหม่หรือซ้ำ) — ล้าง idempotency key ให้ออเดอร์ถัดไปได้ key ใหม่
                  window.app.pos.pendingRequestId = null;
                  // 5B.2 — จำชื่อ/เบอร์พนักงานไว้ prefill ออเดอร์ถัดไป (per เครื่อง ไม่ใช่ per user — ล้างตอน logout)
                  sessionStorage.setItem('tg_bk_staff', bkStaffName);
                  sessionStorage.setItem('tg_bk_phone', bkPhone);
                  window.app.hideLoading();
                  window.app.hideModal('checkoutModal');
                  if (res.duplicate) {
                    // ยิงซ้ำจาก timeout/คีย์ซ้ำ — ออเดอร์เดิมถูกบันทึกไปแล้ว ไม่ต้องเปิดหน้ายืนยันซ้ำ

                  window.app.pos.saveAndRender();

                  clearTimeout(window.app.pos.custLookupTimer);

                  document.getElementsByName('resStatus').forEach(r => r.checked = false);
                  
                  const pContainer = document.getElementById('cartPromosContainer');
                  window.app.pos.appliedCoupons = []; window.app.pos.renderCouponChips();
                  if(pContainer) {
                    pContainer.innerHTML = '';

                  document.querySelectorAll('#dynamicInterests input[type="checkbox"]').forEach(c=>c.checked=false);
                  // ออเดอร์บันทึกสำเร็จไปแล้ว — ถ้ารีเฟรชข้อมูลพลาด ห้ามเด้ง error ให้ผู้ใช้เข้าใจผิดว่าจองไม่สำเร็จ
                  try {
                    const newGlobal = await window.app.api('GET_ALL_DATA', {});
                    if(newGlobal && newGlobal.status === 'success') window.app.globalData = newGlobal;
                    window.app.pos.filter();
                  } catch(refreshErr) { console.warn('รีเฟรชข้อมูลหลังบันทึกออเดอร์ไม่สำเร็จ (สต๊อกบนการ์ดอาจยังเป็นค่าเก่า):', refreshErr); }
               } else { Swal.fire('ระบบขัดข้อง',res ? res.message : 'Error', 'error'); }
             } catch(e) {
               // timeout ≠ บันทึกไม่สำเร็จ — ออเดอร์อาจเข้าแล้ว (idempotency key กันซ้ำอยู่) อย่าให้ผู้ใช้รีบคีย์ใหม่ทันที
               if (e && e.isTimeout) Swal.fire('การเชื่อมต่อช้า', 'กรุณาตรวจสอบหน้ารายการจองก่อนคีย์ซ้ำ — หากออเดอร์ยังไม่เข้า กดยืนยันอีกครั้งได้ (ระบบกันบันทึกซ้ำให้)', 'warning');
               else Swal.fire('เกิดข้อผิดพลาด', e.message, 'error');

      const customWrap = document.getElementById('tiCustomPriceWrap');
      if (customWrap) customWrap.classList.toggle('hidden', !catItem.custom);

    searchTrackedOrder: async function() {
      const inp = document.getElementById('orderTrackQueryInput');
      const resWrap = document.getElementById('orderTrackResults');
      if (!inp || !resWrap) return;

      if (q.length < 3) return Swal.fire('แจ้งเตือน', 'กรุณากรอกเลขที่ใบจอง หรือเบอร์โทรศัพท์อย่างน้อย 4 หลัก', 'warning');

      resWrap.innerHTML = '<div class="py-10 text-center text-slate-500 text-xs font-bold"><i class="fas fa-spinner fa-spin mr-2 text-indigo-600"></i>กำลังค้นหาข้อมูลใบจอง...</div>';
      try {
        const res = await window.app.api('TRACK_ORDER', { query: q });
        if (!res || res.status !== 'success') {
          resWrap.innerHTML = `<div class="p-6 text-center text-rose-600 text-xs font-bold">${window.app.esc(res ? res.message : 'ค้นหาไม่สำเร็จ')}</div>`;
          return;
        }
        const orders = res.orders || [];
        if (orders.length === 0) {
          resWrap.innerHTML = '<div class="p-8 text-center bg-slate-50 rounded-2xl border border-slate-200 text-slate-500 text-xs font-bold"><i class="fas fa-search-minus text-2xl text-slate-300 mb-2 block"></i>ไม่พบรายการใบจองที่ตรงกับคำค้นหานี้</div>';
          return;
        }
        const esc = window.app.esc;
        resWrap.innerHTML = orders.map(o => {
          const st = (o.status || 'Pending').toString();
          const stLower = st.toLowerCase();
          const stepIdx = (stLower.includes('complete') || stLower.includes('deliver') || stLower.includes('สำเร็จ') || stLower.includes('รับเครื่องแล้ว')) ? 4
                        : (stLower.includes('ready') || stLower.includes('พร้อมรับ')) ? 3
                        : (stLower.includes('confirm') || stLower.includes('paid') || stLower.includes('ยืนยัน') || o.deposit > 0) ? 2 : 1;
          const qrUrl = 'https:\/\/quickchart.io/qr?size=160&margin=1&text=' + encodeURIComponent(o.orderId + '|' + o.branch + '|NET:' + o.netTotal);
          const steps = ['รับคำสั่งจอง', 'ล็อกสิทธิ์/มัดจำ', 'พร้อมรับที่สาขา', 'ส่งมอบสำเร็จ'];

          return `
            <div class="border-2 border-slate-200 rounded-2xl overflow-hidden bg-white shadow-sm">
              <div class="bg-slate-900 text-white px-4 py-3 flex flex-wrap justify-between items-center gap-2">
                <div>
                  <span class="px-2 py-0.5 rounded bg-[#FF6B00] text-white text-[10px] font-black mr-2">${esc(o.orderId)}</span>
                  <span class="text-xs font-bold text-slate-200">ลูกค้า: ${esc(o.customerName || '-')} (${esc(o.maskedPhone || '-')})</span>
                </div>
                <span class="px-2.5 py-0.5 rounded-full bg-white/15 text-[#FF6B00] text-[11px] font-extrabold">สถานะ: ${esc(st)}</span>
              </div>

              ${window.app.statusHistoryHtml(o.history, true)}
              <div class="p-4 grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                <div class="md:col-span-8 space-y-3">
                  <!-- 4-Step Visual Order Timeline -->
                  <div class="grid grid-cols-4 gap-1.5 pt-1">
                    ${steps.map((label, idx) => {
                      const done = (idx + 1) <= stepIdx;
                      return `
                        <div class="text-center">
                          <div class="h-1.5 rounded-full mb-1.5 ${done ? 'bg-emerald-500' : 'bg-slate-200'}"></div>
                          <div class="text-[10px] font-extrabold ${done ? 'text-emerald-700' : 'text-slate-400'}">${done ? '<i class="fas fa-check-circle mr-0.5"></i>' : ''}${esc(label)}</div>
                        </div>
                      `;
                    }).join('')}
                  </div>

                  <div class="bg-slate-50 rounded-xl p-3 border border-slate-100 space-y-1 text-xs">
                    <div class="text-[11px] text-slate-500 font-bold">สาขารับเครื่อง: <strong class="text-slate-800">${esc(o.branch)} (${esc(o.channel)})</strong> • วันที่จอง: ${esc(o.timestamp)}</div>
                    <div class="pt-1 font-bold text-slate-800">
                      ${o.items.map(it => `<div>📱 ${esc(it.name)} x${it.qty} <span class="text-[#E11D48]">(฿${it.net.toLocaleString()})</span></div>`).join('')}
                    </div>
                    ${o.gifts.length > 0 ? `<div class="text-[11px] text-emerald-700 font-semibold">🎁 ของแถม: ${o.gifts.map(g => esc(g.name) + (g.qty > 1 ? ' x' + g.qty : '')).join(', ')}</div>` : ''}
                    <div class="pt-1.5 border-t border-slate-200 flex justify-between items-center">
                      <span class="text-[11px] font-bold text-slate-500">เงินมัดจำแล้ว: <strong class="text-emerald-600">฿${(o.deposit || 0).toLocaleString()}</strong></span>
                      <span class="text-sm font-black text-[#E11D48]">ยอดสุทธิ: ฿${(o.netTotal || 0).toLocaleString()}</span>
                    </div>
                  </div>
                </div>

                <!-- Digital Booking Pass QR Code -->
                <div class="md:col-span-4 flex flex-col items-center justify-center bg-amber-50/60 border border-amber-200 rounded-2xl p-3 text-center">
                  <div class="text-[10px] font-black text-slate-800 uppercase tracking-wider mb-1"><i class="fas fa-ticket-alt text-[#E11D48] mr-1"></i>QR รับเครื่องที่สาขา</div>
                  <img src="${qrUrl}" alt="QR Code" class="w-28 h-28 rounded-xl border border-slate-200 bg-white p-1 shadow-2xs">
                  <div class="text-[10px] font-mono font-bold text-slate-600 mt-1">${esc(o.orderId)}</div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        resWrap.innerHTML = `<div class="p-6 text-center text-rose-600 text-xs font-bold">${window.app.esc(e.message || 'เกิดข้อผิดพลาด')}</div>`;
      }
    },



    // =========================================================================
    // 5. ระบบบันทึกรุ่นที่สนใจ (Wishlist / Favorites)
    // =========================================================================
    initWishlist: function() {
      try {
        const w = localStorage.getItem('mpos_wishlist');
        this.wishlist = w ? (JSON.parse(w) || []) : [];
      } catch (e) {
        this.wishlist = [];
      }
      this.updateWishlistBadges();
    },

    toggleWishlist: function(sku, event) {
      if (event) {
        event.stopPropagation();
        event.preventDefault();
      }
      if (!sku) return;
      const idx = this.wishlist.indexOf(sku);
      let isAdded = false;
      if (idx > -1) {
        this.wishlist.splice(idx, 1);
        isAdded = false;
        window.app.toast('นำออกจากรายการโปรดแล้ว');
      } else {
        this.wishlist.push(sku);
        isAdded = true;
        window.app.toast('❤️ บันทึกเข้ารายการโปรดแล้ว');
      }
      try {
        localStorage.setItem('mpos_wishlist', JSON.stringify(this.wishlist));
      } catch (e) {}

      this.updateWishlistBadges();

      const skuClean = sku.replace(/[^a-zA-Z0-9_-]/g, '');
      const btns = document.querySelectorAll('.btn-wishlist-' + skuClean);
      btns.forEach(btn => {
        if (isAdded) {
          btn.className = btn.className.replace('text-slate-400 hover:text-rose-500', 'text-rose-500 border-rose-300 bg-rose-50/80');
          btn.innerHTML = '<i class="fas fa-heart text-rose-500 animate-pulse"></i>';
          btn.title = 'ลบออกจากรายการโปรด';
        } else {
          btn.className = btn.className.replace('text-rose-500 border-rose-300 bg-rose-50/80', 'text-slate-400 hover:text-rose-500');
          btn.innerHTML = '<i class="far fa-heart"></i>';
          btn.title = 'บันทึกเป็นรายการโปรด';
        }
      });

      const drawer = document.getElementById('wishlistDrawer');
      if (drawer && !drawer.classList.contains('translate-x-full')) {
        this.renderWishlistDrawer();
      }
    },

    updateWishlistBadges: function() {
      const count = (this.wishlist || []).length;
      const b1 = document.getElementById('posWishlistCountBadge');
      const b2 = document.getElementById('wishlistDrawerCount');
      if (b1) b1.textContent = count;
      if (b2) b2.textContent = count;
    },

    toggleWishlistDrawer: function() {
      const drawer = document.getElementById('wishlistDrawer');
      const overlay = document.getElementById('wishlistOverlay');
      if (!drawer || !overlay) return;
      const isOpen = !drawer.classList.contains('translate-x-full');
      if (isOpen) {
        drawer.classList.add('translate-x-full');
        overlay.classList.add('opacity-0');
        setTimeout(() => overlay.classList.add('hidden'), 300);
      } else {
        this.renderWishlistDrawer();
        overlay.classList.remove('hidden');
        setTimeout(() => {
          overlay.classList.remove('opacity-0');
          drawer.classList.remove('translate-x-full');
        }, 10);
      }
    },

    openWishlistDrawer: function() {
      this.toggleWishlistDrawer();
    },

      const listContainer = document.getElementById('wishlistDrawerItems');
      if (!listContainer) return;
      this.updateWishlistBadges();

      const skus = this.wishlist || [];

        const origPrice = parseFloat(String(p['Original Price'] || '0').replace(/[^\d.\-]/g, '')) || 0;
        const img = p['Image URL'] || window.app.NO_IMG;

        return `
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs flex gap-3 items-center group transition-all hover:border-slate-300">
             <img src="${esc(img)}" alt="${esc(p['Product Name'])}" onerror="this.src=window.app.NO_IMG" class="w-16 h-16 object-contain rounded-xl border border-slate-100 p-1 shrink-0 ${outOfStock ? 'grayscale opacity-50' : ''}">
             <div class="flex-1 min-w-0">
                <div class="text-xs font-black text-slate-900 line-clamp-1">${esc(p['Product Name'])}</div>
                <div class="text-[10px] text-slate-400 font-bold mt-0.5 flex items-center gap-2">
                   <span>${esc(p.Capacity || '-')}</span> • <span>${esc(p.Color || '-')}</span>
                </div>
                <div class="flex items-baseline gap-1.5 mt-1">
                   <span class="text-xs font-black text-[#E11D48] tabular-nums">฿${price.toLocaleString()}</span>
                   ${origPrice > price ? `<span class="text-[10px] text-slate-400 line-through tabular-nums">฿${origPrice.toLocaleString()}</span>` : ''}
                </div>
                <div class="text-[9px] font-bold mt-0.5 ${outOfStock ? 'text-rose-500' : 'text-emerald-600'}">
                   ${outOfStock ? '<i class="fas fa-times-circle mr-0.5"></i>สินค้าหมด' : '<i class="fas fa-check-circle mr-0.5"></i>พร้อมจอง (' + stock + ')'}
                </div>
             </div>
             <div class="flex flex-col gap-1 shrink-0">
                ${!outOfStock ? `
                  <button type="button" onclick="window.app.pos.openAddToCartModal('${escJs(p.SKU)}')" class="px-2.5 py-1.5 bg-[#FF6B00] hover:bg-[#E05300] text-white rounded-xl text-[10px] font-black shadow-2xs flex items-center gap-1 transition-all" title="ใส่ตะกร้า">
                     <i class="fas fa-cart-plus text-[#E11D48]"></i><span>จอง</span>
                  </button>
                ` : ''}
                <button type="button" onclick="window.app.pos.toggleWishlist('${escJs(p.SKU)}')" class="px-2 py-1 text-slate-400 hover:text-rose-600 rounded-lg text-[10px] font-bold transition-colors" title="ลบออกจากรายการโปรด">
                   <i class="fas fa-trash-alt mr-0.5"></i>ลบ
                </button>
             </div>
          </div>
        `;
      }).join('');
    },

    addAllWishlistToCart: function() {
      const skus = this.wishlist || [];
      if (skus.length === 0) return Swal.fire('ไม่มีสินค้า', 'ยังไม่มีรายการสินค้าในรายการโปรด', 'info');

      const prods = (window.app.globalData.products || []).filter(p => skus.includes(p.SKU));
      const inStockProds = prods.filter(p => {
        const stock = parseInt(String(p.Stock || '0').replace(/[^\d.\-]/g, ''), 10) || 0;
        return stock > 0;
      });

      if (inStockProds.length === 0) {
        return Swal.fire('สินค้าหมด', 'รายการสินค้าในรายการโปรดไม่มีสต๊อกพร้อมจอง ณ ขณะนี้', 'warning');
      }

      const currentMobileQty = this.cartData.filter(i => i.Category === 'โมบาย').reduce((sum, i) => sum + i.qty, 0);
      let addedCount = 0;
      let mobileAdded = currentMobileQty >= 1;

      inStockProds.forEach(p => {
        if (p.Category === 'โมบาย') {
          if (mobileAdded) return;
          mobileAdded = true;
        }
        const ex = this.cartData.find(i => i.SKU === p.SKU);
        if (ex) {
          if (p.Category !== 'โมบาย') {
            ex.qty += 1;
            addedCount++;
          }
        } else {
          this.cartData.push({ ...p, qty: 1, brandGifts: [], channelGifts: [] });
          addedCount++;
        }
      });

      if (addedCount > 0) {
        this.saveAndRender();
        this.toggleWishlistDrawer();
        this.toggleCart();
        window.app.toast('เพิ่มสินค้า ' + addedCount + ' รายการลงตะกร้าแล้ว', 'success');
      } else {
        Swal.fire('ข้อจำกัดการจอง', 'ไม่สามารถเพิ่มสินค้าประเภทโมบายเกิน 1 เครื่องต่อออเดอร์ได้', 'warning');
      }
    },

    clearWishlist: function() {
      if ((this.wishlist || []).length === 0) return;
      this.wishlist = [];
      try { localStorage.setItem('mpos_wishlist', '[]'); } catch (e) {}
      this.updateWishlistBadges();
      this.renderWishlistDrawer();
      window.app.toast('ล้างรายการโปรดทั้งหมดแล้ว');
    }
  };
</script>

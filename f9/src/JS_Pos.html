    // ---- ซิงก์ตัวกรองกับ URL (แอปรันใน iframe ของ GAS: ใช้ google.script.url/history ถ้ามี เพื่อให้ลิงก์ชั้นนอกแชร์ได้ + ปุ่มย้อนกลับใช้ได้) ----
    paramsFromState: function() {
      const f = this.storeFilters, p = {};
      if (f.category) p.cat = [f.category];
      if (f.brand) p.brand = [f.brand];
      if (f.groups.length) p.grp = f.groups.slice();
      if (f.capacities.length) p.cap = f.capacities.slice();
      if (f.colors.length) p.col = f.colors.slice();
      if (f.priceRange) p.pr = [f.priceRange];
      if (f.priceMin !== '') p.pmin = [String(f.priceMin)];
      if (f.priceMax !== '') p.pmax = [String(f.priceMax)];
      if (f.sort) p.sort = [f.sort];
      if (f.inStock) p.stock = ['1'];
      const s = document.getElementById('searchProduct');
      if (s && s.value.trim()) p.q = [s.value.trim()];
      if (this.storePage > 1) p.page = [String(this.storePage)];
      if (this.sharedModel) p.p = [this.sharedModel];
      return p;
    },
    syncUrl: function() {
      if (this._applyingUrl) return;
      const p = this.paramsFromState();
      const key = JSON.stringify(p);
      if (key === (this._lastUrlKey || '{}')) return;
      this._lastUrlKey = key;
      try { if (window.google && google.script && google.script.history && google.script.history.push) google.script.history.push(null, p, 'pos'); } catch (e) { /* นอก GAS/เบราว์เซอร์ไม่รองรับ — ข้ามเงียบๆ */ }
    },
    applyUrlParams: function(params, force) {
      params = params || {};
      const g = (k) => (Array.isArray(params[k]) ? params[k] : (params[k] !== undefined ? [String(params[k])] : [])).map(String);
      const known = ['cat', 'brand', 'grp', 'cap', 'col', 'pr', 'pmin', 'pmax', 'sort', 'stock', 'q', 'page', 'p'];
      if (!force && !known.some(k => g(k).length)) return; // ไม่มีพารามิเตอร์ของเรา = คงตัวกรองในหน่วยความจำไว้
      const f = this.emptyStoreFilters();
      f.category = g('cat')[0] || '';
      f.brand = (g('brand')[0] || '').slice(0, 40).toUpperCase();
      f.groups = g('grp'); f.capacities = g('cap'); f.colors = g('col');
      const pr = g('pr')[0] || ''; f.priceRange = ['lt10', '10-30', '30-50', 'gt50'].includes(pr) ? pr : '';
      const mn = parseFloat(g('pmin')[0]), mx = parseFloat(g('pmax')[0]);
      f.priceMin = (isNaN(mn) || mn < 0) ? '' : mn; f.priceMax = (isNaN(mx) || mx < 0) ? '' : mx;
      const so = g('sort')[0] || ''; f.sort = ['asc', 'desc'].includes(so) ? so : '';
      f.inStock = g('stock')[0] === '1';
      const page = parseInt(g('page')[0], 10) || 1;
      this._applyingUrl = true;
      try {
        this.storeFilters = f;
        const s = document.getElementById('searchProduct');
        if (s) s.value = (g('q')[0] || '').slice(0, 100);
        this.renderStoreHeader();
        this.filter();
        if (page > 1) this.goStorePage(page);
        // ลิงก์สินค้าที่แชร์ (?p=รุ่น): เปิดหน้าต่างรายละเอียดรุ่นนั้นทันที; กด Back ที่ไม่มี p = ปิดหน้าต่าง
        const pm = (g('p')[0] || '').slice(0, 120);
        if (pm) { if (this.sharedModel !== pm) this.openSharedModel(pm); }
        else if (force && this.sharedModel) window.app.hideModal('addToCartModal');
      } finally { this._applyingUrl = false; }
      this._lastUrlKey = JSON.stringify(this.paramsFromState());
    },
    // จำรุ่นที่เปิดอยู่ในหน้าต่างสินค้า แล้วซิงก์ลง URL (?p=) เพื่อให้คัดลอกลิงก์ตรงรุ่นได้
    setSharedModel: function(model) {
      model = model || '';
      if (this.sharedModel === model) return;
      this.sharedModel = model;
      this.syncUrl();
    },
    openSharedModel: function(model) {
      const ok = (window.app.globalData.products || []).some(p => p.Model === model && p.Status === 'เปิด');
      if (!ok) { window.app.toast('ไม่พบสินค้ารุ่นนี้ (อาจปิดการขายแล้ว)', 'warning'); return; }
      this.openAddToCartModal('MODEL:' + model);
    },
    productLink: function(model) {
      const base = window.__APP_URL || '';
      if (!base || !model) return '';
      return base + (base.indexOf('?') === -1 ? '?' : '&') + 'p=' + encodeURIComponent(model);
    },
    copyProductLink: function() {
      const url = this.productLink(this.sharedModel);
      if (!url) { window.app.toast('ยังสร้างลิงก์ไม่ได้ (ไม่พบ URL ของแอป)', 'warning'); return; }
      const done = () => window.app.toast('คัดลอกลิงก์สินค้าแล้ว', 'success');
      const fallback = () => {
        try {
          const ta = document.createElement('textarea'); ta.value = url; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select(); const okc = document.execCommand('copy'); document.body.removeChild(ta);
          if (okc) return done();
        } catch (e) {}
        Swal.fire({ title: 'คัดลอกลิงก์นี้', input: 'text', inputValue: url, confirmButtonText: 'ปิด' });
      };
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, fallback); else fallback(); } catch (e) { fallback(); }
    },
    loadUrlState: function() {
      const self = this;
      try {
        if (window.google && google.script && google.script.url && google.script.url.getLocation) {
          google.script.url.getLocation(function(loc) {
            let prm = (loc && loc.parameters) || {};
            // สำรอง: ถ้า getLocation ไม่คืน p แต่ server ส่งรุ่นมากับหน้า (ลิงก์แชร์) ให้ใช้ค่านั้นครั้งเดียว
            if (!prm.p && window.__DEEP_MODEL) { prm = Object.assign({}, prm, { p: [window.__DEEP_MODEL] }); }
            window.__DEEP_MODEL = '';
            self.applyUrlParams(prm, false);
          });
        } else {
          const sp = new URLSearchParams(window.location.search), o = {};
          sp.forEach((v, k) => { (o[k] = o[k] || []).push(v); });
          this.applyUrlParams(o, false);
        }
        if (!this._histBound && window.google && google.script && google.script.history && google.script.history.setChangeHandler) {
          this._histBound = true;
          google.script.history.setChangeHandler(function(e) {
            if (window.app.currentRoute === 'pos') self.applyUrlParams((e && e.location && e.location.parameters) || {}, true);
          });
        }
      } catch (e) { console.warn('loadUrlState:', e); }
    },
    toggleFilterPopover: function(name) {
      const wasOpen = this.openPopover === name;
      this.closeFilterPopovers();
      if (!wasOpen) {
        const el = document.getElementById('storePop_' + name);
        if (el) { el.classList.remove('hidden'); this.openPopover = name; }
      }
    },
    closeFilterPopovers: function() {
      document.querySelectorAll('.store-pop').forEach(el => el.classList.add('hidden'));
      this.openPopover = null;
    },
    renderProducts: function(products) {
      const row = document.getElementById('productGrid');
      if(!row) return;
      this.lastList = products; // ต้องเก็บก่อน early-return ของ empty state — ไม่งั้นเปลี่ยนหน้า/ซิงก์ URL หลังผลว่างจะใช้ลิสต์เก่า

      const searchEl = document.getElementById('searchProduct');
      const resultCountEl = document.getElementById('storeResultCount');
      // ค้นหา/กรอง (6B) แล้วไม่เจอสินค้า — empty state มาตรฐาน (5A.4) พร้อมปุ่มล้างตัวกรอง+คำค้น
      // กรณีไม่มีทั้งคำค้นและตัวกรอง (กำลังโหลด) คงแสดง skeleton เดิม
      const hasQuery = searchEl && searchEl.value.trim() !== '';
      if(products.length === 0 && (hasQuery || this.storeFiltersActive())) {
        if (resultCountEl) resultCountEl.textContent = '0 รายการ';
        this.syncSheetCount();
        row.innerHTML = window.app.emptyState({
          icon: 'fa-search',
          title: 'ไม่พบสินค้า Pre Booking ตามเงื่อนไข',
          subtitle: 'ลองเปลี่ยนคำค้นหา หรือกดล้างตัวกรองเพื่อดูโปรโมชั่นสินค้าทั้งหมดของสาขานี้',
          actionLabel: 'ล้างตัวกรองทั้งหมด',
          onclick: "window.app.pos.clearStoreFilters(true)"
        });
        return;
      }
      // ข้อมูลโหลดเสร็จแล้วแต่ไม่มีสินค้าให้ช่องทาง/สาขานี้ — ต้องบอกผู้ใช้ ไม่ใช่โชว์โครงโหลดค้างตลอดไป
      if (products.length === 0 && (window.app.globalData.products || []).length > 0) {
        if (resultCountEl) resultCountEl.textContent = '0 รายการ';
        this.syncSheetCount();
        row.innerHTML = window.app.emptyState({
          icon: 'fa-box-open',
          title: 'ยังไม่มีสินค้าสำหรับช่องทางนี้',
          subtitle: 'สินค้าที่เปิดขายอยู่ไม่ได้ตั้งไว้สำหรับช่องทางที่เลือก ลองเปลี่ยนช่องทาง หรือแจ้งผู้ดูแลให้ตั้งค่าช่องทางของสินค้า'
        });
        return;
      }
      if(products.length === 0 && searchEl && searchEl.value === '') {
         let skel = '<div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-3 md:gap-4 pb-4">';
         for(let k=0; k<10; k++) { skel += '<div class="pm-skel" aria-hidden="true"><div class="skeleton mb-3" style="aspect-ratio:1/1; width:100%; border-radius:12px;"></div><div class="skeleton mb-2" style="height:10px; width:30%;"></div><div class="skeleton mb-3" style="height:14px; width:80%;"></div><div class="skeleton mb-2" style="height:18px; width:45%;"></div><div class="skeleton" style="height:10px; width:65%;"></div></div>'; }
         skel += '</div>'; row.innerHTML = skel; return;
      }

      // Group products
      const grouped = {};
      const renderedList = [];
      this.cardGroups = {}; // 6A — สร้างใหม่ทุกรอบ render ให้ตรงกับผล filter ปัจจุบัน
      products.forEach(p => {
        if(p.Status !== 'เปิด') return;
        const isGift = (p.Category||'').includes('ของแถม');

        if (!isGift && p.Model && p.Model !== '-' && p.Model !== '') {
            if (!grouped[p.Model]) {
                grouped[p.Model] = {
                    isGroup: true,
                    Model: p.Model,
                    'Product Name': p.Model,
                    Category: p.Category,
                    Price: p.Price,
                    'Image URL': p['Image URL'],
                    Stock: 0,
                    products: []
                };
                renderedList.push(grouped[p.Model]);
                this.cardGroups[p.Model] = grouped[p.Model];
            }
            grouped[p.Model].products.push(p);
            // Stock มาจาก getDisplayValues — อาจมี comma (เช่น "1,200") ต้องถอดก่อน parse
            grouped[p.Model].Stock += (parseInt(String(p.Stock || '0').replace(/[^\d.\-]/g, ''), 10) || 0);

            let currMin = parseFloat((grouped[p.Model].Price||'0').toString().replace(/[^\d.\-]/g,'')) || 0;
            let pPrice = parseFloat((p.Price||'0').toString().replace(/[^\d.\-]/g,'')) || 0;
            if (pPrice < currMin || currMin === 0) grouped[p.Model].Price = p.Price;
        } else {
            renderedList.push(p);
        }
      });

      // คำค้นปัจจุบัน — ใช้ highlight ชื่อสินค้าบนการ์ด (5B.1)
      const searchTerm = searchEl ? searchEl.value.trim() : '';

      // 6B — "ผลลัพธ์ n รายการ" นับตามการ์ดที่แสดงจริง (รุ่นเดียวกันหลาย SKU นับเป็น 1 การ์ด)
      if (resultCountEl) resultCountEl.textContent = '(' + renderedList.length + ' รายการ)';
      this.syncSheetCount();

      // 6A — POS storefront: สไตล์ scoped ด้วย .pos-storefront เท่านั้น ห้ามรั่วไปหน้าอื่น
      // ถ้าสร้างการ์ดใบใดล้มกลางทาง ห้ามทิ้งกริดว่างเงียบๆ (เคยเจอบน iOS) — โชว์ error state มาตรฐาน + ลองใหม่ (rule 12)
      try {
        this.lastList = products;
        const size = this.storePageSize;
        const totalPages = Math.max(1, Math.ceil(renderedList.length / size));
        if (this.storePage > totalPages) this.storePage = totalPages;
        if (this.storePage < 1) this.storePage = 1;
        const pageItems = renderedList.slice((this.storePage - 1) * size, this.storePage * size);
        let html = '<div class="pos-storefront grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-3 md:gap-4 pb-4">';
        pageItems.forEach(p => { html += this.cardHtml(p, searchTerm); });
        html += '</div>' + this.paginationHtml(totalPages);
        row.innerHTML = html;
      } catch (e) {
        console.error('renderProducts ล้มเหลว:', e);
        row.innerHTML = window.app.emptyState({
          icon: 'fa-triangle-exclamation',
          title: 'แสดงรายการสินค้าไม่สำเร็จ',
          subtitle: (e && e.message) ? e.message : String(e),
          actionLabel: 'ลองใหม่',
          onclick: 'window.app.pos.filter()'
        });
      }
    },
    // เลขหน้าสไตล์ BNN: ‹ 1 2 … n ›
    paginationHtml: function(total) {
      if (total <= 1) return '';
      const cur = this.storePage;
      const pages = [];
      for (let i = 1; i <= total; i++) {
        if (i === 1 || i === total || Math.abs(i - cur) <= 1) pages.push(i);
        else if (pages[pages.length - 1] !== '…') pages.push('…');
      }
      let h = '<nav class="sf-pager pos-storefront" aria-label="เลขหน้า">';
      h += '<button type="button" class="sf-pg" ' + (cur <= 1 ? 'disabled' : 'onclick="window.app.pos.goStorePage(' + (cur - 1) + ')"') + ' aria-label="หน้าก่อนหน้า"><i class="fas fa-chevron-left"></i></button>';
      pages.forEach(p => {
        if (p === '…') h += '<span class="sf-pg-gap">…</span>';
        else h += '<button type="button" class="sf-pg' + (p === cur ? ' on' : '') + '" onclick="window.app.pos.goStorePage(' + p + ')"' + (p === cur ? ' aria-current="page"' : '') + '>' + p + '</button>';
      });
      h += '<button type="button" class="sf-pg" ' + (cur >= total ? 'disabled' : 'onclick="window.app.pos.goStorePage(' + (cur + 1) + ')"') + ' aria-label="หน้าถัดไป"><i class="fas fa-chevron-right"></i></button>';
      return h + '</nav>';
    },
    // 6A — แปลงชื่อสีจากชีตเป็น hex สำหรับจุดสีบนการ์ด (เทียบแบบ includes, ไม่รู้จัก = เทา + title บอกชื่อ)
    colorHex: function(name) {
      const n = String(name || '').toLowerCase();
      const table = [
        ['titanium black', '#3a3a3c'], ['jet black', '#0f0f0f'], ['phantom black', '#1a1a1c'],
        ['black', '#000000'], ['graphite', '#41424c'],
        ['titanium gray', '#8a8d8f'], ['titanium grey', '#8a8d8f'], ['gray', '#8e8e93'], ['grey', '#8e8e93'],
        ['silver', '#d8d8d8'], ['titanium', '#c2bcb2'], ['natural', '#c2bcb2'],
        ['white', '#ffffff'], ['clear', '#f1f5f9'], ['cream', '#f2e6d0'], ['beige', '#e8dcc8'],
        ['navy', '#1e3a5f'], ['blue', '#3b5bdb'], ['sky', '#7dd3fc'], ['cyan', '#22d3ee'],
        ['red', '#dc2626'], ['green', '#15803d'], ['mint', '#a7f3d0'], ['lime', '#a3e635'],
        ['yellow', '#facc15'], ['gold', '#e3c8a0'], ['purple', '#7c3aed'], ['violet', '#8b5cf6'], ['lavender', '#c4b5fd'],
        ['pink', '#f472b6'], ['orange', '#ea580c'], ['brown', '#8b5e3c'], ['bronze', '#b08d57'], ['coral', '#fb7185']
      ];
      for (let i = 0; i < table.length; i++) { if (n.includes(table[i][0])) return table[i][1]; }
      return '#cbd5e1';
    },
    // 6A — HTML การ์ดสินค้า 1 ใบ สไตล์ BNN Flash Sale (ใช้ทั้ง render ทั้งกริดและ re-render การ์ดเดียวตอนสลับ variant)
    cardHtml: function(p, searchTerm) {
      const esc = window.app.esc, escJs = window.app.escAttrJs;
      const stockOf = (v) => parseInt(String(v.Stock || '0').replace(/[^\d.\-]/g, ''), 10) || 0; // Stock จาก getDisplayValues อาจมี comma/format
      const isGift = (p.Category || '').includes('ของแถม');
      const currentChannelForBadge = (document.getElementById('posChannelSelect') || {}).value || '';

      let variant = p, dotsHtml = '', chipsHtml = '';
      if (p.isGroup) {
        const vars = p.products;
        // default = variant แรกที่มีสต๊อก (หมดทุกตัวเอาตัวแรก); state คงอยู่ข้าม re-render
        let st = this.cardState[p.Model];
        if (!st) {
          const first = vars.find(v => stockOf(v) > 0) || vars[0];
          st = this.cardState[p.Model] = { cap: first.Capacity, color: first.Color };
        }
        // resolve: combo ตรง → สีเดิมความจุใดก็ได้ → ตัวแรก (กัน state ค้างจาก filter รอบก่อน)
        variant = vars.find(v => v.Color === st.color && v.Capacity === st.cap)
               || vars.find(v => v.Color === st.color)
               || vars[0];
        st.cap = variant.Capacity; st.color = variant.Color;

        const colors = [...new Set(vars.map(v => v.Color).filter(c => c && c !== '-'))];
        const caps = [...new Set(vars.map(v => v.Capacity).filter(c => c && c !== '-'))];

        // จุดสี: สูงสุด 4 จุด + "+n" (กดแล้วเปิด modal เดิมซึ่งมีตัวเลือกครบ — fallback จอแคบตามสเปก)
        const maxDots = 4;
        const shown = colors.length > maxDots + 1 ? colors.slice(0, maxDots) : colors;
        shown.forEach(col => {
          const colStock = vars.filter(v => v.Color === col).reduce((s, v) => s + stockOf(v), 0);
          const sel = col === st.color;
          // tooltip บอกจำนวนคงเหลือของสีนั้น (ความจุที่เลือกอยู่ ถ้าไม่มีความจุนั้นใช้ยอดรวมทุกความจุ)
          const comboV = vars.find(v => v.Color === col && v.Capacity === st.cap);
          const colTip = col + ' · ' + ((comboV ? stockOf(comboV) : colStock) > 0 ? 'เหลือ ' + (comboV ? stockOf(comboV) : colStock) + ' ชิ้น' : 'หมด');
          dotsHtml += '<button type="button" class="color-dot' + (colStock <= 0 ? ' oos' : '') + (sel ? ' ring-2 ring-[#141416] ring-offset-1 scale-110' : '')
            + ' w-[18px] h-[18px] rounded-full border border-slate-300 shrink-0 transition-all" style="background:' + esc(this.colorHex(col))
            + '" title="' + esc(colTip) + '" aria-label="สี ' + esc(colTip) + '" onclick="window.app.pos.selectCardVariant(\'' + escJs(p.Model) + '\',\'\',\'' + escJs(col) + '\')"></button>';
        });
        if (colors.length > maxDots + 1) {
          dotsHtml += '<button type="button" class="text-[10px] font-black text-slate-500 hover:text-slate-900 bg-slate-100 px-1.5 py-0.5 rounded-md shrink-0" aria-label="ดูสีทั้งหมด" onclick="window.app.pos.openAddToCartModal(\'MODEL:' + escJs(p.Model) + '\')">+' + (colors.length - maxDots) + '</button>';
        }

        // chip ความจุ: โชว์ทุกความจุของรุ่น — ตัวที่ไม่มีในสีที่เลือกจางลง (กดได้ ระบบสลับสีให้)
        caps.forEach(cap => {
          const existsInColor = vars.some(v => v.Color === st.color && v.Capacity === cap);
          const sel = cap === st.cap;
          chipsHtml += '<button type="button" class="pm-chip'
            + (sel ? ' on' : '')
            + (existsInColor ? '' : ' opacity-40')
            + '" onclick="window.app.pos.selectCardVariant(\'' + escJs(p.Model) + '\',\'' + escJs(cap) + '\',\'\')">' + esc(cap) + '</button>';
        });
      }

      const pName = esc(variant['Product Name']); // สำหรับ attribute (title/alt) — ห้ามมี <mark>
      const dispName = p.isGroup ? p.Model : p['Product Name'];
      const dispNameHtml = window.app.highlightEsc(dispName, searchTerm || '');
      const catLabel = esc((variant.Category || 'สินค้า').toString().trim());
      // แบรนด์: คำแรกของชื่อรุ่นถ้าเป็นตัวอักษรละติน (เช่น Samsung) ไม่งั้นใช้หมวด
      const firstWord = String(dispName || '').trim().split(/\s+/)[0] || '';
      const brandKey = this.brandOf(variant);
      const brandLabel = brandKey ? esc(this.brandLabel_(brandKey).toUpperCase()) : (/^[A-Za-z]{2,}$/.test(firstWord) ? esc(firstWord.toUpperCase()) : catLabel.toUpperCase());
      // parse ทนต่อเซลล์ format สกุลเงิน (เช่น "฿49,900.00") — เก็บเฉพาะตัวเลข/จุด/ลบ
      const priceNum = parseFloat(String(variant.Price || '0').replace(/[^\d.\-]/g, '')) || 0;
      const price = priceNum.toLocaleString();
      // 6C.1 — Original Price เป็นป้าย display-only ต่อ variant (ราคาคิดเงินจริงคือ Price เสมอ)
      const origNum = parseFloat(String(variant['Original Price'] || '0').replace(/[^\d.\-]/g, '')) || 0;
      const hasSave = origNum > priceNum;
      const savePct = hasSave ? Math.floor(((origNum - priceNum) / origNum) * 100) : 0;
      const stockNum = stockOf(variant);
      const outOfStock = stockNum <= 0;
      const imgUrl = window.app.formatImageUrl(variant['Image URL']);
      const cardKey = p.isGroup ? p.Model : ('SKU:' + p.SKU);

      // ป้ายมุมซ้ายบนสไตล์ BNN Flash Sale: ลด n% (สีแดง-ส้ม) หรือ ป้าย FLASH DEAL (สีเหลือง-ดำ) หรือ ป้ายสินค้าแถม
      let topLeftBadge = '';
      if (isGift) {
        topLeftBadge = '<div class="absolute top-2.5 left-2.5 z-10 px-2 py-0.5 bg-slate-800 text-white text-[10px] font-bold rounded-md shadow-sm pointer-events-none"><i class="fas fa-gift text-amber-400 mr-1"></i>ของแถม</div>';
      } else if (hasSave && savePct > 0) {
        topLeftBadge = '<div class="bnn-discount-badge absolute top-2.5 left-2.5 z-10 px-2 py-0.5 rounded-md text-[10px] font-black tracking-tight flex items-center gap-1 pointer-events-none">-' + savePct + '%</div>';
      }

      // ป้ายหมวดหมู่มุมขวาบน
      const topRightBadge = '';
      // ป้าย NEW (Launch Date <= 30 วัน) / ขายดี (4 อันดับแรกของยอดจอง) มุมซ้ายล่างของรูป — ไม่ติดบนของแถมและสินค้าหมด
      let flagsHtml = '';
      if (!isGift && !outOfStock) {
        if (this.isNew(variant)) flagsHtml += '<span class="pm-flag pm-flag-new">NEW</span>';
        if (this.isHot(variant)) flagsHtml += '<span class="pm-flag pm-flag-hot"><i class="fas fa-fire"></i>ขายดี</span>';
      }
      if (flagsHtml) flagsHtml = '<div class="pm-flags">' + flagsHtml + '</div>';

      // Watermark ทับกลางภาพเมื่อสินค้าหมด (BNN Sold Out Overlay)
      const soldOutOverlay = outOfStock
        ? '<div class="absolute inset-0 bg-white/60 backdrop-blur-[1px] z-10 flex items-center justify-center pointer-events-none">'
          + '<div class="pm-soldout">สินค้าหมด</div>'
          + '</div>'
        : '';

      // 6C.2 — ป้ายโปร bundle จาก AutoPromotions (Active + Get Discount Category ตรงหมวดสินค้า)
      let bundleBadge = '';
      {
        let bRules = (window.app.globalData.autoPromotions || []);
        if (bRules.length === 0) bRules = [{ 'Buy Category': 'โมบาย', 'Get Discount Category': 'อุปกรณ์เสริม', 'Discount Percent': 10, 'Status': 'เปิด' }];
        const myCat = (variant.Category || '').toString().trim();
        let best = null;
        bRules.forEach(r => {
          if (!window.app.statusOn(r.Status)) return;
          if ((r['Get Discount Category'] || '').toString().trim() !== myCat) return;
          const badgeChRaw = (r['Channel'] || '').toString().trim();
          const badgeChTokens = badgeChRaw.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
          const badgeChMatches = badgeChRaw === '' || badgeChRaw === '*' || badgeChRaw.toLowerCase() === 'all' || badgeChTokens.includes(currentChannelForBadge.toString().trim().toLowerCase());
          if (!badgeChMatches) return;
          const pct = parseFloat(r['Discount Percent']) || 0;
          if (pct > 0 && (!best || pct > best.pct)) best = { pct: pct, buyCat: (r['Buy Category'] || '').toString().trim() };
        });
        if (best) bundleBadge = 'ลด ' + esc(best.pct) + '% เมื่อซื้อคู่ ' + esc(best.buyCat);
      }

      // Phase 2 Smart E-Commerce Badges: ผ่อน 0% + แถมฟรี X รายการ + ปุ่มเทียบสเปค
      let installmentBadge = '';
      if (!isGift && priceNum >= 3000) {
        installmentBadge = 'ผ่อน 0% ฿' + Math.ceil(priceNum / 10).toLocaleString() + '/ด.';
      }
      let giftCountBadge = '';
      if (!isGift) {
        const giftInfo = this.countEligibleGifts(variant, currentChannelForBadge);
        if (giftInfo.total > 0) {
          giftCountBadge = 'แถมฟรี ' + giftInfo.total + ' รายการ';
        }
      }
      const isCompared = (this.compareList || []).includes(cardKey);
      const compareBtnHtml = !isGift
        ? '<button type="button" class="bnn-compare-btn' + (isCompared ? ' active' : '') + ' absolute bottom-2 right-2 z-20 px-2 py-0.5 rounded-lg bg-white/95 border border-slate-200 text-[9px] font-extrabold text-slate-600 shadow-sm flex items-center gap-1 transition-all hover:border-slate-400" onclick="window.app.pos.toggleCompare(\'' + escJs(cardKey) + '\', event)" title="เปรียบเทียบสเปค"><i class="fas ' + (isCompared ? 'fa-check text-[#FF6B00]' : 'fa-scale-balanced text-slate-400') + '"></i><span>' + (isCompared ? 'เทียบอยู่' : 'เทียบสเปค') + '</span></button>'
        : '';
      const isFavorited = (this.wishlist || []).includes(variant.SKU);
      const skuClean = (variant.SKU || '').replace(/[^a-zA-Z0-9_-]/g, '');
      const wishlistBtnHtml = !isGift
        ? '<button type="button" class="pm-wish btn-wishlist-' + skuClean + ' absolute bottom-2 left-2 z-20 w-7 h-7 rounded-lg bg-white/95 border border-slate-200 text-xs shadow-sm flex items-center justify-center transition-all hover:scale-110 ' + (isFavorited ? 'text-rose-500 border-rose-300 bg-rose-50/80' : 'text-slate-400 hover:text-rose-500') + '" onclick="window.app.pos.toggleWishlist(\'' + escJs(variant.SKU) + '\', event)" title="' + (isFavorited ? 'ลบออกจากรายการโปรด' : 'บันทึกเป็นรายการโปรด') + '"><i class="' + (isFavorited ? 'fas fa-heart text-rose-500 animate-pulse' : 'far fa-heart') + '"></i></button>'
        : '';

      // หลอดไฟแสดงสถานะสต๊อก (BNN Flash Sale Stock Progress Bar)
      let stockBarHtml = '';
      if (!isGift) {
        if (outOfStock) stockBarHtml = '<div class="sf-stock out">สินค้าหมด</div>';
        else {
          // แสดงจำนวนคงเหลือของตัวเลือกที่เลือกอยู่ (สี/ความจุ) เสมอ — กดจุดสีแล้วเห็นของสีนั้นทันที ไม่ใช่เห็นเฉพาะเมื่อเหลือน้อย
          const colorLbl = (p.isGroup && variant.Color && variant.Color !== '-') ? 'สี' + variant.Color + ' · ' : '';
          // หลอดสเกลความขาดแคลน: เต็มเมื่อเหลือ >= 30 ชิ้น (ชีตไม่มีสต๊อกเริ่มต้น จึงคิด % ที่ขายไปแล้วไม่ได้) ขั้นต่ำ 8% ให้เห็นหลอดเสมอ
          const stockPct = Math.max(8, Math.min(100, Math.round(stockNum / 30 * 100)));
          const stockMeter = '<span class="sf-stock-bar" aria-hidden="true"><span style="width:' + stockPct + '%"></span></span>';
          if (stockNum <= 5) stockBarHtml = '<div class="sf-stock low"><i class="pm-dot"></i>' + esc(colorLbl) + 'เหลือ ' + stockNum + ' ชิ้น' + stockMeter + '</div>';
          else stockBarHtml = '<div class="sf-stock ok"><i class="pm-dot"></i>' + esc(colorLbl) + 'เหลือ ' + stockNum + ' ชิ้น' + stockMeter + '</div>';
        }
      }

      // ปุ่มจองสไตล์ BNN Flash Sale: เปิด addToCartModal ด้วย SKU ของ variant ที่เลือก
      let bookBtn = '';
      if (!isGift) {
        if (outOfStock) {
          bookBtn = '<button type="button" disabled class="pm-cta-off w-full">สินค้าหมด</button>';
        } else {
          bookBtn = '<button type="button" class="bnn-buy-btn pm-view w-full flex items-center justify-center gap-1.5" onclick="window.app.pos.openAddToCartModal(\'' + escJs(variant.SKU) + '\')" aria-label="ดูรายละเอียด ' + pName + '">ดูรายละเอียด</button>';
        }
      }

      // ทั้งการ์ดกดได้ (openCardDetail ข้ามคลิกที่มาจากปุ่มบนการ์ด เช่น หัวใจ/เทียบสเปค/จุดสี/ความจุ) — รูปและชื่อจึงไม่มี onclick ของตัวเอง ไม่งั้นจะเปิดซ้ำสองครั้ง
      const openable = !isGift && !outOfStock;
      let card = '<div class="pos-card pm-card group relative flex flex-col h-full' + (isGift ? ' opacity-80' : '') + (openable ? ' pm-open' : '') + '" data-card-key="' + esc(cardKey) + '"' + (openable ? ' onclick="window.app.pos.openCardDetail(event,\'' + escJs(variant.SKU) + '\')"' : '') + '>';
      card +=      topLeftBadge;
      card +=      topRightBadge;
      card += '    <div class="pm-media relative flex items-center justify-center overflow-hidden' + (openable ? ' cursor-pointer' : '') + '">';
      card +=        soldOutOverlay;
      card +=        compareBtnHtml;
      card +=        wishlistBtnHtml;
      card +=        flagsHtml;
      card += '      <img src="' + esc(imgUrl) + '" loading="lazy" onerror="this.onerror=null;this.src=window.app.NO_IMG;" alt="' + esc(pName) + '" class="max-h-full max-w-full object-contain transition-transform duration-300 group-hover:scale-105' + (outOfStock ? ' grayscale opacity-60' : '') + '">';
      card += '    </div>';
      card += '    <div class="pm-body flex flex-col flex-1 gap-1.5">';
      card += '      <div class="sf-brand">' + brandLabel + '</div>';
      const nameOpenAttr = openable ? ' role="link" tabindex="0" onkeydown="if(event.key===\'Enter\'){window.app.pos.openCardDetail(event,\'' + escJs(variant.SKU) + '\')}"' : '';
      card += '      <div class="pm-name line-clamp-2' + (openable ? ' cursor-pointer' : '') + '"' + nameOpenAttr + ' title="' + esc(dispName) + '">' + dispNameHtml + '</div>';
      // การ์ดแบบเรียบ: ชื่อ → ตัวเลือก (สี+ความจุ แถวเดียว) → ราคา → โปร 1 บรรทัด → สต๊อก → ปุ่ม (ชื่อเต็ม/ป้ายย่อยอยู่ในหน้ารายละเอียด)
      if (dotsHtml || chipsHtml) card += '<div class="pm-vars">' + dotsHtml + chipsHtml + '</div>';
      card += '      <div class="pm-foot mt-auto">';
      // ราคาของตัวเลือกที่เลือกอยู่ (กดความจุ/สีแล้วราคาเปลี่ยนตาม) + ราคาเดิมขีดฆ่า + ประหยัด ในแถวเดียว
      // รุ่นที่ราคาต่างกันตามความจุ/สี: ราคาหลัก = ช่วง "฿ต่ำสุด - ฿สูงสุด" แล้วบอกราคาของตัวที่เลือกในแถวถัดไป
      let rMin = priceNum, rMax = priceNum;
      if (p.isGroup) p.products.forEach(v => { const n = parseFloat(String(v.Price || '0').replace(/[^\d.\-]/g, '')) || 0; if (n < rMin) rMin = n; if (n > rMax) rMax = n; });
      const hasRange = rMax > rMin;
      if (hasRange) card += '        <div class="mb-0.5"><span class="sf-range pm-price tabular-nums">฿' + rMin.toLocaleString() + ' - ฿' + rMax.toLocaleString() + '</span></div>';
      card += '        <div class="pm-pricerow' + (hasRange ? ' sf-selprice' : '') + '">';
      card += hasRange ? '          รุ่นที่เลือก <b class="tabular-nums">฿' + price + '</b>' : '          <span class="pm-price tabular-nums">฿' + price + '</span>';
      if (hasSave) card += '<span class="pm-strike tabular-nums">฿' + origNum.toLocaleString() + '</span><span class="sf-save">ประหยัด ฿' + (origNum - priceNum).toLocaleString() + '</span>';
      card += '        </div>';
      // โปรโมชั่นรวมเป็นข้อความบรรทัดเดียว (ตัดด้วย … เมื่อยาวเกิน; ข้อความเต็มอยู่ใน title)
      const promoBits = [bundleBadge, giftCountBadge, installmentBadge].filter(Boolean);
      if (promoBits.length) card += '        <div class="pm-promo" title="' + promoBits.join(' · ') + '"><i class="fas fa-tag"></i>' + promoBits.join(' · ') + '</div>';
      card +=          stockBarHtml;
      card +=          bookBtn;
      card += '      </div>';
      card += '    </div>';
      card += '</div>';
      return card;
    },
    // 6A — สลับ variant บนการ์ด: ส่ง cap หรือ color อย่างใดอย่างหนึ่ง (อีกตัวส่ง '' = คงของเดิม/ปรับอัตโนมัติ)
    selectCardVariant: function(model, cap, color) {
      const grp = this.cardGroups[model]; const st = this.cardState[model];
      if (!grp || !st) return;
      const vars = grp.products;
      const stockOf = (v) => parseInt(String(v.Stock || '0').replace(/[^\d.\-]/g, ''), 10) || 0;
      if (color) {
        st.color = color;
        if (!vars.some(v => v.Color === color && v.Capacity === st.cap)) {
          const cand = vars.filter(v => v.Color === color);
          const pick = cand.find(v => stockOf(v) > 0) || cand[0];
          if (pick) st.cap = pick.Capacity;
        }
      } else if (cap) {
        st.cap = cap;
        if (!vars.some(v => v.Capacity === cap && v.Color === st.color)) {
          const cand = vars.filter(v => v.Capacity === cap);
          const pick = cand.find(v => stockOf(v) > 0) || cand[0];
          if (pick) st.color = pick.Color;
        }
      }
      this.updateCardVariant(model);
    },
    // 6A — re-render เฉพาะการ์ดของ model นั้น (รูป/ราคา/badge/ปุ่มจอง อัปเดตทันที ไม่ต้อง render ทั้งกริด)
    updateCardVariant: function(model) {
      const grp = this.cardGroups[model];
      if (!grp) return;
      const key = (window.CSS && CSS.escape) ? CSS.escape(model) : model.replace(/"/g, '\\"');
      const el = document.querySelector('#productGrid [data-card-key="' + key + '"]');
      if (!el) return;
      const searchEl = document.getElementById('searchProduct');
      el.outerHTML = this.cardHtml(grp, searchEl ? searchEl.value.trim() : '');
    },
    // กดรูป/ชื่อบนการ์ด = เปิดหน้ารายละเอียด (addToCartModal) เหมือนปุ่ม "จองด่วน" — ปุ่มหัวใจ/เทียบสเปคที่อยู่บนรูปต้องไม่ถูกแย่งคลิก
    openCardDetail: function(ev, sku) {
      if (ev && ev.target && ev.target.closest && ev.target.closest('button, a, input, select')) return;
      this.openAddToCartModal(sku);
    },
    openAddToCartModal: function(id) {
      if (this.isBookingBlocked) {
        return Swal.fire('ไม่สามารถดำเนินการได้', this.bookingBlockedMessage || 'ไม่อยู่ในช่วงเวลาการจองสินค้า', 'warning');
      }
      
      const modalVarSel = document.getElementById('modalVariantSelection');
      let isModelGroup = id.startsWith('MODEL:');
      let prod = null;
      let groupProducts = [];
      
      if (isModelGroup) {
          let modelName = id.substring(6);
          // Only show variants that are in current channel and active
          const currentChannel = document.getElementById('posChannelSelect').value;
          groupProducts = window.app.globalData.products.filter(p => p.Model === modelName && p.Status === 'เปิด' && window.app.channelOk(p.Channel, currentChannel));
          if (groupProducts.length === 0) return Swal.fire('สินค้าหมด', 'สินค้ารุ่นนี้ไม่มีสต๊อกในระบบสำหรับช่องทางที่เลือก', 'warning');
          
          prod = groupProducts[0]; 
          if (modalVarSel) modalVarSel.classList.remove('hidden');
          this.currentGroupProducts = groupProducts;
          this.renderVariantOptions(prod.Capacity, prod.Color);
          
      } else {
          prod = window.app.globalData.products.find(p=>p.SKU==id); 
          if(!prod||this.stockOf(prod)<=0) return Swal.fire('สินค้าหมด','สินค้าชิ้นนี้ไม่มีสต๊อกในระบบ','warning');
          if (modalVarSel) modalVarSel.classList.add('hidden');
          this.currentGroupProducts = null;
          this.updateModalWithProduct(prod);
      }
      
      if(prod && prod.Category === 'โมบาย') {
         let mobileCount = this.cartData.filter(i => i.Category === 'โมบาย').reduce((sum, i) => sum + i.qty, 0);
         if(mobileCount >= 1) {
             return Swal.fire('สิทธิ์ออเดอร์เต็ม', 'สามารถทำรายการจองสินค้าประเภท โมบาย ได้เพียง 1 เครื่อง ต่อ 1 ออเดอร์เท่านั้น', 'warning');
         }
      }

      // เปิดหน้ารายละเอียด: เริ่มที่แท็บของแถมเสมอ (ต้องเลือกก่อนเพิ่มลงตะกร้า) + เลื่อนกลับบนสุด + เติมเงื่อนไขการจองฉบับปัจจุบัน
      this.setDetailTab('gifts');
      const termsEl = document.getElementById('pdTerms');
      if (termsEl) termsEl.innerHTML = window.app.safeRichText(window.app.policyText('booking')).replace(/\r?\n/g, '<br>');
      window.app.showModal('addToCartModal');
      const sc = document.getElementById('pdScroll'); if (sc) sc.scrollTop = 0;
      this.setSharedModel(prod && prod.Model ? prod.Model : '');
    },
    // แท็บในหน้ารายละเอียดสินค้า (gifts / specs / install / terms) — scroll = เลื่อนลงมาที่แท็บด้วย (ใช้จากลิงก์ "ดูตารางผ่อน")
    setDetailTab: function(tab, scroll) {
      const tabs = document.querySelectorAll('#addToCartModal .pd-tab');
      if (!tabs.length) return;
      if (![...tabs].some(b => b.dataset.tab === tab)) tab = 'gifts';
      tabs.forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
      ['gifts', 'specs', 'install', 'terms'].forEach(t => { const p = document.getElementById('pdPanel-' + t); if (p) p.classList.toggle('hidden', t !== tab); });
      if (scroll) { const bar = document.querySelector('#addToCartModal .pd-tabs'); if (bar && bar.scrollIntoView) bar.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
    },
    renderVariantOptions: function(selectedCapacity, selectedColor) {
        const groupProducts = this.currentGroupProducts;
        if (!groupProducts) return;
        
        const capacities = [...new Set(groupProducts.map(p => p.Capacity).filter(c => c && c !== '-'))];
        if (capacities.length > 0 && !capacities.includes(selectedCapacity)) selectedCapacity = capacities[0];
        
        let capHtml = '';
        capacities.forEach(cap => {
            let isSelected = cap === selectedCapacity;
            let btnClass = isSelected ? 'pd-on bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:border-indigo-400 hover:text-indigo-600';
            capHtml += `<button type="button" class="px-2 md:px-2.5 py-1 md:py-1.5 border rounded-lg text-[9px] md:text-[10px] font-bold transition-all ${btnClass}" onclick="window.app.pos.selectVariant('${window.app.escAttrJs(cap)}', '${window.app.escAttrJs(selectedColor)}')">${window.app.esc(cap)}</button>`;
        });
        const capOptEl = document.getElementById('modalCapacityOptions');
        if (capOptEl) capOptEl.innerHTML = capHtml || '<span class="text-[9px] md:text-[10px] text-slate-400">ไม่มีตัวเลือกความจุ</span>';
        
        const productsForCap = groupProducts.filter(p => (!selectedCapacity || p.Capacity === selectedCapacity));
        const colors = [...new Set(productsForCap.map(p => p.Color).filter(c => c && c !== '-'))];
        
        if (colors.length > 0 && !colors.includes(selectedColor)) selectedColor = colors[0];
        
        let colHtml = '';
        colors.forEach(col => {
            let isSelected = col === selectedColor;
            let p = productsForCap.find(x => x.Color === col);
            let outOfStock = p && this.stockOf(p) <= 0;
            // จุดสีจริงคู่ชื่อสี (colorHex คืนค่าสีจากชื่อ; ผ่าน esc เพราะลงใน attribute style)
            const dot = `<i class="pd-dot" aria-hidden="true" style="background:${window.app.esc(this.colorHex(col))}"></i>`;

            let btnClass = '';
            if (outOfStock) {
                btnClass = 'bg-slate-100 text-slate-400 border-slate-200 opacity-60 cursor-not-allowed';
                colHtml += `<button type="button" class="px-2 md:px-2.5 py-1 md:py-1.5 border rounded-lg text-[9px] md:text-[10px] font-bold transition-all ${btnClass}" disabled>${dot}${window.app.esc(col)}</button>`;
            } else {
                btnClass = isSelected ? 'pd-on bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:border-indigo-400 hover:text-indigo-600';
                colHtml += `<button type="button" class="px-2 md:px-2.5 py-1 md:py-1.5 border rounded-lg text-[9px] md:text-[10px] font-bold transition-all ${btnClass}" onclick="window.app.pos.selectVariant('${window.app.escAttrJs(selectedCapacity)}', '${window.app.escAttrJs(col)}')">${dot}${window.app.esc(col)}</button>`;
            }
        });
        const colOptEl = document.getElementById('modalColorOptions');
        if (colOptEl) colOptEl.innerHTML = colHtml || '<span class="text-[9px] md:text-[10px] text-slate-400">ไม่มีตัวเลือกสี</span>';
        
        let targetProduct = productsForCap.find(p => p.Color === selectedColor) || productsForCap[0] || groupProducts[0];
        this.updateModalWithProduct(targetProduct);
    },
    selectVariant: function(capacity, color) {
        this.renderVariantOptions(capacity, color);
    },
    setModalImage: function(index) {
        if (!this.currentImages || this.currentImages.length === 0) return;
        if (index < 0) index = this.currentImages.length - 1;
        if (index >= this.currentImages.length) index = 0;
        this.currentImageIndex = index;
        
        document.getElementById('modalProdImg').src = this.currentImages[index];
        
        const thumbContainer = document.getElementById('modalThumbnails');
        if (thumbContainer && this.currentImages.length > 1) {
            Array.from(thumbContainer.children).forEach((img, i) => {
                if (i === index) {
                    img.classList.add('border-indigo-500', 'scale-105');
                    img.classList.remove('border-slate-200');
                } else {
                    img.classList.remove('border-indigo-500', 'scale-105');
                    img.classList.add('border-slate-200');
                }
            });
        }
    },
    prevImage: function(e) { if(e) e.stopPropagation(); this.setModalImage(this.currentImageIndex - 1); },
    nextImage: function(e) { if(e) e.stopPropagation(); this.setModalImage(this.currentImageIndex + 1); },
    renderRelated: function(prod) {
      const el = document.getElementById('pdRelated');
      if (!el) return;
      const esc = window.app.esc, escJs = window.app.escAttrJs;
      const chEl = document.getElementById('posChannelSelect');
      const channel = chEl ? chEl.value : '';
      const priceOf = (p) => parseFloat(String(p.Price || '0').replace(/[^\d.\-]/g, '')) || 0;
      const keyOf = (p) => (p.Model && p.Model !== '-') ? p.Model : ('SKU:' + p.SKU);
      const myKey = keyOf(prod), myCat = (prod.Category || '').toString().trim(), mySeries = (prod['Product Group'] || '').toString().trim();
      const pool = (myCat.includes('ของแถม') ? [] : (window.app.globalData.products || [])).filter(p => p.Status === 'เปิด' && !(p.Category || '').includes('ของแถม')
        && window.app.channelOk(p.Channel, channel) && this.stockOf(p) > 0 && keyOf(p) !== myKey);
      const pick = (list) => {
        const byModel = {};
        list.forEach(p => { const k = keyOf(p); if (!byModel[k] || priceOf(p) < priceOf(byModel[k])) byModel[k] = p; });
        return Object.keys(byModel).map(k => byModel[k]);
      };
      let items = mySeries && mySeries !== '-' ? pick(pool.filter(p => (p['Product Group'] || '').toString().trim() === mySeries)) : [];
      if (items.length < 2) items = pick(pool.filter(p => (p.Category || '').toString().trim() === myCat));
      // เรียงตามราคาที่ใกล้กับรุ่นที่กำลังดู
      const base = priceOf(prod);
      items.sort((a, b) => Math.abs(priceOf(a) - base) - Math.abs(priceOf(b) - base));
      items = items.slice(0, 6);
      if (items.length < 2) { el.classList.add('hidden'); el.innerHTML = ''; return; }
      let html = '<h2 class="pd-rel-h">สินค้าใกล้เคียง</h2><div class="pd-rel-row custom-scrollbar">';
      items.forEach(p => {
        const nm = (p.Model && p.Model !== '-') ? p.Model : (p['Product Name'] || '');
        html += '<button type="button" class="pd-rel-card" onclick="window.app.pos.openRelated(\'' + escJs(p.SKU) + '\')">'
          + '<span class="pd-rel-img"><img src="' + esc(window.app.formatImageUrl(p['Image URL'])) + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=window.app.NO_IMG;"></span>'
          + '<span class="pd-rel-name">' + esc(nm) + '</span>'
          + '<span class="pd-rel-price tabular-nums">฿' + priceOf(p).toLocaleString() + '</span></button>';
      });
      el.innerHTML = html + '</div>';
      el.classList.remove('hidden');
    },
    openRelated: function(sku) {
      this.openAddToCartModal(sku);
      const sc = document.getElementById('pdScroll'); if (sc) sc.scrollTop = 0;
    },
    updateModalWithProduct: function(prod) {
      if (!prod) return;
      this.pushRecentlyViewed(prod.SKU);
      const priceNum = prod.Price ? (parseFloat(prod.Price.toString().replace(/[^\d.\-]/g,'')) || 0) : 0;
      document.getElementById('modalProdSKU').value = prod.SKU; 
      document.getElementById('modalProdName').innerText = prod['Product Name']; 
      document.getElementById('modalProdPrice').innerText = '฿' + priceNum.toLocaleString();
      document.getElementById('modalProdStock').innerText = '(มีสินค้า: ' + prod.Stock + ')'; 
      document.getElementById('modalProdQty').value = 1; 
      document.getElementById('modalProdQty').max = (prod.Category === 'โมบาย') ? 1 : this.stockOf(prod);

      // หน้ารายละเอียดสินค้า: เส้นทาง / แบรนด์ / ราคาเดิม+ประหยัด / ปุ่มเสริม / แท็บสเปค + ผ่อนชำระ / แถบล่าง — อัปเดตทุกครั้งที่เปลี่ยนสีหรือความจุ
      {
        const esc = window.app.esc, escJs = window.app.escAttrJs;
        const isGiftProd = (prod.Category || '').includes('ของแถม');
        const cat = (prod.Category || '').toString().trim();
        const modelName = (prod.Model && prod.Model !== '-') ? prod.Model : prod['Product Name'];
        const setHtml = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
        const sepIco = '<i class="fas fa-chevron-right" aria-hidden="true"></i>';
        setHtml('pdCrumb', '<button type="button" onclick="window.app.hideModal(\'addToCartModal\')">หน้าร้าน</button>' + sepIco
          + (cat ? '<button type="button" onclick="window.app.hideModal(\'addToCartModal\');window.app.pos.setStoreCategory(\'' + escJs(cat) + '\')">' + esc(cat) + '</button>' + sepIco : '')
          + '<span>' + esc(modelName) + '</span>');
        const bKey = this.brandOf(prod);
        setHtml('pdBrand', bKey ? esc(this.brandLabel_(bKey)) : esc(cat));
        const origNum = parseFloat(String(prod['Original Price'] || '0').replace(/[^\d.\-]/g, '')) || 0;
        setHtml('pdPriceMeta', origNum > priceNum ? '<span class="pd-strike tabular-nums">฿' + origNum.toLocaleString() + '</span><span class="pd-save">ประหยัด ฿' + (origNum - priceNum).toLocaleString() + '</span>' : '');
        const canInstall = !isGiftProd && priceNum >= 3000;
        setHtml('pdInstLine', canInstall ? '<i class="far fa-credit-card"></i> ผ่อน 0% ฿' + Math.ceil(priceNum / 10).toLocaleString() + '/เดือน นาน 10 เดือน <button type="button" onclick="window.app.pos.setDetailTab(\'install\', true)">ดูตารางผ่อน</button>' : '');
        const cKey = (prod.Model && prod.Model !== '-') ? prod.Model : ('SKU:' + prod.SKU);
        setHtml('pdActions', isGiftProd ? '' :
          '<button type="button" onclick="window.app.pos.openTradeInStandalone(\'' + escJs(prod.SKU) + '\')"><i class="fas fa-retweet"></i> คำนวณเก่าแลกใหม่</button>'
          + '<button type="button" onclick="window.app.hideModal(\'addToCartModal\'); window.app.pos.addCompareFromSelect(\'' + escJs(cKey) + '\');"><i class="fas fa-scale-balanced"></i> เทียบสเปคกับรุ่นอื่น</button>');

        // แท็บสเปค: ทุกหัวข้อที่มีข้อมูล (ค่าจากคอลัมน์สเปคในชีต Products; ช่องที่ว่างใช้ค่าประมาณตามรุ่นจาก getDeviceSpecs)
        const sp = isGiftProd ? {} : this.getDeviceSpecs({ variant: prod, variants: this.currentGroupProducts || [prod] });
        const specRows = [['หน้าจอ', sp.display], ['ชิปเซ็ต', sp.chipset], ['หน่วยความจำ', sp.memory], ['กล้องหลัง', sp.rearCamera], ['กล้องหน้า', sp.frontCamera], ['แบตเตอรี่', sp.battery], ['ระบบปฏิบัติการ', sp.osAi], ['การเชื่อมต่อ', sp.connectivity], ['การรับประกัน', sp.warranty]]
          .filter(r => r[1] && String(r[1]).trim() !== '' && String(r[1]).trim() !== '-');
        setHtml('pdSpecs', specRows.length
          ? '<dl class="pd-spec">' + specRows.map(r => '<div><dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd></div>').join('') + '</dl>'
          : '<p class="pd-empty">ยังไม่มีข้อมูลสเปคของสินค้านี้</p>');

        // แท็บผ่อนชำระ
        const instOpt = (m, hot) => '<div class="pd-inst-opt' + (hot ? ' hot' : '') + '"><span>ผ่อน ' + m + ' เดือน' + (hot ? ' · ยอดนิยม' : '') + '</span><b class="tabular-nums">฿' + Math.ceil(priceNum / m).toLocaleString() + '<small>/เดือน</small></b></div>';
        setHtml('modalInstallmentBox', canInstall
          ? '<div class="pd-inst">' + instOpt(6) + instOpt(10, true) + instOpt(24) + '</div><p class="pd-hint">ผ่อน 0% สำหรับบัตรเครดิตที่ร่วมรายการ ยอดต่อเดือนเป็นการประมาณจากราคาสินค้า เงื่อนไขจริงเป็นไปตามที่สาขาแจ้ง</p>'
          : '<p class="pd-empty">สินค้านี้ไม่มีรายการผ่อนชำระ</p>');

        // สินค้าใกล้เคียง: รุ่นอื่นในซีรีส์เดียวกัน (Product Group) ถ้าไม่พอ 2 รุ่นใช้หมวดเดียวกัน — เฉพาะที่เปิดขาย มีสต๊อก และขายในช่องทางที่เลือก
        this.renderRelated(prod);

        // แถบล่างติดขอบจอ
        const barName = document.getElementById('pdBarName'); if (barName) barName.textContent = prod['Product Name'] || '';
        const barPrice = document.getElementById('pdBarPrice'); if (barPrice) barPrice.textContent = '฿' + priceNum.toLocaleString();
        const barImg = document.getElementById('pdBarImg'); if (barImg) { barImg.style.visibility = ''; barImg.src = window.app.formatImageUrl(prod['Image URL']); }
      }

      this.currentImages = window.app.parseImageUrls(prod['Image URL']);
      
      const thumbContainer = document.getElementById('modalThumbnails');
      const btnPrev = document.getElementById('btnPrevImg');
      const btnNext = document.getElementById('btnNextImg');
      
      if (thumbContainer) {
          if (this.currentImages.length > 1) {
              thumbContainer.innerHTML = this.currentImages.map((u, i) => `<img src="${window.app.esc(u)}" onclick="window.app.pos.setModalImage(${i})" alt="" class="border-slate-200">`).join('');
              thumbContainer.classList.remove('hidden');
              if(btnPrev) btnPrev.classList.remove('hidden');
              if(btnNext) btnNext.classList.remove('hidden');
          } else {
              thumbContainer.innerHTML = '';
              thumbContainer.classList.add('hidden');
              if(btnPrev) btnPrev.classList.add('hidden');
              if(btnNext) btnNext.classList.add('hidden');
          }
      }
      this.setModalImage(0);
      
      const bGifts = document.getElementById('modalBrandGifts'); 
      const cGifts = document.getElementById('modalChannelGifts');
      const currentChannel = document.getElementById('posChannelSelect').value;
      const sku = prod.SKU;
      
      let bGiftsHTML = '';
      let cGiftsHTML = '';

      let allowedBrandGifts = [];
      let allowedChannelGifts = [];
      let hasMapping = false;

      const mappings = (window.app.globalData.giftMappings || []).filter(m => {
          if(m.Status !== 'เปิด') return false;
          // Channel เป็น multi-select ฝั่งแอดมิน ค่าที่เซฟมาเป็น comma list ได้ เช่น "Retail, Online"
          // ต้องแตก token เทียบเหมือนฝั่ง server (processCheckout) ห้ามใช้ .includes() แบบ substring ทั้งสตริง
          // ไม่งั้น mapping ที่เลือกหลายช่องทางจะโชว์ให้เลือกได้ที่นี่ แต่ server ปฏิเสธตอน checkout (ไม่ตรงกัน)
          const mCh = (m.Channel || '').trim().toLowerCase();
          const mChTokens = mCh.split(',').map(v => v.trim()).filter(Boolean);
          const chMatch = (mCh === 'all' || mCh === '' || mChTokens.includes(currentChannel.toLowerCase()));
          if(!chMatch) return false;

          const target = (m['Target Mobile (SKU or Group)'] || '').trim();
          const skuLower = sku.toLowerCase();
          const productNameLower = (prod['Product Name'] || '').trim().toLowerCase();
          const groupLower = (prod['Product Group'] || '').trim().toLowerCase();
          
          if (target === '*' || target.toUpperCase() === 'ALL') return true;

          // ต้องตรงกับ targetMatches ฝั่ง server (processCheckout, Code.js) เป๊ะๆ — ห้ามมี pattern ที่ server ไม่รองรับ
          // (เช่น "*" ผสมในโทเค็นแบบ regex หรือแยกโทเค็นด้วย " / ") เพราะจะทำให้ที่นี่โชว์ของแถมให้เลือกได้
          // แต่ server ปฏิเสธตอน checkout — server เทียบชื่อสินค้าแบบ substring (mainName.includes(v)) ไม่ใช่ตรงเป๊ะ
          const targets = target.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
          return targets.includes(skuLower) || (groupLower !== '' && targets.includes(groupLower)) ||
              targets.some(t => t !== '*' && productNameLower !== '' && productNameLower.includes(t));
      });

      if (mappings.length > 0) {
          hasMapping = true;
          mappings.forEach(m => {
              if(m['Brand Gifts']) allowedBrandGifts.push(...m['Brand Gifts'].split(',').map(s=>s.trim().toLowerCase()).filter(s=>s!==''));
              if(m['Channel Gifts']) allowedChannelGifts.push(...m['Channel Gifts'].split(',').map(s=>s.trim().toLowerCase()).filter(s=>s!==''));
          });
      }

      window.app.globalData.products.forEach((p, idx)=>{ 
        if(p.Status==='เปิด'){ 
          // ต้องกัน Product Name ว่าง/undefined เหมือนจุดอื่นในฟังก์ชันนี้ (แถวชีตที่แก้ตรงๆ อาจว่างได้) ไม่งั้น .toLowerCase() throw ทำให้เปิด modal "จอง" ไม่ได้เลยทั้งหน้า
          let pNameLower = (p['Product Name'] || '').toLowerCase();
          const gImg = window.app.formatImageUrl(p['Image URL']);
          
          if(p.Category==='ของแถมแบรนด์' && hasMapping && allowedBrandGifts.some(g => g === '*' || pNameLower.includes(g))) {
            bGiftsHTML += `<div class="flex items-center gap-2.5 p-2 bg-white rounded-xl border border-slate-200 shadow-sm mb-2 hover:border-emerald-400 hover:bg-emerald-50/20 transition-all"><input class="w-4 h-4 text-emerald-500 bg-slate-50 border-slate-300 rounded focus:ring-emerald-500 cursor-pointer shrink-0" type="checkbox" value="${window.app.esc(p['Product Name'])}" id="bgift${idx}" onchange="document.getElementById('bgiftQty${idx}').disabled = !this.checked"><img src="${window.app.esc(gImg)}" alt="" onerror="this.remove()" class="w-8 h-8 object-contain rounded-lg border border-slate-100 bg-white p-0.5 shrink-0"><label class="flex-1 text-[10px] md:text-[11px] font-semibold text-slate-700 break-words whitespace-normal cursor-pointer select-none leading-snug" for="bgift${idx}">${window.app.esc(p['Product Name'])} <span class="inline-block text-[9px] text-emerald-600 font-extrabold ml-1 bg-emerald-50 px-1.5 py-0.5 rounded">(คงเหลือ ${window.app.esc(p.Stock)})</span></label><input type="number" id="bgiftQty${idx}" class="w-12 md:w-14 px-1.5 py-1 text-[10px] md:text-[11px] font-bold text-center border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white shrink-0" value="1" min="1" max="${this.stockOf(p)}" disabled></div>`;
          } 
          else if(p.Category==='ของแถมช่องทาง' && hasMapping && allowedChannelGifts.some(g => g === '*' || pNameLower.includes(g))) {
            cGiftsHTML += `<div class="flex items-center gap-2.5 p-2 bg-white rounded-xl border border-slate-200 shadow-sm mb-2 hover:border-indigo-400 hover:bg-indigo-50/20 transition-all"><input class="w-4 h-4 text-indigo-500 bg-slate-50 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer shrink-0" type="checkbox" value="${window.app.esc(p['Product Name'])}" id="cgift${idx}" onchange="document.getElementById('cgiftQty${idx}').disabled = !this.checked"><img src="${window.app.esc(gImg)}" alt="" onerror="this.remove()" class="w-8 h-8 object-contain rounded-lg border border-slate-100 bg-white p-0.5 shrink-0"><label class="flex-1 text-[10px] md:text-[11px] font-semibold text-slate-700 break-words whitespace-normal cursor-pointer select-none leading-snug" for="cgift${idx}">${window.app.esc(p['Product Name'])} <span class="inline-block text-[9px] text-indigo-600 font-extrabold ml-1 bg-indigo-50 px-1.5 py-0.5 rounded">(คงเหลือ ${window.app.esc(p.Stock)})</span></label><input type="number" id="cgiftQty${idx}" class="w-12 md:w-14 px-1.5 py-1 text-[10px] md:text-[11px] font-bold text-center border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white shrink-0" value="1" min="1" max="${this.stockOf(p)}" disabled></div>`;
          }
        } 
      });

      if(!hasMapping || bGiftsHTML === '') bGiftsHTML = '<div class="text-sm font-medium text-slate-400 p-4 text-center bg-slate-50 rounded-xl border border-dashed border-slate-200">ไม่มีของแถมสำหรับสินค้ารุ่นนี้</div>';
      if(!hasMapping || cGiftsHTML === '') cGiftsHTML = '<div class="text-sm font-medium text-slate-400 p-4 text-center bg-slate-50 rounded-xl border border-dashed border-slate-200">ไม่มีของแถมสำหรับสินค้ารุ่นนี้</div>';

      if(bGifts) bGifts.innerHTML = bGiftsHTML;
      if(cGifts) cGifts.innerHTML = cGiftsHTML;
    },
    confirmAddToCart: function() {
      if (this.isBookingBlocked) {
        return Swal.fire('ไม่สามารถดำเนินการได้', this.bookingBlockedMessage || 'ไม่อยู่ในช่วงเวลาการจองสินค้า', 'warning');
      }
      const sku=document.getElementById('modalProdSKU').value; const qty=parseInt(document.getElementById('modalProdQty').value);
      const p = window.app.globalData.products.find(x=>x.SKU==sku);
      if (!Number.isInteger(qty) || qty < 1) return Swal.fire('จำนวนไม่ถูกต้อง', 'กรุณาระบุจำนวนสินค้าเป็นตัวเลขอย่างน้อย 1', 'warning');

      if (p.Category === 'โมบาย') {
          let currentMobileQty = this.cartData.filter(i => i.Category === 'โมบาย').reduce((sum, i) => sum + i.qty, 0);
          if (currentMobileQty + qty > 1) {
              return Swal.fire('ข้อจำกัดการจอง', 'สินค้าประเภท โมบาย จำกัดสิทธิ์จองได้ออเดอร์ละ 1 เครื่อง', 'warning');
          }
      }

      const bGifts = []; let giftError = false;
      const modelCounts = {};
      
      document.querySelectorAll('#modalBrandGifts input[type="checkbox"]:checked').forEach(cb => {
         const gQty = parseInt(document.getElementById(cb.id.replace('bgift','bgiftQty')).value) || 1;
         const pData = window.app.globalData.products.find(x => x['Product Name'] === cb.value);
         if (pData) {
            if (gQty > this.stockOf(pData)) giftError = true;
            let model = pData.Model || 'UNKNOWN';
            if (model !== '-' && model !== '') {
               if (!modelCounts[model]) modelCounts[model] = 0;
               modelCounts[model] += gQty;
            }
         }
         bGifts.push({name: cb.value, qty: gQty});
      });
      
      const cGifts = [];
      document.querySelectorAll('#modalChannelGifts input[type="checkbox"]:checked').forEach(cb => {
         const gQty = parseInt(document.getElementById(cb.id.replace('cgift','cgiftQty')).value) || 1;
         const pData = window.app.globalData.products.find(x => x['Product Name'] === cb.value);
         if (pData) {
            if (gQty > this.stockOf(pData)) giftError = true;
            let model = pData.Model || 'UNKNOWN';
            if (model !== '-' && model !== '') {
               if (!modelCounts[model]) modelCounts[model] = 0;
               modelCounts[model] += gQty;
            }
         }
         cGifts.push({name: cb.value, qty: gQty});
      });

      if (giftError) return Swal.fire('สต๊อกของแถมไม่พอ', 'คุณเลือกจำนวนของแถมเกินกว่าที่มีในคลังคงเหลือ', 'warning');
      
      for (let model in modelCounts) {
         if (modelCounts[model] > 1) {
             return Swal.fire('ข้อจำกัดของแถม', 'ของแถมรุ่นเดียวกัน (' + model + ') สามารถเลือกได้สูงสุด 1 ชิ้นเท่านั้น', 'warning');
         }
      }
      
      const ex = this.cartData.find(i=>i.SKU==sku && JSON.stringify(i.brandGifts)===JSON.stringify(bGifts) && JSON.stringify(i.channelGifts)===JSON.stringify(cGifts));
      // เช็ค stock รวมทุกบรรทัดของ SKU นี้ในตะกร้า ไม่ใช่แค่บรรทัดที่กำลังจะเพิ่ม/รวม — เดิมถ้าหยิบ SKU เดียวกันแต่เลือกของแถมต่างกัน
      // จะแยกเป็นคนละบรรทัด แล้วแต่ละบรรทัดเช็ค stock อิสระจากกัน ทำให้จองรวมเกิน stock จริงได้ (ไปเจอ error ตอน checkout แทนที่จะเตือนตอนนี้)
      const totalSkuQtyInCart = this.cartData.filter(i=>i.SKU==sku).reduce((s,i)=>s+i.qty,0);
      if (totalSkuQtyInCart + qty > this.stockOf(p)) return Swal.fire('สต๊อกไม่พอ','','warning');
      if(ex){ ex.qty+=qty; }
      else { this.cartData.push({...p, qty:qty, brandGifts:bGifts, channelGifts:cGifts}); }
      
      window.app.hideModal('addToCartModal'); 
      this.saveAndRender();
      if (!this.promptCompanions(p)) {
        window.app.toast('เพิ่มลงตะกร้าแล้ว', 'success');
      }
    },
    // ===== แนะนำสินค้าซื้อคู่ (Frequently Bought Together) =====
    // กติกาเลือกสินค้า: ใช้โปร Bundle จาก AutoPromotions (Buy Category ในตะกร้า -> Get Discount Category) เป็นตัวบอกว่าหมวดไหนควรซื้อคู่
    // ไม่มีกติกาในชีต = ใช้ค่าเริ่มต้นเดียวกับ checkAutoPromotions (โมบาย -> อุปกรณ์เสริม 10%) แล้วจัดอันดับตามความเข้ากันได้กับสินค้าหลัก
    activeAutoRules_: function() {
      let rules = (window.app.globalData && window.app.globalData.autoPromotions) || [];
      if (rules.length === 0) rules = [{ 'Buy Category': 'โมบาย', 'Get Discount Category': 'อุปกรณ์เสริม', 'Discount Percent': 10, 'Status': 'เปิด' }];
      const chSelEl = document.getElementById('posChannelSelect');
      const currentChannel = (chSelEl ? chSelEl.value : '').toString().trim().toLowerCase();
      return rules.filter(r => {
        if (!window.app.statusOn(r.Status)) return false;
        const raw = (r['Channel'] || '').toString().trim();
        const toks = raw.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
        return raw === '' || raw === '*' || raw.toLowerCase() === 'all' || toks.includes(currentChannel);
      });
    },
    recommendCompanions: function(limit, forItems) {
      const items = (forItems || this.cartData || []);
      if (items.length === 0) return [];
      const priceOf = (p) => parseFloat(String(p.Price || '0').replace(/[^\d.\-]/g, '')) || 0;
      const catOf = (p) => (p.Category || '').toString().trim();
      const rules = this.activeAutoRules_();
      const want = {}; // หมวดที่ควรเสนอ -> { pct, mains: สินค้าหลักที่ทำให้เกิดกติกา }
      rules.forEach(r => {
        const buy = (r['Buy Category'] || '').toString().trim(), get = (r['Get Discount Category'] || '').toString().trim();
        if (!buy || !get || get.indexOf('ของแถม') > -1) return;
        const mains = items.filter(i => catOf(i) === buy);
        if (mains.length === 0) return;
        const pct = parseFloat(r['Discount Percent']) || 0;
        if (!want[get]) want[get] = { pct: 0, mains: [] };
        want[get].pct += pct; // ทุกกติกาที่เข้าเงื่อนไขลดซ้อนกัน (ตรงกับ checkAutoPromotions และเพดานที่ server คำนวณ) ป้ายจึงต้องรวมเปอร์เซ็นต์ด้วย
        want[get].mains = want[get].mains.concat(mains);
      });
      const cats = Object.keys(want);
      if (cats.length === 0) return [];
      const inCart = new Set(items.map(i => i.SKU));
      const chSelEl = document.getElementById('posChannelSelect');
      const currentChannel = (chSelEl ? chSelEl.value : '').toString().trim();
      const tok = (s) => String(s || '').toLowerCase().split(/[^a-z0-9ก-๙]+/).filter(t => t.length >= 2);
      const brandWords = new Set(['samsung', 'galaxy', 'apple', 'iphone', 'oppo', 'vivo', 'xiaomi', 'redmi', 'realme', 'huawei', 'series', 'pro', 'max', 'ultra', 'plus']);
      const pool = (window.app.globalData.products || []).filter(p => {
        if ((p.Status || '') !== 'เปิด') return false;
        if (cats.indexOf(catOf(p)) === -1) return false;
        if (inCart.has(p.SKU)) return false;
        if (this.stockOf(p) <= 0 || priceOf(p) <= 0) return false;
        return window.app.channelOk(p.Channel, currentChannel);
      });
      const scored = pool.map(c => {
        const w = want[catOf(c)];
        const cTok = new Set(tok([c['Product Name'], c.Model, c['Marketing Model'], c['Product Group']].join(' ')));
        let score = 0;
        w.mains.forEach(m => {
          const g = (m['Product Group'] || '').toString().trim();
          if (g && g !== '-' && g === (c['Product Group'] || '').toString().trim()) score += 5;
          tok([m.Model, m['Marketing Model'], m['Product Name']].join(' ')).forEach(t => {
            if (!cTok.has(t)) return;
            score += brandWords.has(t) ? 1 : 3;
          });
        });
        return { p: c, score: score, pct: w.pct, price: priceOf(c) };
      });
      scored.sort((a, b) => (b.score - a.score) || (a.price - b.price));
      const seenModel = {}; const out = [];
      for (let i = 0; i < scored.length && out.length < (limit || 4); i++) {
        const s = scored[i]; const m = (s.p.Model || '').toString().trim();
        if (m && m !== '-') { if (seenModel[m]) continue; seenModel[m] = true; }
        out.push(s);
      }
      return out;
    },
    companionRowHtml_: function(s, viaPrompt) {
      const esc = window.app.esc, escJs = window.app.escAttrJs;
      const p = s.p;
      const after = s.pct > 0 ? Math.round(s.price * (100 - s.pct) / 100) : s.price;
      const img = window.app.formatImageUrl(p['Image URL']);
      return '<div class="sf-comp flex items-center gap-3 p-2.5 rounded-xl border border-slate-200 bg-white text-left" data-sku="' + esc(p.SKU) + '">'
        + '<img src="' + esc(img) + '" alt="" loading="lazy" onerror="this.onerror=null;this.style.visibility=\'hidden\'" class="w-12 h-12 object-contain rounded-lg bg-slate-50 shrink-0">'
        + '<div class="min-w-0 flex-1">'
        + '<div class="text-xs font-bold text-slate-900 leading-snug line-clamp-2">' + esc(p['Product Name']) + '</div>'
        + '<div class="flex items-baseline gap-1.5 flex-wrap mt-0.5"><span class="text-sm font-black text-slate-900 tabular-nums">฿' + after.toLocaleString() + '</span>'
        + (s.pct > 0 ? '<span class="text-[10px] text-slate-400 line-through tabular-nums">฿' + s.price.toLocaleString() + '</span><span class="text-[10px] font-extrabold text-rose-600 bg-rose-50 border border-rose-200 rounded px-1">ลด ' + esc(s.pct) + '% เมื่อซื้อคู่</span>' : '')
        + '</div></div>'
        + '<button type="button" class="sf-comp-add shrink-0 px-3 py-1.5 rounded-lg bg-white border border-[#FF6B00] text-[#E05300] text-[11px] font-black hover:bg-orange-50 transition" onclick="window.app.pos.addCompanion(\'' + escJs(p.SKU) + '\',' + (viaPrompt ? 'true' : 'false') + ')" aria-label="เพิ่ม ' + esc(p['Product Name']) + ' ลงตะกร้า"><i class="fas fa-plus mr-1"></i>เพิ่ม</button>'
        + '</div>';
    },
    renderCompanions: function() {
      const box = document.getElementById('cartCompanions');
      if (!box) return;
      const list = this.recommendCompanions(4);
      if (list.length === 0) { box.classList.add('hidden'); box.innerHTML = ''; return; }
      box.innerHTML = '<div class="sf-comp-panel">'
        + '<div class="flex items-center gap-2 mb-2"><i class="fas fa-link text-[#FF6B00]"></i><h6 class="sf-comp-h text-xs font-black uppercase tracking-wide">แนะนำซื้อคู่</h6></div>'
        + '<div class="flex flex-col gap-2">' + list.map(s => this.companionRowHtml_(s, false)).join('') + '</div></div>';
      box.classList.remove('hidden');
    },
    // เด้งแนะนำซื้อคู่หลังเพิ่มสินค้าหลักลงตะกร้า (ครั้งเดียวต่อ SKU ต่อรอบใช้งาน) — คืน true ถ้าแสดงแล้ว
    promptCompanions: function(mainProd) {
      if (!mainProd || typeof Swal === 'undefined') return false;
      this._companionPrompted = this._companionPrompted || {};
      if (this._companionPrompted[mainProd.SKU]) return false;
      const list = this.recommendCompanions(4);
      if (list.length === 0) return false;
      this._companionPrompted[mainProd.SKU] = true;
      const esc = window.app.esc;
      Swal.fire({
        title: 'เพิ่มลงตะกร้าแล้ว — ซื้อคู่ไหม?',
        html: '<div class="text-xs text-slate-500 mb-3">สินค้าที่เข้ากับ <b>' + esc(mainProd['Product Name']) + '</b></div><div id="companionPromptList" class="flex flex-col gap-2">' + list.map(s => this.companionRowHtml_(s, true)).join('') + '</div>',
        showCloseButton: true, showConfirmButton: true, confirmButtonText: 'ไปต่อ', confirmButtonColor: '#141416', width: 520
      });
      return true;
    },
    addCompanion: function(sku, viaPrompt) {
      if (this.isBookingBlocked) return Swal.fire('ไม่สามารถดำเนินการได้', this.bookingBlockedMessage || 'ไม่อยู่ในช่วงเวลาการจองสินค้า', 'warning');
      const p = (window.app.globalData.products || []).find(x => x.SKU == sku);
      if (!p || (p.Status || '') !== 'เปิด') return;
      const inCartQty = this.cartData.filter(i => i.SKU == sku).reduce((s, i) => s + i.qty, 0);
      if (inCartQty + 1 > this.stockOf(p)) { Swal.fire('สต๊อกไม่พอ', '', 'warning'); return; }
      const ex = this.cartData.find(i => i.SKU == sku && !(i.brandGifts && i.brandGifts.length) && !(i.channelGifts && i.channelGifts.length));
      if (ex) ex.qty += 1; else this.cartData.push({ ...p, qty: 1, brandGifts: [], channelGifts: [] });
      this.saveAndRender();
      if (viaPrompt) {
        // อัปเดตรายการในกล่องแนะนำ (สินค้าที่เพิ่มแล้วหายไป) — ถ้าไม่เหลือให้ปิด
        const holder = document.getElementById('companionPromptList');
        const list = this.recommendCompanions(4);
        if (!holder || list.length === 0) { Swal.close(); } else { holder.innerHTML = list.map(s => this.companionRowHtml_(s, true)).join(''); }
      }
    },
    updateQtyInCart: function(idx, c) {
      const itm = this.cartData[idx]; const p = window.app.globalData.products.find(x=>x.SKU==itm.SKU);
      if (c > 0 && p.Category === 'โมบาย') {
          // นับเฉพาะ mobile ชิ้นอื่น (ไม่รวมชิ้นที่กำลังแก้)
          let otherMobile = this.cartData.filter((i, i_idx) => i.Category === 'โมบาย' && i_idx !== idx).reduce((sum, i) => sum + i.qty, 0);
          if (otherMobile + itm.qty + c > 1) { return Swal.fire('จำกัดจำนวน', 'สินค้าประเภท โมบาย จำกัดสิทธิ์จองได้ออเดอร์ละ 1 เครื่อง', 'warning'); }
      }
      itm.qty+=c;
      // เช็ค stock รวมทุกบรรทัดของ SKU นี้ในตะกร้า (ไม่นับบรรทัดตัวเอง) — กัน SKU เดียวกันแยกบรรทัดตามของแถมแล้วรวมกันเกิน stock
      const otherSkuQty = this.cartData.filter((i, i_idx) => i.SKU === itm.SKU && i_idx !== idx).reduce((sum, i) => sum + i.qty, 0);
      const maxAllowed = Math.max(0, this.stockOf(p) - otherSkuQty);
      if(itm.qty>maxAllowed){ itm.qty=maxAllowed; Swal.fire('คลังจำกัด','จำนวนสิทธิ์เกินสต๊อกสินค้าหลัก','warning'); }
      if(itm.qty<=0) this.cartData.splice(idx,1);
      this.saveAndRender();
      this.checkAutoPromotions();
    },
    removeCartItem: function(idx) { this.cartData.splice(idx, 1); this.saveAndRender(); },
    saveAndRender: function() {
      // ตะกร้าเปลี่ยน = ความพยายามคีย์ออเดอร์ใหม่ — ต้องได้ idempotency key ใหม่ ไม่งั้น server จะมองเป็นออเดอร์ซ้ำ
      this.pendingRequestId = null;
      localStorage.setItem('tg_cart', JSON.stringify(this.cartData)); this.renderCart(); this.updateTotal(); this.renderCompanions();
    },
    checkAutoPromotions: function() {
        const suggestBox = document.getElementById('cartAutoSuggest');
        const autoRow = document.getElementById('autoDiscountRow');
        const autoDisp = document.getElementById('cartAutoDiscountDisplay');
        if(!suggestBox || !autoRow) return 0;
        
        suggestBox.innerHTML = '';
        suggestBox.classList.add('hidden');
        autoRow.classList.add('hidden');
        autoRow.classList.remove('flex');
        
        let rules = (window.app.globalData && window.app.globalData.autoPromotions) || [];
        if (rules.length === 0) {
            rules = [{
                'Buy Category': 'โมบาย', 'Get Discount Category': 'อุปกรณ์เสริม', 'Discount Percent': 10,
                'Message Suggest': 'ลูกค้าซื้อมือถือแล้ว! เสนอขายอุปกรณ์เสริม (เคส/ฟิล์ม/หัวชาร์จ) ตอนนี้ <strong class="text-rose-900">รับส่วนลดอุปกรณ์เสริม 10% ทันที</strong> (ระบบคำนวณให้อัตโนมัติ)',
                'Message Apply': 'ลูกค้าได้รับส่วนลดอุปกรณ์เสริม 10% เรียบร้อยแล้ว', 'Status': 'เปิด'
            }];
        }
        
        // เงื่อนไข Channel ร่วมรายการ (เว้นว่าง/'*'/'all' = ทุกช่องทาง) — tokenize เทียบทีละช่องทาง ตามรูปแบบเดียวกับ GiftMappings.Channel (rule 20)
        const chSelEl = document.getElementById('posChannelSelect');
        const currentChannel = (chSelEl ? chSelEl.value : '').toString().trim().toLowerCase();
        let activeRules = rules.filter(r => {
            if (!window.app.statusOn(r.Status)) return false;
            const ruleChRaw = (r['Channel'] || '').toString().trim();
            const ruleChTokens = ruleChRaw.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
            return ruleChRaw === '' || ruleChRaw === '*' || ruleChRaw.toLowerCase() === 'all' || ruleChTokens.includes(currentChannel);
        });

        let totalAutoDiscount = 0;
        let appliedRules = [];
        let suggestRules = [];
        
        let catTotals = {};
        let catCounts = {};
        this.cartData.forEach(item => {
            let cat = (item.Category || '').toString().trim();
            let p = parseFloat((item.Price||'0').toString().replace(/[^\d.\-]/g,''));
            catTotals[cat] = (catTotals[cat] || 0) + ((isNaN(p) ? 0 : p) * item.qty);
            catCounts[cat] = (catCounts[cat] || 0) + item.qty;
        });
        
        for (let rule of activeRules) {
            let buyCat = (rule['Buy Category'] || '').toString().trim();
            let getCat = (rule['Get Discount Category'] || '').toString().trim();
            let discountPct = parseFloat(rule['Discount Percent']) || 0;
            // ข้อความจากชีตแทรกเป็น HTML — ผ่าน safeRichText เสมอ (เหลือแค่ตัวหนา/ขึ้นบรรทัด กัน XSS จากผู้แก้กฎ)
            let msgSuggest = window.app.safeRichText(rule['Message Suggest'] || `เสนอขาย ${getCat} เพิ่ม รับส่วนลด ${discountPct}%`);
            let msgApply = window.app.safeRichText(rule['Message Apply'] || `ได้รับส่วนลด ${getCat} ${discountPct}% เรียบร้อยแล้ว`);
            
            if (catCounts[buyCat] > 0) {
                if (catCounts[getCat] > 0) {
                    let ruleDiscount = (catTotals[getCat] * discountPct) / 100;
                    totalAutoDiscount += ruleDiscount;
                    appliedRules.push({ msg: msgApply, val: ruleDiscount, pct: discountPct, getCat: getCat });
                } else {
                    suggestRules.push(msgSuggest);
                }
            }
        }
        
        if (appliedRules.length > 0) {
            let texts = appliedRules.map(r => r.msg + ` (ลดไป ฿${r.val.toLocaleString()})`).join('<br>');
            suggestBox.innerHTML = `
              <div class="bg-indigo-50 border border-indigo-200 rounded-xl p-3 shadow-sm flex items-start gap-3 transition-all">
                 <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center shrink-0 mt-0.5"><i class="fas fa-magic"></i></div>
                 <div>
                    <h6 class="text-[15px] font-bold text-indigo-800 leading-tight mb-1">Bundle Promotion ทำงานแล้ว!</h6>
                    <p class="text-[13px] text-indigo-700 leading-snug">${texts}</p>
                 </div>
              </div>
            `;
            suggestBox.classList.remove('hidden');
            autoRow.classList.remove('hidden');
            autoRow.classList.add('flex');
            if(autoDisp) autoDisp.innerText = '-฿' + totalAutoDiscount.toLocaleString();
            this.autoDiscountDesc = appliedRules.map(r => `${r.pct}% หมวด ${r.getCat}`).join(' + ');
        } else if (suggestRules.length > 0) {
            let texts = suggestRules.join('<br><br>');
            suggestBox.innerHTML = `
              <div class="bg-white border border-slate-200 border-l-4 border-l-[#FF6B00] rounded-xl p-3 shadow-sm flex items-start gap-3">

    toggleCart: function() {
        const drawer = document.getElementById('cartDrawer');
        const overlay = document.getElementById('cartOverlay');
        if(!drawer || !overlay) return;
        
        if (drawer.classList.contains('translate-x-full')) {
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                drawer.classList.remove('translate-x-full');
            }, 10);
        } else {
            drawer.classList.add('translate-x-full');
            overlay.classList.add('opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }
    },
    updateTotal: function() {
      let s = 0; this.cartData.forEach(i=>{ let price = parseFloat((i.Price||'0').toString().replace(/[^\d.\-]/g,'')); s += (isNaN(price)?0:price) * i.qty; });
      
      let d = 0;
      this.getPromoDiscounts().forEach(x => { d += x.value; });
      
      let autoDiscount = this.checkAutoPromotions();
      this.cartAutoDiscount = autoDiscount;
      
      let t = s - d - autoDiscount;
      const finalTot = (t>0?t:0).toLocaleString();
      if(document.getElementById('cartSubtotal')) document.getElementById('cartSubtotal').innerText = '฿'+s.toLocaleString(); 
      if(document.getElementById('cartDiscount')) document.getElementById('cartDiscount').innerText = '-฿'+d.toLocaleString(); 
      if(document.getElementById('cartTotal')) document.getElementById('cartTotal').innerText = '฿'+finalTot;
      if(document.getElementById('mobileStickyTotal')) document.getElementById('mobileStickyTotal').innerText = '฿'+finalTot;
      this.renderVoucherStrip();
    },
    // 8A.2 — จำลูกค้าเก่าจากเบอร์โทร: ครบ 10 หลักแล้วหน่วง 400ms ค่อยถาม server, เติมเฉพาะช่องที่ยังว่าง
    custLookupTimer: null,
    custLookupSeq: 0,
    onPhoneInput: function() {
      clearTimeout(this.custLookupTimer);
      const el = document.getElementById('coPhone');
      const digits = (el ? el.value : '').replace(/\D/g, '');
      if (digits.length !== 10) return;
      this.custLookupTimer = setTimeout(() => this.lookupCustomerByPhone(digits), 400);
    },
    lookupCustomerByPhone: async function(phone) {
      const seq = ++this.custLookupSeq; // แก้เบอร์ระหว่างรอผล = ผลเก่า stale ทิ้งไป ห้ามเอามาเติม
      const spin = document.getElementById('coPhoneSpin');
      if (spin) spin.classList.remove('hidden');
      try {
        const res = await window.app.api('GET_CUSTOMER_BY_PHONE', { phone: phone });
        if (seq !== this.custLookupSeq) return;
        if (res && res.status === 'success' && res.found) {
          let filled = false;
          const fillMap = { coCustomer: res.customerName, coEmail: res.email, coIdCard: res.idCard, coCodeHandraiser: res.codeHandraiser };
          Object.keys(fillMap).forEach(id => {
            const f = document.getElementById(id);
            if (f && !f.value.trim() && fillMap[id]) {
              f.value = fillMap[id];
              if (id === 'coIdCard' && window.app.formatIdCard) window.app.formatIdCard(f);
              filled = true;
            }
          });
          if (filled) window.app.toast('พบข้อมูลลูกค้าเดิม เติมข้อมูลให้แล้ว', 'success');
        }
      } catch (e) {
        console.warn('ค้นหาลูกค้าจากเบอร์ไม่สำเร็จ:', e); // autofill เป็นตัวช่วยเสริม — พลาดต้องเงียบ ห้ามรบกวนการคีย์ออเดอร์
      } finally {
        if (seq === this.custLookupSeq && spin) spin.classList.add('hidden');
      }
    },
    openCheckoutModal: function() {
      if (this.isBookingBlocked) {
        return Swal.fire('ไม่สามารถดำเนินการได้', this.bookingBlockedMessage || 'ไม่อยู่ในช่วงเวลาการจองสินค้า', 'warning');
      }
      const chSel = document.getElementById('posChannelSelect');
      const brSel = document.getElementById('posBranchSelect');
      if(this.cartData.length===0) return Swal.fire('ตะกร้าว่างเปล่า','กรุณาเลือกสินค้าลงตะกร้าก่อน','warning');
      if(!chSel || !chSel.value) return Swal.fire('ยังไม่เลือกช่องทาง','กรุณาเลือกช่องทางการขายก่อน','warning');
      if(!brSel || !brSel.value) return Swal.fire('ยังไม่เลือกสาขา','กรุณาเลือกสาขาที่ทำรายการก่อน','warning');
      
      const drawer = document.getElementById('cartDrawer');

          this.toggleCart();

      // 5B.2 — prefill ชื่อ/เบอร์พนักงานจากออเดอร์ก่อนหน้าของเครื่องนี้ (ไม่ทับค่าที่ผู้ใช้พิมพ์ค้างไว้)
      const stEl = document.getElementById('bkStaffName');

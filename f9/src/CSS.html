  .pos-storefront .sf-stock.low .sf-stock-bar > span { background: var(--pm-low, #c2410c); }
  .pos-storefront .pm-card .bnn-buy-btn, .pos-storefront .pm-cta-off { height: 40px; border-radius: 999px; font-size: 13px; font-weight: 600; letter-spacing: .01em; border: 1px solid transparent; }
  .pos-storefront .pm-card .bnn-buy-btn { background: var(--pm-btn, #111318); color: var(--pm-btn-fg, #fff); box-shadow: none; }
  .pos-storefront .pm-card .bnn-buy-btn i { font-size: 10px; transition: transform .25s var(--ease-out); }
  .pos-storefront .pm-card .bnn-buy-btn:hover { background: var(--pm-accent, #FF6B00); color: #fff; border-color: transparent; box-shadow: none; transform: none; }
  .pos-storefront .pm-card .bnn-buy-btn:hover i { transform: translateX(3px); }
  .pos-storefront .pm-cta-off { background: transparent; border-color: var(--pm-line, #e8e9ed); color: var(--pm-mute, #868c98); cursor: not-allowed; }
  .pos-storefront .bnn-discount-badge { top: 12px; left: 12px; background: var(--pm-btn, #111318); color: var(--pm-btn-fg, #fff); box-shadow: none; border-radius: 999px; padding: 4px 9px; font-size: 11px; font-weight: 600; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .pos-storefront .pm-soldout { padding: 7px 16px; border-radius: 999px; background: var(--pm-bg, #fff); color: var(--pm-ink, #111318); font-size: 12px; font-weight: 600; box-shadow: 0 6px 18px -8px rgba(15, 23, 42, .35); }
  .pos-storefront .pm-media > .absolute.inset-0 { background: rgba(245, 245, 247, .55); border-radius: inherit; backdrop-filter: none; -webkit-backdrop-filter: none; }
  html.dark .pos-storefront .pm-media > .absolute.inset-0 { background: rgba(15, 23, 42, .55) !important; }
  /* ปุ่มบนรูป: หัวใจมุมขวาบน, เทียบสเปคมุมขวาล่าง — เดสก์ท็อปโผล่เมื่อชี้การ์ด (ที่เลือกไว้แล้วแสดงตลอด), จอสัมผัสแสดงตลอด */
  .pos-storefront .pm-wish { top: 10px; right: 10px; bottom: auto; left: auto; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--pm-bg, #fff); color: var(--pm-ink-2, #454b57); font-size: 13px; box-shadow: 0 4px 12px -6px rgba(15, 23, 42, .35); }
  .pos-storefront .pm-wish:hover { transform: scale(1.08); }
  .pos-storefront .pm-wish.text-rose-500 { background: var(--pm-bg, #fff); }
  .pos-storefront .pm-wish .animate-pulse { animation: none; }
  .pos-storefront .pm-card .bnn-compare-btn { right: 10px; bottom: 10px; padding: 6px 11px; border-radius: 999px; border: 0; background: var(--pm-bg, #fff); color: var(--pm-ink-2, #454b57); font-size: 10.5px; font-weight: 600; box-shadow: 0 4px 12px -6px rgba(15, 23, 42, .35); }
  .pos-storefront .pm-card .bnn-compare-btn.active { background: var(--pm-btn, #111318) !important; color: var(--pm-btn-fg, #fff) !important; }
  .pos-storefront .pm-card .bnn-compare-btn.active i { color: inherit; }
  /* แสดงปุ่มหัวใจ/เทียบสเปคตลอดทุกอุปกรณ์ (เดิมซ่อนจนกว่าจะชี้การ์ด ทำให้ผู้ใช้มองไม่เห็น) และอยู่เหนือแสงตามเมาส์ */
  .pos-storefront .pm-wish, .pos-storefront .pm-card .bnn-compare-btn { z-index: 5; transition: transform .2s, background .2s, color .2s; }
  .pos-storefront .pm-card .bnn-compare-btn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--pm-line, #e8e9ed); }
  .pos-storefront .pm-card .bnn-compare-btn:hover { color: #E85F00; border-color: #FF6B00; }
  .pm-skel { padding: 0; }
  html.dark .pos-storefront .color-dot { border-color: rgba(255, 255, 255, .28); }

  /* เลขหน้า */
  html.sf-site .sf-pager { gap: 4px; padding: 16px 0 40px; }

  html.sf-site .sf-pager .sf-pg:hover:not(:disabled):not(.on) { background: var(--pm-well); border-color: transparent; color: var(--pm-ink); }
  html.sf-site .sf-pager .sf-pg.on { background: var(--pm-btn); border-color: var(--pm-btn); color: var(--pm-btn-fg); font-weight: 600; }

  /* ---------- แถบบริการของร้าน ---------- */
  .pm-trust { list-style: none; margin: 16px 0 0; padding: 28px 0 8px; border-top: 1px solid var(--pm-line, #e8e9ed); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 20px; }
  @media (min-width: 1024px) { .pm-trust { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px; padding-top: 36px; } }
  .pm-trust li { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
  .pm-trust i { font-size: 18px; color: var(--pm-ink, #111318); margin-top: 2px; width: 22px; text-align: center; flex-shrink: 0; }
  .pm-trust strong { display: block; font-size: 13.5px; font-weight: 600; color: var(--pm-ink, #111318); }
  .pm-trust span { display: block; font-size: 12px; line-height: 1.5; color: var(--pm-mute, #868c98); margin-top: 2px; }

  /* ---------- หน้าต่างเลือกช่องทาง/สาขา ---------- */
  .pm-gate-ico { width: 56px; height: 56px; border-radius: 18px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: var(--pm-well, #f5f5f7); color: var(--pm-ink, #111318); }
  html.sf-site #criteriaOverlay, html.sf-site #bookingBlockOverlay { background: color-mix(in srgb, var(--pm-bg) 92%, transparent); }
  html.sf-site #criteriaOverlay > div, html.sf-site #bookingBlockOverlay > div { border-color: var(--pm-line); box-shadow: 0 30px 60px -30px rgba(15, 23, 42, .3); border-radius: 24px; padding: 36px 32px; }

  /* ---------- หน้าต่างรายละเอียดสินค้า: ลดสี เหลือสีหมึก + ปุ่มหลักส้มปุ่มเดียว ---------- */
  html.sf-site #addToCartModal .sf-dlg-ico { display: none; }
  .pm-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--pm-accent-ink, #c2410c); margin-bottom: 8px; }

  /* ---------- Footer ---------- */
  html.sf-site .pos-footer { margin-top: 56px; }
  html.sf-site .pf-grid { padding-top: 48px; padding-bottom: 32px; }
  html.sf-site .pf-logo { background: rgba(255, 255, 255, .1); }
  html.sf-site .pf-h { font-weight: 600; letter-spacing: .1em; font-size: 11px; color: #94a3b8; }
  html.sf-site .pf-links button, html.sf-site .pf-contact { font-weight: 400; }
  html.sf-site .pf-links button:hover, html.sf-site .pf-contact a:hover { color: #fff; }
  html.sf-site .pf-trust li { font-weight: 500; }

  /* แถบลอย (เทียบสเปค / ตะกร้ามือถือ) */
  html.sf-site #posCompareBar { border-color: var(--pm-line); border-radius: 20px; }

  /* ===================================================
     VIVID LAYER — เติมสีสัน + ลูกเล่น ทับบล็อก PREMIUM (ต้องอยู่ท้ายสุด; ใช้เฉพาะ html.sf-site = หน้าร้าน)
     สีหลักไล่เฉดส้ม→ชมพูแดง (--pm-grad) · เฉดรองฟ้า/เขียว/ม่วง ใช้กับป้ายและไอคอนหมวดให้แยกกันออก
     แอนิเมชันทั้งหมดใช้ transform/opacity/background-position เท่านั้น และปิดทั้งหมดเมื่อผู้ใช้ตั้ง prefers-reduced-motion
     =================================================== */
  html.sf-site {
    --pm-grad: #FF6B00;
    --pm-grad-hover: #E85F00;
    --pm-glow: 0 6px 14px -8px rgba(255, 107, 0, .45);
  }
  @keyframes pmFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  @keyframes pmSlide { from { background-position: 0 0; } to { background-position: 200% 0; } }
  @keyframes pmShine { from { background-position: 160% 0; } to { background-position: -60% 0; } }
  @keyframes pmRise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes pmPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: .65; } }
  @keyframes pmPop { 0% { transform: scale(.4); } 55% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @keyframes pmBadge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @keyframes pmKen { from { transform: scale(1); } to { transform: scale(1.08); } }
  @keyframes pmBump { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }

  /* พื้นหลัง: แสงสีจางๆ มุมจอ แทนพื้นขาวล้วน */
  html.sf-site:not(.dark) body { background: #ffffff; }
  html.sf-site.dark body { background: #0f172a; }

  /* แถบบนสุด: กรมท่าไล่เฉด + เส้นสีวิ่งใต้แถบ */
  html.sf-site .sf-topbar::before { background: #0f2a43; }
  html.sf-site .sf-topbar-msg i { color: #FF9A3D; }

  /* Header: โปร่งแสง + เบลอพื้นหลังเมื่อเลื่อนผ่านใต้ */
  html.sf-site .pos-store-header::before { background: color-mix(in srgb, var(--sf-hdr) 84%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.5); backdrop-filter: blur(14px) saturate(1.5); }
  html.sf-site .pos-search:focus { background: var(--pm-bg); border-color: #FF6B00; box-shadow: 0 0 0 4px rgba(255, 107, 0, .16); }
  html.sf-site .pos-search-wrap:focus-within .pos-search-ico { color: #FF6B00; }
  html.sf-site .pos-cart-btn { background: var(--pm-grad); color: #fff; box-shadow: var(--pm-glow); transition: transform .2s var(--ease-out), box-shadow .2s, filter .2s; }
  html.sf-site .pos-cart-btn:hover { background: var(--pm-grad-hover); color: #fff; transform: translateY(-1px); }
  html.sf-site .pos-cart-count { background: #fff; color: #C2410C; min-width: 22px; height: 22px; }
  html.sf-site .pos-cart-btn:hover .pos-cart-count { background: #fff; color: #C2410C; }
  html.sf-site .pos-cart-btn:hover .fa-shopping-basket { animation: pmBump .5s var(--ease-out); }
  html.sf-site .sf-badge { background: var(--pm-grad); color: #fff; }
  html.sf-site .sf-nav-a:hover { color: #E85F00; }
  html.sf-site .sf-nav-a.on { color: #E85F00; }
  html.sf-site .sf-nav-a.on::after { height: 3px; border-radius: 3px; background: var(--pm-grad); }
  html.sf-site .sf-logo { background: var(--pm-grad); color: #fff; }

  /* แถบแคมเปญ Pre Booking: กรมท่า→ม่วงเข้ม→แดงเข้ม เคลื่อนไหวช้าๆ + แสงวาบผ่าน */
  html.sf-site #posTimerBanner { background: #0f2a43; border: 0; box-shadow: none; }
  html.sf-site .bnn-flash-emblem { background: var(--pm-grad); border: 0; color: #fff; border-radius: 999px; }
  html.sf-site .bnn-flash-emblem i { color: #fff !important; }
  html.sf-site #posCampaignTitleText { color: #FFB37A; }
  html.sf-site .bnn-timer-box { background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .2); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  html.sf-site .bnn-timer-box.bnn-timer-sec { background: var(--pm-grad); border-color: transparent; }
  html.sf-site .bnn-timer-box.bnn-timer-sec span + span { color: #ffe9dd !important; }

  /* แบนเนอร์หลัก: ซูมช้าๆ + ฟิล์มสีกรมท่า + ปุ่มไล่เฉด */
  html.sf-site #posHeroBannerWrap { box-shadow: 0 28px 50px -28px rgba(15, 42, 67, .55); animation: pmRise .6s var(--ease-out) both; }
  html.sf-site #posHeroTrack > div { overflow: hidden; }
  html.sf-site #posHeroTrack img { animation: pmKen 14s ease-in-out infinite alternate; }
  .pm-hero-cap { background: linear-gradient(to top, rgba(15, 42, 67, .88), rgba(15, 42, 67, .3) 60%, transparent); }
  .pm-hero-cta { background: var(--pm-grad); color: #fff; box-shadow: var(--pm-glow); transition: transform .2s var(--ease-out); }
  #posHeroTrack > div:hover .pm-hero-cta { transform: translateX(4px) scale(1.04); }
  .pm-hdot.on { background: #FF6B00; width: 26px; }
  html.sf-site #posHeroBannerWrap button[aria-label^="แบนเนอร์"] { background: rgba(255, 255, 255, .9); color: #0f2a43; }
  html.sf-site #posHeroBannerWrap button[aria-label^="แบนเนอร์"]:hover { background: #fff; transform: translateY(-50%) scale(1.1); }

  /* หัวข้อ: แท่งสีไล่เฉดหน้าชื่อ */
  .pm-sec-title::before { content: ''; display: inline-block; width: 5px; height: .95em; margin-right: 10px; border-radius: 3px; vertical-align: -.1em; background: var(--pm-grad); }

  /* การ์ดสินค้า: แท่นรูปไล่เฉดพีช→ฟ้า, ยกตัว + เรืองแสงส้มเมื่อชี้ */

  /* ===================================================
     MOTION LAYER 2 — เอฟเฟกต์ที่ตอบสนองต่อเมาส์/การเลื่อนหน้า (JS ใน JS_Boot.html ตั้งตัวแปร --mx --my --rx --ry เฉพาะจอที่มีเมาส์)
     =================================================== */
  @keyframes pmAurora { from { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); } to { transform: translate3d(-3%, 3%, 0) rotate(7deg) scale(1.08); } }
  @keyframes pmBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pmSheen { from { transform: translateX(-130%) skewX(-20deg); } to { transform: translateX(260%) skewX(-20deg); } }
  @keyframes pmFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  /* แสงสีลอยช้าๆ ด้านหลังเนื้อหา (ทำให้พื้นหลังไม่นิ่ง) */

  /* แถบความคืบหน้าการเลื่อนหน้า (ใช้ scroll-driven animation; เบราว์เซอร์ที่ไม่รองรับจะไม่แสดง) */
  @supports (animation-timeline: scroll()) {
    html.sf-site::before { content: ''; position: fixed; z-index: 120; top: 0; left: 0; right: 0; height: 3px; pointer-events: none; transform-origin: 0 50%; background: var(--pm-grad); box-shadow: 0 0 10px rgba(255, 90, 40, .6); transform: scaleX(0); animation: pmBar linear both; animation-timeline: scroll(root block); }
  }

  /* การ์ดสินค้า: เข้าฉากทีละใบ (ใช้ backwards เพื่อไม่ล็อก transform หลังจบ) */
  html.sf-site .pos-storefront .pm-card { animation: pmRise .5s var(--ease-out) backwards; }
  html.sf-site .pos-storefront .pm-card:nth-child(2) { animation-delay: 50ms; } html.sf-site .pos-storefront .pm-card:nth-child(3) { animation-delay: 100ms; }
  html.sf-site .pos-storefront .pm-card:nth-child(4) { animation-delay: 150ms; } html.sf-site .pos-storefront .pm-card:nth-child(5) { animation-delay: 200ms; }
  html.sf-site .pos-storefront .pm-card:nth-child(n+6) { animation-delay: 250ms; }

  /* แสงตามเมาส์บนแท่นรูปสินค้า + เอียง 3 มิติเล็กน้อย */
  html.sf-site .pos-storefront .pm-media::after { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .3s;
    background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, .55), transparent 65%); }
  html.sf-site .pos-storefront .pm-card:hover .pm-media::after { opacity: 1; }
  html.sf-site.dark .pos-storefront .pm-media::after { background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 160, 90, .22), transparent 65%); }
  @media (hover: hover) and (pointer: fine) {
    html.sf-site .pos-storefront .pm-media { transform-style: preserve-3d; will-change: transform; }
    html.sf-site .pos-storefront .pm-card:hover .pm-media { transform: perspective(800px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-6px); transition: transform .12s linear, box-shadow .35s, background .35s; }
  }
  html.sf-site .pos-storefront .pm-card:active .pm-media { transform: translateY(-2px) scale(.985); }

  /* คูปอง: แสงตามเมาส์ */

  html.sf-site .bnn-flash-emblem { position: relative; overflow: hidden; }

  /* ไอคอนในแถบบริการลอยเบาๆ สลับจังหวะ */
  .pm-trust i { animation: pmFloat 4s ease-in-out infinite; }
  .pm-trust li:nth-child(2) i { animation-delay: .5s; } .pm-trust li:nth-child(3) i { animation-delay: 1s; } .pm-trust li:nth-child(4) i { animation-delay: 1.5s; }

  /* แถบแบรนด์ (pos.renderBrandStrip): ชิปกลมเลื่อนแนวนอน, ไอคอนตัวอักษรแรกไล่สีตามชื่อแบรนด์ (--h = เฉดสี) */
  .sf-brand-row { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x proximity; }
  .sf-brand-chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 9px; padding: 7px 12px 7px 8px; border-radius: 999px; border: 1px solid var(--pm-line); background: var(--pm-bg); color: var(--pm-ink); font-size: 13px; font-weight: 600; cursor: pointer; scroll-snap-align: start; transition: transform .2s var(--ease-out), box-shadow .2s, border-color .2s, background .2s, color .2s; }
  .sf-brand-chip:hover { transform: translateY(-2px); border-color: #0f2a43; }

  .sf-brand-chip.on .sf-brand-ic { background: rgba(255, 255, 255, .28); }

  /* ป้าย NEW / ขายดี บนรูปสินค้า (มุมซ้ายล่าง) + ป้าย NEW บนการ์ดชั้น "สินค้าใหม่" */
  .pm-flags { position: absolute; left: 10px; bottom: 10px; z-index: 4; display: flex; gap: 5px; pointer-events: none; }
  .pm-flag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 800; letter-spacing: .04em; color: #fff; line-height: 1.4; }
  .pm-flag-new { background: #0f2a43; }
  .pm-flag-hot { background: #0f2a43; }
  .pm-flag-hot i { font-size: 10px; color: #FF9A3D; }
  .sf-new-card { position: relative; }
  .sf-new-tag { position: absolute; top: 8px; left: 8px; z-index: 2; padding: 2px 9px; border-radius: 999px; background: #0f2a43; color: #fff; font-size: 10px; font-weight: 800; letter-spacing: .06em; }

  /* หน้าโปรโมชั่นทั้งหมด (promoHubModal): กริดแบนเนอร์แคมเปญ + การ์ดคูปอง/ซื้อคู่ */
  .pm-sec-more { margin-left: auto; align-self: center; border: 0; background: none; color: #E85F00; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap; padding: 4px 2px; }

  .sf-promo-grid-sm { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .sf-camp { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; padding: 0; border-radius: 18px; overflow: hidden; cursor: pointer; background: var(--pm-well); text-align: left; box-shadow: 0 14px 28px -20px rgba(15, 42, 67, .7); transition: transform .25s var(--ease-out), box-shadow .25s; animation: pmRise .45s var(--ease-out) backwards; }
  .sf-camp:nth-child(2) { animation-delay: 50ms; } .sf-camp:nth-child(3) { animation-delay: 100ms; } .sf-camp:nth-child(n+4) { animation-delay: 150ms; }
  .sf-camp img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease-out); }
  .sf-camp:hover { transform: translateY(-4px); box-shadow: 0 22px 34px -22px rgba(15, 42, 67, .7); }
  .sf-camp:hover img { transform: scale(1.06); }
  .sf-camp-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 14px 12px; display: flex; flex-direction: column; gap: 2px; background: linear-gradient(to top, rgba(15, 42, 67, .88), transparent); color: #fff; }
  .sf-camp-cap b { font-size: 14px; font-weight: 700; }

  .sf-promo-coupon .pm-v-name { white-space: normal; }

  .sf-brand-row { scrollbar-width: none; } .sf-brand-row::-webkit-scrollbar { display: none; }

  /* MOTION LAYER 3 — ลากเมาส์ผ่านสินค้า: การ์ดข้างเคียงหรี่ลง, ชื่อ/ราคา/รูป/ปุ่มตอบสนอง */
  @keyframes pmBob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  @keyframes pmPop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .pos-storefront .pm-card { transition: opacity .3s ease, filter .3s ease; }
  .pos-storefront .pm-name { transition: color .2s ease; }
  .pos-storefront .pm-price { display: inline-block; transform-origin: left center; transition: transform .25s var(--ease-out); }
  .pos-storefront .pm-card .sf-swatch { transition: transform .2s var(--ease-out), box-shadow .2s; }
  .pos-storefront .pm-card .sf-swatch:hover { transform: scale(1.35); box-shadow: 0 0 0 2px rgba(255, 107, 0, .45); }
  .pos-storefront .pm-wish, .pos-storefront .pm-card .bnn-compare-btn { opacity: .92; }
  .pos-storefront .sf-pop-card, .pos-storefront .sf-news-card { transition: transform .25s var(--ease-out), box-shadow .25s, border-color .25s; }
  .pos-storefront .sf-pop-card:hover, .pos-storefront .sf-news-card:hover { transform: translateY(-4px); box-shadow: 0 16px 28px -14px rgba(15, 23, 42, .35); }
  .pos-storefront .sf-pop-card:active, .pos-storefront .sf-news-card:active { transform: translateY(-1px) scale(.985); }
  @media (hover: hover) and (pointer: fine) {
    .pos-storefront :has(> .pm-card:hover) > .pm-card:not(:hover) { opacity: .62; filter: saturate(.8); }
    .pos-storefront .pm-card:hover .pm-name { color: var(--pm-accent, #FF6B00); }
    .pos-storefront .pm-card:hover .pm-price { transform: scale(1.06); }
    .pos-storefront .pm-card:hover .pm-media > img { animation: pmBob 2.6s ease-in-out .35s infinite; }
    .pos-storefront .pm-card:hover .pm-wish, .pos-storefront .pm-card:hover .bnn-compare-btn { opacity: 1; transform: translateY(-2px); }
    .pos-storefront .pm-card:hover .bnn-discount-badge, .pos-storefront .pm-card:hover .bnn-deal-badge { animation: pmPop .4s var(--ease-out) both; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pos-storefront .pm-card:hover .pm-media > img, .pos-storefront .pm-card:hover .bnn-discount-badge, .pos-storefront .pm-card:hover .bnn-deal-badge { animation: none; }
    .pos-storefront :has(> .pm-card:hover) > .pm-card:not(:hover) { opacity: 1; filter: none; }
  }

  /* ปุ่มกลับขึ้นบน + หัวใจรายการโปรด: เด้งตอบสนอง */
  html.sf-site #backToTopBtn { transition: transform .2s var(--ease-out), box-shadow .2s; }

  html.sf-site .pos-storefront .pm-wish:active { transform: scale(.85); }

  @media (prefers-reduced-motion: reduce) {
    html.sf-site *, html.sf-site *::before, html.sf-site *::after { animation: none !important; }
    html.sf-site .pos-storefront .pm-card:hover .pm-media { transform: translateY(-6px) !important; }

  /* CLEAN CARD — การ์ดสินค้าแบบเรียบ: ตัวเลือกสี+ความจุแถวเดียว, ราคา+ราคาเดิม+ประหยัดแถวเดียว, โปรโมชั่นเป็นข้อความบรรทัดเดียว (ไม่มีป้ายหลายสี)
     สีที่ใช้บนหน้าร้าน: ส้ม #FF6B00 = ปุ่มหลัก/ลิงก์, กรมท่า #0f2a43 = ป้ายสถานะ, แดง #E11D48 = ส่วนลดเท่านั้น */
  .pos-storefront .pm-vars { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding-top: 2px; }
  .pos-storefront .pm-pricerow { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; margin-bottom: 6px; }
  .pos-storefront .pm-strike { font-size: 11.5px; color: var(--pm-mute, #868c98); text-decoration: line-through; }
  .pos-storefront .pm-promo { margin-bottom: 6px; font-size: 11.5px; font-weight: 500; line-height: 1.5; color: var(--pm-ink-2, #454b57); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pos-storefront .pm-promo i { margin-right: 6px; font-size: 10px; color: #FF6B00; }
  html.dark .pos-storefront .pm-promo { color: #cbd5e1; }
  html.dark .pos-storefront .pm-strike { color: #94a3b8; }
  /* ปุ่มเทียบสเปคบนรูป: จอที่มีเมาส์แสดงเมื่อชี้การ์ด (หรือกำลังเทียบอยู่/โฟกัสด้วยคีย์บอร์ด) — จอสัมผัสแสดงตลอด */
  @media (hover: hover) and (pointer: fine) {
    .pos-storefront .pm-card .bnn-compare-btn:not(.active) { opacity: 0; }
    .pos-storefront .pm-card:hover .bnn-compare-btn, .pos-storefront .pm-card .bnn-compare-btn:focus-visible { opacity: 1; }
  }
  /* หน้าต่างเงื่อนไข/นโยบาย (window.app.openPolicy) + แถบยืนยันการรับทราบในหน้ายืนยันการจอง */
  .pol-body { text-align: left; font-size: 14px; line-height: 1.75; color: var(--ink-2); max-height: 60vh; overflow-y: auto; padding: 2px 6px 2px 2px; overflow-wrap: anywhere; }
  .pol-body b, .pol-body strong { color: #0f172a; }
  html.dark .pol-body b, html.dark .pol-body strong { color: #f1f5f9; }
  .co-consent { padding: 12px 32px; background: #f8fafc; border-top: 1px solid #e2e8f0; font-size: 13px; font-weight: 500; color: var(--ink-2); text-align: left; }
  .co-consent label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
  .co-consent input { width: 18px; height: 18px; margin-top: 1px; flex: 0 0 auto; accent-color: #FF6B00; cursor: pointer; }
  .co-consent button { font-weight: 700; color: #C2410C; text-decoration: underline; text-underline-offset: 3px; }
  .co-consent button:hover { color: #9a3412; }
  html.dark .co-consent { background: #1e293b; border-top-color: #334155; }
  html.dark .co-consent button { color: #FFB37A; }
  /* ===================================================
     SIDEBAR v2 — แถบเมนูหลังร้าน (เดสก์ท็อป #desktopSidebar): พื้นขาวล้วน, ไอคอนในกรอบสี่เหลี่ยมมน, รายการที่เลือก = พื้นฟ้าอ่อน + กรอบไอคอนกรมท่า + แถบส้ม
     ทับ utility class ของ Tailwind ที่ buildMenu/route ใส่ไว้ (bg-indigo-600 / text-white ...) จึงต้องใช้ !important — เมนูมือถือ (#mobileMenu) ไม่เกี่ยว
     =================================================== */
  #desktopSidebar { background: #ffffff; -webkit-backdrop-filter: none; backdrop-filter: none; border-right: 1px solid #e8ecf1; box-shadow: none; }
  #desktopSidebar > div:first-child { padding: 16px 14px 14px 16px; border-bottom-color: #eef1f5; }
  #desktopSidebar #sidebarLogoBox { width: 38px; height: 38px; border-radius: 11px; box-shadow: none; }
  #desktopSidebar #sidebarLogoBox:has(.app-logo-img) { border: 1px solid #e8ecf1; }
  #desktopSidebar > div:first-child span.font-black { font-size: 15px; font-weight: 700; letter-spacing: 0; color: #0f172a; }
  .sb-tag { font-size: 11px; font-weight: 500; line-height: 1.3; color: #94a3b8; }
  #desktopMenu { padding: 10px 10px 16px; }
  #desktopMenu > * + * { margin-top: 2px !important; }
  #desktopMenu .nav-link, #desktopMenu > div > button { min-height: 44px; padding: 6px 10px 6px 8px !important; border-radius: 11px; font-size: 13.5px !important; font-weight: 600 !important; color: #334155 !important; background: transparent; transition: background-color .15s, color .15s; }
  #desktopMenu .nav-link:hover, #desktopMenu > div > button:hover { background: #f4f6f9 !important; color: #0f2a43 !important; }
  #desktopMenu .nav-link > i, #desktopMenu > div > button > span > i { flex: 0 0 auto; width: 30px; height: 30px; margin-right: 10px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; background: #f1f4f8; color: #475569; font-size: 13px; opacity: 1; transition: background-color .15s, color .15s; }
  #desktopMenu .nav-link:hover > i, #desktopMenu > div > button:hover > span > i { background: #e6ebf2; color: #0f2a43; }
  #desktopMenu .nav-th { line-height: 1.3; }
  #desktopMenu .nav-sub { margin-top: 1px; font-size: 10.5px !important; font-weight: 500 !important; line-height: 1.3; color: #94a3b8; opacity: 1 !important; }
  #desktopMenu > div > button > i.fa-chevron-down { color: #94a3b8; opacity: 1; margin-left: 6px; }
  /* รายการที่เลือกอยู่ */
  #desktopMenu .nav-link.active-link { background: #eef3f8 !important; color: #0f2a43 !important; font-weight: 700 !important; }
  #desktopMenu .nav-link.active-link > i { background: #0f2a43; color: #ffffff; }
  #desktopMenu .nav-link.active-link .nav-sub { color: #64748b; }
  #desktopMenu .nav-link.active-link::before { left: 0; top: 11px; bottom: 11px; width: 3px; border-radius: 0 3px 3px 0; }
  /* หัวข้อกลุ่มเมนู */
  #desktopMenu > div[class*="uppercase"] { padding: 16px 10px 6px !important; margin-top: 0 !important; font-size: 10.5px !important; font-weight: 700 !important; letter-spacing: .08em; color: #94a3b8 !important; }
  /* เมนูย่อย: เส้นนำสายตาด้านซ้ายแทนกล่องสีเทา */
  #desktopMenu [id^="desk-sub-"] { margin: 2px 0 6px 22px !important; padding: 0 0 0 10px !important; background: transparent !important; border-left: 1px solid #e2e8f0; border-radius: 0 !important; }
  #desktopMenu [id^="desk-sub-"] > * + * { margin-top: 1px !important; }
  #desktopMenu [id^="desk-sub-"] .nav-link { min-height: 38px; padding: 5px 8px !important; font-size: 13px !important; }
  #desktopMenu [id^="desk-sub-"] .nav-link > i { width: 18px; height: auto; margin-right: 8px; background: transparent !important; color: #94a3b8; font-size: 12px; }
  #desktopMenu [id^="desk-sub-"] .nav-link.active-link > i { color: #0f2a43; }
  #desktopMenu [id^="desk-sub-"] .nav-link.active-link::before { left: -11px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; }
  #desktopMenu [id^="desk-sub-"] > div[class*="uppercase"] { padding: 10px 8px 4px !important; margin-top: 0 !important; font-size: 10px !important; font-weight: 700 !important; letter-spacing: .08em; color: #94a3b8 !important; }
  /* การ์ดผู้ใช้ด้านล่าง */
  #desktopSidebar #userMenuWrap { padding: 10px; background: #ffffff; border-top-color: #eef1f5; }
  #desktopSidebar #userMenuBtn { padding: 8px; border-radius: 12px; }
  #desktopSidebar #userMenuBtn:hover { background: #f4f6f9; border-color: transparent; box-shadow: none; }
  #desktopSidebar #userMenuBtn > div:first-child { width: 36px; height: 36px; background: #eef3f8; border: 0; box-shadow: none; }
  #desktopSidebar #userMenuBtn > div:first-child i { color: #0f2a43; }
  #desktopSidebar #headerRole { color: #94a3b8; font-weight: 600; letter-spacing: .06em; }
  /* โหมดมืด */
  html.dark #desktopSidebar { background: #0f172a; border-right-color: #1e293b; }
  html.dark #desktopSidebar > div:first-child { border-bottom-color: #1e293b; }
  html.dark #desktopSidebar > div:first-child span.font-black { color: #f1f5f9; }
  html.dark #desktopMenu .nav-link, html.dark #desktopMenu > div > button { color: #cbd5e1 !important; }
  html.dark #desktopMenu .nav-link:hover, html.dark #desktopMenu > div > button:hover { background: #1e293b !important; color: #ffffff !important; }
  html.dark #desktopMenu .nav-link > i, html.dark #desktopMenu > div > button > span > i { background: #1e293b; color: #cbd5e1; }
  html.dark #desktopMenu .nav-link:hover > i, html.dark #desktopMenu > div > button:hover > span > i { background: #334155; color: #ffffff; }
  html.dark #desktopMenu .nav-sub { color: #64748b; }
  html.dark #desktopMenu .nav-link.active-link { background: #1e293b !important; color: #ffffff !important; }
  html.dark #desktopMenu .nav-link.active-link > i { background: #f1f5f9; color: #0f172a; }
  html.dark #desktopMenu .nav-link.active-link .nav-sub { color: #94a3b8; }
  html.dark #desktopMenu [id^="desk-sub-"] { border-left-color: #334155; }
  html.dark #desktopMenu [id^="desk-sub-"] .nav-link.active-link > i { color: #ffffff; }
  html.dark #desktopSidebar #userMenuWrap { background: #0f172a; border-top-color: #1e293b; }
  html.dark #desktopSidebar #userMenuBtn:hover { background: #1e293b; }
  html.dark #desktopSidebar #userMenuBtn > div:first-child { background: #1e293b; }
  html.dark #desktopSidebar #userMenuBtn > div:first-child i { color: #cbd5e1; }

  /* ===================================================
     PRODUCT DETAIL PAGE — หน้ารายละเอียดสินค้าเต็มจอ (#addToCartModal.pd-page; เปิด/ปิดด้วย showModal/hideModal เหมือน popup เดิม)
     โครง: .pd-head (กลับ + เส้นทาง) / .pd-scroll (รูป + ข้อมูล + แท็บ) / .pd-bar (ราคา + เพิ่มลงตะกร้า ติดขอบล่าง)
     ห้ามตั้ง display ให้ .pd-page หรือองค์ประกอบที่สลับด้วย .hidden โดยตรง — ใช้ :not(.hidden) เพื่อไม่ทับ .hidden ของ Tailwind
     =================================================== */
  .pd-page { background: #ffffff; }
  .pd-shell { height: 100%; display: flex; flex-direction: column; background: #ffffff; text-align: left; color: #0f172a; }
  .pd-head { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 10px 16px; }
  .pd-back, .pd-head-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: #0f172a; transition: background-color .15s, border-color .15s; }
  .pd-back { border: 1px solid #e2e8f0; background: #ffffff; }
  .pd-back:hover, .pd-head-btn:hover { background: #f4f6f9; }
  .pd-head-btn { color: #334155; }
  .pd-head-btn.pd-x { width: 38px; padding: 0; justify-content: center; font-size: 16px; }
  .pd-crumb { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; font-size: 13px; color: #64748b; }
  .pd-crumb button { flex: 0 0 auto; font-weight: 500; color: #64748b; }
  .pd-crumb button:hover { color: #0f172a; text-decoration: underline; text-underline-offset: 3px; }
  .pd-crumb i { flex: 0 0 auto; font-size: 9px; color: #cbd5e1; }
  .pd-crumb span { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 600; color: #0f172a; }
  .pd-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .pd-wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
  .pd-top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
  @media (min-width: 900px) {
    .pd-wrap { padding: 32px 24px 64px; }
    .pd-top { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 56px; align-items: start; }
    .pd-gallery { position: sticky; top: 0; }
    /* จอเตี้ย: ย่อรูปลงเพื่อให้เห็นแถบแท็บ (ของแถมที่ต้องเลือก) โดยไม่ต้องเลื่อน */
    .pd-gallery .pd-stage { max-height: min(560px, max(280px, calc(100vh - 330px))); padding: 5%; }
  }
  /* รูปสินค้า */
  .pd-stage { position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 560px; display: flex; align-items: center; justify-content: center; padding: 8%; background: #f5f6f8; border-radius: 20px; overflow: hidden; }
  .pd-stage > img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .pd-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; align-items: center; justify-content: center; border-radius: 50%; background: #ffffff; color: #0f172a; box-shadow: 0 4px 14px -6px rgba(15, 23, 42, .35); }
  .pd-nav:not(.hidden) { display: flex; }
  .pd-nav:hover { background: #f4f6f9; }
  .pd-prev { left: 12px; } .pd-next { right: 12px; }
  .pd-thumbs { gap: 10px; margin-top: 12px; padding: 2px; overflow-x: auto; scrollbar-width: none; }
  .pd-thumbs:not(.hidden) { display: flex; }
  .pd-thumbs::-webkit-scrollbar { display: none; }
  .pd-thumbs img { flex: 0 0 auto; width: 68px; height: 68px; padding: 5px; object-fit: contain; background: #f5f6f8; border: 2px solid transparent; border-radius: 12px; cursor: pointer; transition: border-color .15s; }
  .pd-thumbs img:hover { border-color: #cbd5e1; }
  .pd-thumbs img.border-indigo-500 { border-color: #0f2a43 !important; transform: none; }
  /* ข้อมูลสินค้า */
  .pd-brand { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #868c98; }
  #addToCartModal #modalProdName { margin: 6px 0 16px; font-size: 24px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em; color: #0f172a; }
  @media (min-width: 900px) { #addToCartModal #modalProdName { font-size: 30px; } }
  .pd-pricebox { padding: 16px 0; border-top: 1px solid #eef1f5; border-bottom: 1px solid #eef1f5; }
  .pd-pricerow { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; margin-top: 4px; }
  #addToCartModal #modalProdPrice { font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: -.02em; color: #0f172a; }
  .pd-pricemeta { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .pd-strike { font-size: 15px; color: #868c98; text-decoration: line-through; }
  .pd-save { padding: 2px 8px; border-radius: 6px; background: #E11D48; color: #ffffff; font-size: 12.5px; font-weight: 700; }
  .pd-instline { margin-top: 8px; font-size: 13.5px; color: #454b57; }
  .pd-instline:empty { display: none; }
  .pd-instline i { margin-right: 6px; color: #868c98; }
  .pd-instline button { margin-left: 8px; font-weight: 600; color: #C2410C; text-decoration: underline; text-underline-offset: 3px; }
  .pd-vars { margin-top: 20px; gap: 16px; }
  .pd-vars:not(.hidden) { display: grid; }
  .pd-var-lb { margin-bottom: 8px; font-size: 13px; font-weight: 600; color: #0f172a; }
  .pd-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .pd-opts button { padding: 9px 16px !important; border-radius: 10px !important; font-size: 13.5px !important; font-weight: 600 !important; line-height: 1.3; }
  .pd-opts > span { font-size: 13px !important; }
  .pd-qty { margin-top: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid #e8ecf1; border-radius: 12px; }

  .pd-qty #modalProdStock { margin-left: 6px; font-weight: 500; color: #059669; }
  .pd-qty-in { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #64748b; }
  .pd-qty-in input { width: 64px; padding: 7px 6px; text-align: center; font-size: 15px; font-weight: 700; color: #0f172a; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 10px; }
  .pd-actions { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .pd-actions:empty { display: none; }
  .pd-actions button { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid #e2e8f0; border-radius: 10px; background: #ffffff; font-size: 13px; font-weight: 600; color: #0f172a; transition: background-color .15s, border-color .15s; }
  .pd-actions button:hover { background: #f4f6f9; border-color: #cbd5e1; }
  .pd-actions button i { color: #868c98; }
  /* แท็บ */
  .pd-tabs { margin-top: 40px; display: flex; gap: 4px; border-bottom: 1px solid #e8ecf1; overflow-x: auto; scrollbar-width: none; scroll-margin-top: 8px; }
  .pd-tabs::-webkit-scrollbar { display: none; }
  .pd-tab { flex: 0 0 auto; margin-bottom: -1px; padding: 12px 16px; border-bottom: 2px solid transparent; font-size: 14px; font-weight: 600; color: #64748b; white-space: nowrap; transition: color .15s, border-color .15s; }
  .pd-tab:hover { color: #0f172a; }
  .pd-tab.on { color: #0f172a; border-bottom-color: #FF6B00; }
  .pd-panel { padding-top: 24px; }
  .pd-hint { margin: 0 0 14px; font-size: 13px; line-height: 1.6; color: #64748b; }
  .pd-inst + .pd-hint { margin: 14px 0 0; }
  .pd-empty { padding: 24px; text-align: center; font-size: 14px; color: #868c98; background: #f8fafc; border-radius: 12px; }
  .pd-gifts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  @media (min-width: 768px) { .pd-gifts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .pd-giftbox { padding: 16px; border: 1px solid #e8ecf1; border-radius: 14px; }
  .pd-giftbox h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: #0f172a; }
  .pd-giftbox h3 i { margin-right: 6px; color: #868c98; }
  #addToCartModal .pd-giftbox label { font-size: 13px !important; font-weight: 500 !important; }
  #addToCartModal .pd-giftbox label span { font-size: 11px !important; }
  #addToCartModal .pd-giftbox input[type="number"] { width: 60px; font-size: 13px !important; }
  #addToCartModal .pd-giftbox > div > div { box-shadow: none; }
  .pd-spec { margin: 0; }
  .pd-spec > div { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 12px 0; border-bottom: 1px solid #eef1f5; font-size: 14px; line-height: 1.6; }
  @media (min-width: 640px) { .pd-spec > div { grid-template-columns: 180px minmax(0, 1fr); gap: 16px; } }
  .pd-spec dt { font-weight: 500; color: #64748b; }
  .pd-spec dd { margin: 0; color: #0f172a; overflow-wrap: anywhere; }
  .pd-inst { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .pd-inst-opt { display: flex; flex-direction: column; gap: 4px; padding: 14px 12px; text-align: center; border: 1px solid #e8ecf1; border-radius: 12px; }
  .pd-inst-opt.hot { border-color: #0f2a43; box-shadow: inset 0 0 0 1px #0f2a43; }
  .pd-inst-opt span { font-size: 12.5px; color: #64748b; }
  .pd-inst-opt b { font-size: 18px; font-weight: 700; color: #0f172a; }
  .pd-inst-opt small { margin-left: 2px; font-size: 11px; font-weight: 500; color: #868c98; }
  .pd-terms { max-width: 760px; font-size: 14px; line-height: 1.75; color: #334155; overflow-wrap: anywhere; }
  .pd-terms b, .pd-terms strong { color: #0f172a; }
  /* แถบล่างติดขอบจอ */
  .pd-bar { flex: 0 0 auto; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: #ffffff; border-top: 1px solid #e8ecf1; }
  .pd-bar-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  #pdBarImg { flex: 0 0 auto; width: 46px; height: 46px; padding: 3px; object-fit: contain; background: #f5f6f8; border-radius: 10px; }
  .pd-bar-txt { flex: 1 1 auto; min-width: 0; }
  #pdBarName { font-size: 13px; color: #454b57; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pdBarPrice { font-size: 18px; font-weight: 700; line-height: 1.3; color: #0f172a; }
  .pd-bar-quote { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px; border-radius: 12px; font-size: 13.5px; }
  .pd-bar-cta { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 24px; border-radius: 12px; background: #FF6B00; color: #ffffff; font-size: 15px; font-weight: 700; transition: background-color .15s; }
  .pd-bar-cta:hover { background: #E85F00; }
  @media (max-width: 640px) {
    .pd-back span, #shareProductBtn span, .pd-bar-quote span, #pdBarImg { display: none; }
    .pd-back { width: 38px; padding: 0; justify-content: center; }
    .pd-crumb > *:not(:last-child) { display: none; }
    .pd-bar-quote { width: 46px; padding: 0; justify-content: center; }
    .pd-bar-cta { padding: 0 18px; }
    .pd-inst-opt b { font-size: 15px; }
  }
  /* โหมดมืด */
  html.dark .pd-page, html.dark .pd-shell, html.dark .pd-bar { background: #0f172a; color: #f1f5f9; }
  html.dark .pd-bar, html.dark .pd-tabs, html.dark .pd-pricebox, html.dark .pd-spec > div { border-color: #1e293b; }
  html.dark .pd-back { background: #0f172a; border-color: #334155; }
  html.dark .pd-back, html.dark .pd-head-btn, html.dark .pd-crumb span, html.dark #addToCartModal #modalProdName, html.dark #addToCartModal #modalProdPrice,
  html.dark .pd-var-lb, html.dark .pd-qty label, html.dark .pd-tab.on, html.dark .pd-tab:hover, html.dark .pd-giftbox h3, html.dark .pd-spec dd, html.dark .pd-inst-opt b,
  html.dark #pdBarPrice, html.dark .pd-terms b, html.dark .pd-terms strong { color: #f1f5f9; }
  html.dark .pd-back:hover, html.dark .pd-head-btn:hover { background: #1e293b; }
  html.dark .pd-stage, html.dark .pd-thumbs img, html.dark #pdBarImg, html.dark .pd-empty { background: #1e293b; }
  html.dark .pd-thumbs img.border-indigo-500 { border-color: #f1f5f9 !important; }
  html.dark .pd-nav { background: #334155; color: #f1f5f9; }
  html.dark .pd-instline, html.dark #pdBarName, html.dark .pd-terms, html.dark .pd-hint { color: #cbd5e1; }
  html.dark .pd-instline button { color: #FFB37A; }
  html.dark .pd-qty, html.dark .pd-giftbox, html.dark .pd-inst-opt { border-color: #334155; }
  html.dark .pd-inst-opt.hot { border-color: #f1f5f9; box-shadow: inset 0 0 0 1px #f1f5f9; }
  html.dark .pd-qty-in input { background: #1e293b; border-color: #334155; color: #f1f5f9; }
  html.dark .pd-actions button { background: #0f172a; border-color: #334155; color: #f1f5f9; }
  html.dark .pd-actions button:hover { background: #1e293b; }

  /* ===================================================
     INTL 1 — หน้าร้านแบบเว็บ e-commerce สากล (ต้องอยู่ท้ายสุด; ทับ PREMIUM / VIVID / MOTION / CLEAN CARD ด้านบน)
     หลัก: (1) สีส้มใช้กับ "ปุ่มหลักหนึ่งปุ่มต่อหน้าจอ" เท่านั้น — ตะกร้าใน header และปุ่มบนการ์ดจึงไม่เป็นส้มทึบ
           (2) มุมโค้ง 3 ระดับ: ปุ่ม/ช่องกรอก 8px, การ์ด/กล่อง 12px, ป้าย 6px — แคปซูลเหลือเฉพาะชิปตัวกรอง/แบรนด์และป้ายจำนวน
           (3) การ์ดนิ่ง: ไม่เอียง 3 มิติ ไม่ลอย ไม่หรี่การ์ดข้างเคียง — ตอบสนองแค่สีพื้นรูปและขีดเส้นใต้ชื่อ
     สีทั้งหมดอ้างตัวแปร --pm-* ซึ่งสลับตามโหมดมืดอยู่แล้ว (สีที่เขียนตรงๆ มีกฎ html.dark คู่ไว้ท้ายบล็อก)
     =================================================== */
  html.sf-site { --r-ctl: 8px; --r-card: 12px; --r-tag: 6px; }

  /* แถบความคืบหน้าการเลื่อนหน้า (เส้นส้มเรืองแสงบนสุด) — เอาออก */
  @supports (animation-timeline: scroll()) { html.sf-site::before { content: none; } }

  /* วงโฟกัสคีย์บอร์ด (ช่องกรอกมีวงของตัวเองอยู่แล้ว) */
  html.sf-site #page-content :is(button, a, summary, [role="link"]):focus-visible { outline: 2px solid #0f2a43; outline-offset: 2px; }
  html.sf-site.dark #page-content :is(button, a, summary, [role="link"]):focus-visible { outline-color: #f1f5f9; }

  /* ---------- Header ---------- */
  html.sf-site .pos-search { border-radius: var(--r-ctl); }
  html.sf-site .pos-search:focus { border-color: var(--pm-ink); box-shadow: 0 0 0 3px rgba(17, 19, 24, .08); }
  html.sf-site .pos-search-wrap:focus-within .pos-search-ico { color: var(--pm-ink); }
  html.sf-site .sf-icon-btn { border-radius: var(--r-ctl); font-weight: 600; }
  /* ตะกร้า = ปุ่มไอคอนแบบเดียวกับรายการโปรด/บัญชี + ป้ายจำนวนสีส้ม */
  html.sf-site .pos-cart-btn { position: relative; height: 46px; min-width: 46px; padding: 0 12px; border-radius: var(--r-ctl); background: transparent; color: var(--pm-ink); border: 0; box-shadow: none; font-size: 13px; font-weight: 600; transition: background .15s; }
  html.sf-site .pos-cart-btn > i { font-size: 19px; }
  html.sf-site .pos-cart-btn:hover { background: var(--pm-well); color: var(--pm-ink); transform: none; }
  html.sf-site .pos-cart-btn:hover .fa-shopping-basket { animation: none; }
  html.sf-site .pos-cart-lbl { display: none; color: inherit; }
  html.sf-site .pos-cart-count, html.sf-site .pos-cart-btn:hover .pos-cart-count { position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; padding: 0 4px; background: #FF6B00; color: #fff; font-size: 10px; font-weight: 700; border: 0; box-shadow: 0 0 0 2px var(--sf-hdr, #fff); }
  @media (min-width: 1280px) {
    html.sf-site .pos-cart-lbl { display: inline; }
    html.sf-site .pos-cart-count, html.sf-site .pos-cart-btn:hover .pos-cart-count { position: static; box-shadow: none; }
  }
  @media (max-width: 639px) { html.sf-site .pos-cart-btn { height: 42px; min-width: 40px; padding: 0 8px; } }
  html.sf-site .pos-where-chip { border-radius: var(--r-ctl); }
  html.sf-site .sf-nav-a { border-radius: var(--r-ctl); }
  html.sf-site .sf-nav-a.on::after { height: 2px; border-radius: 0; }
  html.sf-site .sf-acct-pop { border-radius: var(--r-card); }

  /* ---------- แถบแคมเปญ + แบนเนอร์ ---------- */
  html.sf-site #posTimerBanner { border-radius: var(--r-card); padding: 8px 14px; }
  html.sf-site .bnn-flash-emblem { border-radius: var(--r-tag); }
  html.sf-site .bnn-timer-box { border-radius: var(--r-tag); }
  html.sf-site #posHeroBannerWrap { border: 0; border-radius: var(--r-card); box-shadow: none; }
  html.sf-site #posHeroTrack img { animation: none; }
  .pm-hero-cta { border-radius: var(--r-ctl); box-shadow: none; }
  #posHeroTrack > div:hover .pm-hero-cta { transform: none; }

  /* ---------- หัวข้อ section: ไม่มีขีดสีนำหน้า, คำอธิบายลงบรรทัดใหม่ ---------- */
  .pm-sec-title::before { content: none; }
  html.sf-site .pm-sec-head { flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin-bottom: 16px; }
  html.sf-site .pm-sec-title { font-size: 20px; font-weight: 600; line-height: 1.3; }
  @media (min-width: 768px) { html.sf-site .pm-sec-title { font-size: 24px; } }
  html.sf-site .pm-sec-sub { order: 3; flex-basis: 100%; font-size: 13px; }
  /* ส่วนที่อยู่ใต้รายการสินค้า (คูปอง/ข่าว/ดูล่าสุด) */
  html.sf-site .sf-after { margin-top: 32px; margin-bottom: 0; }
  @media (min-width: 768px) { html.sf-site .sf-after { margin-top: 48px; } }
  html.sf-site .sf-after:empty { margin-top: 0; }

  /* ---------- คูปอง / ชั้นสินค้า / ไทล์หมวด ---------- */
  html.sf-site .bnn-voucher-card { border-radius: var(--r-card); padding-left: 16px; }
  html.sf-site .bnn-voucher-card::before { content: none; }
  html.sf-site .bnn-voucher-card:hover { transform: none; box-shadow: none; border-color: var(--pm-ink); }
  html.sf-site .pm-v-btn { border-radius: var(--r-ctl); box-shadow: none; }
  html.sf-site .bnn-voucher-card:hover .pm-v-btn { transform: none; }
  html.sf-site .sf-pop-card { border-radius: var(--r-card); }
  html.sf-site .sf-pop-card:hover, html.sf-site .pos-storefront .sf-pop-card:hover, html.sf-site .pos-storefront .sf-news-card:hover { transform: none; box-shadow: none; }
  html.sf-site .sf-pop-card:hover { background: var(--pm-well-2); }
  html.sf-site .sf-news-img { border-radius: var(--r-card); box-shadow: none; }
  html.sf-site .sf-news-card:hover .sf-news-img { transform: none; }
  html.sf-site .pm-recent-item { border-radius: var(--r-ctl); }
  html.sf-site .pm-recent-item:hover { transform: none; box-shadow: none; }
  html.sf-site .sf-cattiles .sf-tile { border-radius: var(--r-card); }
  html.sf-site .sf-cattiles .sf-tile:hover { transform: none; box-shadow: none; }

  /* ---------- ตัวกรอง / เลขหน้า ---------- */
  html.sf-site .pos-storefront .sf-price-go { background: var(--pm-btn); color: var(--pm-btn-fg); border-radius: var(--r-ctl); }
  html.sf-site .sf-pager .sf-pg { border-radius: var(--r-ctl); }

  /* ---------- การ์ดสินค้า ---------- */
  html.sf-site .pos-storefront .pm-card { animation: none; }
  /* เดสก์ท็อป: ปุ่ม "ดูรายละเอียด" จองที่ไว้ใต้การ์ดแล้ว จึงลดระยะระหว่างแถว */
  @media (hover: hover) and (pointer: fine) and (min-width: 1024px) { html.sf-site #productGrid .pos-storefront.grid { row-gap: 20px; } }
  html.sf-site .pos-storefront .pm-card.pm-open { cursor: pointer; }
  html.sf-site .pos-storefront :has(> .pm-card:hover) > .pm-card:not(:hover) { opacity: 1; filter: none; }
  html.sf-site .pos-storefront .pm-media { border-radius: var(--r-card); background: var(--pm-well); transform: none; will-change: auto; transition: background .2s; }
  html.sf-site .pos-storefront .pm-card:hover .pm-media, html.sf-site .pos-storefront .pm-card:active .pm-media { transform: none !important; box-shadow: none; background: var(--pm-well-2); }
  html.sf-site .pos-storefront .pm-media::after { content: none; }
  html.sf-site .pos-storefront .pm-media > img { filter: none; transition: transform .2s ease-out; }
  html.sf-site .pos-storefront .pm-card:hover .pm-media > img { transform: scale(1.03); animation: none; }
  html.sf-site .pos-storefront .pm-card:hover .pm-name, html.sf-site .pos-storefront .pm-name[role="link"]:hover { color: var(--pm-ink); }
  html.sf-site .pos-storefront .pm-card.pm-open:hover .pm-name { text-decoration: underline; text-underline-offset: 3px; }
  html.sf-site .pos-storefront .pm-price { font-size: 18px; }
  @media (min-width: 768px) { html.sf-site .pos-storefront .pm-price { font-size: 20px; } }
  html.sf-site .pos-storefront .pm-card:hover .pm-price { transform: none; }
  html.sf-site .pos-storefront .pm-chip { border-radius: var(--r-tag); }
  html.sf-site .pos-storefront .color-dot:hover, html.sf-site .pos-storefront .pm-card .sf-swatch:hover { transform: scale(1.15); box-shadow: none; }
  html.sf-site .pos-storefront .bnn-discount-badge { top: 10px; left: 10px; border-radius: var(--r-tag); }
  html.sf-site .pos-storefront .pm-card:hover .bnn-discount-badge, html.sf-site .pos-storefront .pm-card:hover .bnn-deal-badge { animation: none; }
  html.sf-site .pm-flag, html.sf-site .sf-new-tag { border-radius: var(--r-tag); }
  html.sf-site .pos-storefront .pm-soldout { border-radius: var(--r-ctl); box-shadow: none; }
  html.sf-site .pos-storefront .pm-card .bnn-compare-btn { border-radius: var(--r-ctl); box-shadow: none; }
  html.sf-site .pos-storefront .pm-card .bnn-compare-btn:hover { color: var(--pm-ink); border-color: var(--pm-ink); }
  html.sf-site .pos-storefront .pm-card:hover .pm-wish, html.sf-site .pos-storefront .pm-card:hover .bnn-compare-btn { transform: none; }
  /* ปุ่มบนการ์ด = ปุ่มรอง "ดูรายละเอียด" (ทั้งการ์ดกดได้อยู่แล้ว): จอที่มีเมาส์โผล่เมื่อชี้/โฟกัส, จอสัมผัสและจอแคบไม่แสดง */
  html.sf-site .pos-storefront .pm-card .pm-view, html.sf-site .pos-storefront .pm-cta-off { height: 40px; border-radius: var(--r-ctl); }
  html.sf-site .pos-storefront .pm-card .pm-view { background: var(--pm-bg); color: var(--pm-ink); border: 1px solid var(--pm-line); box-shadow: none; font-weight: 600; transition: opacity .15s, background .15s, border-color .15s; }
  html.sf-site .pos-storefront .pm-card .pm-view::after { content: none; }
  html.sf-site .pos-storefront .pm-card .pm-view:hover, html.sf-site .pos-storefront .pm-card .pm-view:active { background: var(--pm-well); color: var(--pm-ink); border-color: var(--pm-ink); transform: none; box-shadow: none; }
  @media (hover: hover) and (pointer: fine) and (min-width: 1024px) {
    html.sf-site .pos-storefront .pm-card .pm-view { opacity: 0; }
    html.sf-site .pos-storefront .pm-card:hover .pm-view, html.sf-site .pos-storefront .pm-card:focus-within .pm-view { opacity: 1; }
  }
  @media (hover: none), (pointer: coarse), (max-width: 1023px) {
    html.sf-site .pos-storefront .pm-card .pm-view, html.sf-site .pos-storefront .pm-cta-off { display: none; }
    html.sf-site .pos-storefront .sf-stock { margin-bottom: 0; }
  }

  /* ---------- แถบบริการท้ายหน้า / footer: นิ่ง ---------- */
  .pm-trust i { animation: none; }
  .pm-trust li:hover { transform: none; }
  html.sf-site .pf-links button:hover { transform: none; }

  /* ---------- แถบเปรียบเทียบ: มือถือย่อเหลือ จำนวน + ปุ่มเปิดตาราง + ล้าง (ไม่บังสินค้า) ---------- */
  html.sf-site #posCompareBar { border-radius: var(--r-card); box-shadow: 0 12px 28px -14px rgba(15, 23, 42, .35); }
  html.sf-site #posCompareBar button[onclick*="openCompareModal"] { background: var(--pm-btn); color: var(--pm-btn-fg); border-radius: var(--r-ctl); box-shadow: none; }
  html.sf-site #posCompareBar button[onclick*="openCompareModal"]:hover { opacity: .88; }
  html.sf-site #posCompareBar button[onclick*="clearCompare"] { border-radius: var(--r-ctl); }
  @media (max-width: 639px) {
    html.sf-site #posCompareBar { padding: 6px 8px; gap: 8px; }
    html.sf-site #posCompareBar #posCompareSlots { display: none; }
    html.sf-site #posCompareBar > div:first-child { display: flex; border-right: 0; padding-right: 0; }
  }
  html.sf-site.dark #posCompareBar { background: #1e293b; border-color: #334155; }
  html.sf-site.dark #posCompareBar > div:first-child div { color: #e2e8f0; }

  /* ===================================================
     INTL 2 — หน้าว่าง / ข้อความแจ้งเตือน / หน้ารายละเอียดสินค้า (ต่อจาก INTL 1)
     =================================================== */
  /* หน้าว่างของตะกร้า/รายการโปรด: ไอคอนเส้น + หนึ่งประโยค + ปุ่มรองหนึ่งปุ่ม */
  .sf-blank { min-height: 260px; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .sf-blank > i { margin-bottom: 16px; font-size: 32px; color: #cbd5e1; }
  .sf-blank-t { font-size: 15px; font-weight: 600; color: #0f172a; }
  .sf-blank-s { margin-top: 4px; max-width: 260px; font-size: 13px; line-height: 1.5; color: #64748b; }
  .sf-blank-btn { margin-top: 20px; height: 40px; padding: 0 20px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  html.dark .sf-blank > i { color: #475569; }
  html.dark .sf-blank-t { color: #f1f5f9; }
  html.dark .sf-blank-s { color: #94a3b8; }

  /* ข้อความแจ้งเตือน (window.app.toast) บนหน้าร้าน: กล่องขาวมุม 8px เส้นขอบบาง — ไม่มีเงาหนา */
  html.sf-site .swal2-container .swal2-popup.swal2-toast { border-radius: 8px !important; border: 1px solid #e5e7eb; box-shadow: 0 10px 24px -14px rgba(15, 23, 42, .35) !important; padding: 10px 14px; }
  html.sf-site .swal2-container.swal2-top-end { top: 8px; }
  html.sf-site.dark .swal2-container .swal2-popup.swal2-toast { border-color: #334155; }

  /* หน้ารายละเอียด: ตัวเลือกที่เลือก = ขอบกรมท่า 2px พื้นขาว (ไม่ทึบ), สีมีจุดสีจริงคู่ชื่อ */
  .pd-opts button { display: inline-flex; align-items: center; gap: 8px; border-radius: 8px !important; }
  .pd-opts button.pd-on { background: #ffffff !important; color: #0f172a !important; border-color: #0f2a43 !important; box-shadow: inset 0 0 0 1px #0f2a43 !important; }
  .pd-dot { flex: 0 0 auto; width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(15, 23, 42, .2); }
  html.dark .pd-opts button.pd-on { background: #0f172a !important; color: #f1f5f9 !important; border-color: #f1f5f9 !important; box-shadow: inset 0 0 0 1px #f1f5f9 !important; }
  html.dark .pd-dot { border-color: rgba(255, 255, 255, .35); }
  .pd-actions button, .pd-bar-quote, .pd-bar-cta { border-radius: 8px; }
  /* แถวความเชื่อมั่นใต้ตัวเลือก: ไอคอน + ข้อความ ไม่มีกรอบ */
  .pd-trust { list-style: none; margin: 20px 0 0; padding: 16px 0 0; border-top: 1px solid #eef1f5; display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: #454b57; }
  .pd-trust li { display: inline-flex; align-items: center; gap: 8px; }
  .pd-trust i { font-size: 13px; color: #0f2a43; }
  html.dark .pd-trust { border-top-color: #1e293b; color: #cbd5e1; }
  html.dark .pd-trust i { color: #cbd5e1; }
  /* สินค้าใกล้เคียง */
  .pd-related { margin-top: 48px; padding-top: 32px; border-top: 1px solid #e8ecf1; }
  .pd-rel-h { margin-bottom: 16px; font-size: 20px; font-weight: 600; color: #0f172a; }
  .pd-rel-row { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x proximity; }
  .pd-rel-card { flex: 0 0 168px; display: flex; flex-direction: column; gap: 4px; text-align: left; scroll-snap-align: start; }
  .pd-rel-img { display: flex; align-items: center; justify-content: center; aspect-ratio: 1 / 1; margin-bottom: 6px; padding: 14%; border-radius: 12px; background: #f5f6f8; transition: background .2s; }

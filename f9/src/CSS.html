<style>
  /* ===================================================
     ENTERPRISE E-COMMERCE DESIGN SYSTEM
     Premium UI - Dark Nav + Light Content
     =================================================== */

  /* === CSS Custom Properties === */
  :root {
    /* รอบปรับโทน "พรีเมี่ยม" (2026-07-10): slate-navy เข้ม+เรียบหรู แทน indigo สดเดิม — ให้ตรงกับ Tailwind indigo scale ที่แก้ใน Index.html */
    --color-primary: #366891;
    --color-primary-dark: #254d71;
    --color-primary-darker: #1b3a59;
    --color-primary-light: #5485ad;
    --color-primary-bg: #eef3f8;
    --color-accent: #06b6d4;
    --color-accent-dark: #0891b2;
    --color-success: #10b981;
    --color-success-bg: #ecfdf5;
    --color-warning: #f59e0b;
    --color-warning-bg: #fffbeb;
    --color-danger: #f43f5e;
    --color-danger-bg: #fff1f2;
    --color-surface: #ffffff;
    --color-surface-secondary: #f8fafc;
    --color-border: #e2e8f0;
    --color-border-light: #f1f5f9;
    --color-text-primary: #0f172a;
    --color-text-secondary: #475569;
    --color-text-muted: #94a3b8;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.03), 0 1px 3px 0 rgb(0 0 0 / 0.04);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.03);
    --shadow-lg: 0 10px 25px -3px rgb(0 0 0 / 0.06), 0 4px 10px -4px rgb(0 0 0 / 0.04);
    --shadow-xl: 0 20px 40px -8px rgb(0 0 0 / 0.08), 0 8px 16px -6px rgb(0 0 0 / 0.04);
    --shadow-glow: 0 0 20px -5px rgba(37, 77, 113, 0.25);
    --radius-sm: 0.5rem;
    --radius-md: 0.75rem;
    --radius-lg: 1rem;
    --radius-xl: 1.25rem;
    /* รอบ "แบนราบ" (flatten, สไตล์ pbzf8): ลด 2xl/3xl ให้ตรงกับ borderRadius override ใน Tailwind config (Index.html)
       เพราะ .chart-card/.login-card/.swal2-popup ฯลฯ อ้างอิง var() ตรงนี้ ไม่ผ่าน Tailwind class */
    --radius-2xl: 0.625rem;
    --radius-3xl: 0.75rem;
    --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
    --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
    --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* === Base Styles === */
  body {
    font-family: Roboto, 'Helvetica Neue', Helvetica, Tahoma, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    /* รอบ "แบนราบ": พื้นหลังเดิมเป็น gradient พาสเทลไล่สี ทำให้การ์ดแบบทึบ (ไม่ blur แล้ว) ดูขัดกัน — เปลี่ยนเป็นพื้นเรียบสีเดียว */
    background: var(--color-surface-secondary);
  }

  /* === Custom Scrollbar - Ultra Refined === */
  .custom-scrollbar::-webkit-scrollbar { 
    width: 0.3cm; 
    height: 0.3cm; 
  }
  .custom-scrollbar::-webkit-scrollbar-track { 
    background: transparent; 
    border-radius: 10px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #b8cee1, #85abc9);
    border-radius: 10px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, #85abc9, #5485ad);
  }

  /* Global scrollbar */
  ::-webkit-scrollbar { width: 0.3cm; height: 0.3cm; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* === Premium Animations === */
  .animate-fade-in { 
    animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
  }
  .animate-fade-in-up { 
    animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
  }
  
  @keyframes fadeIn { 
    from { opacity: 0; } 
    to { opacity: 1; } 
  }
  @keyframes fadeInUp {
    from { 
      opacity: 0; 
      transform: translateY(20px) scale(0.98); 
    }
    to { 
      opacity: 1; 
      transform: translateY(0) scale(1); 
    }
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
  }
  @keyframes gradient-shift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes countUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* === Skeleton Loading === */
  .skeleton {
    background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 37%, #f1f5f9 63%);
    background-size: 400% 100%;
    animation: shimmer 1.8s infinite ease-in-out;
    border-radius: var(--radius-lg);
  }

  /* === Premium Glass Navigation === */
  .glass-nav {
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    box-shadow: var(--shadow-sm);
  }

  /* === KPI Cards - Premium Gradient System === */
  /* รอบ "แบนราบ" (flatten, สไตล์ pbzf8): เอา radial-glow (::after) กับพื้นหลัง gradient ออก
     เหลือพื้นผิวเรียบสีเดียว + เส้นซ้ายสีคาดตามหมวด (accent) เป็นตัวแยกความหมายแทน */
  .kpi-gradient-total {
    background: var(--color-surface);
    border-left: 4px solid var(--color-primary);
  }
  .kpi-gradient-mob {
    background: var(--color-surface);
    border-left: 4px solid var(--color-success);
  }
  .kpi-gradient-acc {
    background: var(--color-surface);
    border-left: 4px solid #64748b;
  }
  .kpi-gradient-resT {
    background: var(--color-surface);
    border-left: 4px solid var(--color-warning);
  }
  .kpi-gradient-resF {
    background: var(--color-surface);
    border-left: 4px solid #3b82f6;
  }
  .kpi-gradient-aov {
    background: var(--color-surface);
    border-left: 4px solid #a855f7;
  }
  .kpi-gradient-conv {
    background: var(--color-surface);
    border-left: 4px solid #10b981;
  }

  /* === SweetAlert Enterprise Theme === */
  .swal2-popup {
    border-radius: var(--radius-2xl) !important;
    font-family: Roboto, 'Helvetica Neue', Helvetica, Tahoma, Arial, sans-serif !important;
    box-shadow: var(--shadow-md) !important;
    padding: 2.25rem !important;
    border: 1px solid var(--color-border) !important;
  }
  .swal2-title { 
    font-size: 1.3rem !important; 
    color: var(--color-text-primary) !important; 
    font-weight: 800 !important; 
    letter-spacing: -0.025em !important;
  }
  .swal2-html-container { 
    font-size: 0.925rem !important; 
    color: var(--color-text-secondary) !important; 
    line-height: 1.7 !important;
  }
  .swal2-actions { 
    margin-top: 1.75rem !important; 
    gap: 0.75rem !important; 
  }
  .swal2-styled.swal2-confirm {
    background: var(--color-primary-dark) !important;
    border-radius: var(--radius-lg) !important;
    font-weight: 700 !important;
    padding: 0.75rem 1.75rem !important;
    font-size: 0.875rem !important;
    box-shadow: var(--shadow-sm) !important;
    border: none !important;
    transition: all var(--transition-fast) !important;
  }
  .swal2-styled.swal2-confirm:hover {
    background: var(--color-primary-darker) !important;
  }
  .swal2-styled.swal2-cancel { 
    background: var(--color-surface) !important; 
    color: var(--color-text-secondary) !important; 
    border: 1px solid var(--color-border) !important; 
    border-radius: var(--radius-lg) !important; 
    font-weight: 700 !important; 
    padding: 0.75rem 1.75rem !important; 
    font-size: 0.875rem !important;
    transition: all var(--transition-fast) !important;
  }
  .swal2-styled.swal2-cancel:hover {
    background: var(--color-surface-secondary) !important;
    border-color: #cbd5e1 !important;
  }

  /* === Data Table - Enterprise Grade === */
  #dataTable {
    border-spacing: 0;
  }
  /* ===== สไตล์ตารางแบบ Otis CMS (อ้างอิง otis.tg.co.th/superapp/banner) — ใช้กับตารางทุกหน้าใน #page-content =====
     หัวตาราง: พื้น #f3f6f9 ไม่ใหญ่/ไม่ตัวพิมพ์ใหญ่ 13px ตัวหนา 600 · แถว: เส้นคั่นบาง #e9ebec ไม่มีเส้นแนวตั้ง ตัวอักษร 13px
     ใช้ !important เพราะหัวตารางแต่ละหน้าเขียน Tailwind class (bg-indigo-50, text-[10px], uppercase ฯลฯ) ไว้เอง
     สีตัวหนังสือหัวตารางใช้ #495057 (เข้มกว่า Otis ที่ #878a99) ตามที่ตั้งค่าตัวอักษรเทาเป็นดำเข้มไว้ */
  #page-content table:not(#invTable) thead,
  #page-content table:not(#invTable) thead tr { background: #f3f6f9 !important; backdrop-filter: none !important; }
  #page-content table:not(#invTable) thead tr { border-bottom: 0 !important; }
  #page-content table:not(#invTable) th {
    background: #f3f6f9 !important;
    color: #495057 !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    text-transform: none !important;
    letter-spacing: normal !important;
    padding: 12px 16px !important;
    border: 0 !important;
    border-bottom: 1px solid #e9ebec !important;
    white-space: nowrap;
  }
  #page-content table:not(#invTable) tbody tr { border-bottom: 1px solid #e9ebec !important; transition: background-color var(--transition-fast); }
  #page-content table:not(#invTable) tbody tr:hover { background-color: rgba(243, 246, 249, 0.7) !important; }
  #page-content table:not(#invTable) tbody td {
    font-size: 13px;
    color: #212529;
    padding: 12px 16px;
    border-color: #e9ebec;
  }
  #dataTable { border-spacing: 0; }
  #dataTable th { position: sticky; top: 0; z-index: 10; }

  /* ===== หน้าจัดการเนื้อหา (แบนเนอร์/ข่าวสาร/หมวดหมู่ข่าว) สไตล์ Otis CMS — JS_Cms.html ===== */
  .cms-page { max-width: 100%; }
  .cms-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .cms-head h1 { font-size: 1.05rem; font-weight: 700; color: var(--ink-2); margin: 0; }
  .cms-crumb { font-size: 12px; color: #495057; }
  .cms-card { background: #fff; border-radius: 4px; box-shadow: 0 1px 2px rgba(56, 65, 74, 0.15); padding: 20px 24px 16px; }
  .cms-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .cms-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; border-radius: 4px; padding: 8px 16px; font-size: 13px; font-weight: 500; color: #fff; cursor: pointer; box-shadow: 0 3px 3px rgba(56, 65, 74, 0.1); transition: filter 0.15s; }
  .cms-btn:hover { filter: brightness(0.95); }
  .cms-btn-sm { padding: 4px 10px; font-size: 12px; box-shadow: none; }
  .cms-btn-green { background: #45cb85; }
  .cms-btn-red { background: #f7a58f; }
  .cms-btn-outline { background: #fff; color: #405189; border-color: #405189; }
  .cms-btn-line { background: #fff; color: #405189; border-color: #ced4da; }
  .cms-search { border: 1px solid #e9ebec; border-radius: 4px; margin-bottom: 14px; }
  .cms-search-h { background: #f3f6f9; padding: 10px 14px; font-size: 13px; font-weight: 600; border-bottom: 1px solid #e9ebec; color: #212529; }
  .cms-search-b { padding: 12px 14px; }
  .cms-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 16px; margin-bottom: 10px; }
  .cms-fl label, .cms-f label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; color: #212529; }
  .cms-search-btns { display: flex; gap: 6px; }
  .cms-in { width: 100%; border: 1px solid #ced4da; border-radius: 3px; padding: 5px 8px; font-size: 12px; background: #fff; color: #212529; }
  .cms-in:disabled { background: #f3f6f9; }
  .cms-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; font-size: 12px; color: #212529; }
  .cms-sel, .cms-quick { border: 1px solid #ced4da; border-radius: 3px; padding: 3px 8px; font-size: 12px; background: #fff; color: #212529; }
  .cms-quick { width: 190px; }
  .cms-wrap { overflow-x: auto; }
  .cms-table { width: 100%; border-collapse: collapse; white-space: nowrap; }
  .cms-table th.cms-sortable { cursor: pointer; user-select: none; }
  .cms-table th.cms-sortable::after { content: ' \2195'; opacity: 0.35; font-size: 11px; }
  .cms-table th.cms-asc::after { content: ' \2191'; opacity: 1; }
  .cms-table th.cms-desc::after { content: ' \2193'; opacity: 1; }
  .cms-table td, .cms-table th { vertical-align: middle; }
  .cms-c-chk { width: 36px; text-align: center !important; }
  .cms-c-act { white-space: nowrap; }
  .cms-sel-row { background: rgba(69, 203, 133, 0.08); }
  .cms-empty { text-align: center; padding: 28px 12px !important; color: #878a99; }
  .cms-thumb { width: 72px; height: 40px; object-fit: cover; border-radius: 3px; border: 1px solid #e9ebec; background: #f3f6f9; display: block; }
  .cms-link { color: #405189; font-weight: 500; text-decoration: none; }
  .cms-link:hover { text-decoration: underline; }
  .cms-muted { color: #878a99; }
  .cms-seq { width: 58px; border: 1px solid #ced4da; border-radius: 3px; padding: 5px 6px; font-size: 13px; text-align: center; background: #fff; color: #212529; }
  .cms-badge { display: inline-block; padding: 3px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; color: #fff; }
  .cms-b-green { background: #45cb85; } .cms-b-amber { background: #f7b84b; } .cms-b-gray { background: #878a99; } .cms-b-red { background: #f06548; }
  .cms-ico { border: 1px solid #ced4da; background: #fff; color: #405189; border-radius: 4px; width: 28px; height: 28px; font-size: 12px; cursor: pointer; margin-right: 4px; }
  .cms-ico-red { color: #f06548; }
  .cms-foot { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; font-size: 12px; color: #212529; }
  .cms-pager { display: flex; gap: 4px; flex-wrap: wrap; }
  .cms-pg { border: 1px solid #ced4da; background: #fff; color: #405189; border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .cms-pg:disabled { color: #adb5bd; cursor: default; }
  .cms-pg-on { background: #405189; color: #fff; border-color: #405189; }
  .cms-form { text-align: left; max-height: 62vh; overflow-y: auto; padding: 2px 4px; }
  .cms-f { margin-bottom: 10px; }
  .cms-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cms-hint { font-size: 11px; color: #878a99; margin: 2px 0 0; }
  .cms-imgrow { display: flex; gap: 10px; align-items: flex-start; }
  .cms-prev { width: 96px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid #e9ebec; }
  .cms-imgctl { flex: 1; display: grid; gap: 6px; font-size: 12px; }
  @media (max-width: 640px) { .cms-card { padding: 14px 12px; } .cms-two { grid-template-columns: 1fr; } }

  /* === UI Input Focus Effects === */
  input:focus, select:focus, textarea:focus {
    box-shadow: 0 0 0 3px rgba(37, 77, 113, 0.12), 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important;
    border-color: var(--color-primary) !important;
    outline: none !important;
  }

  /* === Active Navigation State === */
  .nav-link.active-link {
    background: var(--color-primary-dark) !important;
    color: #ffffff !important;
    font-weight: 700 !important;
  }
  /* เส้นนำทางสีส้มแบรนด์ด้านซ้ายของรายการที่เลือก + ชื่ออังกฤษบรรทัดล่างให้อ่านชัดบนพื้นเข้ม */
  .nav-link.active-link { position: relative; }
  .nav-link.active-link::before {
    content: ''; position: absolute; left: 5px; top: 22%; bottom: 22%; width: 3px;
    border-radius: 3px; background: #FF6B00;
  }
  .nav-link.active-link .nav-sub { opacity: 0.8 !important; }

  /* === Blob Background Animations === */
  @keyframes blob {
    0% { transform: translate(0px, 0px) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
    100% { transform: translate(0px, 0px) scale(1); }
  }
  .animate-blob {
    animation: blob 8s infinite;
  }
  .animation-delay-2000 {
    animation-delay: 2s;
  }
  .animation-delay-4000 {
    animation-delay: 4s;
  }

  /* === Premium Button Styles === */
  .btn-enterprise {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.625rem 1.25rem;
    font-weight: 700;
    font-size: 0.8125rem;
    border-radius: var(--radius-lg);
    transition: all var(--transition-fast);
    cursor: pointer;
    border: none;
    outline: none;
    position: relative;
    overflow: hidden;
  }
  .btn-enterprise-primary {
    background: var(--color-primary-dark);
    color: white;
    box-shadow: var(--shadow-sm);
  }
  .btn-enterprise-primary:hover {
    background: var(--color-primary-darker);
  }
  .btn-enterprise-secondary {
    background: var(--color-surface);
    color: var(--color-text-secondary);
    border: 1px solid var(--color-border);
    box-shadow: var(--shadow-sm);
  }
  .btn-enterprise-secondary:hover {
    background: var(--color-surface-secondary);
    border-color: #cbd5e1;
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  /* === Product Group Modal (เพิ่ม/แก้ไขสินค้าแบบหลาย SKU) input — พอร์ตมาจาก f8 2026-09-19 === */
  .pg-input {
    width: 100%;
    padding: 0.5rem 0.75rem;
    background: #f8fafc;
    color: var(--color-text-primary);
    border: 1px solid var(--color-border);
    border-radius: 0.5rem;
    font-size: 0.875rem;
    font-weight: 500;
    box-shadow: var(--shadow-sm);
    transition: all var(--transition-fast);
  }
  .pg-input:focus {
    outline: none;
    box-shadow: 0 0 0 2px rgba(54, 104, 145, 0.4);
    background: #ffffff;
  }
  .pg-input:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* === Chart Card Wrapper === */
  .chart-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-2xl);
    box-shadow: var(--shadow-sm);
    transition: all var(--transition-normal);
    padding: 1.5rem;
  }
  .chart-card:hover {
    box-shadow: var(--shadow-md);
  }
  .chart-card h6 {
    font-weight: 700;
    font-size: 0.8125rem;
    color: var(--color-text-primary);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  /* === Full-bleed table band (2026-08-09: ตารางต้องขยายชิดขอบจอทุกอุปกรณ์) ===
     เดิมตารางอยู่ใน .chart-card กรอบเดียว (overflow-hidden + border รวม) ทำให้ negative-margin
     ที่จะดันตารางออกไปชนขอบจอ #page-content (p-4 md:p-6 lg:p-8) โดนตัดทิ้งเสมอ
     จึงแยกกรอบเป็น 3 แถบอิสระ: หัว (.tbleed-head) / ตัวตาราง (.tbleed-body, ไม่มีกรอบซ้าย-ขวา + ชน margin ลบ) / ท้าย (.tbleed-foot)
     ไม่แตะ overflow-x-auto ชั้นในที่ห่อ <table> อยู่แล้ว (ยังเลื่อนแนวนอนได้ตามปกติถ้าตารางกว้างเกินจอ)
     2026-08-10 fix: หัว/ท้ายเดิมไม่มี negative margin เลย มีแต่ตัวตารางตรงกลางที่ชน margin ลบออกไปถึงขอบจอ
     ทำให้ตัวตารางกว้างกว่าหัว-ท้าย เกิดเหลี่ยมมุมไม่ตรงกัน (เห็นชัดสุดที่หน้า Orders ซึ่งมี .tbleed-foot ให้เทียบ) —
     ใส่ negative margin ชุดเดียวกับ .tbleed-body ให้หัว/ท้ายด้วย ทั้ง 3 แถบจะชิดขอบตรงกันเป๊ะ */
  .tbleed-head {
    border-left: 1px solid var(--color-border);
    border-top: 1px solid var(--color-border);
    border-right: 1px solid var(--color-border);
    border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
    box-shadow: var(--shadow-sm);
    margin-left: -1rem;
    margin-right: -1rem;
  }
  .tbleed-foot {
    background: var(--color-surface);
    border-left: 1px solid var(--color-border);
    border-right: 1px solid var(--color-border);
    border-bottom: 1px solid var(--color-border);
    border-radius: 0 0 var(--radius-2xl) var(--radius-2xl);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    margin-left: -1rem;
    margin-right: -1rem;
  }
  @media (min-width: 768px) {
    .tbleed-head, .tbleed-foot { margin-left: -1.5rem; margin-right: -1.5rem; }
  }
  @media (min-width: 1024px) {
    .tbleed-head, .tbleed-foot { margin-left: -2rem; margin-right: -2rem; }
  }
  /* ตัวแปรสำหรับหัวตารางที่อยู่ใน grid หลายคอลัมน์ (เช่น dashboard KPI mini-table ใน lg:grid-cols-3) —
     ต้องหยุด bleed ทันทีที่ breakpoint ซึ่ง grid เปลี่ยนเป็นหลายคอลัมน์ (จับคู่กับ .tbleed-body-col3) ไม่งั้น
     margin ลบจะทับคอลัมน์ข้างเคียง — .tbleed-head ปกติห้ามใช้ในบริบท grid หลายคอลัมน์ */
  .tbleed-head-col3 {
    border-left: 1px solid var(--color-border);
    border-top: 1px solid var(--color-border);
    border-right: 1px solid var(--color-border);
    border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
    box-shadow: var(--shadow-sm);
    margin-left: -1rem;
    margin-right: -1rem;
  }
  @media (min-width: 768px) {
    .tbleed-head-col3 { margin-left: -1.5rem; margin-right: -1.5rem; }
  }
  @media (min-width: 1024px) {
    .tbleed-head-col3 { margin-left: 0; margin-right: 0; }
  }
  /* หลายจุดหา card ตารางด้วย .closest('.chart-card') / .querySelectorAll('.chart-card') เพื่อแปะปุ่ม export รูปภาพ
     (window.app.tableExportButtons, ~JS.html บรรทัด 349/2632/2966/3208/3465/3589) — ต้องคง class chart-card ไว้บน
     กรอบนอกเสมอ ห้ามลบทิ้ง ใช้ตัวปรับแต่งนี้ "ปิด" ลักษณะภาพของ .chart-card แทน (พื้นหลัง/กรอบ/เงา) เพื่อไม่ให้
     negative margin ของ .tbleed-body โดน overflow ของกรอบเดิมตัดทิ้ง */
  .chart-card.tbleed-outer {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
  }
  /* 2026-08-12 fix: .tbleed-body มี overflow-x-auto + max-height เสมอ ซึ่งตาม CSS overflow spec
     ทำให้ overflow-y ถูกบังคับเป็น auto ไปด้วย (แกนหนึ่งไม่ visible อีกแกนต้อง auto ตาม) — พอเนื้อหาสูงเกิน
     max-h จริง scrollbar แนวตั้ง (กว้าง 0.3cm ตาม .custom-scrollbar) จะแทะพื้นที่จากขอบขวาของกล่องออกไป
     ทำให้ตัวตาราง (แถบสีหัวตาราง/เซลล์) ขยับเข้ามาไม่ชนขอบเท่า .tbleed-head/.tbleed-foot ที่ไม่มี scrollbar —
     เห็นชัดว่า "ขอบขวาตารางเยื้องเข้ามา" ทั้งที่ margin ลบเท่ากันแล้ว (ปัญหาคนละสาเหตุกับ fix 2026-08-10 ด้านบน)
     แก้โดย bleed margin-right เพิ่มอีก 0.3cm (เผื่อที่ให้ scrollbar พอดี ไม่กินพื้นที่ตาราง) — ส่วนที่ล้นออกนอก
     viewport ถูก <body class="overflow-x-hidden"> ตัดทิ้งอย่างปลอดภัยอยู่แล้ว ไม่ทำให้เกิด scrollbar แนวนอนทั้งหน้า
     scrollbar-gutter: stable กันไม่ให้ layout กระตุกเวลาข้อมูลเปลี่ยนจนพอดี/ไม่พอดี max-h */
  .tbleed-body {
    background: var(--color-surface);
    margin-left: -1rem;
    margin-right: calc(-1rem - 0.3cm);
    scrollbar-gutter: stable;
  }
  @media (min-width: 768px) {
    .tbleed-body { margin-left: -1.5rem; margin-right: calc(-1.5rem - 0.3cm); }
  }
  @media (min-width: 1024px) {
    .tbleed-body { margin-left: -2rem; margin-right: calc(-2rem - 0.3cm); }
  }
  /* ตัวแปรสำหรับตารางที่อยู่ใน grid หลายคอลัมน์ (เช่น dashboard KPI mini-table ใน lg:grid-cols-3) —
     ต้องหยุด bleed ทันทีที่ breakpoint ซึ่ง grid เปลี่ยนเป็นหลายคอลัมน์ ไม่งั้น margin ลบจะทับคอลัมน์ข้างเคียง
     ที่ lg: margin ปกติคือ 0 (ไม่ bleed แล้ว) ยังเผื่อ 0.3cm ให้ scrollbar ได้เพราะ gap ของ grid (1.25-1.5rem)
     กว้างกว่านี้เยอะ ไม่มีทางชนคอลัมน์ข้างเคียง */
  .tbleed-body-col3 {
    background: var(--color-surface);
    margin-left: -1rem;
    margin-right: calc(-1rem - 0.3cm);
    scrollbar-gutter: stable;
  }
  @media (min-width: 768px) {
    .tbleed-body-col3 { margin-left: -1.5rem; margin-right: calc(-1.5rem - 0.3cm); }
  }
  @media (min-width: 1024px) {
    .tbleed-body-col3 { margin-left: 0; margin-right: -0.3cm; }
  }

  /* === Chart export (download/copy) buttons — วางไว้บนกราฟ ในกรอบ .relative ที่ห่อ canvas อยู่แล้ว === */
  .chart-export-btns {
    position: absolute;
    top: 2px;
    right: 2px;
    z-index: 5;
    display: flex;
    gap: 0.25rem;
  }
  /* ตารางสรุป (ไม่ใช่กราฟ) มีแถบหัวข้อของตัวเองอยู่แล้ว — วางปุ่มแบบ static ในแถบหัวแทนการลอยทับเนื้อหา
     ตั้งใจไม่ใช้ชื่อ class "inline" — ชนกับ utility class ของ Tailwind (display:inline) ที่โหลดทีหลัง CSS.html
     ใน cascade แล้วชนะ (กฎข้อ 18 ของโปรเจกต์) จนปุ่มเรียงตัวผิดเพี้ยน — ใช้ !important กันเผื่อไว้ด้วย */
  .table-export-btns {
    position: static !important;
    display: flex !important;
    gap: 0.25rem;
  }
  .chart-export-btn {
    width: 26px;
    height: 26px;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--color-border);
    color: var(--color-text-secondary);
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: var(--transition-fast);
  }
  .chart-export-btn:hover {
    background: var(--color-primary);
    color: #ffffff;
    border-color: var(--color-primary);
  }

  /* === Login Page Enhancements === */
  .login-container {
    position: relative;
  }
  .login-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    box-shadow: var(--shadow-lg);
  }

  /* === Cart Drawer Enhancement === */
  .cart-drawer-shadow {
    box-shadow: -4px 0 16px -4px rgba(0, 0, 0, 0.12);
  }

  /* ============================================================
     Cart Drawer — 3-Zone Flexbox Layout
     Zone 1: Header  — fixed 60px  (flex: 0 0 60px)
     Zone 2: Content — fills gap   (flex: 1 1 0  + min-height:0)
     Zone 3: Footer  — natural h   (flex-shrink: 0)
     รายการสินค้าไม่มีทางเลื่อนใต้ Header หรือ Footer ได้เลย
  ============================================================ */

  /* Drawer wrapper: Flexbox column เต็มความสูงจอ */
  #cartDrawer {
    display: flex;
    flex-direction: column;
    height: 100vh;            /* fallback สำหรับเบราว์เซอร์ที่ไม่รองรับ dvh */
    height: 100dvh;           /* เต็มความสูง viewport บนมือถือ */
    overflow: hidden;          /* ป้องกัน drawer เองไม่ scroll */
  }

  /* Zone 1 — Header: สูง 60px, อยู่คงที่ (sticky) */
  .cart-drawer-header {
    flex: 0 0 60px;
    height: 60px;
    min-height: 60px;
    max-height: 60px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  /* Zone 2 — Scrollable Content: ความสูง = calc(100vh - 60px - footer จริง) */
  .cart-drawer-content {
    height: calc(100vh - 60px - 50px - env(safe-area-inset-bottom));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1 1 0;
    min-height: 0; /* CRITICAL: prevents flex child from expanding beyond parent */
  }

  /* Zone 3 — Footer: สูง 50px + safe-area (ปุ่ม checkout ไม่โดน home indicator บัง), อยู่คงที่ (sticky) */
  .cart-drawer-footer {
    flex: 0 0 calc(50px + env(safe-area-inset-bottom));
    height: calc(50px + env(safe-area-inset-bottom));
    min-height: calc(50px + env(safe-area-inset-bottom));
    max-height: calc(50px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom) !important; /* Tailwind CDN's <style> is injected after this block, ties on specificity */
    box-sizing: border-box;
    position: sticky;
    bottom: 0;
    z-index: 10;
  }

  /* === Responsive Navigation Enhancement === */
  @media (max-width: 1023px) {
    .glass-nav {
      background: var(--color-surface);
    }
  }

  /* === Countdown Timer Cards === */
  .countdown-digit {
    background: #16293f;
    color: white;
    padding: 0.375rem 0.5rem;
    border-radius: var(--radius-sm);
    font-weight: 900;
    font-size: 0.875rem;
    min-width: 2rem;
    text-align: center;
    box-shadow: var(--shadow-sm);
  }

  /* === Print Styles === */
  @media print {
    .glass-nav, footer, .animate-blob { display: none !important; }
    body { background: white !important; }
    .chart-card {
      box-shadow: none !important;
      border: 1px solid #e2e8f0 !important;
    }
  }

  @media print {
    body * { visibility: hidden; }
    #invoice-paper, #invoice-paper * { visibility: visible; }
    #invoice-paper {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }
    .no-print, .no-print * { display: none !important; }
    /* invWhtPctPrint คือ % หัก ณ ที่จ่ายแบบข้อความล้วน (คู่กับ input#invWhtPct ที่ถูกซ่อนด้วย .no-print ตอนพิมพ์) — JS.html อัปเดตแค่ innerText ไม่เคยปลด class="hidden" เลย
       ถ้าไม่บังคับ display ที่นี่ ตอนพิมพ์จะไม่เห็น % หัก ณ ที่จ่ายเลยทั้งที่ยอดเงินหักด้านล่างยังคำนวณ/แสดงอยู่ตามปกติ */
    #invWhtPctPrint { display: inline !important; }
  }

  /* === Cross-device: กัน iOS Safari auto-zoom เมื่อ focus input ที่ font-size < 16px === */
  @media (max-width: 767px) {
    input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),
    select,
    textarea {
      font-size: 16px !important;
    }
  }

  /* === Cross-device: safe-area สำหรับ iPhone มี notch / home indicator (ต้องมี viewport-fit=cover ด้วย) === */
  @media (max-width: 1023px) {
    .glass-nav {
      padding-top: env(safe-area-inset-top);
    }
  }

  /* === Accessibility (5B.4): focus ring เฉพาะตอนนำทางด้วยคีย์บอร์ด — ไม่กวนตอนคลิกเมาส์ === */
  button:focus-visible,
  a:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 2px;
    border-radius: inherit;
  }

  /* === 6A POS storefront & BNN Flash Sale Theme — scoped ด้วย .pos-storefront / .bnn-flash-shell เท่านั้น ห้ามรั่วไปหน้าอื่น === */
  .bnn-flash-shell {
    --bnn-yellow: #FF6B00;
    --bnn-yellow-hover: #E05300;
    --bnn-orange-theme: #FF6B00;
    --bnn-orange-hover: #E05300;
    --bnn-dark: #141416;
    --bnn-dark-soft: #1F2026;
    --bnn-red: #E11D48;
    --bnn-orange: #FF6B00;
  }

  /* แถบแบนเนอร์หัวหน้า BNN Flash Sale พร้อมไฟวิ่ง + ลายเฉียงสปอร์ต */
  .bnn-flash-banner {
    background: linear-gradient(135deg, #111216 0%, #1c1d24 55%, #2b131b 100%);
    border: 1px solid rgba(255, 107, 0, 0.32);
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 25px -6px rgba(17, 18, 22, 0.25);
  }
  .bnn-flash-banner::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #FF6B00 0%, #FF8C00 50%, #E11D48 100%);
    z-index: 2;
  }
  .bnn-flash-banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      -45deg,
      rgba(255, 107, 0, 0.04) 0px,
      rgba(255, 107, 0, 0.04) 10px,
      transparent 10px,
      transparent 20px
    );
    pointer-events: none;
  }

  .bnn-flash-emblem {
    background: linear-gradient(135deg, #FF6B00 0%, #FF8C00 100%);
    color: #ffffff;
    transform: skewX(-8deg);
    box-shadow: 0 4px 14px rgba(255, 107, 0, 0.35);
  }
  .bnn-flash-emblem > * {
    transform: skewX(8deg);
  }

  .bnn-timer-box {
    background: #ffffff;
    color: #111216;
    border-bottom: 2px solid #FF6B00;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }
  .bnn-timer-box.bnn-timer-sec {
    background: #E11D48;
    color: #ffffff;
    border-bottom-color: #ff8fa3;
  }

  /* แถบ Category Pills สไตล์ BNN */
  .pos-storefront .bnn-cat-pill {
    transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .pos-storefront .bnn-cat-pill:hover {
    border-color: #141416;
    transform: translateY(-1px);
  }
  .pos-storefront .bnn-cat-pill.active {
    background: #141416 !important;
    color: #FF6B00 !important;
    border-color: #141416 !important;
    box-shadow: 0 4px 12px rgba(20, 20, 22, 0.18);
  }

  /* การ์ดสินค้า BNN Flash Sale */
  .pos-storefront .pos-card {
    transition: box-shadow 0.22s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.22s ease;
    border: 1px solid #e2e8f0;
  }
  .pos-storefront .pos-card:hover {
    transform: translateY(-4px);
    border-color: #FF6B00;
    box-shadow: 0 14px 28px -6px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(255, 107, 0, 0.55);
  }

  /* ป้ายลดราคา BNN มุมซ้ายบน */
  .pos-storefront .bnn-discount-badge {
    background: linear-gradient(135deg, #E11D48 0%, #FF4D2D 100%);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(225, 29, 72, 0.3);
  }
  .pos-storefront .bnn-deal-badge {
    background: #FF6B00;
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(255, 107, 0, 0.35);
  }

  /* หลอดสต๊อก Flash Sale Progress Bar (Sold / Remaining Meter) */
  .pos-storefront .bnn-stock-bar {
    height: 18px;
    border-radius: 9999px;
    background: #fee2e2;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(225, 29, 72, 0.16);
  }
  .pos-storefront .bnn-stock-bar-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    border-radius: 9999px;
    background: linear-gradient(90deg, #FF7A00 0%, #E11D48 100%);
    transition: width 0.4s ease;
  }
  .pos-storefront .bnn-stock-bar-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: linear-gradient(
      45deg,
      rgba(255, 255, 255, 0.18) 25%,
      transparent 25%,
      transparent 50%,
      rgba(255, 255, 255, 0.18) 50%,
      rgba(255, 255, 255, 0.18) 75%,
      transparent 75%,
      transparent
    );
    background-size: 16px 16px;
  }
  .pos-storefront .bnn-stock-bar-label {
    position: relative;
    z-index: 2;
    font-size: 10px;
    font-weight: 800;
    line-height: 16px;
    text-align: center;
    color: #881337;
    letter-spacing: 0.01em;
    text-shadow: 0 0 6px rgba(255, 255, 255, 0.85);
  }
  .pos-storefront .bnn-stock-bar.hot .bnn-stock-bar-label {
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  }
  .pos-storefront .bnn-stock-bar.oos {
    background: #e2e8f0;
    border-color: #cbd5e1;
  }
  .pos-storefront .bnn-stock-bar.oos .bnn-stock-bar-label {
    color: var(--ink-2);
    text-shadow: none;

  /* ปุ่มสั่งจอง BNN Orange + Black */

    background: #FF6B00;
    color: #ffffff;
    border: 1px solid #e05300;
    box-shadow: 0 2px 6px rgba(255, 107, 0, 0.28);
    transition: all 0.18s ease;
  }
  .pos-storefront .bnn-buy-btn:hover {
    background: #141416;
    color: #FF6B00;
    border-color: #141416;
    box-shadow: 0 4px 12px rgba(20, 20, 22, 0.22);
    transform: translateY(-1px);
  }
  .pos-storefront .bnn-buy-btn:active {
    transform: translateY(0) scale(0.98);

  /* คูปองส่วนลด BNN Voucher Card (รอยปรุตั๋วด้านข้าง) */

    position: relative;
    background: linear-gradient(135deg, #fffaf5 0%, #fff7ed 100%);
    border: 1px solid #fed7aa;
    border-left: 4px solid #E11D48;
    border-radius: 12px;
    transition: all 0.18s ease;
  }
  .bnn-voucher-card:hover {
    border-color: #f97316;
    border-left-color: #E11D48;
    transform: translateY(-1px);
    box-shadow: 0 6px 14px -3px rgba(225, 29, 72, 0.12);
  }
  .bnn-voucher-card.applied {
    background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
    border-color: #6ee7b7;
    border-left-color: #059669;
  }

  /* ปุ่มเปรียบเทียบสินค้าบนการ์ด */
  .pos-storefront .bnn-compare-btn {
    transition: all 0.15s ease;
  }
  .pos-storefront .bnn-compare-btn.active {
    background: #141416 !important;
    color: #FF6B00 !important;
    border-color: #FF6B00 !important;
  }

  .pos-storefront .color-dot {
    position: relative;
  }
  /* สีที่หมดสต๊อกทุกความจุ: จาง + เส้นทแยงขีดทับ แต่ยังกดได้ (กดแล้วเห็นราคา/สถานะของสีนั้น) */
  .pos-storefront .color-dot.oos {

  }
  .pos-storefront .color-dot.oos::after {
    content: '';

    left: -3px;
    right: -3px;
    top: 50%;
    height: 1.5px;
    background: #64748b;
    transform: rotate(-45deg);

  /* === Sidebar collapse/expand toggle — redesigned (2026-07-21) === */
  /* ปุ่มในหัว sidebar: ใช้ตอน sidebar เปิดอยู่ กดแล้วยุบ */

  /* ============================================================
     Dark Mode
     Toggle: window.app.toggleTheme() ตั้ง class "dark" บน <html> (ดู JS.html)

     ที่สู้กับ cascade order ของ Tailwind CDN) — สโคปไว้ใน @media screen เท่านั้น
     กันไม่ให้ไปยุ่งกับ @media print (ใบเสร็จ/รายงานต้องพิมพ์เป็นกระดาษขาวเสมอ)

  /* เดิม html.dark{...} + component overrides ด้านล่างนี้ไม่ได้อยู่ใน @media screen ทั้งที่คอมเมนต์ด้านบนบอกว่าต้องสโคปไว้แค่ screen —

     เกือบขาว) ทุก component ที่อ้างอิงตัวแปรนี้ตรงๆ (.chart-card, .kpi-gradient-*, .swal2-popup, .login-card, .btn-enterprise-*)
     จึงพิมพ์ออกมาตัวหนังสือ/พื้นหลังเพี้ยนบนกระดาษขาว ขัดกับ invariant "ใบเสร็จ/รายงานต้องพิมพ์เป็นกระดาษขาวเสมอ" ที่โปรเจกต์นี้ตั้งใจไว้ */

  /* === หน้ารายการสินค้าสไตล์หน้าหมวด BNN: แถบกรองซ้าย / หัวข้อ+จำนวน / แถบเรียงตาม / เลขหน้า — scoped ด้วย .pos-storefront === */

  /* ===== ตรึง (sticky) header ร้านค้า =====
     sticky ใช้ไม่ได้ถ้ามี ancestor ที่เป็น overflow:hidden (กลายเป็นกรอบเลื่อนของตัวเอง) — เปลี่ยนเป็น clip (ตัดขอบเหมือนเดิมแต่ไม่สร้างกรอบเลื่อน)
     ครอบเฉพาะตัวห่อเนื้อหาและการ์ดร้านค้า; body ยังมี overflow-x-hidden ตัดล้นแนวนอนของ viewport อยู่แล้ว */
  #mainContentWrapper { overflow-x: clip; }
  #page-content .pos-shell-card { overflow: clip; }
  .pos-store-header { position: sticky; top: 0; z-index: 30; background: #fff; margin: -14px -14px 12px; padding: 12px 14px 10px; border-bottom: 1px solid #e2e8f0; border-radius: 24px 24px 0 0; transition: box-shadow .2s; }

  @media (max-width: 1023px) { .pos-store-header.is-stuck .pos-where { display: none; } .pos-store-header.is-stuck { padding-bottom: 8px; } }
  html.dark .pos-store-header { background: #1e293b; border-bottom-color: #334155; }

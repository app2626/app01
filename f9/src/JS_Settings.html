<script>
// Split out of JS.html (core). Attaches to window.app; included by Index.html after JS and before JS_Boot.
  // รอบ 9 — หน้า "ตั้งค่าระบบ" รวม 6 หน้า settings เดิมเป็น tab ภายในหน้าเดียว (UI reorganization เท่านั้น —
  // เนื้อหาแต่ละ tab คือ settingsManager.init(type) เดิม render ลง container ของ tab; backend ไม่เปลี่ยน)
window.app.systemSettings = {
    pendingTab: '',   // ตั้งโดย route() ตอน redirect จาก hash เก่า เพื่อเปิด tab ที่ตรงกัน
    activeTab: '',
    // id = hash/type เดิมทั้ง 6 — ใช้เป็นทั้ง redirect map ใน route() และ alias สิทธิ์ใน checkMenuAccess
    tabs: [
      { id: 'bookingsettings', icon: 'fa-clock',           label: 'เวลารับจอง' },
      { id: 'herobanners',     icon: 'fa-images',          label: 'Hero Banners' },
      { id: 'promogrids',      icon: 'fa-th-large',        label: 'Promo Grid' },
      { id: 'popupbanners',    icon: 'fa-window-maximize', label: 'Popup' },
      { id: 'loginbg',         icon: 'fa-image',           label: 'พื้นหลัง Login' },
      { id: 'autosetup',       icon: 'fa-database',        label: 'ฐานข้อมูล' }
    ],

    init: function() {
      const content = document.getElementById('page-content');
      if (!content) return;
      const startTab = this.tabs.some(t => t.id === this.pendingTab) ? this.pendingTab : 'bookingsettings';
      this.pendingTab = '';
      // tab bar สไตล์ sub-chips ของ POS (เส้นใต้ตัว active) — icon/label เป็น literal จาก tabs ข้างบน ไม่ใช่ข้อมูลผู้ใช้
      const barHtml = this.tabs.map(t =>
        `<button type="button" role="tab" id="ssTab-${t.id}" class="px-1 pb-2 text-sm whitespace-nowrap border-b-2 transition-colors border-transparent text-slate-500 hover:text-indigo-600" onclick="window.app.systemSettings.openTab('${t.id}')"><i class="fas ${t.icon} mr-1.5 text-[11px] opacity-70"></i>${t.label}</button>`
      ).join('');
      content.innerHTML = `
        <div class="space-y-6 animate-fade-in-up">
          <div class="bg-white border border-slate-200 shadow-sm rounded-3xl px-6 pt-5">
            <h3 class="text-lg font-extrabold text-slate-800 mb-4"><i class="fas fa-sliders-h text-indigo-500 mr-2"></i> ตั้งค่าระบบ</h3>
            <div class="flex gap-5 overflow-x-auto custom-scrollbar" role="tablist">${barHtml}</div>
          </div>
          <div id="ssTabContent"></div>
        </div>`;
      this.openTab(startTab);
    },

    openTab: function(tabId) {
      this.activeTab = tabId;
      this.tabs.forEach(t => {
        const btn = document.getElementById('ssTab-' + t.id);
        if (!btn) return;
        const active = t.id === tabId;
        btn.setAttribute('aria-selected', active ? 'true' : 'false');
        btn.classList.toggle('border-indigo-600', active);
        btn.classList.toggle('text-indigo-600', active);
        btn.classList.toggle('font-bold', active);
        btn.classList.toggle('border-transparent', !active);
        btn.classList.toggle('text-slate-500', !active);
      });
      // render เฉพาะ tab ที่เปิด — เรียก logic เดิมของหน้าเดิมลง container ของ tab
      window.app.settingsManager.init(tabId, 'ssTabContent');
    }
  };

window.app.settingsManager = {
    currentType: '',
    data: null,
    containerId: 'page-content',

    // containerId (optional) — รอบ 9: หน้า systemsettings ส่ง container ของ tab มา; จำค่าไว้เพราะ
    // save/delete เรียกซ้ำด้วย this.init(this.currentType) โดยไม่ส่ง container
    init: async function(type, containerId) {
      this.currentType = type;
      if (containerId) this.containerId = containerId;
      // เข้า/รีเฟรช tab ใหม่ทุกครั้ง — ล้างไฟล์รูปที่เลือกค้างจากการดูครั้งก่อน (banner-*, loginBg, newBanner) กัน URL เก่าเผลอทับของใหม่ตอนบันทึก
      Object.keys(window.app.pendingImageUploads).forEach(k => { if (k !== 'gridImage') delete window.app.pendingImageUploads[k]; });
      const content = document.getElementById(this.containerId);
      if(!content) return;
      
      if (type === 'autosetup') {
        // ถ้าโหลด settings ไม่ได้ (เช่นยังไม่เคย Auto Setup จึงไม่มีชีต UI_Banners) ต้อง render ต่อด้วยค่าว่าง
        // — ปุ่ม Auto Setup ต้องกดได้เสมอ ห้าม block ด้วย error
        this.data = {};
        try {
          const res = await window.app.api('GET_SETTINGS_LIST');
          if (res && res.status === 'success') this.data = res.data;
          else console.warn('GET_SETTINGS_LIST:', res && res.message);
        } catch(e) { console.warn('GET_SETTINGS_LIST:', e.message); }
        this.render();
        return;
      }
      
      window.app.showLoading('กำลังโหลดข้อมูล...');
      try {
        const res = await window.app.api('GET_SETTINGS_LIST');
        Swal.close();
        if (res && res.status === 'success') {
          this.data = res.data;
          this.render();
        } else {
          Swal.fire('ข้อผิดพลาด', res ? res.message : 'ไม่สามารถโหลดข้อมูลได้', 'error');
        }
      } catch(e) {
        Swal.close();
        Swal.fire('ข้อผิดพลาด', e.message || 'ไม่สามารถโหลดข้อมูลได้', 'error');
      }
    },
    
    render: function() {
      const content = document.getElementById(this.containerId);
      if(!content || !this.data) return;
      
      let html = '';
      
      if (this.currentType === 'autosetup') {
        html = `
          <div class="max-w-2xl mx-auto space-y-6 animate-fade-in-up">
          <div class="bg-white border border-slate-200 shadow-xl rounded-3xl overflow-hidden">
            <div class="p-6 bg-slate-50 border-b border-slate-100">
              <h3 class="text-lg font-extrabold text-slate-800"><i class="fas fa-signature text-indigo-500 mr-2"></i> ชื่อเว็บแอป</h3>
              <p class="text-xs text-slate-500 mt-1">ชื่อที่แสดงบนแท็บเบราว์เซอร์ หน้า Login และเมนู — เปลี่ยนได้จากหน้านี้โดยไม่ต้องแก้โค้ด เผื่อนำโปรเจกต์นี้ไปทำสำเนาใช้กับร้าน/แบรนด์อื่น</p>
            </div>
            <div class="p-8 space-y-4">
              <div class="flex items-center gap-4">
                <div class="w-20 h-20 shrink-0 bg-slate-100 border border-slate-200 rounded-xl overflow-hidden flex items-center justify-center">
                  <img id="webAppLogoPreview" src="${window.app.esc(window.app.formatImageUrl((this.data.keyValueSettings && this.data.keyValueSettings.LogoUrl) || ''))}" class="w-full h-full object-contain" onerror="this.style.display='none'">
                </div>
                <div class="flex-1">
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">โลโก้เว็บแอป</label>
                  <p class="text-[11px] text-slate-400 mb-2">แสดงแทนไอคอนเริ่มต้นที่หน้า Login / แถบเมนู / ส่วนท้ายหน้า — เว้นว่างได้ถ้าไม่มี (ใช้ไอคอนเริ่มต้นต่อไป)</p>
                  <button type="button" class="px-4 py-2 bg-white border border-slate-200 text-slate-600 text-sm font-bold rounded-xl hover:bg-slate-50 transition-colors shadow-sm" onclick="document.getElementById('webAppLogoFile').click()"><i class="fas fa-upload mr-1"></i> อัปโหลดโลโก้</button>
                  <input type="file" id="webAppLogoFile" class="hidden" accept="image/png,image/jpeg,image/webp,image/gif" onchange="window.app.selectImageForUpload(this, 'webAppLogo', function(localUrl){ const p=document.getElementById('webAppLogoPreview'); if(p){ p.src=localUrl; p.style.display=''; } window.app.toast('เลือกรูปแล้ว — จะอัปโหลดขึ้น Drive ตอนกดบันทึก'); })">
                </div>
              </div>
              <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">ชื่อเว็บแอป</label>
                <input type="text" id="webAppNameInput" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all shadow-sm" value="${window.app.esc((this.data.keyValueSettings && this.data.keyValueSettings.SystemName) || '')}" placeholder="เช่น Mobile Pre Booking System">
              </div>
              <div class="flex justify-end pt-2 border-t border-slate-100">
                <button onclick="window.app.settingsManager.saveAppName()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl shadow-md hover:shadow-lg transition-all flex items-center"><i class="fas fa-save mr-2"></i> บันทึกชื่อเว็บแอป</button>
              </div>
            </div>
          </div>
          <div class="bg-white border border-slate-200 shadow-xl rounded-3xl overflow-hidden">
            <div class="p-6 bg-slate-50 border-b border-slate-100">
              <h3 class="text-lg font-extrabold text-slate-800"><i class="fas fa-headset text-indigo-500 mr-2"></i> ข้อมูลติดต่อร้าน</h3>
              <p class="text-xs text-slate-500 mt-1">แสดงที่ส่วนท้ายของทุกหน้า — เว้นว่างช่องไหน ช่องนั้นจะไม่แสดง</p>
            </div>
            <div class="p-8 space-y-4">
              <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider" for="contactPhoneInput">เบอร์โทร</label>
                <input type="text" id="contactPhoneInput" maxlength="40" inputmode="tel" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all shadow-sm" placeholder="เช่น 02-123-4567 หรือ 081-234-5678" value="${window.app.esc(((this.data.keyValueSettings || {}).ContactPhone || '').replace(/^'+/, ''))}">
              </div>
              <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider" for="contactLineInput">LINE</label>
                <input type="text" id="contactLineInput" maxlength="120" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all shadow-sm" placeholder="LINE ID เช่น @mystore หรือวางลิงก์ LINE แบบ https" value="${window.app.esc(((this.data.keyValueSettings || {}).ContactLine || '').replace(/^'+/, ''))}">
              </div>
              <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider" for="contactHoursInput">เวลาทำการ</label>
                <input type="text" id="contactHoursInput" maxlength="120" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all shadow-sm" placeholder="เช่น ทุกวัน 10:00 - 21:00 น." value="${window.app.esc(((this.data.keyValueSettings || {}).ContactHours || '').replace(/^'+/, ''))}">
              </div>
              <div class="flex justify-end pt-2 border-t border-slate-100">
                <button type="button" onclick="window.app.settingsManager.saveContactInfo(this)" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl shadow-md hover:shadow-lg transition-all flex items-center"><i class="fas fa-save mr-2"></i> บันทึกข้อมูลติดต่อ</button>
              </div>
            </div>
          </div>
          <div class="bg-white border border-slate-200 shadow-xl rounded-3xl overflow-hidden">
            <div class="p-6 bg-slate-50 border-b border-slate-100">
              <h3 class="text-lg font-extrabold text-slate-800"><i class="fas fa-database text-indigo-500 mr-2"></i> สร้างฐานข้อมูลครั้งแรก (Auto Setup)</h3>
              <p class="text-xs text-slate-500 mt-1">ใช้สำหรับการตั้งค่า Google Sheets และข้อมูลเริ่มต้นระบบทั้งหมด (ตาราง, สินค้าตัวอย่าง, บัญชีแอดมิน)</p>
            </div>
            <div class="p-8 space-y-6 text-center">
              <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-indigo-50 mb-2">
                 <i class="fas fa-database text-4xl text-indigo-600"></i>
              </div>
              <div class="text-slate-600 text-sm max-w-md mx-auto space-y-3">
                 <p class="font-bold text-slate-800">คำเตือนสำหรับระบบ!</p>
                 <p>หากคุณกดดำเนินการ ระบบจะสร้างแผ่นงานที่จำเป็นสำหรับระบบขายของแบรนด์นี้ หากมีตารางเดิมอยู่แล้ว จะทำการตรวจสอบความสมบูรณ์และเสริมตารางที่หายไป</p>
                 <p class="text-slate-500">ใช้เมื่อ<strong>ติดตั้งระบบครั้งแรก</strong> หรือเมื่อระบบเวอร์ชันใหม่<strong>มีตาราง/คอลัมน์เพิ่ม</strong>แล้วต้องการเติมส่วนที่หายไป — ข้อมูลเดิมไม่ถูกลบ</p>
              </div>
              
              <div class="pt-6 border-t border-slate-100 flex justify-center">
                <button type="button" class="inline-flex items-center justify-center px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition-all" onclick="window.app.initDB()">
                    <i class="fas fa-cogs mr-2"></i> เริ่มการดำเนินการ Auto Setup
                </button>
              </div>
            </div>
          </div>

          <div class="bg-white border border-slate-200 shadow-xl rounded-3xl overflow-hidden">
            <div class="p-6 bg-slate-50 border-b border-slate-100">
              <h3 class="text-lg font-extrabold text-slate-800"><i class="fas fa-folder text-indigo-500 mr-2"></i> โฟลเดอร์เก็บรูปอัปโหลด (Drive Folder ID)</h3>
              <p class="text-xs text-slate-500 mt-1">กำหนดโฟลเดอร์ Google Drive ปลายทางของรูปที่อัปโหลดจากปุ่ม "อัปโหลดรูป" — เว้นว่างเพื่อใช้โฟลเดอร์อัตโนมัติ</p>
            </div>
            <div class="p-8 space-y-4">
              <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Drive Folder ID หรือลิงก์โฟลเดอร์</label>
                <input type="text" id="driveFolderIdInput" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all shadow-sm" value="${window.app.esc((this.data.keyValueSettings && this.data.keyValueSettings.DriveFolderId) || '')}" placeholder="เช่น 1AbCdEfGhIjKlMnOpQrStUvWxYz หรือ https:\/\/drive.google.com/drive/folders/...">
                <p class="text-[11px] text-slate-400 leading-relaxed">เปิดโฟลเดอร์ใน Google Drive แล้วคัดลอกลิงก์มาวางได้เลย ระบบจะดึง ID ให้อัตโนมัติ — เว้นว่างเพื่อใช้โฟลเดอร์อัตโนมัติ (MPOS Product Images)</p>
              </div>
              <div class="flex justify-end pt-2 border-t border-slate-100">
                <button onclick="window.app.settingsManager.saveDriveFolderId()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl shadow-md hover:shadow-lg transition-all flex items-center"><i class="fas fa-save mr-2"></i> บันทึกโฟลเดอร์</button>
              </div>
            </div>
          </div>

          <div class="bg-white border border-slate-200 shadow-xl rounded-3xl overflow-hidden">
            <div class="p-6 bg-slate-50 border-b border-slate-100">
              <h3 class="text-lg font-extrabold text-slate-800"><i class="fas fa-building text-indigo-500 mr-2"></i> ข้อมูลบริษัท (ใบเสนอราคา/ใบแจ้งหนี้)</h3>
              <p class="text-xs text-slate-500 mt-1">ค่าเริ่มต้นของโลโก้/ชื่อบริษัท/ที่อยู่/อีเมล ที่จะขึ้นในหน้าสร้างใบเสนอราคา/ใบแจ้งหนี้ทุกครั้ง (แก้ไขเพิ่มเติมเฉพาะใบได้ที่หน้านั้น)</p>
            </div>
            <div class="p-8 space-y-4">
              <div class="flex items-center gap-4">
                <div class="w-20 h-20 shrink-0 bg-slate-100 border border-slate-200 rounded-xl overflow-hidden flex items-center justify-center">
                  <img id="invCompanyLogoPreview" src="${window.app.esc(window.app.formatImageUrl((this.data.keyValueSettings && this.data.keyValueSettings.InvoiceLogoUrl) || ''))}" class="w-full h-full object-contain" onerror="this.style.display='none'">
                </div>
                <div class="flex-1">
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">โลโก้บริษัท</label>
                  <button type="button" class="px-4 py-2 bg-white border border-slate-200 text-slate-600 text-sm font-bold rounded-xl hover:bg-slate-50 transition-colors shadow-sm" onclick="document.getElementById('invCompanyLogoFile').click()"><i class="fas fa-upload mr-1"></i> อัปโหลดโลโก้</button>
                  <input type="file" id="invCompanyLogoFile" class="hidden" accept="image/png,image/jpeg,image/webp,image/gif" onchange="window.app.selectImageForUpload(this, 'invoiceLogo', function(localUrl){ const p=document.getElementById('invCompanyLogoPreview'); if(p){ p.src=localUrl; p.style.display=''; } window.app.toast('เลือกรูปแล้ว — จะอัปโหลดขึ้น Drive ตอนกดบันทึก'); })">
                </div>
              </div>
              <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">ชื่อบริษัท</label>
                <input type="text" id="invCompanyNameInput" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all shadow-sm" value="${window.app.esc((this.data.keyValueSettings && this.data.keyValueSettings.InvoiceCompanyName) || '')}" placeholder="เช่น บริษัท ทีจี เซลลูล่าร์เวิลด์ จำกัด">
              </div>
              <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">ที่อยู่บริษัท</label>
                <textarea id="invCompanyAddressInput" rows="2" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all shadow-sm resize-none" placeholder="ที่อยู่สำหรับออกเอกสาร">${window.app.esc((this.data.keyValueSettings && this.data.keyValueSettings.InvoiceCompanyAddress) || '')}</textarea>
              </div>
              <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">อีเมลติดต่อ</label>
                <input type="text" id="invCompanyEmailInput" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all shadow-sm" value="${window.app.esc((this.data.keyValueSettings && this.data.keyValueSettings.InvoiceCompanyEmail) || '')}" placeholder="เช่น info@company.com">
              </div>
              <div class="space-y-2 pt-2 border-t border-slate-100">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">ชื่อผู้อนุมัติ (ประทับในเอกสารเมื่อกดอนุมัติ)</label>
                <input type="text" id="approverNameInput" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all shadow-sm" value="${window.app.esc((this.data.keyValueSettings && this.data.keyValueSettings.ApproverName) || '')}" placeholder="เช่น นายสมชาย ใจดี (ผู้จัดการฝ่ายขาย)">
              </div>
              <div class="flex items-center gap-4">
                <div class="w-24 h-16 shrink-0 bg-slate-100 border border-slate-200 rounded-xl overflow-hidden flex items-center justify-center">
                  <img id="approverSignPreview" src="${window.app.esc(window.app.formatImageUrl((this.data.keyValueSettings && this.data.keyValueSettings.ApproverSignatureUrl) || ''))}" class="w-full h-full object-contain" onerror="this.style.display='none'">

    saveItem: async function(type, rowIndex, inputId, targetLinkId, detailsId, titleId, buttonTextId) {
      let url = document.getElementById(inputId).value.trim();
      const targetLink = targetLinkId ? document.getElementById(targetLinkId).value.trim() : '';
      const details = detailsId ? document.getElementById(detailsId).value.trim() : '';
      const title = titleId ? document.getElementById(titleId).value.trim() : '';
      const buttonText = buttonTextId ? document.getElementById(buttonTextId).value.trim() : '';
      const stateKey = 'banner-' + rowIndex;
      const hasPendingImage = !!window.app.pendingImageUploads[stateKey];
      if (!url && !hasPendingImage) return Swal.fire('แจ้งเตือน', 'กรุณากรอกลิงก์รูปภาพ', 'warning');

      // 5B.5 — disabled + spinner ระหว่างรอ API
      const restoreBtn = window.app.buttonBusy(document.activeElement) || function(){};
      window.app.showLoading('กำลังบันทึกข้อมูล...');
      try {
        if (hasPendingImage) url = await window.app.flushImageUpload(stateKey);
        const res = await window.app.api('SAVE_SETTINGS_ITEM', { type: type, rowIndex: rowIndex, bannerId: (this._bannerIds[type + ':' + rowIndex] || ''), url: url, targetLink: targetLink, details: details, title: title, buttonText: buttonText });
        if(res && res.status==='success') {
          await window.app.refreshGlobalData();
          Swal.fire({ icon: 'success', title: 'บันทึกข้อมูลสำเร็จ', showConfirmButton: false, timer: 1200 });
          this.init(this.currentType);
        } else {
          Swal.fire('ผิดพลาด', res ? res.message : 'Error', 'error');
        }
      } catch(e) {
        Swal.fire('ผิดพลาด', e.message || 'Error', 'error');
      } finally {
        restoreBtn();
      }
    },

    saveContactInfo: async function(btn) {
      const phone = document.getElementById('contactPhoneInput').value.trim();
      const line = document.getElementById('contactLineInput').value.trim();
      const hours = document.getElementById('contactHoursInput').value.trim();

      if (line && /^(javascript|data|vbscript):/i.test(line)) { Swal.fire('LINE ไม่ถูกต้อง', 'ใส่ LINE ID หรือลิงก์ https เท่านั้น', 'warning'); return; }
      if (/^[a-z][a-z0-9+.-]*:/i.test(line) && !/^https?:\/\//i.test(line)) { Swal.fire('LINE ไม่ถูกต้อง', 'ถ้าใส่เป็นลิงก์ ต้องขึ้นต้นด้วย https://', 'warning'); return; }
      const restoreBtn = window.app.buttonBusy(btn || document.activeElement) || function(){};
      window.app.showLoading('กำลังบันทึกข้อมูล...');
      try {
        const res = await window.app.api('SAVE_SETTINGS_ITEM', { type: 'bookingsettings', settings: { ContactPhone: phone, ContactLine: line, ContactHours: hours } });
        if (res && res.status === 'success') {
          await window.app.refreshGlobalData();
          window.app.renderFooterContact();
          Swal.fire({ icon: 'success', title: 'บันทึกข้อมูลติดต่อแล้ว', timer: 1500, showConfirmButton: false });
          this.init(this.currentType);
        } else {
          Swal.fire('ผิดพลาด', res ? res.message : 'Error', 'error');
        }
      } catch (e) {
        Swal.fire('ผิดพลาด', e.message || 'Error', 'error');
      } finally { restoreBtn(); }
    },

    saveCompanyInfo: async function() {
      const name = document.getElementById('invCompanyNameInput').value.trim();
      const address = document.getElementById('invCompanyAddressInput').value.trim();
      const email = document.getElementById('invCompanyEmailInput').value.trim();
      const approverNameEl = document.getElementById('approverNameInput');
      const approverName = approverNameEl ? approverNameEl.value.trim() : '';
      let logoUrl = (this.data.keyValueSettings && this.data.keyValueSettings.InvoiceLogoUrl) || '';
      let signUrl = (this.data.keyValueSettings && this.data.keyValueSettings.ApproverSignatureUrl) || '';
      const hasPendingImage = !!window.app.pendingImageUploads.invoiceLogo;
      const hasPendingSign = !!window.app.pendingImageUploads.approverSign;

      const restoreBtn = window.app.buttonBusy(document.activeElement) || function(){};
      window.app.showLoading('กำลังบันทึกข้อมูล...');
      try {
        if (hasPendingImage) logoUrl = await window.app.flushImageUpload('invoiceLogo');
        if (hasPendingSign) signUrl = await window.app.flushImageUpload('approverSign');
        const res = await window.app.api('SAVE_SETTINGS_ITEM', {
          type: 'bookingsettings',
          settings: { InvoiceCompanyName: name, InvoiceCompanyAddress: address, InvoiceCompanyEmail: email, InvoiceLogoUrl: logoUrl, ApproverSignatureUrl: signUrl, ApproverName: approverName }
        });
        if(res && res.status==='success') {
          await window.app.refreshGlobalData();
          Swal.fire({ icon: 'success', title: 'บันทึกข้อมูลบริษัทสำเร็จ', showConfirmButton: false, timer: 1500 });
          this.init(this.currentType);
        } else {
          Swal.fire('ผิดพลาด', res ? res.message : 'Error', 'error');
        }
      } catch(e) {
        Swal.fire('ผิดพลาด', e.message || 'Error', 'error');
      } finally {
        restoreBtn();
      }
    }
  };

<script>
// Split out of JS.html (core). Attaches to window.app; included by Index.html after JS and before JS_Boot.
  // สรุปยอดจองรายวัน: แถว = วันที่ (Timestamp) / คอลัมน์ = Model (เดิมมี sub-column ความจุแยกแถวย่อย — owner request 2026-09-19 ตัดออก เหลือคอลัมน์ Model เดียว)
window.app.bookingSummary = {
    rawOrders: [],
    currentCategory: '',
    init: async function() {
      const content = document.getElementById('page-content');
      const tmpl = document.getElementById('tmpl-bookingsummary');
      if (content && tmpl) content.innerHTML = tmpl.innerHTML;

      window.app.showLoading('กำลังโหลดข้อมูลสรุปยอดจอง...');
      try {
        const res = await window.app.api('GET_ADVANCED_DASHBOARD', {});
        Swal.close();
        if (res && res.status === 'success') {
          this.rawOrders = res.data.orders || [];
          this.setupCategoryFilter();
          this.render();
        } else {
          this.renderLoadError(res ? res.message : 'ไม่สามารถโหลดข้อมูลสรุปยอดจองได้');
        }
      } catch (e) {
        Swal.close(); this.renderLoadError(e.message);
      }
    },
    setupCategoryFilter: function() {
      const sel = document.getElementById('bsCategoryFilter');
      if (!sel) return;
      const products = window.app.globalData.products || [];
      const seen = {}; const cats = [];
      products.forEach(p => {
        const c = (p['Category'] || '').toString().trim();
        if (c && !seen[c]) { seen[c] = true; cats.push(c); }
      });
      // ให้ "โมบาย" ขึ้นก่อนเสมอถ้ามี — ที่เหลือคงลำดับตามที่เจอในชีต Products
      cats.sort((a, b) => (a === 'โมบาย' ? -1 : b === 'โมบาย' ? 1 : 0));
      sel.innerHTML = cats.map(c => '<option value="' + window.app.esc(c) + '">' + window.app.esc(c) + '</option>').join('');
      this.currentCategory = cats.includes('โมบาย') ? 'โมบาย' : (cats[0] || '');
      sel.value = this.currentCategory;
    },
    onCategoryChange: function() {
      const sel = document.getElementById('bsCategoryFilter');
      this.currentCategory = sel ? sel.value : '';
      this.render();
    },
    // error state มาตรฐาน (5A.4) พร้อมปุ่มลองใหม่ — ห้ามเงียบเฉยตาม error contract
    renderLoadError: function(msg) {
      const wrap = document.getElementById('bookingSummaryTableWrap');
      if (!wrap) { Swal.fire('Error', msg, 'error'); return; }
      wrap.innerHTML = window.app.emptyState({
        icon: 'fa-exclamation-triangle',
        title: 'โหลดข้อมูลไม่สำเร็จ',
        subtitle: msg,
        actionLabel: 'ลองใหม่',
        onclick: 'window.app.bookingSummary.init()'
      });
    },
    // สร้าง HTML ตาราง pivot หนึ่งตาราง แบบสลับแกน: แถว = Model/Capacity (สินค้า), คอลัมน์ = columns[] (วันที่ หรือ สถานะจอง), ท้ายตาราง Grand Total
    // rowCombos: [{model, variant, label}] เรียงตามยอดรวมมาก->น้อย ; columns: [{key,label}] ; matrix: columns[i].key -> model -> variant -> qty
    buildTransposedPivotTable: function(title, columns, matrix, rowCombos, rowHeaderLabel) {
      let headRow = '<th class="py-2.5 px-4 text-left text-[11px] font-bold text-black uppercase tracking-wider sticky left-0 bg-indigo-50 z-20">' + window.app.esc(rowHeaderLabel) + '</th>';
      columns.forEach(c => {
        headRow += '<th class="py-2.5 px-3 text-center text-[11px] font-bold text-black uppercase tracking-wider border-l border-indigo-100 bg-indigo-50">' + window.app.esc(c.label) + '</th>';
      });
      headRow += '<th class="py-2.5 px-4 text-right text-[11px] font-bold text-black uppercase tracking-wider border-l-2 border-indigo-200 bg-indigo-50">ยอดรวม</th>';
      headRow += '<th class="py-2.5 px-3 text-right text-[11px] font-bold text-black uppercase tracking-wider border-l border-indigo-100 bg-indigo-50">%</th>';

      // เดินลูปรอบแรกหา rowTotal ของแต่ละแถวและ grandTotal ก่อน เพื่อคำนวณ % (คอลัมน์หลัง "ยอดรวม") ในลูปที่สอง
      const colTotals = {}; // colKey -> qty
      const rowTotals = rowCombos.map(r => {
        let t = 0;
        columns.forEach(c => {
          const colMatrix = matrix[c.key] || {};
          t += (colMatrix[r.model] && colMatrix[r.model][r.variant]) || 0;
        });
        return t;
      });
      const grandTotal = rowTotals.reduce((s, v) => s + v, 0);

      let bodyRows = '';
      rowCombos.forEach((r, i) => {
        let cells = '';
        columns.forEach(c => {
          const colMatrix = matrix[c.key] || {};
          const qty = (colMatrix[r.model] && colMatrix[r.model][r.variant]) || 0;
          colTotals[c.key] = (colTotals[c.key] || 0) + qty;
          cells += '<td class="py-2.5 px-3 text-center text-slate-600 border-l border-slate-100">' + (qty > 0 ? qty.toLocaleString() : '<span class="text-slate-300">-</span>') + '</td>';
        });
        const rowTotal = rowTotals[i];
        const pct = grandTotal > 0 ? ((rowTotal / grandTotal) * 100).toFixed(1) : '0.0';
        bodyRows += '<tr class="hover:bg-slate-50 transition-colors">'
          + '<td class="py-2.5 px-4 text-slate-700 font-medium sticky left-0 bg-white z-10">' + window.app.esc(r.label) + '</td>'
          + cells
          + '<td class="py-2.5 px-4 text-right text-indigo-600 font-black border-l-2 border-slate-300 bg-slate-50/60">' + rowTotal.toLocaleString() + '</td>'
          + '<td class="py-2.5 px-3 text-right text-slate-500 border-l border-slate-100">' + pct + '%</td>'
          + '</tr>';
      });

      let footCells = '';
      columns.forEach(c => {
        footCells += '<td class="py-3 px-3 text-center text-slate-800 border-l border-slate-100">' + (colTotals[c.key] || 0).toLocaleString() + '</td>';
      });
      const footRow = '<tr class="bg-slate-100 font-black border-t-2 border-slate-300">'
        + '<td class="py-3 px-4 text-slate-800 sticky left-0 bg-slate-100 z-10">Grand Total</td>'
        + footCells
        + '<td class="py-3 px-4 text-right text-indigo-700 border-l-2 border-slate-300">' + grandTotal.toLocaleString() + '</td>'
        + '<td class="py-3 px-3 text-right text-slate-600 border-l border-slate-100">' + (grandTotal > 0 ? '100.0%' : '0.0%') + '</td>'
        + '</tr>';

      const tableHtml = '<table class="w-full text-sm text-left whitespace-nowrap">'
        + '<thead class="sticky top-0 z-10"><tr class="bg-indigo-50/95 backdrop-blur-sm border-b border-indigo-100">' + headRow + '</tr></thead>'
        + '<tbody class="divide-y divide-slate-100">' + bodyRows + '</tbody>'
        + '<tfoot>' + footRow + '</tfoot>'
        + '</table>';

      return '<div class="chart-card tbleed-outer !p-0 mb-6">'
        + '<div class="tbleed-head bg-slate-50 border-b border-slate-200/80 p-4">'
        + '<h6 class="!mb-0"><i class="fas fa-table text-indigo-500"></i>' + window.app.esc(title) + '</h6>'
        + '</div>'
        + '<div class="tbleed-body overflow-x-auto custom-scrollbar max-h-[400px]">' + tableHtml + '</div>'
        + '</div>';
    },
    // ตารางที่ 3: เปรียบเทียบ % ยอดจองระหว่างกลุ่มรุ่นที่กำหนดไว้ตายตัว (owner request 2026-07-24) — groups: [{label, qty}] ตามลำดับที่ต้องการแสดง
    buildGroupCompareTable: function(title, groups) {
      const total = groups.reduce((s, g) => s + g.qty, 0);
      const colors = ['indigo', 'pink', 'emerald', 'amber'];
      let bodyRows = '';
      groups.forEach((g, i) => {
        const pct = total > 0 ? ((g.qty / total) * 100).toFixed(1) : '0.0';
        const color = colors[i % colors.length];
        bodyRows += '<tr class="hover:bg-slate-50 transition-colors">'
          + '<td class="py-3 px-4 text-slate-700 font-medium">' + window.app.esc(g.label) + '</td>'
          + '<td class="py-3 px-4 text-center font-black text-slate-700">' + g.qty.toLocaleString() + '</td>'
          + '<td class="py-3 px-4"><div class="flex items-center gap-2"><span class="text-xs text-slate-500 w-12 text-right">' + pct + '%</span><div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden"><div class="bg-' + color + '-500 h-full rounded-full" style="width:' + pct + '%"></div></div></div></td>'
          + '</tr>';
      });
      const footRow = '<tr class="bg-slate-100 font-black border-t-2 border-slate-300">'
        + '<td class="py-3 px-4 text-slate-800">รวม</td>'
        + '<td class="py-3 px-4 text-center text-indigo-700">' + total.toLocaleString() + '</td>'
        + '<td class="py-3 px-4 text-right text-slate-500 pr-8">100%</td>'
        + '</tr>';
      const tableHtml = '<table class="w-full text-sm text-left">'
        + '<thead><tr class="bg-indigo-50/95 border-b border-indigo-100">'
        + '<th class="py-2.5 px-4 text-left text-[11px] font-bold text-black uppercase tracking-wider">กลุ่มรุ่น</th>'
        + '<th class="py-2.5 px-4 text-center text-[11px] font-bold text-black uppercase tracking-wider">ยอดจอง</th>'
        + '<th class="py-2.5 px-4 text-left text-[11px] font-bold text-black uppercase tracking-wider">สัดส่วน</th>'
        + '</tr></thead>'
        + '<tbody class="divide-y divide-slate-100">' + bodyRows + '</tbody>'
        + '<tfoot>' + footRow + '</tfoot>'
        + '</table>';
      return '<div class="chart-card tbleed-outer !p-0 mb-6">'
        + '<div class="tbleed-head bg-slate-50 border-b border-slate-200/80 p-4">'
        + '<h6 class="!mb-0"><i class="fas fa-chart-pie text-pink-500"></i>' + window.app.esc(title) + '</h6>'
        + '</div>'
        + '<div class="tbleed-body py-2 overflow-x-auto custom-scrollbar">' + tableHtml + '</div>'
        + '</div>';
    },
    render: function() {
      // กัน async race: element อาจถูกเปลี่ยนหน้าไปแล้วระหว่างรอข้อมูล
      const wrap = document.getElementById('bookingSummaryTableWrap');
      if (!wrap) return;

      const category = this.currentCategory;
      if (!category) {
        wrap.innerHTML = window.app.emptyState({ icon: 'fa-boxes-stacked', title: 'ไม่มีข้อมูลหมวดหมู่สินค้า', subtitle: '' });
        return;
      }

      // SKU -> {model, variant, category} จากชีต Products (Model คือกลุ่มรุ่นหลัก)
      // variant คงไว้เป็น '-' เสมอ (เดิมเป็น Capacity แยกแถวย่อยต่อความจุ — owner request 2026-09-19 ให้เหลือคอลัมน์ Model เดียว รวมทุกความจุของรุ่นเดียวกันเป็นแถวเดียว)
      const products = window.app.globalData.products || [];
      const skuInfo = {};
      products.forEach(p => {
        if (!p.SKU) return;
        const model = (p['Model'] || '').toString().trim() || (p['Product Name'] || '').toString().trim() || 'ไม่ระบุรุ่น';
        const cat = (p['Category'] || '').toString().trim() || 'ไม่ระบุหมวดหมู่';
        skuInfo[p.SKU] = { model: model, variant: '-', category: cat };
      });

      // ห้ามใช้ toISOString() ทำ date key — เป็น UTC ทำให้วันเลื่อนถอยหลัง 1 วันในโซน UTC+7 (กฎข้อ 1 ของโปรเจกต์)
      const toLocalKey = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const formatDisplay = (d) => d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();

      // แถว Reservation Status มีแค่แถวแรกของแต่ละ OrderID — ต้อง join กลับด้วย OrderID (เหมือน renderProductQuotaTable)
      const orderResStatusMap = {};
      this.rawOrders.forEach(o => { if (o['Reservation Status'] && o['Reservation Status'].toString().trim() !== '') orderResStatusMap[o.OrderID] = o['Reservation Status']; });

      // ตารางที่ 1: dateMatrix[dateKey][model][variant] = qty (กรองเฉพาะหมวดหมู่ที่เลือกจาก dropdown เท่านั้น)
      const dateMatrix = {};
      const dateDisplay = {};    // dateKey -> "28/9/2026"
      const modelVariantTotals = {}; // model -> variant -> qty (ใช้ร่วมทั้ง 2 ตาราง สำหรับจัดลำดับแถว)

      // ตารางที่ 2: resMatrix['T'|'F'][model][variant] = qty (หมวดหมู่เดียวกับตารางที่ 1)
      const resMatrix = { 'T': {}, 'F': {} };

      this.rawOrders.forEach(o => {
        if (window.app.isOrderCancelled(o)) return;
        if (o.SKU === 'DISCOUNT') return; // แถวส่วนลดไม่ใช่สินค้า
        let qty = parseInt((o.Qty || '0').toString().replace(/,/g, ''));
        if (isNaN(qty) || qty <= 0) return;

        const info = skuInfo[o.SKU] || { model: (o['Product Name'] || '').toString().trim() || 'ไม่ระบุรุ่น', variant: '-', category: 'ไม่ระบุหมวดหมู่' };
        if (info.category !== category) return; // กรองเฉพาะหมวดหมู่ที่เลือกอยู่
        const model = info.model, variant = info.variant;

        if (!modelVariantTotals[model]) modelVariantTotals[model] = {};
        modelVariantTotals[model][variant] = (modelVariantTotals[model][variant] || 0) + qty;

        if (o.Timestamp) {
          const d = new Date(o.Timestamp);
          if (!isNaN(d.getTime())) {
            const dateKey = toLocalKey(d);
            dateDisplay[dateKey] = formatDisplay(d);
            if (!dateMatrix[dateKey]) dateMatrix[dateKey] = {};
            if (!dateMatrix[dateKey][model]) dateMatrix[dateKey][model] = {};
            dateMatrix[dateKey][model][variant] = (dateMatrix[dateKey][model][variant] || 0) + qty;
          }
        }

        const rStatus = (o['Reservation Status'] || orderResStatusMap[o.OrderID] || '').toString();
        let sKey = null;
        if (rStatus.includes('จอง T')) sKey = 'T';
        else if (rStatus.includes('จอง F')) sKey = 'F';
        if (sKey) {
          if (!resMatrix[sKey][model]) resMatrix[sKey][model] = {};
          resMatrix[sKey][model][variant] = (resMatrix[sKey][model][variant] || 0) + qty;
        }
      });

      const dateKeys = Object.keys(dateMatrix).sort();
      const hasResData = Object.keys(resMatrix['T']).length > 0 || Object.keys(resMatrix['F']).length > 0;

      if (dateKeys.length === 0 && !hasResData) {
        wrap.innerHTML = window.app.emptyState({ icon: 'fa-calendar-times', title: 'ยังไม่มีข้อมูลยอดจอง (หมวดหมู่ ' + category + ')', subtitle: 'เมื่อมีการคีย์ออเดอร์แรก ข้อมูลสรุปจะแสดงที่นี่' });
        return;
      }

      // จัดลำดับแถว Model/Capacity (owner request 2026-07-24):
      // - โมเดล: เรียงตามลำดับตายตัว FOLD 8 -> FOLD 8 ULTRA -> FLIP 8 ก่อนเสมอ (ไม่สนยอดขาย) ส่วนโมเดลอื่นที่ไม่อยู่ในลิสต์ต่อท้ายเรียงตามยอดรวมมาก->น้อยเหมือนเดิม
      // - ความจุในแต่ละโมเดล: เรียงจากน้อย->มากตามขนาดจริง (256, 512, 1TB) ไม่ใช่ตามยอดขาย
      // capVal ต้องบังคับให้มีหน่วย (TB/GB/MB) ต่อท้ายตัวเลขเสมอ ไม่งั้นรูปแบบ "12/256GB" (RAM/ความจุ) จะจับเลข RAM "12" ก่อนความจุจริงผิดพลาด — ต้องคนละกับ capVal ใน pos module (~บรรทัด 3900) ที่ไม่มี RAM prefix ปนอยู่
      const capVal = (c) => {
        const m = String(c).match(/([\d.]+)\s*(TB|GB|MB)\b/i);
        if (!m) return Number.MAX_VALUE;
        let v = parseFloat(m[1]);
        const u = m[2].toUpperCase();
        if (u === 'TB') v *= 1024; else if (u === 'MB') v /= 1024;
        return v;
      };
      const modelPriority = ['GALAXY Z FLIP 8', 'GALAXY Z FOLD 8', 'GALAXY Z FOLD 8 ULTRA'];
      const priorityIndexOf = (model) => modelPriority.findIndex(p => p.toUpperCase() === model.toString().trim().toUpperCase());
      const rowCombos = [];
      const modelTotals = {};
      Object.keys(modelVariantTotals).forEach(m => {
        modelTotals[m] = Object.values(modelVariantTotals[m]).reduce((s, v) => s + v, 0);
      });
      const modelNames = Object.keys(modelVariantTotals).sort((a, b) => {
        const ai = priorityIndexOf(a), bi = priorityIndexOf(b);
        if (ai !== -1 && bi !== -1) return ai - bi;
        if (ai !== -1) return -1;
        if (bi !== -1) return 1;
        return modelTotals[b] - modelTotals[a];
      });
      modelNames.forEach(m => {
        const variants = Object.keys(modelVariantTotals[m]).sort((a, b) => capVal(a) - capVal(b));
        variants.forEach(v => rowCombos.push({ model: m, variant: v, label: (v && v !== '-') ? (m + ' (' + v + ')') : m }));
      });

      let html = '';

      // ตารางที่ 1 — แถว = Model (Capacity), คอลัมน์ = วันที่จอง
      if (dateKeys.length > 0) {
        const columns = dateKeys.map(dk => ({ key: dk, label: dateDisplay[dk] }));
        html += this.buildTransposedPivotTable('สรุปยอดจองรายวัน (' + category + ')', columns, dateMatrix, rowCombos, 'รุ่น');

        // เทียบ % ยอดจองรายวัน (owner request 2026-07-24) — รวมทุกรุ่นเข้าด้วยกันต่อวัน แล้วเทียบสัดส่วนวันต่อวัน แบบเดียวกับตาราง "เทียบ % ตามกลุ่มรุ่น"
        const dateGroups = dateKeys.map(dk => {
          let qty = 0;
          const dayModels = dateMatrix[dk] || {};
          Object.keys(dayModels).forEach(m => { Object.keys(dayModels[m]).forEach(v => { qty += dayModels[m][v]; }); });
          return { label: dateDisplay[dk], qty: qty };
        });
        html += this.buildGroupCompareTable('ยอดจองเทียบ % รายวัน (' + category + ')', dateGroups);
      }

      // ตารางที่ 2 — แถว = Model (Capacity), คอลัมน์ = สถานะจอง (T/F)
      if (hasResData) {
        const columns = [{ key: 'T', label: 'T' }, { key: 'F', label: 'F' }];
        html += this.buildTransposedPivotTable('สรุปยอดจองตามสถานะการจอง (' + category + ')', columns, resMatrix, rowCombos, 'รุ่น');

        // เทียบ % สถานะจอง T vs F (owner request 2026-07-24) — รวมทุกรุ่นเข้าด้วยกันต่อสถานะ แล้วเทียบสัดส่วน T vs F
        const sumStatus = (sKey) => {
          let qty = 0;
          const models = resMatrix[sKey] || {};
          Object.keys(models).forEach(m => { Object.keys(models[m]).forEach(v => { qty += models[m][v]; }); });
          return qty;
        };
        const statusGroups = [
          { label: 'จอง T (มีการจอง)', qty: sumStatus('T') },
          { label: 'จอง F (สวมสิทธิ์การจอง)', qty: sumStatus('F') }
        ];
        html += this.buildGroupCompareTable('ยอดจองเทียบ % ตามสถานะการจอง (' + category + ')', statusGroups);
      }

      // ตารางที่ 3 — เทียบ % ยอดจองตามกลุ่มรุ่น (owner request 2026-07-24, ปรับหลักการจัดกลุ่ม 2026-07-24)
      // กลุ่ม = ข้อความ Model โดยตัดส่วนความจุ (Capacity) ออก — หาตำแหน่งที่ค่า Capacity ของแต่ละแถวปรากฏอยู่ใน Model แล้วตัดทุกอย่างตั้งแต่จุดนั้นทิ้ง
      // เช่น Model "GALAXY Z FOLD 8 ULTRA 1TB" + Capacity "1TB" -> กลุ่ม "GALAXY Z FOLD 8 ULTRA"; ถ้าไม่พบ Capacity ในข้อความ Model ให้ใช้ Model เต็มเป็นกลุ่ม
      // ไม่ใช้รายชื่อกลุ่มตายตัวอีกต่อไป (เดิม hardcode 3 ชื่อ + เช็ค ULTRA ก่อนกัน substring ทับกัน) — วิธีนี้รองรับรุ่น/กลุ่มใหม่ในอนาคตอัตโนมัติ
      const stripCapacity = (modelText, cap) => {
        const mt = modelText.toString().trim();
        const c = (cap || '').toString().trim();
        if (!c || c === '-') return mt;
        const idx = mt.toUpperCase().indexOf(c.toUpperCase());
        return idx === -1 ? mt : (mt.substring(0, idx).trim() || mt);
      };
      const groupTotals = {};
      Object.keys(modelVariantTotals).forEach(m => {
        Object.keys(modelVariantTotals[m]).forEach(v => {
          const g = stripCapacity(m, v);
          groupTotals[g] = (groupTotals[g] || 0) + modelVariantTotals[m][v];
        });
      });
      const groups = Object.keys(groupTotals)
        .sort((a, b) => groupTotals[b] - groupTotals[a])
        .map(g => ({ label: g, qty: groupTotals[g] }));
      if (groups.length > 0) {
        html += this.buildGroupCompareTable('ยอดจองเทียบ % ตามกลุ่มรุ่น (' + category + ')', groups);

      wrap.innerHTML = html;
      wrap.querySelectorAll('.chart-card').forEach(c => window.app.tableExportButtons(c));

  // สรุปยอดตามรุ่น/แอเรีย/ช่องทางขาย: 3 ตาราง กรองด้วยหมวดหมู่สินค้า (ค่าเริ่มต้น "โมบาย")
window.app.salesSummary = {
    rawOrders: [],
    rawTarget: [],
    currentCategory: '',
    init: async function() {
      const content = document.getElementById('page-content');
      const tmpl = document.getElementById('tmpl-salessummary');
      if (content && tmpl) content.innerHTML = tmpl.innerHTML;

      window.app.showLoading('กำลังโหลดข้อมูลสรุปยอด...');
      try {
        // ดึงชีต Target คู่กันไว้จำกัดรายชื่อแอเรียในตาราง "ยอดจองตามแอเรีย × รุ่น" (owner request 2026-07-24)
        const [res, resTarget] = await Promise.all([
          window.app.api('GET_ADVANCED_DASHBOARD', {}),
          window.app.api('GET_TABLE', { tableName: 'Target' })
        ]);
        Swal.close();
        if (res && res.status === 'success') {
          this.rawOrders = res.data.orders || [];
          this.rawTarget = (resTarget && resTarget.status === 'success') ? (resTarget.data || []) : [];
          this.setupCategoryFilter();
          this.render();
        } else {
          this.renderLoadError(res ? res.message : 'ไม่สามารถโหลดข้อมูลได้');
        }
      } catch (e) {
        Swal.close(); this.renderLoadError(e.message);
      }
    },
    // error state มาตรฐาน (5A.4) พร้อมปุ่มลองใหม่ — ห้ามเงียบเฉยตาม error contract
    renderLoadError: function(msg) {
      const wrap = document.getElementById('salesSummaryTablesWrap');
      if (!wrap) { Swal.fire('Error', msg, 'error'); return; }
      wrap.innerHTML = window.app.emptyState({
        icon: 'fa-exclamation-triangle',
        title: 'โหลดข้อมูลไม่สำเร็จ',
        subtitle: msg,
        actionLabel: 'ลองใหม่',
        onclick: 'window.app.salesSummary.init()'
      });
    },
    setupCategoryFilter: function() {
      const sel = document.getElementById('massCategoryFilter');
      if (!sel) return;
      const products = window.app.globalData.products || [];
      const seen = {}; const cats = [];
      products.forEach(p => {
        const c = (p['Category'] || '').toString().trim();
        if (c && !seen[c]) { seen[c] = true; cats.push(c); }
      });
      // ให้ "โมบาย" ขึ้นก่อนเสมอถ้ามี — ที่เหลือคงลำดับตามที่เจอในชีต Products
      cats.sort((a, b) => (a === 'โมบาย' ? -1 : b === 'โมบาย' ? 1 : 0));
      sel.innerHTML = cats.map(c => '<option value="' + window.app.esc(c) + '">' + window.app.esc(c) + '</option>').join('');
      this.currentCategory = cats.includes('โมบาย') ? 'โมบาย' : (cats[0] || '');
      sel.value = this.currentCategory;
    },
    onCategoryChange: function() {
      const sel = document.getElementById('massCategoryFilter');
      this.currentCategory = sel ? sel.value : '';
      this.render();
    },
    // ตัวช่วยสร้างตาราง pivot 2 มิติแบบเรียบ (rows x columns -> qty ตรงๆ ไม่มีการจัดกลุ่มย่อยแบบ Model/Capacity) พร้อม Grand Total ทั้งแถวและคอลัมน์
    buildFlatPivotTable: function(title, columns, matrix, rows, rowHeaderLabel) {
      // หัวตารางโทนเดียวกับตารางสรุปหน้าอื่น (slate อ่อน + ตัวเทา) + ตรึงคอลัมน์แรก (Model/Product Name/แอเรีย) ให้เหมือนหน้าสรุปยอดจองรายวัน (owner request 2026-07-12, เดิมสั่งไม่ตรึงเมื่อ 2026-07-11)
      let headRow = '<th class="py-2.5 px-4 text-left text-[11px] font-bold text-black uppercase tracking-wider sticky left-0 bg-indigo-50 z-20">' + window.app.esc(rowHeaderLabel) + '</th>';
      columns.forEach(c => {
        headRow += '<th class="py-2.5 px-3 text-center text-[11px] font-bold text-black uppercase tracking-wider border-l border-indigo-100 bg-indigo-50">' + window.app.esc(c.label) + '</th>';
      });
      headRow += '<th class="py-2.5 px-4 text-right text-[11px] font-bold text-black uppercase tracking-wider border-l-2 border-indigo-200 bg-indigo-50">Grand Total</th>';

      let bodyRows = '';
      const colTotals = {}; // colKey -> qty
      let grandTotal = 0;
      rows.forEach(r => {
        const rowMatrix = matrix[r.key] || {};
        let rowTotal = 0;
        let cells = '';
        columns.forEach(c => {
          const qty = rowMatrix[c.key] || 0;
          rowTotal += qty;
          colTotals[c.key] = (colTotals[c.key] || 0) + qty;
          cells += '<td class="py-2.5 px-3 text-center text-slate-600 border-l border-slate-100">' + (qty > 0 ? qty.toLocaleString() : '') + '</td>';
        });
        grandTotal += rowTotal;
        bodyRows += '<tr class="hover:bg-slate-50 transition-colors">'
          + '<td class="py-2.5 px-4 text-slate-700 font-medium sticky left-0 bg-white z-10">' + window.app.esc(r.label) + '</td>'
          + cells
          + '<td class="py-2.5 px-4 text-right text-slate-700 font-bold border-l-2 border-slate-300 bg-slate-50/60">' + (rowTotal > 0 ? rowTotal.toLocaleString() : '') + '</td>'
          + '</tr>';
      });

      let footCells = '';
      columns.forEach(c => {
        footCells += '<td class="py-3 px-3 text-center text-slate-800 border-l border-slate-100">' + (colTotals[c.key] || 0).toLocaleString() + '</td>';
      });
      const footRow = '<tr class="bg-slate-100 font-black border-t-2 border-slate-300">'
        + '<td class="py-3 px-4 text-slate-800 sticky left-0 bg-slate-100 z-10">Grand Total</td>'
        + footCells
        + '<td class="py-3 px-4 text-right text-amber-700 border-l-2 border-slate-300">' + grandTotal.toLocaleString() + '</td>'
        + '</tr>';

      const tableHtml = '<table class="w-full text-sm text-left whitespace-nowrap">'
        + '<thead class="sticky top-0 z-10"><tr class="bg-indigo-50/95 backdrop-blur-sm border-b border-indigo-100">' + headRow + '</tr></thead>'
        + '<tbody class="divide-y divide-slate-100">' + bodyRows + '</tbody>'
        + '<tfoot>' + footRow + '</tfoot>'
        + '</table>';

      return '<div class="chart-card tbleed-outer !p-0 mb-6">'
        + '<div class="tbleed-head bg-slate-50 border-b border-slate-200/80 p-4">'
        + '<h6 class="!mb-0"><i class="fas fa-table text-indigo-500"></i>' + window.app.esc(title) + '</h6>'
        + '</div>'
        + '<div class="tbleed-body overflow-x-auto custom-scrollbar max-h-[500px]">' + tableHtml + '</div>'
        + '</div>';
    },
    render: function() {
      // กัน async race: element อาจถูกเปลี่ยนหน้าไปแล้วระหว่างรอข้อมูล
      const wrap = document.getElementById('salesSummaryTablesWrap');
      if (!wrap) return;

      const category = this.currentCategory;
      if (!category) {
        wrap.innerHTML = window.app.emptyState({ icon: 'fa-boxes-stacked', title: 'ไม่มีข้อมูลหมวดหมู่สินค้า', subtitle: '' });
        return;
      }

      const products = (window.app.globalData.products || []).filter(p => (p['Category'] || '').toString().trim() === category);
      if (products.length === 0) {
        wrap.innerHTML = window.app.emptyState({ icon: 'fa-boxes-stacked', title: 'ไม่มีสินค้าในหมวดหมู่นี้', subtitle: '' });
        return;
      }

      // SKU -> {modelCap, productName} — modelCap = Model อย่างเดียว (เดิมรวม Capacity ต่อท้ายด้วย — owner request 2026-09-19 ให้เหลือคอลัมน์ Model เดียว), productName = ชื่อเต็มต่อ SKU (รวมสี/ความจุตามที่บันทึกในชีต ตารางแยกต่างหากด้านล่างไม่แตะ)
      const skuInfo = {};
      const modelCapRowsSeen = {};
      const modelCapRows = []; // [{key,label}] ตามลำดับที่เจอในชีต Products
      const productNameRows = []; // [{key,label}] ใช้ SKU เป็น key กันชื่อซ้ำข้ามสี/ตัวเลือกที่ไม่ตั้งใจ

      products.forEach(p => {
        if (!p.SKU) return;
        const model = (p['Model'] || '').toString().trim() || (p['Product Name'] || '').toString().trim() || 'ไม่ระบุรุ่น';
        const modelCap = model;
        const pName = (p['Product Name'] || '').toString().trim() || modelCap;
        skuInfo[p.SKU] = { modelCap: modelCap, productName: pName };
        if (!modelCapRowsSeen[modelCap]) { modelCapRowsSeen[modelCap] = true; modelCapRows.push({ key: modelCap, label: modelCap }); }
        productNameRows.push({ key: p.SKU, label: pName });
      });

      // คอลัมน์ Channel — ใช้ลำดับจากชีต Channels ถ้ามี ไม่งั้น fallback เป็นค่าที่เจอจริงในออเดอร์
      // normChannelMap: ชื่อช่องทาง (ตัดช่องว่าง+lowercase) -> ชื่อมาตรฐาน — กันไม่ให้ช่องทางเดียวกันที่พิมพ์เว้นวรรค/ตัวพิมพ์เล็กใหญ่ต่างกันกลายเป็นคนละคอลัมน์ (1 ช่องทาง = 1 หัวคอลัมน์เท่านั้น)
      const channelsSheet = window.app.globalData.channels || [];
      const channelColumns = [];
      const normChannelMap = {};
      channelsSheet.forEach(c => {
        const name = (c['Channel Name'] || '').toString().trim();
        if (!name) return;
        const norm = name.toLowerCase();
        if (!(norm in normChannelMap)) { normChannelMap[norm] = name; channelColumns.push({ key: name, label: name }); }
      });
      const resolveChannel = (raw) => {
        const trimmed = (raw || '').toString().trim();
        if (!trimmed) return 'ไม่ระบุช่องทาง';
        const norm = trimmed.toLowerCase();
        if (!(norm in normChannelMap)) { normChannelMap[norm] = trimmed; channelColumns.push({ key: trimmed, label: trimmed }); }
        return normChannelMap[norm];
      };

      // แถว Area — join ผ่าน Branch Code จากชีต Branches (หา key "Area" แบบไม่สนตัวพิมพ์ เหมือน target module)
      const branches = window.app.globalData.branches || [];
      const areaKey = branches.length > 0 ? (Object.keys(branches[0]).find(k => k.toLowerCase().trim() === 'area') || 'Area') : 'Area';
      const branchAreaMap = {}; // Branch Code (upper) -> Area
      const areaByUpper = {}; // AREA NAME (upper) -> {key,label} ทุกแอเรียที่มีจริงในชีต Branches
      branches.forEach(b => {
        const code = (b['Branch Code'] || '').toString().trim().toUpperCase();
        const area = (b[areaKey] || '').toString().trim();
        if (code && area) branchAreaMap[code] = area;
        if (area && !areaByUpper[area.toUpperCase()]) areaByUpper[area.toUpperCase()] = { key: area, label: area };
      });

      // รายชื่อแอเรียที่จะแสดงในตาราง "ยอดจองตามแอเรีย × รุ่น" — จำกัด+เรียงตามรายชื่อในชีต Target คอลัมน์แรกเท่านั้น (owner request 2026-07-24)
      // ข้ามแถว ALL/ALL BRANCHES เพราะเป็นยอดรวมทุกสาขา ไม่ใช่ชื่อแอเรียจริง (ปฏิบัติแบบเดียวกับ target module)
      const targetRows = this.rawTarget || [];
      const targetAreaRows = [];
      if (targetRows.length > 0) {
        const targetKeys = Object.keys(targetRows[0]).filter(k => k !== '_rowIndex');
        const targetNameKey = targetKeys.find(k => k.toLowerCase() === 'area' || k.includes('Area') || k.includes('สาขา') || k.includes('พนักงาน') || k.includes('ชื่อ') || k.includes('รับเป้า')) || targetKeys[0];
        const targetAreaSeen = {};
        targetRows.forEach(t => {
          const name = (t[targetNameKey] || '').toString().trim();
          if (!name) return;
          const upper = name.toUpperCase();
          if (upper === 'ALL' || upper === 'ALL BRANCHES') return;
          const match = areaByUpper[upper];
          if (match && !targetAreaSeen[match.key]) { targetAreaSeen[match.key] = true; targetAreaRows.push(match); }
        });
      }

      // สะสมยอด: matrix1[modelCap][channel] / matrix2[area][modelCap] / matrix3[SKU][channel]
      const matrix1 = {}, matrix2 = {}, matrix3 = {};
      const UNMAPPED_AREA = 'ไม่ระบุแอเรีย';

      this.rawOrders.forEach(o => {
        if (window.app.isOrderCancelled(o)) return;
        if (o.SKU === 'DISCOUNT') return; // แถวส่วนลดไม่ใช่สินค้า
        let qty = parseInt((o.Qty || '0').toString().replace(/,/g, ''));
        if (isNaN(qty) || qty <= 0) return;
        const info = skuInfo[o.SKU];
        if (!info) return; // สินค้าไม่ได้อยู่ในหมวดหมู่ที่กำลังกรอง — ข้าม

        const channel = resolveChannel(o.Channel);
        const branchCode = (o['Branch Code'] || '').toString().trim().toUpperCase();
        const area = branchAreaMap[branchCode] || UNMAPPED_AREA;

        if (!matrix1[info.modelCap]) matrix1[info.modelCap] = {};
        matrix1[info.modelCap][channel] = (matrix1[info.modelCap][channel] || 0) + qty;

        if (!matrix2[area]) matrix2[area] = {};
        matrix2[area][info.modelCap] = (matrix2[area][info.modelCap] || 0) + qty;

        if (!matrix3[o.SKU]) matrix3[o.SKU] = {};
        matrix3[o.SKU][channel] = (matrix3[o.SKU][channel] || 0) + qty;
      });

      let html = '';
      html += this.buildFlatPivotTable('ยอดจองตามรุ่น × ช่องทางขาย', channelColumns, matrix1, modelCapRows, 'Model');
      html += this.buildFlatPivotTable('ยอดจองตามสินค้า (รวมสี) × ช่องทางขาย', channelColumns, matrix3, productNameRows, 'Product Name');
      if (targetAreaRows.length > 0) {
        html += this.buildFlatPivotTable('ยอดจองตามแอเรีย × รุ่น', modelCapRows, matrix2, targetAreaRows, 'แอเรีย');
      } else {
        html += '<div class="chart-card mb-6">' + window.app.emptyState({
          icon: 'fa-list-check',
          title: 'ไม่มีรายชื่อแอเรียในชีต Target',
          subtitle: 'ตาราง "ยอดจองตามแอเรีย × รุ่น" แสดงเฉพาะแอเรียตามรายชื่อในชีต Target — กรุณาเพิ่มรายชื่อแอเรียในชีต Target ก่อน'
        }) + '</div>';
      }

      wrap.innerHTML = html;
      wrap.querySelectorAll('.chart-card').forEach(c => window.app.tableExportButtons(c));
    }
  };

  // สรุปยอดจองตามสาขา × รุ่น แยกสถานะ จอง T / จอง F / ผลรวม (owner request 2026-07-24) — 3 ตารางแยกสถานะ (แบบเดียวกับ 3 ตารางของ salesSummary)
window.app.branchBookingSummary = {

    },
    setupCategoryFilter: function() {

    },
    // ตัวกรอง Area/สาขา แบบพิมพ์ค้นหา (owner request 2026-07-24) — input + datalist (เหมือน Customer Name ในหน้า Orders grid)
    // กรองแบบ substring ระหว่างพิมพ์ (oninput) ไม่บังคับต้องเลือกค่าจาก datalist ให้ตรงเป๊ะ
    setupBranchAreaFilters: function() {
      const branches = window.app.globalData.branches || [];
      const areaKey = branches.length > 0 ? (Object.keys(branches[0]).find(k => k.toLowerCase().trim() === 'area') || 'Area') : 'Area';

      const areaInput = document.getElementById('bbAreaFilter');
      const areaList = document.getElementById('bbAreaListOptions');
      if (areaList) {
        const seenArea = {}; let opts = '';
        branches.forEach(b => {
          const area = (b[areaKey] || '').toString().trim();
          if (area && !seenArea[area]) { seenArea[area] = true; opts += '<option value="' + window.app.esc(area) + '">'; }
        });
        areaList.innerHTML = opts;
      }
      if (areaInput) areaInput.value = this.currentArea;

      const branchInput = document.getElementById('bbBranchFilter');
      const branchList = document.getElementById('bbBranchListOptions');
      if (branchList) {
        const seenCode = {}; let opts = '';
        branches.forEach(b => {
          const code = (b['Branch Code'] || '').toString().trim();
          if (!code || seenCode[code]) return;
          seenCode[code] = true;
          const name = (b['Branch Name'] || '').toString().trim() || code;

    // ตัวช่วยสร้างตาราง pivot 2 มิติแบบเรียบ (เหมือน salesSummary.buildFlatPivotTable) พร้อม Grand Total ทั้งแถวและคอลัมน์
    buildFlatPivotTable: function(title, columns, matrix, rows, rowHeaderLabel) {
      let headRow = '<th class="py-2.5 px-4 text-left text-[11px] font-bold text-black uppercase tracking-wider sticky left-0 bg-indigo-50 z-20">' + window.app.esc(rowHeaderLabel) + '</th>';
      columns.forEach(c => {
        headRow += '<th class="py-2.5 px-3 text-center text-[11px] font-bold text-black uppercase tracking-wider border-l border-indigo-100 bg-indigo-50">' + window.app.esc(c.label) + '</th>';
      });
      headRow += '<th class="py-2.5 px-4 text-right text-[11px] font-bold text-black uppercase tracking-wider border-l-2 border-indigo-200 bg-indigo-50">Grand Total</th>';

      let bodyRows = '';
      const colTotals = {};
      let grandTotal = 0;
      rows.forEach(r => {
        const rowMatrix = matrix[r.key] || {};
        let rowTotal = 0;
        let cells = '';
        columns.forEach(c => {
          const qty = rowMatrix[c.key] || 0;
          rowTotal += qty;
          colTotals[c.key] = (colTotals[c.key] || 0) + qty;
          cells += '<td class="py-2.5 px-3 text-center text-slate-600 border-l border-slate-100">' + (qty > 0 ? qty.toLocaleString() : '') + '</td>';
        });
        grandTotal += rowTotal;
        bodyRows += '<tr class="hover:bg-slate-50 transition-colors">'
          + '<td class="py-2.5 px-4 text-slate-700 font-medium sticky left-0 bg-white z-10">' + window.app.esc(r.label) + '</td>'
          + cells
          + '<td class="py-2.5 px-4 text-right text-slate-700 font-bold border-l-2 border-slate-300 bg-slate-50/60">' + (rowTotal > 0 ? rowTotal.toLocaleString() : '') + '</td>'
          + '</tr>';
      });

      let footCells = '';
      columns.forEach(c => {
        footCells += '<td class="py-3 px-3 text-center text-slate-800 border-l border-slate-100">' + (colTotals[c.key] || 0).toLocaleString() + '</td>';
      });
      const footRow = '<tr class="bg-slate-100 font-black border-t-2 border-slate-300">'
        + '<td class="py-3 px-4 text-slate-800 sticky left-0 bg-slate-100 z-10">Grand Total</td>'
        + footCells
        + '<td class="py-3 px-4 text-right text-amber-700 border-l-2 border-slate-300">' + grandTotal.toLocaleString() + '</td>'
        + '</tr>';

      const tableHtml = '<table class="w-full text-sm text-left whitespace-nowrap">'
        + '<thead class="sticky top-0 z-10"><tr class="bg-indigo-50/95 backdrop-blur-sm border-b border-indigo-100">' + headRow + '</tr></thead>'
        + '<tbody class="divide-y divide-slate-100">' + bodyRows + '</tbody>'
        + '<tfoot>' + footRow + '</tfoot>'
        + '</table>';

      return '<div class="chart-card tbleed-outer !p-0 mb-6">'
        + '<div class="tbleed-head bg-slate-50 border-b border-slate-200/80 p-4">'
        + '<h6 class="!mb-0"><i class="fas fa-table text-indigo-500"></i>' + window.app.esc(title) + '</h6>'
        + '</div>'
        + '<div class="tbleed-body overflow-x-auto custom-scrollbar max-h-[500px]">' + tableHtml + '</div>'
        + '</div>';
    },
    render: function() {
      const wrap = document.getElementById('branchBookingSummaryTablesWrap');
      if (!wrap) return;

      const category = this.currentCategory;
      if (!category) {
        wrap.innerHTML = window.app.emptyState({ icon: 'fa-boxes-stacked', title: 'ไม่มีข้อมูลหมวดหมู่สินค้า', subtitle: '' });
        return;
      }

      const products = (window.app.globalData.products || []).filter(p => (p['Category'] || '').toString().trim() === category);
      if (products.length === 0) {
        wrap.innerHTML = window.app.emptyState({ icon: 'fa-boxes-stacked', title: 'ไม่มีสินค้าในหมวดหมู่นี้', subtitle: '' });
        return;
      }

      // SKU -> modelCap (Model อย่างเดียว, ไม่รวมสี — เดิมรวม Capacity ต่อท้ายด้วย, owner request 2026-09-19 ให้เหลือคอลัมน์ Model เดียว) — ใช้เป็นคอลัมน์
      const skuInfo = {};
      const modelCapRowsSeen = {};
      const modelCapRows = [];
      products.forEach(p => {
        if (!p.SKU) return;
        const model = (p['Model'] || '').toString().trim() || (p['Product Name'] || '').toString().trim() || 'ไม่ระบุรุ่น';
        const modelCap = model;
        skuInfo[p.SKU] = modelCap;
        if (!modelCapRowsSeen[modelCap]) { modelCapRowsSeen[modelCap] = true; modelCapRows.push({ key: modelCap, label: modelCap }); }
      });

      // แถวสาขา — ใช้ทุกสาขาจากชีต Branches (แสดงแม้ยอดจอง 0) เรียงตามลำดับที่บันทึกในชีต — key = Branch Code (join key), label = Branch Name
      // กรองด้วย Area/สาขา ที่พิมพ์ค้นหา (owner request 2026-07-24) — substring แบบไม่สนตัวพิมพ์เล็กใหญ่, เลือกได้อิสระ ใช้เงื่อนไข AND ร่วมกัน
      const branches = window.app.globalData.branches || [];
      const areaKey = branches.length > 0 ? (Object.keys(branches[0]).find(k => k.toLowerCase().trim() === 'area') || 'Area') : 'Area';
      const filterArea = (this.currentArea || '').toLowerCase();
      const filterBranchQuery = (this.currentBranchQuery || '').toLowerCase();
      const branchRows = [];
      const branchByUpperCode = {}; // BRANCH CODE (upper, trim) -> {key,label} — ใช้ join ยอดจากออเดอร์ ไม่ผ่านตัวกรอง
      branches.forEach(b => {
        const code = (b['Branch Code'] || '').toString().trim();
        if (!code) return;
        const upper = code.toUpperCase();
        if (branchByUpperCode[upper]) return;
        const name = (b['Branch Name'] || '').toString().trim() || code;
        const area = (b[areaKey] || '').toString().trim();
        const row = { key: code, label: name };
        branchByUpperCode[upper] = row;
        if (filterArea && !area.toLowerCase().includes(filterArea)) return;
        // ต้องเทียบกับสตริงรวม "ชื่อ (รหัส)" ด้วย ไม่ใช่แค่ code/name แยกกัน — เพราะ datalist option (บรรทัด ~3277) ใช้ค่านี้เป็น value
        // ถ้าผู้ใช้คลิกเลือกจาก datalist โดยตรง ค่าที่ได้คือสตริงรวมทั้งก้อน ซึ่งไม่ใช่ substring ของ code หรือ name เดี่ยวๆ เลย
        const combinedBranchLabel = (name + ' (' + code + ')').toLowerCase();
        if (filterBranchQuery && !code.toLowerCase().includes(filterBranchQuery) && !name.toLowerCase().includes(filterBranchQuery) && !combinedBranchLabel.includes(filterBranchQuery)) return;
        branchRows.push(row);
      });

      // แถว Reservation Status มีแค่แถวแรกของแต่ละ OrderID — ต้อง join กลับด้วย OrderID (เหมือน bookingSummary)
      const orderResStatusMap = {};
      this.rawOrders.forEach(o => { if (o['Reservation Status'] && o['Reservation Status'].toString().trim() !== '') orderResStatusMap[o.OrderID] = o['Reservation Status']; });

      const UNKNOWN_BRANCH = 'ไม่ระบุสาขา';
      let hasUnknownBranch = false;

      // matrixT/matrixF: กรองเฉพาะแถวที่ Reservation Status เป็นจอง T / จอง F ตามลำดับ, matrixAll: ทุกแถวไม่สนสถานะ (ผลรวมทั้งหมด)
      const matrixT = {}, matrixF = {}, matrixAll = {};

      this.rawOrders.forEach(o => {
        if (window.app.isOrderCancelled(o)) return;
        if (o.SKU === 'DISCOUNT') return; // แถวส่วนลดไม่ใช่สินค้า
        let qty = parseInt((o.Qty || '0').toString().replace(/,/g, ''));
        if (isNaN(qty) || qty <= 0) return;
        const modelCap = skuInfo[o.SKU];
        if (!modelCap) return; // สินค้าไม่ได้อยู่ในหมวดหมู่ที่กำลังกรอง — ข้าม

        const branchCodeRaw = (o['Branch Code'] || '').toString().trim();
        const bRow = branchByUpperCode[branchCodeRaw.toUpperCase()];
        const branchKey = bRow ? bRow.key : UNKNOWN_BRANCH;
        if (!bRow) hasUnknownBranch = true;

        if (!matrixAll[branchKey]) matrixAll[branchKey] = {};
        matrixAll[branchKey][modelCap] = (matrixAll[branchKey][modelCap] || 0) + qty;

        const rStatus = (o['Reservation Status'] || orderResStatusMap[o.OrderID] || '').toString();
        if (rStatus.includes('จอง T')) {
          if (!matrixT[branchKey]) matrixT[branchKey] = {};
          matrixT[branchKey][modelCap] = (matrixT[branchKey][modelCap] || 0) + qty;
        } else if (rStatus.includes('จอง F')) {
          if (!matrixF[branchKey]) matrixF[branchKey] = {};
          matrixF[branchKey][modelCap] = (matrixF[branchKey][modelCap] || 0) + qty;
        }
      });

      // ออเดอร์ที่หาสาขาไม่เจอ — เพิ่มแถว "ไม่ระบุสาขา" ท้ายทุกตาราง เฉพาะตอนไม่มีตัวกรอง Area/สาขาใช้งานอยู่ (ไม่มี Area/Branch Code จริงให้จับคู่กับตัวกรอง)
      if (hasUnknownBranch && !filterArea && !filterBranchQuery) branchRows.push({ key: UNKNOWN_BRANCH, label: UNKNOWN_BRANCH });

      if (branchRows.length === 0) {
        wrap.innerHTML = window.app.emptyState({ icon: 'fa-store-slash', title: 'ไม่พบสาขาตามตัวกรองที่เลือก', subtitle: 'ลองเปลี่ยนตัวกรอง Area หรือ สาขา' });
        return;
      }

      let html = '';
      html += this.buildFlatPivotTable('ยอดจองตามสาขา × รุ่น (จอง T)', modelCapRows, matrixT, branchRows, 'สาขา');
      html += this.buildFlatPivotTable('ยอดจองตามสาขา × รุ่น (จอง F)', modelCapRows, matrixF, branchRows, 'สาขา');
      html += this.buildFlatPivotTable('ยอดจองตามสาขา × รุ่น (ผลรวมทั้งหมด)', modelCapRows, matrixAll, branchRows, 'สาขา');

      wrap.innerHTML = html;
      wrap.querySelectorAll('.chart-card').forEach(c => window.app.tableExportButtons(c));
    }
  };

  // สรุปข้อมูลจองทั้งหมด: ย้ายมาจากหน้า Dashboard (owner request) — ใช้ rawOrders (ยอดรวมทั้งหมด) ไม่มีตัวกรองวันที่/สาขา
  // เพราะ "โควต้า"/"คงเหลือ" เป็นค่าสต๊อกปัจจุบัน ไม่มีมิติเวลา — หนึ่งการ์ด/ตาราง ต่อหมวดหมู่ (Category)
window.app.allBookingSummary = {
    rawOrders: [],
    init: async function() {
      const content = document.getElementById('page-content');
      const tmpl = document.getElementById('tmpl-allbookingsummary');
      if (content && tmpl) content.innerHTML = tmpl.innerHTML;

      window.app.showLoading('กำลังโหลดข้อมูลสรุปการจอง...');
      try {
        const res = await window.app.api('GET_ADVANCED_DASHBOARD', {});
        Swal.close();
        if (res && res.status === 'success') {
          this.rawOrders = res.data.orders || [];
          this.render();
        } else {
          this.renderLoadError(res ? res.message : 'ไม่สามารถโหลดข้อมูลได้');
        }
      } catch (e) {
        Swal.close(); this.renderLoadError(e.message);
      }
    },
    // error state มาตรฐาน (5A.4) พร้อมปุ่มลองใหม่ — ห้ามเงียบเฉยตาม error contract
    renderLoadError: function(msg) {
      const container = document.getElementById('allBookingSummaryTablesContainer');
      if (!container) { Swal.fire('Error', msg, 'error'); return; }
      container.innerHTML = window.app.emptyState({
        icon: 'fa-exclamation-triangle',
        title: 'โหลดข้อมูลไม่สำเร็จ',
        subtitle: msg,
        actionLabel: 'ลองใหม่',
        onclick: 'window.app.allBookingSummary.init()'
      });
    },
    // Orders ไม่มีคอลัมน์ Category ของตัวเอง จึงต้อง join ผ่าน SKU กับ Products sheet เพื่อรู้ว่าแต่ละแถวออเดอร์อยู่หมวดไหน
    render: function() {
      // กัน async race: element อาจถูกเปลี่ยนหน้าไปแล้วระหว่างรอข้อมูล
      const container = document.getElementById('allBookingSummaryTablesContainer');
      if (!container) return;

      const products = window.app.globalData.products || [];
      const skuCategory = {};
      const catData = {}; // Category -> { productName: {stock,t,f} }
      products.forEach(p => {
        const name = (p['Product Name'] || '').toString().trim(); if (!name) return;
        const cat = (p['Category'] || '').toString().trim() || 'ไม่ระบุหมวดหมู่';
        if (p.SKU) skuCategory[p.SKU] = cat;
        let stock = parseFloat((p.Stock || '0').toString().replace(/,/g, '')); if (isNaN(stock)) stock = 0;
        if (!catData[cat]) catData[cat] = {};
        if (!catData[cat][name]) catData[cat][name] = { stock: 0, t: 0, f: 0 };
        catData[cat][name].stock += stock;
      });
      const orderResStatusMap = {};
      this.rawOrders.forEach(o => { if (o['Reservation Status'] && o['Reservation Status'].trim() !== '') { orderResStatusMap[o.OrderID] = o['Reservation Status']; } });
      this.rawOrders.forEach(o => {
        if (window.app.isOrderCancelled(o)) return;
        if (o.SKU === 'DISCOUNT') return; // แถวส่วนลดไม่ใช่สินค้า — Product Name ของมันคือชื่อโปรโมชั่น
        const name = (o['Product Name'] || '').toString().trim();
        if (!name) return;
        const cat = skuCategory[o.SKU] || 'ไม่ระบุหมวดหมู่';
        if (!catData[cat]) catData[cat] = {};
        if (!catData[cat][name]) catData[cat][name] = { stock: 0, t: 0, f: 0 };
        let qty = parseInt(String(o.Qty || 0).replace(/,/g,''), 10); if (isNaN(qty)) qty = 0;
        const rStatus = o['Reservation Status'] || orderResStatusMap[o.OrderID] || '';
        if (rStatus.includes('จอง T')) catData[cat][name].t += qty;
        else if (rStatus.includes('จอง F')) catData[cat][name].f += qty;
      });
      const sumCat = cat => Object.values(catData[cat]).reduce((s, c) => s + c.t + c.f, 0);
      // ลำดับหมวดตายตัวตามที่เจ้าของกำหนด (2026-07-11) — หมวดนอกลิสต์ต่อท้าย เรียงตามยอดจองรวมเหมือนเดิม
      const catOrder = ['โมบาย', 'แท็บเล็ต', 'อุปกรณ์เสริม', 'สมาร์ทวอทช์', 'หูฟัง', 'ของแถมแบรนด์', 'ของแถมช่องทาง'];
      const catRank = cat => { const i = catOrder.indexOf(cat); return i === -1 ? catOrder.length : i; };
      const catNames = Object.keys(catData).sort((a, b) => (catRank(a) - catRank(b)) || (sumCat(b) - sumCat(a)));
      if (catNames.length === 0) { container.innerHTML = window.app.emptyState({ icon: 'fa-boxes-stacked', title: 'ไม่มีข้อมูลสินค้า', subtitle: '' }); return; }

      let html = '';
      catNames.forEach(cat => {
        const prodMap = catData[cat];
        const names = Object.keys(prodMap).sort((a, b) => (prodMap[b].t + prodMap[b].f) - (prodMap[a].t + prodMap[a].f));
        let rows = ''; let sumStock = 0, sumT = 0, sumF = 0;
        names.forEach(name => {
          const c = prodMap[name]; const total = c.t + c.f; const quota = c.stock + total;
          sumStock += c.stock; sumT += c.t; sumF += c.f;
          rows += '<tr class="hover:bg-slate-50 transition-colors">'
            + '<td class="py-3 px-4 text-slate-700 font-medium">' + window.app.esc(name) + '</td>'
            + '<td class="py-3 px-4 text-right text-slate-600">' + quota.toLocaleString() + '</td>'
            + '<td class="py-3 px-4 text-right text-indigo-600 font-black">' + total.toLocaleString() + '</td>'
            + '<td class="py-3 px-4 text-right text-emerald-600 font-bold">' + c.stock.toLocaleString() + '</td>'
            + '<td class="py-3 px-4 text-right text-amber-600 font-bold">' + c.t.toLocaleString() + '</td>'
            + '<td class="py-3 px-4 text-right text-blue-600 font-bold">' + c.f.toLocaleString() + '</td>'
            + '</tr>';
        });
        const sumTotal = sumT + sumF; const sumQuota = sumStock + sumTotal;
        rows += '<tr class="bg-slate-50 font-black border-t-2 border-slate-200">'
          + '<td class="py-3 px-4 text-slate-800">รวม ' + window.app.esc(cat) + '</td>'
          + '<td class="py-3 px-4 text-right text-slate-800">' + sumQuota.toLocaleString() + '</td>'
          + '<td class="py-3 px-4 text-right text-indigo-700">' + sumTotal.toLocaleString() + '</td>'
          + '<td class="py-3 px-4 text-right text-emerald-700">' + sumStock.toLocaleString() + '</td>'
          + '<td class="py-3 px-4 text-right text-amber-700">' + sumT.toLocaleString() + '</td>'
          + '<td class="py-3 px-4 text-right text-blue-700">' + sumF.toLocaleString() + '</td>'
          + '</tr>';

        html += '<div class="chart-card tbleed-outer !p-0 mb-6">'
          + '<div class="tbleed-head bg-slate-50 border-b border-slate-200/80 p-4">'
          + '<h6 class="!mb-0"><i class="fas fa-boxes-stacked text-indigo-500"></i>' + window.app.esc(cat) + '</h6>'
          + '</div>'
          + '<div class="tbleed-body overflow-x-auto custom-scrollbar max-h-[400px]">'
          + '<table class="w-full text-sm text-left whitespace-nowrap">'
          + '<thead class="sticky top-0 z-10"><tr class="bg-indigo-50/95 backdrop-blur-sm border-b border-indigo-100">'
          + '<th class="py-2.5 px-4 text-left text-[11px] font-bold text-black uppercase tracking-wider">สินค้า</th>'
          + '<th class="py-2.5 px-4 text-right text-[11px] font-bold text-black uppercase tracking-wider">จำนวนโควต้า</th>'
          + '<th class="py-2.5 px-4 text-right text-[11px] font-bold text-black uppercase tracking-wider">ยอดจองรวม</th>'
          + '<th class="py-2.5 px-4 text-right text-[11px] font-bold text-black uppercase tracking-wider">คงเหลือ</th>'
          + '<th class="py-2.5 px-4 text-right text-[11px] font-bold text-black uppercase tracking-wider">ยอดจอง T</th>'
          + '<th class="py-2.5 px-4 text-right text-[11px] font-bold text-black uppercase tracking-wider">ยอดจอง F</th>'
          + '</tr></thead>'
          + '<tbody class="divide-y divide-slate-100">' + rows + '</tbody>'
          + '</table></div></div>';
      });
      container.innerHTML = html;
      container.querySelectorAll('.chart-card').forEach(c => window.app.tableExportButtons(c));
    }
  };
</script>

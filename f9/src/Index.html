  <script>
    // Dark mode: ตั้ง class ให้ <html> ก่อน paint แรกสุด กัน flash สีตอนโหลดหน้า (อ่านค่าที่ผู้ใช้เลือกไว้ก่อน, ถ้าไม่เคยเลือกค่อย fallback ไปตาม prefers-color-scheme ของเครื่อง)
    (function() {
      try {
        var t = localStorage.getItem('tg_theme');
        if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>

<script>
// Split out of JS.html (core). Attaches to window.app; included by Index.html after JS and before JS_Boot.
window.app.target = {
    rows: [],       // [{name, target}] ตามลำดับในชีต — ปุ่มแก้ไข/ลบส่ง index เข้ามา (ไม่ฝังข้อความจากชีตใน onclick)
    MAX_ROWS: 500,  // = TARGET_MAX_IMPORT_ ใน Code.js
    isAdmin: function() { return !!(window.app.user && window.app.user.Role === 'Admin'); },
    cols: function() { return this.isAdmin() ? 6 : 5; },

    init: async function() {
      const content = document.getElementById('page-content');
      const tmpl = document.getElementById('tmpl-target');
      if(content && tmpl) content.innerHTML = tmpl.innerHTML;
      const admin = this.isAdmin();
      ['targetAdminBar', 'targetActTh'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.toggle('hidden', !admin); });
      this.rows = [];

      window.app.showLoading('กำลังโหลดข้อมูลเป้าหมาย...');
      try {
        const resOrders = await window.app.api('GET_TABLE', { tableName: 'Orders' });
        const resTarget = await window.app.api('GET_TABLE', { tableName: 'Target' });
        Swal.close();
        if(resOrders && resOrders.status === 'success' && resTarget && resTarget.status === 'success') {
           this.render(resTarget.data, resOrders.data);
        } else {
           this.renderLoadError('ไม่พบข้อมูล กรุณาตรวจสอบว่ามีชีต "Target" แล้วหรือไม่');
        }
      } catch(e) {
        Swal.close(); this.renderLoadError(e.message);
      }
    },
    renderLoadError: function(msg) {
      const tbody = document.getElementById('targetTableBody');
      if (!tbody) { window.app.alertError('Error', msg); return; }
      tbody.innerHTML = '<tr><td colspan="' + this.cols() + '">' + window.app.emptyState({
        icon: 'fa-exclamation-triangle',
        title: 'โหลดข้อมูลไม่สำเร็จ',
        subtitle: msg,
        actionLabel: 'ลองใหม่',
        onclick: 'window.app.target.init()'
      }) + '</td></tr>';
    },
    render: function(targets, orders) {
      // กัน async race: element อาจถูกเปลี่ยนหน้าไปแล้วระหว่างรอข้อมูล
      const targetBodyEl = document.getElementById('targetTableBody');
      if (!targetBodyEl) return;
      const settings = window.app.globalData.settings || {};
      const startStr = settings.ReserveStart;
      const endStr = settings.ReserveEnd;
      if(!startStr || !endStr) {
         const canSetup = window.app.user && window.app.user.Role === 'Admin';
         targetBodyEl.innerHTML = '<tr><td colspan="' + this.cols() + '">' + window.app.emptyState({
           icon: 'fa-clock',
           title: 'ยังไม่ได้ตั้งค่าช่วงเวลาการจอง',
           subtitle: 'กรุณาตั้งค่า วันเริ่ม-วันสิ้นสุดการจอง ในเมนู "ตั้งเวลารับจองสินค้า" ก่อนใช้งานหน้านี้',
           actionLabel: canSetup ? 'ไปตั้งค่าช่วงเวลาการจอง' : '',
           onclick: canSetup ? "location.hash='bookingsettings'" : ''
         }) + '</td></tr>';
         return;
      }
      
      const startDate = new Date(startStr);
      const endDate = new Date(endStr);
      const now = new Date();
      
      const formatTh = (d) => { const m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.']; return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()+543}`; };
      const rangeEl = document.getElementById('targetDateRange');
      if (rangeEl) rangeEl.innerText = `(${formatTh(startDate)} - ${formatTh(endDate)})`;
      
      // นับจำนวนวันตามปฏิทิน (ไม่สนใจเวลา) — เหมือน analytics.render กัน Math.ceil ปัดเกิน 1 วันเมื่อเวลาเริ่ม/สิ้นสุดไม่ตรง 00:00
      const startDateOnly = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
      const endDateOnly = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate());
      const totalDays = Math.max(1, Math.round((endDateOnly - startDateOnly) / (1000 * 60 * 60 * 24)));
      let currentDays = Math.max(0, Math.ceil((now - startDate) / (1000 * 60 * 60 * 24)));
      if (now > endDate) currentDays = totalDays;

      // แปลงวันที่เป็น key YYYY-MM-DD (local time) — เหมือน analytics.render เพื่อกรองออเดอร์ให้อยู่ในช่วงจองเดียวกัน
      const toDateKey = (dt) => dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
      const startKey = toDateKey(startDate);
      const endKey = toDateKey(endDate);

      const validOrders = orders.filter(o => {
          if (window.app.isOrderCancelled(o) || !o.Timestamp) return false;
          // นอกช่วงเวลาการจอง (ReserveStart/ReserveEnd) — ตัดออก ไม่งั้นยอดจองรวมออเดอร์เก่าข้ามแคมเปญทั้งหมด (Orders sheet ไม่เคยถูกล้าง)
          const tsObj = new Date(o.Timestamp);
          if (isNaN(tsObj)) return false;
          const d = toDateKey(tsObj);
          return d >= startKey && d <= endKey;
      });
      const salesByName = {};
      let totalMobileQty = 0;

      const products = window.app.globalData.products || [];
      const getCat = (sku) => {
         const p = products.find(x => x.SKU === sku);
         return p ? (p.Category || '').toString().trim() : '';
      };

      const branches = window.app.globalData.branches || [];

      // หา key ของคอลัมน์ Area ใน Branches แบบไม่สนตัวพิมพ์ (Area / AREA / area)
      const areaKey = branches.length > 0
         ? (Object.keys(branches[0]).find(k => k.toLowerCase().trim() === 'area') || 'Area')
         : 'Area';

      validOrders.forEach(o => {
          let cat = getCat(o.SKU);
          if (window.app.isMobileCat(cat)) {
             let qty = parseInt(String(o.Qty || 0).replace(/,/g,''), 10);
             if(!isNaN(qty) && qty > 0) {
                 totalMobileQty += qty;
                 let staff = (o['Staff'] || '').toString().trim().toUpperCase();
                 let branchInput = (o['Branch Code'] || '').toString().trim().toUpperCase();

                 if (staff) salesByName[staff] = (salesByName[staff] || 0) + qty;

                 const bInfo = branches.find(b =>
                     (b['Branch Code'] || '').toString().trim().toUpperCase() === branchInput ||
                     (b['Branch Name'] || '').toString().trim().toUpperCase() === branchInput
                 );

                 if (bInfo) {
                     let area = (bInfo[areaKey] || '').toString().trim().toUpperCase();
                     let branchName = (bInfo['Branch Name'] || '').toString().trim().toUpperCase();
                     let branchCode = (bInfo['Branch Code'] || '').toString().trim().toUpperCase();

                     if (area) salesByName[area] = (salesByName[area] || 0) + qty;
                     if (branchName) salesByName[branchName] = (salesByName[branchName] || 0) + qty;
                     if (branchCode && branchCode !== branchName) salesByName[branchCode] = (salesByName[branchCode] || 0) + qty;
                 } else {
                     // หาสาขาไม่เจอ — นับด้วยค่าที่บันทึกมาตรงๆ เผื่อชื่อใน Target ตรงกับค่านี้
                     if (branchInput) salesByName[branchInput] = (salesByName[branchInput] || 0) + qty;
                     salesByName['UNKNOWN AREA'] = (salesByName['UNKNOWN AREA'] || 0) + qty;
                 }
             }
          }
      });
      
      let html = '';
      const admin = this.isAdmin();
      const hasNamed = (targets || []).some(t => Object.keys(t).some(k => k !== '_rowIndex' && String(t[k] || '').trim()));
      if(!targets || targets.length === 0 || !hasNamed) {
          html = '<tr><td colspan="' + this.cols() + '">' + window.app.emptyState({
            icon: 'fa-crosshairs',
            title: 'ยังไม่มีเป้าหมาย',
            subtitle: admin ? 'เพิ่มเป้าหมายทีละรายการ หรือนำเข้าจากไฟล์ CSV' : 'ให้ผู้ดูแลระบบเพิ่มเป้าหมายก่อน',
            actionLabel: admin ? 'เพิ่มเป้าหมาย' : '',
            onclick: admin ? 'window.app.target.openForm(-1)' : ''
          }) + '</td></tr>';
      } else {
          let actualKeys = Object.keys(targets[0]).filter(k => k !== '_rowIndex');
          
          let nameKey = actualKeys.find(k => k.toLowerCase() === 'area' || k.includes('Area') || k.includes('สาขา') || k.includes('พนักงาน') || k.includes('ชื่อ') || k.includes('รับเป้า')) || actualKeys[0];
          let targetKey = actualKeys.find(k => k !== nameKey && (k === 'เป้า' || k.includes('เป้า') || k.toLowerCase().includes('target'))) || actualKeys.find(k => k !== nameKey) || actualKeys[1];
          
          
          let totalTargetSum = 0;
          let totalActualSum = 0;
          let totalForecastSum = 0;
          
          const hasAreaRows = targets.some(t => { const n = (t[nameKey] || '').toString().trim().toUpperCase(); return n && n !== 'ALL' && n !== 'ALL BRANCHES'; });
          targets.forEach(t => {
              let name = (t[nameKey] || '').toString().trim();
              if(!name) return;
              
              // ลบลูกน้ำ (comma) ออกก่อนแปลงเป็นตัวเลข เพื่อป้องกันปัญหาการดึงข้อมูลผิดพลาด
              let targetValStr = (t[targetKey] || '').toString().replace(/,/g, '').trim();
              let targetVal = parseFloat(targetValStr) || 0;
              let upperName = name.toUpperCase();
              // "ALL" / "ALL BRANCHES" = ยอดรวมโมบายทุกสาขา
              let actualVal = (upperName === 'ALL' || upperName === 'ALL BRANCHES') ? totalMobileQty : (salesByName[upperName] || 0);
              
              let displayName = name;
              if (window.app.globalData.branches) {
                  const bInfo = window.app.globalData.branches.find(b => b['Branch Code'] === name || b['Branch Name'] === name);
                  if (bInfo) displayName = bInfo['Branch Name'];
              }
              if (displayName === name && window.app.globalData.members) {
                  const mInfo = window.app.globalData.members.find(m => m['Username'] === name || m['Name'] === name);
                  if (mInfo) displayName = mInfo['Name'] || mInfo['Username'];
              }
              
              const eName = window.app.esc(name); const eDisp = window.app.esc(displayName);
              let nameHtml = displayName === name ? eName : `${eDisp} <span class="text-[10px] text-slate-400 font-normal block md:inline md:ml-1">(${eName})</span>`;
              
              let avgPerDay = currentDays > 0 ? (actualVal / currentDays) : 0;
              let forecastVal = Math.round(avgPerDay * totalDays);
              let diffVal = actualVal - targetVal;
              
              // แถว ALL / ALL BRANCHES คือยอดรวมทุกสาขาอยู่แล้ว — ถ้าชีตมีแถวรายแอเรียด้วย ห้ามบวกซ้ำในบรรทัด "รวมทั้งหมด"
              const isAllRow = (upperName === 'ALL' || upperName === 'ALL BRANCHES');
              if (!(isAllRow && hasAreaRows)) {
                totalTargetSum += targetVal;
                totalActualSum += actualVal;
                totalForecastSum += forecastVal;
              }
              
              let diffClass = diffVal >= 0 ? 'text-emerald-600 bg-emerald-50' : 'text-rose-600 bg-rose-50';
              let diffIcon = diffVal >= 0 ? '<i class="fas fa-arrow-up mr-1"></i>' : '<i class="fas fa-arrow-down mr-1"></i>';
              const idx = this.rows.push({ name: name, target: targetVal }) - 1;
              const actHtml = admin ? `<td class="py-4 px-4 text-center whitespace-nowrap"><button type="button" class="cms-ico" onclick="window.app.target.openForm(${idx})" title="แก้ไข" aria-label="แก้ไขเป้าหมาย"><i class="fas fa-pen"></i></button><button type="button" class="cms-ico cms-ico-red" onclick="window.app.target.remove(${idx})" title="ลบ" aria-label="ลบเป้าหมาย"><i class="fas fa-trash"></i></button></td>` : '';

              html += `
              <tr class="hover:bg-slate-50 border-b border-slate-100 transition-colors">
                 <td class="py-4 px-4 font-bold text-slate-800">${nameHtml}</td>
                 <td class="py-4 px-4 text-center text-slate-600">${targetVal.toLocaleString()}</td>
                 <td class="py-4 px-4 text-center font-bold text-indigo-600">${actualVal.toLocaleString()}</td>
                 <td class="py-4 px-4 text-center"><span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold ${diffClass}">${diffIcon}${diffVal > 0 ? '+' : ''}${diffVal.toLocaleString()}</span></td>
                 <td class="py-4 px-4 text-center font-bold text-amber-500">${forecastVal.toLocaleString()}</td>
                 ${actHtml}
              </tr>
              `;
          });
          
          let tDiff = totalActualSum - totalTargetSum;
          let tDiffClass = tDiff >= 0 ? 'text-emerald-600' : 'text-rose-600';
          let tDiffIcon = tDiff >= 0 ? '<i class="fas fa-arrow-up mr-1"></i>' : '<i class="fas fa-arrow-down mr-1"></i>';
          html += `
              <tr class="bg-indigo-50/50 border-t-2 border-indigo-100">
                 <td class="py-4 px-4 font-black text-indigo-900 text-right">รวมทั้งหมด:</td>
                 <td class="py-4 px-4 text-center font-black text-indigo-900">${totalTargetSum.toLocaleString()}</td>
                 <td class="py-4 px-4 text-center font-black text-indigo-700">${totalActualSum.toLocaleString()}</td>
                 <td class="py-4 px-4 text-center font-black ${tDiffClass}">${tDiffIcon}${tDiff > 0 ? '+' : ''}${tDiff.toLocaleString()}</td>
                 <td class="py-4 px-4 text-center font-black text-amber-600">${totalForecastSum.toLocaleString()}</td>
                 ${admin ? '<td></td>' : ''}
              </tr>
          `;
      }

      targetBodyEl.innerHTML = html;
      const targetCard = targetBodyEl.closest('.chart-card');
      if (targetCard) window.app.tableExportButtons(targetCard);
    },

    // ชื่อที่หน้านี้นับยอดให้ได้: ALL BRANCHES / Area / รหัสสาขา / ชื่อสาขา / Username — ใช้เป็นตัวเลือกในช่องชื่อ
    nameOptions: function() {
      const g = window.app.globalData || {}, out = [], seen = {};
      const add = (v, note) => { v = (v || '').toString().trim(); if (!v || seen[v.toUpperCase()]) return; seen[v.toUpperCase()] = 1; out.push({ v: v, note: note }); };
      add('ALL BRANCHES', 'ยอดรวมทุกสาขา');
      const br = g.branches || [];
      const areaKey = br.length ? (Object.keys(br[0]).find(k => k.toLowerCase().trim() === 'area') || 'Area') : 'Area';
      br.forEach(b => add(b[areaKey], 'Area'));
      br.forEach(b => add(b['Branch Code'], 'รหัสสาขา ' + (b['Branch Name'] || '')));
      br.forEach(b => add(b['Branch Name'], 'ชื่อสาขา'));
      (g.members || []).forEach(m => add(m.Username, 'พนักงาน ' + (m.Name || '')));
      return out;
    },

    // เพิ่ม (idx = -1) / แก้ไข (idx = แถวใน this.rows) — ตรวจจริงที่ server (TARGET_SAVE); บันทึกแล้วโหลดหน้าใหม่ก่อนค่อยแจ้งผล (showLoading ของ init ปิด Swal ที่ขึ้นก่อน)
    openForm: async function(idx) {
      if (!this.isAdmin()) return;
      const esc = window.app.esc;
      const cur = idx > -1 ? this.rows[idx] : null;
      if (idx > -1 && !cur) return;
      const opts = this.nameOptions().map(o => '<option value="' + esc(o.v) + '">' + esc(o.note) + '</option>').join('');
      const r = await Swal.fire({
        title: cur ? 'แก้ไขเป้าหมาย' : 'เพิ่มเป้าหมาย',
        html: '<div class="text-left space-y-3">'
          + '<div><label for="tgName" class="block text-sm font-semibold mb-1">ชื่อ (Area / สาขา / พนักงาน)</label>'
          + '<input id="tgName" class="swal2-input" style="margin:0;width:100%" list="tgNameList" maxlength="100" autocomplete="off" placeholder="เช่น ALL BRANCHES หรือชื่อ Area" value="' + (cur ? esc(cur.name) : '') + '">'
          + '<datalist id="tgNameList">' + opts + '</datalist>'
          + '<p class="text-xs text-slate-500 mt-1">ต้องตรงกับ Area, รหัสสาขา, ชื่อสาขา หรือ Username ถึงจะนับยอดจองได้ — ALL BRANCHES = ยอดรวมทุกสาขา</p></div>'
          + '<div><label for="tgTarget" class="block text-sm font-semibold mb-1">เป้า (เครื่อง)</label>'
          + '<input id="tgTarget" class="swal2-input" style="margin:0;width:100%" type="number" min="0" step="1" inputmode="numeric" value="' + (cur ? esc(cur.target) : '') + '"></div>'
          + '</div>',
        showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', focusConfirm: false,
        didOpen: () => { const el = document.getElementById(cur ? 'tgTarget' : 'tgName'); if (el) el.focus(); },
        preConfirm: async () => {
          const name = document.getElementById('tgName').value.trim();
          const target = document.getElementById('tgTarget').value.trim();
          if (!name) { Swal.showValidationMessage('กรุณาระบุชื่อ'); return false; }
          if (!/^\d+$/.test(target)) { Swal.showValidationMessage('เป้าต้องเป็นจำนวนเต็มตั้งแต่ 0 ขึ้นไป'); return false; }
          try {
            const res = await window.app.api('TARGET_SAVE', { name: name, target: target, originalName: cur ? cur.name : '' });
            if (!res || res.status !== 'success') { Swal.showValidationMessage(esc(String((res && res.message) || 'บันทึกไม่สำเร็จ').replace(/^Error:\s*/, ''))); return false; }
            return res;
          } catch (e) { Swal.showValidationMessage(esc(e.message || String(e))); return false; }
        }
      });
      if (!r.isConfirmed) return;
      await this.init();
      window.app.toast((cur ? 'บันทึกการแก้ไขเป้าหมายแล้ว: ' : 'เพิ่มเป้าหมายแล้ว: ') + r.value.name);
    },

    remove: async function(idx) {
      if (!this.isAdmin()) return;
      const cur = this.rows[idx];
      if (!cur) return;
      const c = await Swal.fire({ icon: 'warning', title: 'ลบเป้าหมายนี้?', text: cur.name + ' (เป้า ' + cur.target.toLocaleString() + ')', showCancelButton: true, confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#e11d48' });
      if (!c.isConfirmed) return;
      window.app.showLoading('กำลังลบ...');
      let res;
      try { res = await window.app.api('TARGET_DELETE', { name: cur.name }); } catch (e) { res = { status: 'error', message: e.message }; }
      if (!res || res.status !== 'success') { window.app.hideLoading(); window.app.alertError('ลบไม่สำเร็จ', String((res && res.message) || 'Error').replace(/^Error:\s*/, '')); return; }
      await this.init();
      window.app.toast('ลบเป้าหมายแล้ว: ' + cur.name);
    },

    // ----- นำเข้า CSV: คอลัมน์ชื่อ + เป้า, ชื่อใหม่ = เพิ่ม, ชื่อที่มีแล้ว = อัปเดตเป้า; ตรวจก่อน (dryRun) แล้วค่อยบันทึก -----
    downloadTemplate: function() {
      const q = (v) => '"' + String(v).replace(/"/g, '""') + '"';
      const rows = [['Area', 'เป้า'], ['ALL BRANCHES', '1000']];
      const firstArea = this.nameOptions().find(o => o.note === 'Area');
      if (firstArea) rows.push([firstArea.v, '200']);
      const csv = '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n') + '\r\n';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      a.download = 'target_import_template.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    },

    openImport: async function() {
      if (!this.isAdmin()) return;
      const r = await Swal.fire({
        title: 'นำเข้าเป้าหมายจากไฟล์ CSV',
        icon: 'info',
        html: '<div class="text-left text-sm leading-relaxed"><ul class="list-disc pl-5 space-y-1">'
          + '<li>ไฟล์ CSV (UTF-8) 2 คอลัมน์: <b>Area</b> (ชื่อ Area / รหัสสาขา / ชื่อสาขา / Username / ALL BRANCHES) และ <b>เป้า</b> (ตัวเลข)</li>'
          + '<li>ชื่อที่ยังไม่มี = <b>เพิ่มใหม่</b> · ชื่อที่มีอยู่แล้ว = <b>อัปเดตเป้า</b> (ไม่สนตัวพิมพ์เล็ก/ใหญ่) · ไม่ลบรายการที่ไม่อยู่ในไฟล์</li>'
          + '<li>ครั้งละไม่เกิน ' + this.MAX_ROWS + ' แถว และจะแสดงผลให้ตรวจก่อนบันทึกจริง</li>'
          + '</ul></div>',
        showCancelButton: true, showDenyButton: true,
        confirmButtonText: 'เลือกไฟล์ CSV', denyButtonText: 'ดาวน์โหลดไฟล์ตัวอย่าง', cancelButtonText: 'ยกเลิก'
      });
      if (r.isDenied) return this.downloadTemplate();
      if (!r.isConfirmed) return;
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.csv,text/csv';
      input.onchange = () => { if (input.files && input.files[0]) this.handleFile(input.files[0]); };
      input.click();
    },

    // ไฟล์ → [{name, target}] — หัวคอลัมน์ชื่อ/เป้าหาแบบเดียวกับ server (targetSheet_); ข้ามแถวว่างและแถว "รวมทั้งหมด"
    parseFile: function(text) {
      const parsed = window.app.productGroup.parseCsv(text);
      if (!parsed) throw new Error('ไฟล์ CSV ไม่สมบูรณ์ (เครื่องหมายคำพูดไม่ปิด)');
      const header = (parsed[0] || []).map(h => String(h).trim());
      let ni = header.findIndex(h => /^(area|name)$/i.test(h) || h.indexOf('Area') > -1 || h.indexOf('สาขา') > -1 || h.indexOf('พนักงาน') > -1 || h.indexOf('ชื่อ') > -1 || h.indexOf('รับเป้า') > -1);
      let ti = header.findIndex((h, i) => i !== ni && (h.indexOf('เป้า') > -1 || /target/i.test(h)));
      if (ni === -1 || ti === -1) throw new Error('ไม่พบหัวคอลัมน์ Area และ เป้า ในแถวแรกของไฟล์ — ลองใช้ไฟล์ตัวอย่าง');
      const rows = [];
      parsed.slice(1).forEach(cells => {
        if (!cells.some(x => String(x).trim() !== '')) return;
        const name = String(cells[ni] === undefined ? '' : cells[ni]).trim();
        if (/^รวมทั้งหมด:?$/.test(name)) return;
        rows.push({ name: name, target: String(cells[ti] === undefined ? '' : cells[ti]).trim() });
      });
      if (!rows.length) throw new Error('ไม่พบข้อมูลในไฟล์');
      if (rows.length > this.MAX_ROWS) throw new Error('ไฟล์มี ' + rows.length + ' แถว นำเข้าได้ครั้งละไม่เกิน ' + this.MAX_ROWS + ' แถว');
      return rows;
    },

    handleFile: async function(file) {
      const esc = window.app.esc;
      try {
        if (file.size > 2 * 1024 * 1024) throw new Error('ไฟล์ใหญ่เกิน 2 MB');
        const rows = this.parseFile(await file.text());
        window.app.showLoading('กำลังตรวจไฟล์ ' + rows.length + ' แถว...');
        let res;
        try { res = await window.app.api('TARGET_IMPORT', { rows: rows, dryRun: true }); } finally { window.app.hideLoading(); }
        if (!res || res.status !== 'success') throw new Error(String((res && res.message) || 'ตรวจไฟล์ไม่สำเร็จ').replace(/^Error:\s*/, ''));
        const n = res.added.length + res.updated.length;
        const list = (items, fmt) => '<ul class="list-disc pl-5 text-xs leading-relaxed">' + items.slice(0, 8).map(fmt).join('') + (items.length > 8 ? '<li class="opacity-70">และอีก ' + (items.length - 8) + ' รายการ</li>' : '') + '</ul>';
        const html = '<div class="text-sm text-left">ไฟล์ <b>' + esc(file.name) + '</b> · ทั้งหมด ' + res.total + ' แถว</div>'
          + (res.added.length ? '<div class="mt-3 text-left"><div class="font-bold text-emerald-700">เพิ่มใหม่ ' + res.added.length + ' รายการ</div>' + list(res.added, a => '<li><b>' + esc(a.name) + '</b> = ' + esc(a.target.toLocaleString()) + '</li>') + '</div>' : '')
          + (res.updated.length ? '<div class="mt-3 text-left"><div class="font-bold text-indigo-700">อัปเดตเป้า ' + res.updated.length + ' รายการ</div>' + list(res.updated, u => '<li><b>' + esc(u.name) + '</b> ' + esc(u.from.toLocaleString()) + ' → ' + esc(u.target.toLocaleString()) + '</li>') + '</div>' : '')
          + (res.unchanged ? '<div class="mt-3 text-left text-slate-600">เป้าเท่าเดิม ' + res.unchanged + ' รายการ (ไม่เปลี่ยน)</div>' : '')
          + (res.errors.length ? '<div class="mt-3 text-left"><div class="font-bold text-rose-700">ข้อมูลไม่ถูกต้อง ' + res.errors.length + ' แถว (ไม่นำเข้า)</div>' + list(res.errors, x => '<li>แถว ' + esc(x.line) + (x.name ? ' · <b>' + esc(x.name) + '</b>' : '') + ' — ' + esc(x.reason) + '</li>') + '</div>' : '');
        if (!n) { await Swal.fire({ title: 'ไม่มีอะไรต้องเปลี่ยน', html: html, icon: 'warning' }); return; }
        const cf = await Swal.fire({ title: 'ตรวจสอบก่อนนำเข้า', html: html, icon: res.errors.length ? 'warning' : 'question', showCancelButton: true, confirmButtonText: 'บันทึก ' + n + ' รายการ', cancelButtonText: 'ยกเลิก' });
        if (!cf.isConfirmed) return;
        window.app.showLoading('กำลังบันทึกเป้าหมาย...');
        let fin;
        try { fin = await window.app.api('TARGET_IMPORT', { rows: rows, dryRun: false }); } catch (e) { fin = { status: 'error', message: e.message }; }
        if (!fin || fin.status !== 'success') { window.app.hideLoading(); throw new Error(String((fin && fin.message) || 'นำเข้าไม่สำเร็จ').replace(/^Error:\s*/, '')); }
        await this.init();
        await Swal.fire({ icon: 'success', title: 'นำเข้าเป้าหมายแล้ว', text: 'เพิ่มใหม่ ' + fin.added.length + ' · อัปเดต ' + fin.updated.length + (fin.errors.length ? ' · ไม่นำเข้า ' + fin.errors.length + ' แถว' : '') });
      } catch (e) {
        window.app.alertError('นำเข้าไม่ได้', e.message || String(e));
      }
    }
  };
</script>

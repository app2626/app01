<script>
window.app = {
  // ภาพแทนเมื่อไม่มีรูปสินค้า — SVG ในตัว ไม่พึ่งบริการภายนอก (via.placeholder.com ไม่เสถียร) และไม่มีข้อความภาษาอังกฤษ
  NO_IMG: "data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20200%20200%27%3E%3Cdefs%3E%3ClinearGradient%20id=%27g%27%20x1=%270%27%20y1=%270%27%20x2=%271%27%20y2=%271%27%3E%3Cstop%20offset=%270%27%20stop-color=%27%23f1f5f9%27/%3E%3Cstop%20offset=%271%27%20stop-color=%27%23dce7f0%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%27200%27%20height=%27200%27%20rx=%2728%27%20fill=%27url%28%23g%29%27/%3E%3Crect%20x=%2770%27%20y=%2734%27%20width=%2760%27%20height=%27132%27%20rx=%2713%27%20fill=%27none%27%20stroke=%27%2385abc9%27%20stroke-width=%275%27/%3E%3Crect%20x=%2791%27%20y=%2745%27%20width=%2718%27%20height=%274%27%20rx=%272%27%20fill=%27%2385abc9%27/%3E%3Ccircle%20cx=%27100%27%20cy=%27150%27%20r=%274.5%27%20fill=%27%2385abc9%27/%3E%3C/svg%3E",

  user: null,
  globalData: { products: [], promotions: [], branches: [], channels: [], interests: [], heroBanners: [], gridBanners: [], popupBanners: [], giftMappings: [] },
  cart: [],
  currentRoute: '',

  // label = ชื่อไทย (บรรทัดบน) · sub = ชื่ออังกฤษ (บรรทัดล่าง) — สิทธิ์/route ผูกกับ id เท่านั้น เปลี่ยนชื่อได้อิสระ
  menuConfig: [
      { label: 'เมนูหลัก', sub: 'Main Menu', isCategory: true, roles: ['Admin', 'Manager', 'Sales'] },
      { id: 'dashboard', icon: 'fa-tachometer-alt', label: 'แดชบอร์ด', sub: 'Dashboard', roles: ['Admin', 'Manager', 'Sales'] },
      { id: 'pos', icon: 'fa-shopping-cart', label: 'สั่งจองสินค้า', sub: 'Pre Booking', roles: ['Admin', 'Manager', 'Sales'] },
      { id: 'orders', icon: 'fa-file-invoice-dollar', label: 'รายการใบจอง', sub: 'Orders', roles: ['Admin', 'Manager', 'Sales'] },
      { id: 'invoice', icon: 'fa-file-invoice', label: 'ใบเสนอราคา/แจ้งหนี้', sub: 'Quotation & Invoice', roles: ['Admin', 'Manager', 'Sales'] },
      { label: 'วิเคราะห์/รายงาน', sub: 'Reports', isCategory: true, roles: ['Admin', 'Manager', 'Sales'] },
      { id: 'analytics', icon: 'fa-chart-pie', label: 'วิเคราะห์ยอดขาย', sub: 'Sales Analytics', roles: ['Admin', 'Manager'] },
      { id: 'target', icon: 'fa-crosshairs', label: 'เป้าหมายและพยากรณ์', sub: 'Target & Forecast', roles: ['Admin', 'Manager'] },
      { id: 'bookingsummary', icon: 'fa-table', label: 'สรุปยอดจองรายวัน', sub: 'Daily Bookings', roles: ['Admin', 'Manager'] },
      { id: 'salessummary', icon: 'fa-layer-group', label: 'สรุปรุ่น/แอเรีย/ช่องทาง', sub: 'Model · Area · Channel', roles: ['Admin', 'Manager'] },
      { id: 'branchbookingsummary', icon: 'fa-store-alt', label: 'สรุปยอดจองตามสาขา', sub: 'Branch Bookings', roles: ['Admin', 'Manager'] },
      { id: 'allbookingsummary', icon: 'fa-boxes-stacked', label: 'สรุปข้อมูลจองทั้งหมด', sub: 'All Bookings', roles: ['Admin', 'Manager'] },
      { label: 'หลังร้าน', sub: 'Back Office', isCategory: true, roles: ['Admin', 'Manager'] },
      {
        // กลุ่มย่อยเรียงตามงาน: สินค้า / ร้านและสาขา / โปรโมชั่น / เนื้อหาและระบบ — id ของทุกเมนูคงเดิม (สิทธิ์ Accessible Menus และ route ผูกกับ id)
        id: 'admin_settings', icon: 'fa-cogs', label: 'จัดการร้าน', sub: 'Store Admin', roles: ['Admin', 'Manager'],
        isParent: true,
        children: [
          { label: 'สินค้า', sub: 'Products', isCategory: true, roles: ['Admin'] },
          { id: 'products', icon: 'fa-box-open', label: 'สินค้า', sub: 'Products', roles: ['Admin'] },
          { id: 'inventorylog', icon: 'fa-boxes', label: 'ประวัติสต็อก', sub: 'Stock History', roles: ['Admin'] },
          { label: 'ร้านและสาขา', sub: 'Store & Branches', isCategory: true, roles: ['Admin'] },
          { id: 'channels', icon: 'fa-network-wired', label: 'ช่องทางขาย', sub: 'Channels', roles: ['Admin'] },
          { id: 'branches', icon: 'fa-store-alt', label: 'สาขา', sub: 'Branches', roles: ['Admin'] },
          { id: 'members', icon: 'fa-users', label: 'ผู้ใช้งาน', sub: 'Members', roles: ['Admin'] },
          { id: 'interests', icon: 'fa-heart', label: 'ตัวเลือกความสนใจลูกค้า', sub: 'Booking Form Options', roles: ['Admin'] },
          { label: 'โปรโมชั่น', sub: 'Promotions', isCategory: true, roles: ['Admin', 'Manager'] },
          { id: 'giftmappings', icon: 'fa-project-diagram', label: 'ชุดของแถม', sub: 'Gift Sets', roles: ['Admin', 'Manager'] },
          { id: 'autopromotions', icon: 'fa-magic', label: 'ส่วนลดซื้อคู่อัตโนมัติ', sub: 'Auto Promotions', roles: ['Admin', 'Manager'] },
          { id: 'promotions', icon: 'fa-tags', label: 'ส่วนลดตอนจอง', sub: 'Checkout Discounts', roles: ['Admin'] },
          { id: 'coupons', icon: 'fa-ticket-alt', label: 'โค้ดส่วนลด', sub: 'Coupons', roles: ['Admin'] },
          { label: 'เนื้อหาและระบบ', sub: 'Content & System', isCategory: true, roles: ['Admin'] },
          { id: 'banners', icon: 'fa-images', label: 'แบนเนอร์', sub: 'Banners', roles: ['Admin'] },
          { id: 'news', icon: 'fa-newspaper', label: 'ข่าวสาร', sub: 'News', roles: ['Admin'] },
          { id: 'newscats', icon: 'fa-tags', label: 'หมวดหมู่ข่าว', sub: 'News Categories', roles: ['Admin'] },
          { id: 'systemsettings', icon: 'fa-sliders-h', label: 'ตั้งค่าระบบ', sub: 'System Settings', roles: ['Admin'] },
          { id: 'auditlog', icon: 'fa-history', label: 'บันทึกการใช้งาน', sub: 'Audit Log', roles: ['Admin'] }
        ]
      }
  ],

  // Escape ข้อความก่อนแทรกลง innerHTML ทุกครั้งที่ข้อมูลมาจากชีต/ผู้ใช้ — ป้องกัน XSS
  esc: function(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  },

  // สำหรับค่าที่ฝังเป็น string literal ใน onclick="fn('...')" — escape เป็น JS string ก่อน แล้วค่อย escape HTML
  // ข้อความจากชีตที่อนุญาตให้จัดรูปแบบได้นิดหน่อย (เช่น Message Suggest/Apply ของ AutoPromotions — Admin/Manager แก้ได้):
  // escape ทั้งหมดก่อน แล้วคืนเฉพาะแท็ก b/strong/em/i/u/br (class ได้แค่ตัวอักษรปลอดภัย) — ห้ามมี attribute อื่น/สคริปต์หลุดผ่าน
  safeRichText: function(v) {
    return window.app.esc(v).replace(/&lt;(\/?)(b|strong|em|i|u|br)(?:\s+class=(?:&quot;|&#39;)([A-Za-z0-9 _:\-]{0,80})(?:&quot;|&#39;))?\s*\/?&gt;/gi,
      function(m, close, tag, cls) { tag = tag.toLowerCase(); return close ? '</' + tag + '>' : '<' + tag + (cls ? ' class="' + cls + '"' : '') + '>'; });
  },

  escAttrJs: function(v) {
    return window.app.esc(String(v === null || v === undefined ? '' : v).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
  },

  // ทุกหน้าที่นับ/รวมยอดจองจาก Orders ต้องข้ามแถวที่ถูกยกเลิกด้วยฟังก์ชันนี้ — เดิมแต่ละหน้าเช็คเอง ('Cancelled' บ้าง, 'Cancelled'+'ยกเลิก' บ้าง)
  // ไม่สม่ำเสมอกัน ทำให้ถ้าแถวไหนถูกตั้ง Order Status เป็น 'ยกเลิก' (เช่น แก้ตรงชีตเอง) บางหน้าจะยังนับรวมอยู่ — รวมเป็นจุดเดียวกันแทน
  // หมวดที่นับเป็น "โมบาย" ในแดชบอร์ด/วิเคราะห์ยอดขาย/เป้าหมาย — แท็บเล็ตนับรวมกับโมบาย (owner request 2026-11-10)
  // ใช้เฉพาะการนับยอดในรายงาน ไม่เกี่ยวกับกฎจำกัดโมบาย 1 เครื่องต่อออเดอร์ (ยังใช้เฉพาะหมวด โมบาย)
  isMobileCat: function(cat) { const c = (cat === undefined || cat === null ? '' : cat).toString().trim(); return c === 'โมบาย' || c === 'แท็บเล็ต'; },
  isOrderCancelled: function(o) {
    const s = (o && o['Order Status'] !== undefined && o['Order Status'] !== null ? o['Order Status'] : '').toString().trim();
    return s === 'Cancelled' || s === 'ยกเลิก';
  },

  // flow สถานะออเดอร์ปัจจุบัน (ไม่รวม Cancelled) — อ่านจากชีต OrderStatus ตามลำดับแถวถ้ามี ≥2 แถว ไม่งั้น fallback มาตรฐาน
  // เดิมมี 3 จุดคัดลอกลอจิกนี้ซ้ำกัน (Orders grid select, grid filter, orderTimelineHtml) เสี่ยงแก้จุดเดียวแล้วหลุดไม่ตรงกัน — รวมมาไว้ที่เดียว
  getOrderStatusFlow: function() {
    const stList = (window.app.globalData.orderStatuses || []).filter(s => s && (s['Status Name'] || '').toString().trim() !== '');
    return stList.length >= 2
      ? stList.map(s => s['Status Name'].toString().trim()).filter(n => n.toLowerCase() !== 'cancelled')
      : ['Pending', 'Confirmed', 'Paid', 'Delivered'];
  },

  // ประวัติการเปลี่ยนสถานะ (จากชีต OrderStatusLog) — แสดงเป็นไทม์ไลน์แนวตั้ง เก่า→ใหม่ ; showBy เฉพาะหน้าพนักงาน (หน้า public ไม่มีชื่อพนักงาน)
  statusHistoryHtml: function(history, showBy) {
    if (!history || !history.length) return '';
    const esc = window.app.esc;
    const rows = history.map((h, i) => {
      const last = i === history.length - 1;
      return '<li class="flex gap-2.5 items-start">'
        + '<span class="mt-1 w-2.5 h-2.5 shrink-0 rounded-full ' + (last ? 'bg-emerald-500 ring-4 ring-emerald-100' : 'bg-slate-300') + '"></span>'
        + '<span class="text-[11px] leading-snug"><strong class="' + (last ? 'text-emerald-700' : 'text-slate-700') + '">' + esc(h.to || '-') + '</strong>'
        + (h.from ? ' <span class="text-slate-400">(จาก ' + esc(h.from) + ')</span>' : '')
        + '<br><span class="text-slate-400 font-semibold">' + esc(h.time) + (showBy && h.by ? ' · ' + esc(h.by) : '') + '</span></span></li>';
    }).join('');
    return '<div class="status-history px-4 py-3 border-b border-slate-100"><div class="text-[10px] font-black text-slate-500 uppercase tracking-wider mb-2">ประวัติการดำเนินการ</div><ul class="space-y-2.5">' + rows + '</ul></div>';
  },

  // 5B.1 — esc ข้อความแล้ว highlight คำค้น: หา match บน raw text, esc ทีละ segment แล้วครอบ <mark>
  // (ปลอดภัยกว่า replace หลัง esc ทั้งก้อน เพราะคำค้นจะไม่มีวัน match เข้าไปใน entity เช่น &amp;)
  highlightEsc: function(raw, term) {
    const s = String(raw === null || raw === undefined ? '' : raw);
    term = (term || '').toString().trim();
    if (!term) return window.app.esc(s);
    const lower = s.toLowerCase();
    const t = term.toLowerCase();
    let out = '', i = 0;
    while (true) {
      const idx = lower.indexOf(t, i);
      if (idx === -1) { out += window.app.esc(s.slice(i)); break; }
      out += window.app.esc(s.slice(i, idx));
      out += '<mark class="bg-amber-100 text-inherit rounded px-0.5">' + window.app.esc(s.slice(idx, idx + t.length)) + '</mark>';
      i = idx + t.length;
    }
    return out;
  },

  // 5B.5 — ปุ่ม submit ต้อง disabled + spinner ระหว่างรอ API กัน double-submit
  // คืนฟังก์ชัน restore — ผู้เรียกต้องเรียกใน finally เสมอ; ถ้าปุ่ม disabled อยู่แล้วคืน no-op (บอกว่ามีงานค้าง)
  buttonBusy: function(btn, text) {
    if (!btn || btn.tagName !== 'BUTTON' || btn.disabled) return null;
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1.5"></i>' + window.app.esc(text || 'กำลังบันทึก...');
    return function() { btn.disabled = false; btn.innerHTML = orig; };
  },

  // เหมือน buttonBusy แต่สำหรับปุ่มไอคอนเล็ก (26px) — สลับเฉพาะไอคอนเป็น spinner ห้ามใส่ข้อความ ไม่งั้นล้นปุ่ม
  iconBtnBusy: function(btn) {
    if (!btn || btn.tagName !== 'BUTTON' || btn.disabled) return null;
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    return function() { btn.disabled = false; btn.innerHTML = orig; };
  },

  // ย่อรูปฝั่ง client ก่อนอัป — ด้านยาวสุดเหลือ 1200px, jpeg คุณภาพ 0.85 (png คงเป็น png กันพื้นหลังโปร่งใสเพี้ยน)
  resizeImageFile: function(file, onDone, onError) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        let w = img.width, h = img.height;
        const maxDim = 1200;
        if (w > maxDim || h > maxDim) {
          if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const isPng = file.type === 'image/png';
        const outMime = isPng ? 'image/png' : 'image/jpeg';
        const dataUrl = canvas.toDataURL(outMime, 0.85);
        const ext = isPng ? '.png' : '.jpg';
        const baseName = (file.name || 'image').replace(/\.[^.]+$/, '');
        onDone(dataUrl, outMime, baseName + ext);
      };
      img.onerror = function() { onError('ไฟล์รูปเสียหายหรือไม่รองรับ'); };
      img.src = e.target.result;
    };
    reader.onerror = function() { onError('ไม่สามารถอ่านไฟล์ได้'); };
    reader.readAsDataURL(file);
  },

  // เก็บไฟล์รูปที่เลือกไว้แต่ยังไม่อัปโหลด คีย์ตามจุดที่ใช้ (gridImage / loginBg / banner-<rowIndex> / newBanner)
  // — อัปจริงตอนกด "บันทึกข้อมูล" ครั้งเดียว ไม่ใช่ทันทีที่เลือกไฟล์
  pendingImageUploads: {},

  // เลือกไฟล์รูป: validate + เก็บไว้ใน pendingImageUploads + โชว์พรีวิวจากไฟล์ในเครื่อง (ยังไม่ขึ้น Drive)
  selectImageForUpload: function(inputEl, stateKey, onLocalPreview) {
    const file = inputEl.files && inputEl.files[0];
    inputEl.value = '';
    if (!file) return;
    if (file.type.indexOf('image/') !== 0) {
      return Swal.fire('ผิดพลาด', 'กรุณาเลือกไฟล์รูปภาพเท่านั้น (png, jpg, webp, gif)', 'error');
    }
    if (file.size > 8 * 1024 * 1024) {
      return Swal.fire('ผิดพลาด', 'ไฟล์รูปใหญ่เกินไป (จำกัดไม่เกิน 8MB ก่อนย่อขนาด)', 'error');
    }
    window.app.pendingImageUploads[stateKey] = file;
    if (onLocalPreview) onLocalPreview(URL.createObjectURL(file));
  },

  // เรียกตอนกด "บันทึกข้อมูล" — ถ้ามีไฟล์ค้างสำหรับ stateKey นี้ ย่อ+อัปโหลดขึ้น Drive จริง แล้วคืน URL (null ถ้าไม่มีไฟล์ค้าง)
  flushImageUpload: function(stateKey) {
    const file = window.app.pendingImageUploads[stateKey];
    if (!file) return Promise.resolve(null);
    return new Promise((resolve, reject) => {
      window.app.resizeImageFile(file, function(dataUrl, mimeType, fileName) {
        const base64Data = dataUrl.split(',')[1];
        window.app.api('UPLOAD_IMAGE', { fileName: fileName, mimeType: mimeType, base64Data: base64Data }).then(function(res) {
          if (res && res.status === 'success') {
            delete window.app.pendingImageUploads[stateKey];
            resolve(res.url);
          } else {
            reject(new Error(res ? res.message : 'อัปโหลดรูปไม่สำเร็จ'));
          }
        }).catch(reject);
      }, function(err) { reject(new Error(err || 'ไม่สามารถประมวลผลรูปภาพได้')); });
    });
  },

  // Empty/error state มาตรฐานเดียวทั้งระบบ (5A.4) — คืน HTML string
  // opts.onclick ต้องเป็นโค้ดที่เราเขียนเองเท่านั้น (ห้ามมีข้อมูลผู้ใช้) เพราะฝังลง attribute ตรงๆ
  // สินค้าแสดงในช่องทางนี้ไหม — เว้นว่าง/'*'/'ALL'/'ทั้งหมด' = ทุกช่องทาง (ก่อนหน้านี้ 'ALL' ถูกมองเป็นชื่อช่องทางจริงแล้วสินค้าหายหมด)
  channelOk: function(prodChannel, current) {
    const pc = (prodChannel == null ? '' : String(prodChannel)).trim();
    const cur = (current == null ? '' : String(current)).trim();
    if (!cur || !pc) return true;
    const toks = pc.split(/[,;|]/).map(t => t.trim().toLowerCase()).filter(Boolean);
    if (toks.some(t => t === '*' || t === 'all' || t === 'ทั้งหมด')) return true;
    return pc.includes(cur);
  },

  emptyState: function(opts) {
    opts = opts || {};
    const icon = opts.icon || 'fa-inbox';
    const actionBtn = opts.actionLabel
      ? '<button type="button" class="mt-1 px-5 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow-sm hover:bg-indigo-700 transition-colors" onclick="' + opts.onclick + '">' + window.app.esc(opts.actionLabel) + '</button>'
      : '';
    return '<div class="flex flex-col items-center justify-center text-center py-10 px-6">'
      + '<div class="w-16 h-16 rounded-full bg-slate-100 border border-slate-200 text-slate-400 flex items-center justify-center mb-4"><i class="fas ' + icon + ' text-2xl"></i></div>'
      + '<p class="font-bold text-slate-700 text-sm mb-1">' + window.app.esc(opts.title || 'ไม่มีข้อมูล') + '</p>'
      + (opts.subtitle ? '<p class="text-xs text-slate-400 mb-4 max-w-sm leading-relaxed">' + window.app.esc(opts.subtitle) + '</p>' : '')
      + actionBtn
      + '</div>';
  },

  showLoading: function(text) {
    Swal.fire({ 
      toast: true, 
      position: 'bottom-end', 
      showConfirmButton: false, 
      width: 'auto',
      padding: '0',
      html: '<div class="flex items-center space-x-2.5 px-4 h-full w-full"><svg class="animate-spin h-4 w-4 text-indigo-600 shrink-0" xmlns="http:\/\/www.w3.org\/2000\/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span class="text-[13px] font-black text-indigo-900 tracking-wide whitespace-nowrap">' + (text || 'กำลังโหลดข้อมูล...') + '</span></div>',

  toast: function(title, icon = 'success') {

  formatPhone: function(el) {
    let val = el.value.replace(/\D/g, '');
    if (val.length > 3 && val.length <= 6) val = val.slice(0, 3) + '-' + val.slice(3);
    else if (val.length > 6) val = val.slice(0, 3) + '-' + val.slice(3, 6) + '-' + val.slice(6, 10);
    el.value = val;
    if (val.replace(/-/g,'').length === 10) { el.classList.remove('border-slate-200','border-rose-500'); el.classList.add('border-emerald-500','ring-emerald-200'); }
    else { el.classList.remove('border-emerald-500','ring-emerald-200'); el.classList.add('border-slate-200'); }
  },

  // ตรวจเลขบัตรประชาชน / Passport — กติกาเดียวกับ normalizeIdCard_ ใน Code.js (server เป็นตัวบังคับจริง)
  // คืน { ok, value, type: 'thai'|'passport', msg }
  validateIdCard: function(raw) {
    const v = String(raw == null ? '' : raw).replace(/[\s-]/g, '').toUpperCase();
    if (!v) return { ok: false, msg: 'กรุณากรอกเลขบัตรประชาชน / Passport' };
    if (/^\d+$/.test(v)) {
      if (v.length === 13) {
        let sum = 0; for (let i = 0; i < 12; i++) sum += parseInt(v.charAt(i), 10) * (13 - i);
        if ((11 - (sum % 11)) % 10 !== parseInt(v.charAt(12), 10)) return { ok: false, msg: 'เลขบัตรประชาชนไม่ถูกต้อง (ตรวจเลขหลักสุดท้ายไม่ผ่าน)' };
        return { ok: true, value: v, type: 'thai' };
      }
      if (v.length >= 6 && v.length <= 9) return { ok: true, value: v, type: 'passport' };
      return { ok: false, msg: 'เลขบัตรประชาชนต้องมี 13 หลัก หรือ Passport 6-9 ตัวอักษร' };
    }
    if (/^[A-Z0-9]{6,9}$/.test(v)) return { ok: true, value: v, type: 'passport' };
    return { ok: false, msg: 'เลข Passport ต้องเป็นตัวอักษรอังกฤษ/ตัวเลข 6-9 ตัว' };
  },

  // จัดรูปแบบช่องบัตรประชาชน/Passport ระหว่างพิมพ์: มีตัวอักษร = โหมด Passport (ตัวพิมพ์ใหญ่ ไม่เกิน 9 ตัว) · ตัวเลขล้วน = จัดขีดแบบบัตรประชาชน 13 หลัก
  formatIdCard: function(el) {
    const raw = String(el.value || '').toUpperCase();
    const hasLetter = /[A-Z]/.test(raw);
    let res;
    if (hasLetter) {
      res = raw.replace(/[^A-Z0-9]/g, '').slice(0, 9);
    } else {
      const val = raw.replace(/\D/g, '').slice(0, 13);
      res = '';
      if (val.length > 0) res += val.substring(0,1);
      if (val.length > 1) res += '-' + val.substring(1,5);
      if (val.length > 5) res += '-' + val.substring(5,10);
      if (val.length > 10) res += '-' + val.substring(10,12);
      if (val.length > 12) res += '-' + val.substring(12,13);
    }
    el.value = res;
    const r = window.app.validateIdCard(res);
    el.classList.remove('border-emerald-500', 'ring-emerald-200', 'border-rose-500', 'border-slate-200');
    if (r.ok) el.classList.add('border-emerald-500', 'ring-emerald-200');
    else el.classList.add(res.replace(/[^A-Za-z0-9]/g, '').length >= 6 ? 'border-rose-500' : 'border-slate-200');
    el.title = r.ok ? (r.type === 'thai' ? 'บัตรประชาชนไทย' : 'Passport') : (r.msg || '');
  },

  formatImageUrl: function(url, size='w500') {
    if (!url || url.trim() === '-' || url.trim() === '') return window.app.NO_IMG;
    if (url.includes(',')) url = url.split(',')[0].trim();
    const driveRegex = /(?:drive\.google\.com\/.*[?&]id=|drive\.google\.com\/file\/d\/)([^/?&]+)/;
    const match = url.match(driveRegex);
    if (match && match[1]) return 'https:\/\/drive.google.com/thumbnail?id=' + match[1] + '&sz=' + size;
    return url;
  },
  parseImageUrls: function(urlsStr) {
    if (!urlsStr || urlsStr.trim() === '-' || urlsStr.trim() === '') return [window.app.NO_IMG];
    return urlsStr.split(',').map(u => {
        let trimmed = u.trim();
        if (!trimmed) return null;
        const match = trimmed.match(/(?:drive\.google\.com\/.*[?&]id=|drive\.google\.com\/file\/d\/)([^/?&]+)/);
        return (match && match[1]) ? 'https:\/\/drive.google.com/thumbnail?id=' + match[1] + '&sz=w1000' : trimmed;
    }).filter(u => u);
  },
  // แทนที่ไอคอนโลโก้เริ่มต้น (fa-layer-group) ด้วยรูปโลโก้เว็บแอปที่ตั้งค่าไว้ (Settings key "LogoUrl") — ไม่ตั้งค่า = ปล่อยไอคอนเดิมไว้เฉยๆ ไม่ยุ่ง
  // เรียกซ้ำได้หลายครั้งอย่างปลอดภัย (renderLayout เรียกทุกครั้งที่เปลี่ยนหน้า) — เช็คว่ามี <img> อยู่แล้วก่อนสร้างใหม่ กัน element ซ้ำ
  applyLogo: function(boxId, iconId, url) {
    const trimmed = (url || '').toString().trim();
    if (!trimmed) return;
    const box = document.getElementById(boxId);
    if (!box) return;
    const icon = document.getElementById(iconId);
    if (icon) icon.style.display = 'none';
    // กล่องไอคอนเริ่มต้นทำสีพื้นทึบไว้ (bg-[#8a6428]) — โลโก้จริงมักเป็น PNG พื้นหลังโปร่งใส ถ้าไม่ลบสีพื้นเดิมออก
    // จะเห็นสีทองน้ำตาลโผล่รอบ/หลังโลโก้เพราะ object-contain ไม่เต็มกรอบสี่เหลี่ยมพอดี ดูเหมือนภาพซ้อนกัน — override ด้วย inline style ให้ชนะ class เดิม
    box.style.backgroundColor = '#ffffff';
    let img = box.querySelector('img.app-logo-img');
    if (!img) {
      img = document.createElement('img');
      img.className = 'app-logo-img w-full h-full object-contain p-0.5';
      box.appendChild(img);
    }
    // รูปโหลดไม่ได้ (ลิงก์เสีย/Drive ไม่ให้สิทธิ์) = กลับไปใช้ไอคอนเริ่มต้น ไม่ทิ้งกรอบรูปแตกไว้
    img.onerror = function() { img.remove(); if (icon) icon.style.display = ''; box.style.backgroundColor = ''; };
    const src = window.app.formatImageUrl(trimmed);
    if (img.getAttribute('src') !== src) img.src = src;
  },
  // โลโก้ร้านทุกจุดของ layout หลัก (แถบเมนู / แถบบนมือถือ / ท้ายหน้า) — เรียกทุกครั้งที่ได้ข้อมูลตั้งค่าใหม่
  // ตอนเพิ่งวาด layout ข้อมูลตั้งค่ายังไม่มา จึงใช้ลิงก์ที่จำไว้จากครั้งก่อน (localStorage) ไปก่อน แล้วอัปเดตเมื่อข้อมูลจริงมาถึง
  applyAppLogos: function() {
    const st = window.app.globalData && window.app.globalData.settings;
    let url = '';
    if (st) {
      url = String(st.LogoUrl == null ? '' : st.LogoUrl).replace(/^'+/, '').trim();
      try { if (url) localStorage.setItem('f9_logo_url', url); else localStorage.removeItem('f9_logo_url'); } catch (e) {}
    } else {
      try { url = localStorage.getItem('f9_logo_url') || ''; } catch (e) {}
    }
    [['sidebarLogoBox', 'sidebarLogoIcon'], ['mobileLogoBox', 'mobileLogoIcon'], ['footerLogoBox', 'footerLogoIcon']].forEach(function(p) {
      if (url) return window.app.applyLogo(p[0], p[1], url);
      // ไม่มีโลโก้ (ลบออกจากตั้งค่าแล้ว) = คืนไอคอนเริ่มต้น
      const box = document.getElementById(p[0]); if (!box) return;
      const old = box.querySelector('img.app-logo-img'); if (old) old.remove();
      const ic = document.getElementById(p[1]); if (ic) ic.style.display = '';
      box.style.backgroundColor = '';
    });
  },

  // ===== Export กราฟ Chart.js เป็นภาพ (ดาวน์โหลด + คัดลอกคลิปบอร์ด) =====
  // ใช้ Chart.getChart(canvasId) ของ Chart.js เอง แทนการเก็บ registry ซ้ำ — หา instance ปัจจุบันได้เสมอไม่ว่าใครสร้าง/เก็บไว้ที่ไหน (dashboard.charts, analytics.chart, ฯลฯ)
  // เรียกครั้งเดียวหลังสร้างกราฟแต่ละอัน — เช็ค class ป้องกันแทรกปุ่มซ้ำตอน re-render (เช่น Live refresh ของ dashboard)
  chartExportButtons: function(canvasId) {
    const canvas = document.getElementById(canvasId);
    const wrapper = canvas ? canvas.parentElement : null;

    const box = document.createElement('div');

    box.innerHTML =
      '<button type="button" class="chart-export-btn" title="ดาวน์โหลดภาพกราฟ" aria-label="ดาวน์โหลดภาพกราฟ (PNG)" onclick="window.app.downloadChartImage(\'' + canvasId + '\', event)"><i class="fas fa-download"></i></button>' +

  // หาชื่อกราฟจาก h6 ของการ์ดที่ห่อ canvas อยู่ — ใช้ตั้งชื่อไฟล์ตอนดาวน์โหลด (fallback เป็น canvasId ถ้าไม่พบ)
  chartTitleOf: function(canvas) {
    // เดินขึ้น ancestor ไม่กี่ชั้นหา h6 แรกที่เจอ — ไม่ผูกกับ class ".chart-card" ตายตัว
    // เพราะบางหน้า (เช่น Sales Analytics) การ์ดกราฟใช้ wrapper class อื่น โครงสร้างไม่เหมือน Dashboard
    let h6 = null;
    let node = canvas.parentElement;
    for (let i = 0; i < 4 && node && !h6; i++) {
      h6 = node.querySelector('h6');
      node = node.parentElement;
    }
    const raw = (h6 ? h6.textContent : canvas.id).trim().replace(/\s+/g, ' ');
    return raw.replace(/[\\/:*?"<>|]/g, '').slice(0, 60) || canvas.id;
  },
  downloadChartImage: function(canvasId, e) {
    if (e) e.stopPropagation();
    const chart = (typeof Chart !== 'undefined' && Chart.getChart) ? Chart.getChart(canvasId) : null;
    if (!chart) return Swal.fire('ผิดพลาด', 'ไม่พบกราฟ กรุณาลองใหม่', 'error');
    const d = new Date();
    const dateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const a = document.createElement('a');
    a.href = chart.toBase64Image('image/png', 1);
    a.download = window.app.chartTitleOf(chart.canvas) + '_' + dateStr + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  },
  copyChartImage: async function(canvasId, e) {
    if (e) e.stopPropagation();
    const chart = (typeof Chart !== 'undefined' && Chart.getChart) ? Chart.getChart(canvasId) : null;
    if (!chart) return Swal.fire('ผิดพลาด', 'ไม่พบกราฟ กรุณาลองใหม่', 'error');
    try {
      if (!navigator.clipboard || typeof ClipboardItem === 'undefined') throw new Error('เบราว์เซอร์นี้ไม่รองรับการคัดลอกรูปภาพ');
      const blob = await new Promise(resolve => chart.canvas.toBlob(resolve, 'image/png'));
      if (!blob) throw new Error('สร้างภาพจากกราฟไม่สำเร็จ');
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      window.app.toast('คัดลอกภาพกราฟแล้ว — วางได้เลย (Ctrl+V)');
    } catch (err) {
      Swal.fire('คัดลอกไม่สำเร็จ', (err && err.message ? err.message : 'ไม่ทราบสาเหตุ') + ' — ลองใช้ปุ่มดาวน์โหลดแทน', 'warning');
    }
  },

  // ===== Export ตารางสรุป (Target/สรุปยอดจองรายวัน/สรุปยอดรุ่น-แอเรีย-ช่องทาง/สรุปข้อมูลจองทั้งหมด) เป็นภาพ =====
  // ตารางเหล่านี้ไม่ใช่ canvas เหมือนกราฟ — ใช้ html2canvas แคป DOM แทน
  // เรียกครั้งเดียวหลัง render การ์ดแต่ละใบ (เหมือน chartExportButtons) — เช็ค class ป้องกันแทรกซ้ำ

  // โคลนกล่อง scroll ของตารางออกไปนอกหน้าจอก่อนแคป — กัน html2canvas เพี้ยนกับ position:sticky
  // (thead + คอลัมน์แรกของทุกตารางสรุปใช้ sticky ทำ frozen header/column) และกัน max-height ตัดภาพให้เห็นแค่ส่วนที่ scroll เข้ามา
  renderTableToCanvas: async function(scrollWrap) {
    const clone = scrollWrap.cloneNode(true);
    clone.querySelectorAll('.sticky').forEach(el => { el.classList.remove('sticky'); el.style.position = 'static'; });
    clone.style.maxHeight = 'none';
    clone.style.overflow = 'visible';
    clone.style.position = 'absolute';
    clone.style.top = '-99999px';
    clone.style.left = '0';
    clone.style.marginLeft = '0';
    clone.style.marginRight = '0';
    clone.style.width = scrollWrap.scrollWidth + 'px';
    clone.style.background = '#ffffff';
    document.body.appendChild(clone);
    try {
      return await html2canvas(clone, { backgroundColor: '#ffffff', scale: 2 });
    } finally {
      document.body.removeChild(clone);
    }
  },

  printReceipt: async function(orderId, pay) {
     const d = new Date();
     const dateStr = d.toLocaleDateString('th-TH') + ' ' + d.toLocaleTimeString('th-TH');

     // รองรับทั้งชื่อ field จาก checkout payload (cart/customerName/contactPhone) และชื่อเดิม
     const esc = window.app.esc;
     const items = pay.items || pay.cart || [];
     const customer = esc(pay.customer || pay.customerName || '-');
     const phone = esc(pay.phone || pay.contactPhone || '-');

     let subTotal = 0;
     let itemsHtml = '';
     items.forEach(item => {
        let p = parseFloat((item.Price||'0').toString().replace(/[^\d.\-]/g,''));
        let t = p * item.qty;
        subTotal += t;
        // reprintOrder (grid.js) ใช้ isGiftLine เมื่อสร้าง cart จากแถวของแถมที่คีนอยู่ในชีตแยกแถว (ไม่มีความสัมพันธ์กับสินค้าหลักในข้อมูล)

      seen[code] = true;

      out.push({ value: code, label: name ? code + ' - ' + name : code });

  policyText: function(kind) {
    const st = (window.app.globalData && window.app.globalData.settings) || {};
    const v = String(st[window.app.POLICY_KEYS[kind]] == null ? '' : st[window.app.POLICY_KEYS[kind]]).replace(/^'+/, '').trim();
    return v || window.app.POLICY_DEFAULTS[kind] || '';
  },
  // text = ข้อความที่จะแสดงแทนค่าที่บันทึกไว้ (ใช้ดูตัวอย่างจากหน้าตั้งค่าก่อนบันทึก)
  openPolicy: function(kind, text) {
    if (!window.app.POLICY_TITLES[kind]) return;
    const body = (typeof text === 'string' && text.trim()) ? text.trim() : window.app.policyText(kind);
    Swal.fire({
      title: window.app.esc(window.app.POLICY_TITLES[kind]),
      html: '<div class="pol-body" id="policyBody">' + window.app.safeRichText(body).replace(/\r?\n/g, '<br>') + '</div>',
      width: 640, confirmButtonText: 'ปิด', confirmButtonColor: '#0f2a43'
    });
  },
  // "สาขาของเรา" จากชีต Branches (globalData.branches) — จัดกลุ่มตามจังหวัด แสดงชื่อสาขา + ห้าง/พื้นที่; ผู้ใช้ Sales เห็นเฉพาะสาขาที่ server ส่งมาให้
  openBranches: function() {
    const esc = window.app.esc, clean = (v) => String(v == null ? '' : v).replace(/^'+/, '').trim();
    const seen = {}, groups = {}, order = [];
    ((window.app.globalData && window.app.globalData.branches) || []).forEach(b => {
      const name = clean(b['Branch Name']) || clean(b['Branch Code']); if (!name) return;
      const key = clean(b['Branch Code']) || name; if (seen[key]) return; seen[key] = true; // สาขาเดียวกันอาจมีหลายแถว (แถวละช่องทาง)
      const prov = clean(b.Province) || 'สาขา';
      if (!groups[prov]) { groups[prov] = []; order.push(prov); }
      groups[prov].push({ name: name, sub: [clean(b.Mall), clean(b.Area)].filter((v, i, a) => v && v !== '-' && v !== name && a.indexOf(v) === i).join(' · ') });
    });
    order.sort((a, b) => a.localeCompare(b, 'th'));
    const html = order.length
      ? order.map(p => '<section class="br-grp"><h4>' + esc(p) + '</h4><ul>' + groups[p].map(x => '<li><i class="fas fa-store" aria-hidden="true"></i><div><b>' + esc(x.name) + '</b>' + (x.sub ? '<span>' + esc(x.sub) + '</span>' : '') + '</div></li>').join('') + '</ul></section>').join('')
      : '<p class="br-none">ยังไม่มีข้อมูลสาขา</p>';
    Swal.fire({ title: 'สาขาของเรา', html: '<div class="pol-body br-body" id="branchBody">' + html + '</div>', width: 640, confirmButtonText: 'ปิด', confirmButtonColor: '#0f2a43' });
  },

  // ข้อมูลติดต่อร้านใน footer (ตั้งค่าที่ ตั้งค่าระบบ › ข้อมูลติดต่อร้าน: ContactPhone / ContactLine / ContactHours)
  // footer: ลิงก์หมวดสินค้า (เหมือนเมนูหมวดใน header) — กดจากหน้าไหนก็ได้ พาไปหน้าร้านพร้อมกรองหมวดนั้น
  renderFooterCategories: function() {
    const nav = document.getElementById('footerCatLinks'); if (!nav || !window.app.pos || !window.app.pos.storeCategories) return;
    const cats = window.app.pos.storeCategories().filter(c => !c.includes('ของแถม')).slice(0, 8);
    const esc = window.app.esc, escJs = window.app.escAttrJs;
    nav.innerHTML = cats.map(c => '<button type="button" onclick="window.app.goCategory(\'' + escJs(c) + '\')"><i class="fas ' + window.app.pos.catIcon(c) + '"></i>' + esc(c) + '</button>').join('');
    const col = document.getElementById('footerCatCol');
    if (col) col.classList.toggle('hidden', cats.length === 0);
  },
  goCategory: function(cat) {
    const pos = window.app.pos;
    if (window.app.currentRoute === 'pos') { pos.setStoreCategory(cat); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    // ยังไม่อยู่หน้าร้าน: ตั้งตัวกรองในหน่วยความจำไว้ก่อน — pos.init วาดตาม storeFilters ปัจจุบัน
    pos.storeFilters = pos.emptyStoreFilters();
    pos.storeFilters.category = cat;
    pos.storePage = 1;
    window.location.hash = '#pos';
  },
  renderFooterContact: function() {
    const box = document.getElementById('footerContact'); if (!box) return;
    const st = (window.app.globalData && window.app.globalData.settings) || {};
    const clean = (v) => String(v == null ? '' : v).replace(/^'+/, '').trim(); // ค่าที่ขึ้นต้น + = - @ ถูกกัน formula โดยเติม ' ไว้หน้า
    const phone = clean(st.ContactPhone), line = clean(st.ContactLine), hours = clean(st.ContactHours);
    const parts = [];
    if (phone) {
      const digits = phone.replace(/[^0-9+]/g, '');
      parts.push('<a href="tel:' + window.app.esc(digits) + '" class="hover:text-[#FF6B00] transition-colors"><i class="fas fa-phone mr-1.5 text-slate-400"></i>' + window.app.esc(phone) + '</a>');
    }
    if (line) {
      const href = /^https?:\/\//i.test(line) ? line : 'https://line.me/R/ti/p/' + encodeURIComponent(line.charAt(0) === '@' ? line : '@' + line);
      const shown = /^https?:\/\//i.test(line) ? 'LINE' : (line.charAt(0) === '@' ? line : '@' + line);
      parts.push('<a href="' + window.app.esc(href) + '" target="_blank" rel="noopener noreferrer" class="hover:text-[#FF6B00] transition-colors"><i class="fab fa-line mr-1.5 text-emerald-500"></i>' + window.app.esc(shown) + '</a>');
    }
    if (hours) parts.push('<span><i class="far fa-clock mr-1.5 text-slate-400"></i>' + window.app.esc(hours) + '</span>');
    box.innerHTML = parts.join('');
    box.classList.toggle('hidden', parts.length === 0);
    const col = document.getElementById('footerContactCol');
    if (col) col.classList.toggle('hidden', parts.length === 0);
  },

  // =========================================================================
  // ระบบติดตามสถานะใบจอง & บัตรรับเครื่องดิจิทัลสำหรับลูกค้า (Public Booking Pass)
  // =========================================================================
  openPublicTrackModal: function(defaultOrderId) {
    this.showModal('publicOrderTrackModal');
    const oidInp = document.getElementById('publicTrackOrderIdInput');
    const phInp = document.getElementById('publicTrackPhoneInput');
    if (oidInp) {
      if (defaultOrderId) {
        oidInp.value = defaultOrderId.toString().trim();
        if (phInp) phInp.focus();
        this.searchPublicOrderTrack();
      } else {
        oidInp.focus();
      }
    }
  },

  searchPublicOrderTrack: async function() {
    const oidInp = document.getElementById('publicTrackOrderIdInput');
    const phInp = document.getElementById('publicTrackPhoneInput');
    const container = document.getElementById('publicTrackResultsContainer');
    if (!oidInp || !container) return;

    const oid = (oidInp.value || '').trim();
    const phone = (phInp ? phInp.value : '').trim();

    if (!oid) {
      return Swal.fire('แจ้งเตือน', 'กรุณากรอกเลขที่ใบจอง (Order ID เช่น ORD-...)', 'warning');
    }

    container.innerHTML = '<div class="py-12 text-center text-slate-500 text-xs font-bold"><i class="fas fa-spinner fa-spin mr-2 text-indigo-600 text-lg block mb-2"></i>กำลังค้นหาข้อมูลใบจองและตรวจสอบสิทธิ์...</div>';

    try {
      const res = await this.api('PUBLIC_TRACK_ORDER', { orderId: oid, phone: phone });
      if (!res) {
        container.innerHTML = '<div class="p-6 text-center text-rose-600 text-xs font-bold">ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง</div>';
        return;
      }

      if (res.status === 'require_phone') {
        container.innerHTML = `
          <div class="p-6 bg-amber-50 border border-amber-200 rounded-2xl text-center space-y-3">
             <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center mx-auto text-base">
               <i class="fas fa-user-shield"></i>
             </div>
             <div>
               <h4 class="text-xs font-black text-amber-900 mb-1">ยืนยันสิทธิ์ความเป็นเจ้าของใบจอง</h4>
               <p class="text-[11px] text-amber-700 font-semibold">${this.esc(res.message || 'กรุณาระบุเบอร์โทรศัพท์ 4 ตัวท้ายที่ใช้สั่งจอง')}</p>
             </div>
          </div>
        `;
        if (phInp) {
          phInp.focus();
          phInp.classList.add('ring-2', 'ring-amber-400');
          setTimeout(() => phInp.classList.remove('ring-2', 'ring-amber-400'), 2500);
        }
        return;
      }

      if (res.status !== 'success' || !res.order) {
        container.innerHTML = `
          <div class="p-8 text-center bg-white rounded-2xl border border-rose-200 text-rose-600 text-xs font-bold space-y-2">
             <i class="fas fa-exclamation-circle text-2xl text-rose-500 mb-1 block"></i>
             <div>${this.esc(res.message || 'ไม่พบข้อมูลใบจองที่ระบุ')}</div>
             <p class="text-[10px] text-slate-400 font-normal">หากท่านมั่นใจว่าข้อมูลถูกต้อง กรุณาติดต่อสาขาที่ทำการจอง</p>
          </div>
        `;
        return;
      }

      const o = res.order;
      const esc = this.esc, escJs = this.escAttrJs;
      const st = (o.status || 'Pending').toString();
      const stLower = st.toLowerCase();
      const isComplete = stLower.includes('complete') || stLower.includes('deliver') || stLower.includes('สำเร็จ') || stLower.includes('รับเครื่องแล้ว');
      const isReady = stLower.includes('ready') || stLower.includes('พร้อมรับ');
      const isConfirmed = stLower.includes('confirm') || stLower.includes('paid') || stLower.includes('ยืนยัน') || o.deposit > 0;
      const stepIdx = isComplete ? 4 : isReady ? 3 : isConfirmed ? 2 : 1;
      const steps = ['รับคำสั่งจอง', 'ล็อกสิทธิ์/มัดจำ', 'พร้อมรับที่สาขา', 'ส่งมอบสำเร็จ'];

      const qrPayload = encodeURIComponent(o.orderId + '|' + o.branch + '|NET:' + o.netTotal);
      const qrUrl = 'https:\/\/quickchart.io/qr?size=180&margin=1&text=' + qrPayload;

      container.innerHTML = `
        <div id="publicPrintablePass" class="bg-white border-2 border-slate-900 rounded-3xl overflow-hidden shadow-lg animate-fade-in-up">
          <div class="bg-[#141416] text-white p-5 border-b-4 border-[#FF6B00]">
             <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                   <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[#FF6B00] text-white text-[10px] font-black uppercase tracking-wider mb-1">
                     <i class="fas fa-bolt text-[#E11D48]"></i> DIGITAL BOOKING PASS
                   </div>
                   <h2 class="text-lg font-black text-white font-mono tracking-wide">${esc(o.orderId)}</h2>
                   <p class="text-[11px] text-slate-300">วันที่ทำการจอง: ${esc(o.timestamp || '-')}</p>
                </div>
                <div class="text-right">
                   <span class="inline-block px-3 py-1 rounded-full text-xs font-black shadow-xs ${
                     isComplete ? 'bg-emerald-500 text-white' :
                     isReady ? 'bg-sky-500 text-white' :
                     isConfirmed ? 'bg-amber-400 text-slate-900' : 'bg-slate-700 text-slate-200'
                   }">
                     <i class="fas ${isComplete ? 'fa-check-circle' : isReady ? 'fa-box-open' : 'fa-clock'} mr-1"></i>สถานะ: ${esc(st)}
                   </span>
                </div>
             </div>
          </div>

          <div class="p-4 border-b border-slate-100 bg-slate-50/70">
             <div class="text-[10px] font-black text-slate-500 uppercase tracking-wider mb-2">ขั้นตอนการส่งมอบสินค้า</div>
             <div class="grid grid-cols-4 gap-2">
                ${steps.map((label, idx) => {
                  const done = (idx + 1) <= stepIdx;
                  return `
                    <div class="text-center">
                       <div class="h-2 rounded-full mb-1.5 transition-all ${done ? 'bg-emerald-500' : 'bg-slate-200'}"></div>
                       <div class="text-[10px] font-extrabold ${done ? 'text-emerald-700' : 'text-slate-400'}">
                         ${done ? '<i class="fas fa-check-circle mr-0.5"></i>' : ''}${esc(label)}
                       </div>
                    </div>
                  `;
                }).join('')}
             </div>
          </div>
          ${this.statusHistoryHtml(o.history, false)}

          <div class="p-5 md:p-6 grid grid-cols-1 md:grid-cols-12 gap-5">
             <div class="md:col-span-7 space-y-4">
                <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-1.5 text-xs">
                   <div class="flex justify-between">
                     <span class="text-slate-500 font-bold">ลูกค้า:</span>
                     <span class="text-slate-900 font-black">${esc(o.customerName)} (${esc(o.maskedPhone)})</span>
                   </div>
                   <div class="flex justify-between">
                     <span class="text-slate-500 font-bold">สาขารับเครื่อง:</span>
                     <span class="text-slate-900 font-black">${esc(o.branch)} (${esc(o.channel)})</span>
                   </div>
                   ${o.pickupDate ? `
                     <div class="flex justify-between">
                       <span class="text-slate-500 font-bold">วันที่นัดรับเครื่อง:</span>
                       <span class="text-indigo-700 font-black">${esc(o.pickupDate)}</span>
                     </div>
                   ` : ''}
                </div>

                <div>
                   <div class="text-[11px] font-black text-slate-800 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                     <i class="fas fa-mobile-alt text-indigo-600"></i> รายการสินค้า
                   </div>

                      ${o.items.map(it => `

                           <div class="text-right font-black text-[#E11D48] tabular-nums">฿${it.net.toLocaleString()}</div>
                        </div>
                      `).join('')}
                   </div>
                </div>

                ${o.gifts && o.gifts.length > 0 ? `
                  <div class="p-3 bg-emerald-50/70 border border-emerald-200/90 rounded-2xl">
                     <div class="text-[11px] font-black text-emerald-800 mb-1.5 flex items-center gap-1.5">
                       <i class="fas fa-gifts text-[#E11D48]"></i> รายการของแถมฟรี (${o.gifts.length} รายการ)
                     </div>
                     <div class="flex flex-wrap gap-1">
                        ${o.gifts.map(g => `
                          <span class="px-2.5 py-1 rounded-lg bg-white border border-emerald-200 text-[10px] font-bold text-slate-800 shadow-2xs">
                            🎁 ${esc(g.name)}${g.qty > 1 ? ' (x' + g.qty + ')' : ''}
                          </span>

                   <div class="flex justify-between items-center pt-2 border-t border-slate-200">

                   </button>
                   <button type="button" onclick="window.app.copyPublicTrackLink('${escJs(o.orderId)}')" class="w-full py-2 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 text-xs font-black rounded-xl shadow-2xs flex items-center justify-center gap-2 transition-all">
                     <i class="fas fa-share-alt text-indigo-600"></i> คัดลอกลิงก์ตรวจสอบสถานะ
                   </button>
                </div>
             </div>
          </div>
        </div>
      `;

  printPublicBookingPass: function() {
    const card = document.getElementById('publicPrintablePass');
    if (!card) return;

            // มีหัวข้อ/คำอธิบาย/ปุ่ม CTA อย่างน้อย 1 อย่าง — แสดงเป็นการ์ด (พอร์ตแนวคิดจาก pbzf8's PromoPopupModal.jsx, 2026-09-19)

  // Popup หลายหน้า = สไลด์ไปด้านข้าง (CSS scroll-snap แนวนอน + ลูกศร + จุดบอกตำแหน่ง); มีหน้าเดียวซ่อนตัวควบคุมทั้งหมด
  popupInitCarousel_: function() {
    const track = document.getElementById('popupBannerContent');
    const dots = document.getElementById('popupBannerDots');
    if (!track || !dots) return;
    const n = track.children.length;
    this.popupIdx = 0;
    track.style.transform = 'translateX(0)';
    dots.innerHTML = Array.from({length: n}, (_, i) => `<button type="button" class="popup-dot" aria-label="หน้า ${i + 1}" onclick="window.app.popupGo(${i})"></button>`).join('');
    document.getElementById('popupBannerModal').classList.toggle('popup-multi', n > 1);
    if (!track._popupBound) {
      track._popupBound = true;
      let x0 = null;
      track.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; window.app.popupStop_(); }, {passive: true});
      track.addEventListener('touchend', e => {
        if (x0 === null) return;
        const dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) > 40) window.app.popupSlide(dx < 0 ? 1 : -1);
        window.app.popupAuto_();
      }, {passive: true});
      const car = track.parentNode;
      car.addEventListener('mouseenter', () => window.app.popupStop_());
      car.addEventListener('mouseleave', () => window.app.popupAuto_());
    }
    this.popupAuto_();
  },
  popupStop_: function() { if (this.popupTimer) { clearInterval(this.popupTimer); this.popupTimer = null; } },
  popupAuto_: function() {
    this.popupStop_();
    const track = document.getElementById('popupBannerContent');
    if (track && track.children.length > 1) this.popupTimer = setInterval(() => this.popupSlide(1), 5000);
  },
  popupSync_: function() {
    document.querySelectorAll('#popupBannerDots .popup-dot').forEach((d, k) => d.classList.toggle('active', k === this.popupIdx));
  },
  popupGo: function(i) {
    const track = document.getElementById('popupBannerContent');
    if (!track) return;
    const n = track.children.length;
    if (!n) return;
    this.popupIdx = ((i % n) + n) % n;
    track.style.transform = 'translateX(-' + (this.popupIdx * 100) + '%)';
    this.popupSync_();
  },
  popupSlide: function(dir) { this.popupGo((this.popupIdx || 0) + dir); },

  closePopupBanner: function() {
    const modal = document.getElementById('popupBannerModal');
    if(modal) {
        this.popupStop_();
        modal.classList.add('hidden');
        document.body.style.overflow = '';
    }
  },

  init: function() {
    window.app.applyTheme(document.documentElement.classList.contains('dark') ? 'dark' : 'light');

    setInterval(() => {
      const d = new Date();
      const clk = document.getElementById('clock');
      if(clk) clk.innerText = d.toLocaleString('th-TH');
    }, 1000);

    // กันหลุดระบบ (2026-07-10): ย้าย session ไป localStorage ให้อยู่รอดข้ามการปิดเบราว์เซอร์
    // (token ฝั่ง server อายุ 30 วัน — verifyToken ยังตรวจ exp ทุก call เหมือนเดิม logout จริงเมื่อ token หมดอายุ)
    // อ่าน sessionStorage เผื่อ session เก่าที่ค้างจากเวอร์ชันก่อน แล้ว migrate ให้อัตโนมัติ
    let storedUser = null;
    try {
      storedUser = localStorage.getItem('tg_pos_user') || sessionStorage.getItem('tg_pos_user');
    } catch (e) {
      console.warn('storage is unavailable:', e);
    }

    if (storedUser && storedUser !== 'undefined' && storedUser !== 'null') {
      try {
        window.app.user = JSON.parse(storedUser);
        try { localStorage.setItem('tg_pos_user', storedUser); sessionStorage.removeItem('tg_pos_user'); } catch(e2){}
        window.app.renderLayout();
      } catch (e) {
        console.error('Failed to parse stored user:', e);
        try { localStorage.removeItem('tg_pos_user'); sessionStorage.removeItem('tg_pos_user'); } catch(e2){}
        window.app.renderLogin();
      }
    } else {
      window.app.renderLogin();
    }
    try {
      // ใน GAS ลิงก์ ?track= อยู่ที่ URL ชั้นนอก iframe มองไม่เห็นผ่าน window.location — server ส่งค่ามาให้ใน window.__TRACK_PARAM
      const urlParams = new URLSearchParams(window.location.search);
      const trackParam = window.__TRACK_PARAM || urlParams.get('track') || urlParams.get('orderId');
      if (trackParam) {
        setTimeout(() => {
          window.app.openPublicTrackModal(trackParam);
        }, 500);
      }
    } catch(eParam) {}

    window.addEventListener('hashchange', () => window.app.route());
    document.addEventListener('click', (e) => {
      // ทุกลิงก์ #หน้า ในแอป (sidebar, เมนูบัญชีบนหน้าร้าน, ลิงก์แบนเนอร์ ฯลฯ) ต้องเปลี่ยน hash เอง:
      // หน้าเว็บจริงอยู่ใน iframe ของ GAS ที่มี <base target="_top"> — ปล่อยให้เบราว์เซอร์จัดการ ลิงก์จะไปเปลี่ยนหน้าต่างนอกและไม่เกิดอะไรขึ้น
      // (เดิมดักเฉพาะ a.nav-link ทำให้เมนู "บัญชีผู้ใช้ / ระบบหลังร้าน" กดแล้วไม่ไปไหนบนเว็บจริง)
      const link = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!link || e.defaultPrevented) return;
      const href = link.getAttribute('href') || '';
      if (!/^#[A-Za-z0-9_-]+$/.test(href)) return;
      e.preventDefault();
      if (window.location.hash === href) window.app.route(); else window.location.hash = href;
    });
  },

  initDB: async function() {
    Swal.fire({
       title: 'กำลังตรวจสอบและสร้างฐานข้อมูล...',
       html: 'กรุณารอสักครู่ ระบบกำลังตั้งค่าแผ่นงานและข้อมูลทดสอบ',
       allowOutsideClick: false,
       didOpen: () => { Swal.showLoading(); }
    });
    try {
      const res = await new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).setupDatabase(window.app.user);
      });
       const adminText = res && res.initialAdmin
         ? 'บัญชีเริ่มต้น: ' + window.app.esc(res.initialAdmin.username) + ' / ' + window.app.esc(res.initialAdmin.password) + ' — กรุณาเปลี่ยนรหัสผ่านทันที'
         : 'ฐานข้อมูลพร้อมใช้งานแล้ว';
       Swal.fire({ icon: 'success', title: 'สร้างฐานข้อมูลสำเร็จ!', html: adminText, confirmButtonColor: '#254d71' });

  renderLogin: function() {

  renderLayout: async function() {
    const el = document.getElementById('app');
    const tmpl = document.getElementById('tmpl-main');
    if(el && tmpl) el.innerHTML = tmpl.innerHTML;
    
    if(document.getElementById('headerUserName')) document.getElementById('headerUserName').innerText = window.app.user.Name;
    if(document.getElementById('headerRole')) document.getElementById('headerRole').innerText = window.app.user.Role;
    if(document.getElementById('mobileUserName')) document.getElementById('mobileUserName').innerText = window.app.user.Name;
    if(document.getElementById('mobileRole')) document.getElementById('mobileRole').innerText = window.app.user.Role;

    window.app.applyAppLogos();
    window.app.renderFooterContact();
    window.app.applySidebarPref();
    // footer ปีปัจจุบัน + ปุ่มกลับขึ้นบน (อยู่ใน <template> จึงใส่สคริปต์ inline ไม่ได้ — ต้องผูกที่นี่หลัง clone)
    try { const fy = document.getElementById('footerYear'); if (fy) fy.textContent = new Date().getFullYear(); } catch (e) {}
    if (!window.__userMenuBound) {
      window.__userMenuBound = true;
      document.addEventListener('click', function (e) {
        const wrap = document.getElementById('userMenuWrap');
        if (wrap && !wrap.contains(e.target)) window.app.closeUserMenu();
        const sfw = document.getElementById('sfAcctWrap');
        if (sfw && !sfw.contains(e.target)) window.app.closeSfAccount();
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { window.app.closeUserMenu(); window.app.closeSfAccount(); } });
    }
    if (!window.__backToTopBound) {
      window.__backToTopBound = true;
      window.addEventListener('scroll', function () {
        const b = document.getElementById('backToTopBtn'); if (!b) return;
        const show = (window.pageYOffset || document.documentElement.scrollTop) > 600;
        b.classList.toggle('hidden', !show); b.classList.toggle('flex', show);
      }, { passive: true });
    }
    
    window.app.buildMenu();
    window.app.updateThemeToggleUI();
    window.app.showBootSkeleton();
    window.app.showLoading('กำลังเข้าสู่ระบบ...');

    try {
      const res = await window.app.api('GET_ALL_DATA', {});
      Swal.close();
      if(res && res.status === 'success') {
         window.app.globalData = res;
         window.app.applyAppLogos();
         window.app.preloadBanners();
         window.app.renderFooterCategories();
         // ลิงก์สินค้าที่แชร์ (?p=) ไม่มี hash → พาไปหน้าสั่งจอง (pos) แทน dashboard
         // ปัดจอลงเพื่อรีเฟรช (มือถือ) = โหลด iframe ใหม่ hash หาย → กลับหน้าที่เปิดค้างไว้ (จำไว้ใน sessionStorage) แทนการเริ่มที่ dashboard
         // ลิงก์สินค้าที่แชร์ (?p=) ยังมาก่อนเสมอ
         if(!window.location.hash) window.location.hash = window.__DEEP_MODEL ? '#pos' : ('#' + (window.app.savedRoute_() || 'dashboard'));
         window.app.route();

         setTimeout(() => { window.app.showPopupBanner(); }, 500);
         
      } else {
         // logout เฉพาะเมื่อ token ใช้ไม่ได้จริง — error อื่น (ชีตพัง ฯลฯ) ให้ลองใหม่ได้โดยไม่เสีย session (กันหลุดระบบ 2026-07-10)
         const msg = (res && res.message) || 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้';
         if (/token|login/i.test(msg)) {
            Swal.fire('Session หมดอายุ', 'กรุณาเข้าสู่ระบบใหม่อีกครั้ง', 'error');
            window.app.logout();
         } else {
            const r = await Swal.fire({ icon: 'error', title: 'โหลดข้อมูลไม่สำเร็จ', text: msg, confirmButtonText: 'ลองใหม่', showCancelButton: true, cancelButtonText: 'ออกจากระบบ' });
            if (r.isConfirmed) window.app.renderLayout(); else window.app.logout();
         }
      }
    } catch(err) {
      Swal.close();
      // เดิม: error อะไรก็ตาม (รวมเน็ตช้าเกิน 45 วิ) ถูกตีความว่า "Session หมดอายุ" แล้วเตะออกทั้งที่ token ยังดี —
      // ตอนนี้ logout เฉพาะ token ผิด/หมดอายุจริง นอกนั้นให้ปุ่มลองใหม่ (กันหลุดระบบ 2026-07-10)
      if (/token|login/i.test(err.message || '')) {
        Swal.fire('Session หมดอายุ', 'กรุณาเข้าสู่ระบบใหม่อีกครั้ง', 'error');
        window.app.logout();
      } else {
        const r = await Swal.fire({ icon: 'error', title: 'เชื่อมต่อไม่สำเร็จ', text: err.isTimeout ? 'การเชื่อมต่อใช้เวลานานเกินไป กรุณาลองใหม่' : (err.message || 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้'), confirmButtonText: 'ลองใหม่', showCancelButton: true, cancelButtonText: 'ออกจากระบบ' });
        if (r.isConfirmed) window.app.renderLayout(); else window.app.logout();
      }
    }
  },

  checkMenuAccess: function(menuId, defaultRoles) {
      if(!window.app.user) return false;
      const uRole = window.app.user.Role;
      if (uRole === 'Admin') return true; 
      
      const allowed = window.app.user['Accessible Menus'];
      if (allowed && allowed.trim() !== '') {
          if (allowed.trim() === '*' || allowed.trim().toUpperCase() === 'ALL') return true;
          // เทียบรายเมนูแบบตรงตัว — การใช้ substring includes เคยทำให้สิทธิ์ 'autopromotions' เปิดเมนู 'promotions' ได้
          const list = allowed.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
          if (list.includes(menuId.toLowerCase())) return true;
          // รอบ 9 — สมาชิกเก่าอาจระบุ id หน้า settings เดิม (เช่น 'bookingsettings') ไว้ใน Accessible Menus:
          // ให้นับเป็นสิทธิ์เข้าหน้า systemsettings ที่ยุบรวมแล้วด้วย
          if (menuId === 'systemsettings') return window.app.systemSettings.tabs.some(t => list.includes(t.id));
          // สิทธิ์เมนูแบนเนอร์เก่า (herobanners/promogrids/popupbanners) นับเป็นสิทธิ์หน้า banners ใหม่
          if (menuId === 'banners') return ['herobanners', 'promogrids', 'popupbanners'].some(id => list.includes(id));
          return false;
      }
      return defaultRoles.includes(uRole); 
  },

  // แถวเมนูสองบรรทัด: ไทย (บน) + อังกฤษ (ล่าง) — ตัดด้วย … ให้บรรทัดเดียว ความสูงแต่ละรายการเท่ากัน, title แสดงชื่อเต็ม
  navLabelHtml: function(m, big) {
    const th = this.esc(m.label), en = m.sub ? this.esc(m.sub) : '';
    return `<span class="min-w-0 flex-1"><span class="nav-th block truncate leading-tight">${th}</span>${en ? `<span class="nav-sub block truncate leading-tight ${big ? 'text-[11px]' : 'text-[10px]'} font-semibold opacity-60">${en}</span>` : ''}</span>`;
  },
  navCategoryHtml: function(m, cls) {
    return `<div class="${cls} truncate whitespace-nowrap">${this.esc(m.label)}${m.sub ? ` <span class="normal-case tracking-normal font-semibold opacity-60">· ${this.esc(m.sub)}</span>` : ''}</div>`;
  },

  buildMenu: function() {
    const deskNav = document.getElementById('desktopMenu');
    const mobNav = document.getElementById('mobileMenu');
    if(!deskNav || !mobNav) return;
    
    let deskHtmlStr = '';
    let mobHtmlStr = '';
    
    this.menuConfig.forEach(m => {
      if(m.isCategory) {
          if (this.checkMenuAccess('category', m.roles)) {
              deskHtmlStr += this.navCategoryHtml(m, 'px-4 pt-4 pb-1 text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1');
              mobHtmlStr += this.navCategoryHtml(m, 'px-4 pt-4 pb-2 text-[11px] font-black text-slate-400 uppercase tracking-widest mt-1');
          }
      } else if(m.isParent) {
          let childDeskHtml = '';
          let childMobHtml = '';
          let hasChildAccess = false;
          
          m.children.forEach(child => {
             if(child.isCategory) {
                 if(this.checkMenuAccess('category', child.roles)) {
                    childDeskHtml += this.navCategoryHtml(child, 'px-3 pt-3 pb-1 text-[9px] font-black text-slate-400 uppercase tracking-widest mt-1');
                    childMobHtml += this.navCategoryHtml(child, 'px-4 pt-3 pb-1 text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1');
                 }
             } else if(this.checkMenuAccess(child.id, child.roles)) {
                childDeskHtml += `<a href="#${child.id}" class="nav-link flex items-center px-3 py-2 rounded-xl text-[13px] font-bold text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition-all" id="nav-desk-${child.id}" title="${this.esc(child.label)}${child.sub ? ' — ' + this.esc(child.sub) : ''}"><i class="fas ${child.icon} mr-2 w-4 text-center opacity-50 text-[11px]"></i>${this.navLabelHtml(child)}</a>`;
                childMobHtml += `<a href="#${child.id}" class="nav-link flex items-center px-4 py-2.5 rounded-xl text-sm font-bold text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition-all" id="nav-mob-${child.id}" onclick="window.app.closeMobileMenu()"><i class="fas ${child.icon} mr-2 w-4 text-center opacity-50 text-[11px]"></i>${this.navLabelHtml(child)}</a>`;
                hasChildAccess = true;
             }
          });

          if(hasChildAccess) { 
             deskHtmlStr += `<div>
                <button onclick="document.getElementById('desk-sub-${m.id}').classList.toggle('hidden')" class="w-full text-left px-3 py-3 rounded-xl text-sm font-bold text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors flex justify-between items-center" id="nav-desk-${m.id}">
                  <span class="flex items-center min-w-0 flex-1"><i class="fas ${m.icon} mr-3 w-5 text-center opacity-70"></i>${this.navLabelHtml(m)}</span>
                  <i class="fas fa-chevron-down text-[10px] opacity-50"></i>
                </button>
                <div id="desk-sub-${m.id}" class="hidden pl-8 pr-2 py-1 space-y-0.5 bg-slate-50/50 rounded-xl mt-1">
                   ${childDeskHtml}
                </div>
             </div>`;

             mobHtmlStr += `<div>
               <button onclick="document.getElementById('sub-${m.id}').classList.toggle('hidden')" class="w-full text-left px-4 py-3 rounded-xl text-base font-bold text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors flex justify-between items-center" id="nav-mob-${m.id}">
                 <span class="flex items-center min-w-0 flex-1"><i class="fas ${m.icon} mr-3 w-5 text-center opacity-70"></i>${this.navLabelHtml(m, true)}</span>
                 <i class="fas fa-chevron-down text-sm"></i>
               </button>
               <div id="sub-${m.id}" class="hidden pl-6 pr-2 py-2 space-y-1 bg-slate-50/50 rounded-xl mt-1 border border-slate-100/50">
                  ${childMobHtml}
               </div>
             </div>`;
          }
      } else {
          if(this.checkMenuAccess(m.id, m.roles)) {
             deskHtmlStr += `<a href="#${m.id}" class="nav-link flex items-center px-3 py-2.5 rounded-xl text-sm font-bold text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition-all w-full" id="nav-desk-${m.id}" title="${this.esc(m.label)}${m.sub ? ' — ' + this.esc(m.sub) : ''}"><i class="fas ${m.icon} mr-3 w-5 text-center opacity-70"></i>${this.navLabelHtml(m)}</a>`;
             mobHtmlStr += `<a href="#${m.id}" class="nav-link flex items-center px-4 py-2.5 rounded-xl text-base font-bold text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition-all" id="nav-mob-${m.id}" onclick="window.app.closeMobileMenu()"><i class="fas ${m.icon} mr-3 w-5 text-center opacity-70 text-sm"></i>${this.navLabelHtml(m, true)}</a>`;
          }
      }
    });
    
    deskNav.innerHTML = deskHtmlStr;
    mobNav.innerHTML = mobHtmlStr;
  },

  route: function() {
    if (window.app.pos && window.app.pos.countdownInterval) {
      clearInterval(window.app.pos.countdownInterval);
      window.app.pos.countdownInterval = null;
    }
    if(!window.app.user) return window.app.renderLogin();
    const hash = window.location.hash.substring(1) || 'dashboard';
    window.app.currentRoute = hash;

    // รอบ 9 — hash เก่าของ 6 หน้า settings ที่ยุบรวมเป็น systemsettings: redirect แล้วเปิด tab เดิม (bookmark เก่าต้องไม่เจอหน้าตาย)
    // ใช้ location.replace เพื่อไม่ทิ้ง history entry ของ hash เก่า (กดย้อนกลับแล้วไม่วนredirect)
    // แท็บแบนเนอร์เก่า (Hero/Promo Grid/Popup) ถูกตัดออกแล้ว — bookmark เก่าส่งไปหน้า จัดการแบนเนอร์ ใหม่
    if (['herobanners', 'promogrids', 'popupbanners'].includes(hash)) {
      window.location.replace('#banners');
      return;
    }
    if (window.app.systemSettings.tabs.some(t => t.id === hash)) {
      window.app.systemSettings.pendingTab = hash;
      window.location.replace('#systemsettings');
      return;
    }

    const targetMenu = this.menuConfig.flatMap(x => x.children || [x]).find(x => x.id === hash);
    if (!targetMenu || !this.checkMenuAccess(hash, targetMenu.roles)) {
       Swal.fire('ปฏิเสธการเข้าถึง', 'คุณไม่มีสิทธิ์เข้าถึงข้อมูลในส่วนนี้', 'warning');
       window.location.hash = '#dashboard';
       return;
    }
    
    window.app.saveRoute_(hash); // ผ่านการเช็คสิทธิ์แล้วเท่านั้น — จำหน้าปัจจุบันไว้ใช้ตอนรีเฟรช
    // หน้าร้าน (#pos) แสดงแบบเว็บไซต์มาตรฐาน: ซ่อน sidebar/แถบบนของระบบหลังร้าน ใช้ header ร้านค้าแทน (CSS html.sf-site)
    document.documentElement.classList.toggle('sf-site', hash === 'pos');
    document.querySelectorAll('.nav-link').forEach(el => {
       el.classList.remove('bg-indigo-600', 'text-white', 'hover:bg-indigo-700', 'bg-indigo-50', 'text-indigo-600', 'active-link');
       if(el.id.startsWith('nav-desk-')) el.classList.add('text-slate-500', 'hover:bg-indigo-50', 'hover:text-indigo-600');
       if(el.id.startsWith('nav-mob-')) el.classList.add('text-slate-600', 'hover:bg-indigo-50', 'hover:text-indigo-600');
    });
    
    const deskActive = document.getElementById('nav-desk-' + hash);
    const mobActive = document.getElementById('nav-mob-' + hash);
    
    if(deskActive) {
      deskActive.classList.remove('text-slate-500', 'hover:bg-indigo-50');
      deskActive.classList.add('bg-indigo-600', 'text-white', 'hover:bg-indigo-700', 'active-link');
      if(document.getElementById('pageTitle')) { const th = deskActive.querySelector('.nav-th'); document.getElementById('pageTitle').innerText = th ? th.textContent : deskActive.innerText; }
    }
    if(mobActive) {
      mobActive.classList.remove('text-slate-600', 'hover:bg-indigo-50');
      mobActive.classList.add('bg-indigo-50', 'text-indigo-600', 'active-link');
    }

    const content = document.getElementById('page-content');
    if(!content) return;
    
    try {
      switch(hash) {
        case 'dashboard': 
          const dbTmpl = document.getElementById('tmpl-dashboard');
          if(dbTmpl) content.innerHTML = dbTmpl.innerHTML; 
          window.app.dashboard.init(); 
          break;
        case 'analytics':
          window.app.analytics.init();
          break;
        case 'target':
          window.app.target.init();
          break;
        case 'bookingsummary':
          window.app.bookingSummary.init();
          break;
        case 'salessummary':
          window.app.salesSummary.init();
          break;
        case 'branchbookingsummary':
          window.app.branchBookingSummary.init();
          break;
        case 'allbookingsummary':
          window.app.allBookingSummary.init();
          break;
        case 'pos': 
          const posTmpl = document.getElementById('tmpl-pos');
          if(posTmpl) content.innerHTML = posTmpl.innerHTML; 
          window.app.pos.init(); 
          break;
        case 'systemsettings':
          window.app.systemSettings.init();
          break;
        case 'banners': case 'news': case 'newscats':
          window.app.cms.open(hash);
          break;
        case 'products': 
          window.app.grid.init('Products', 'SKU', [
            { key: 'SKU', label: 'SKU', type: 'text' }, 
            { key: 'Product Name', label: 'ชื่อสินค้า', type: 'text' },
            { key: 'Model', label: 'รุ่น (Model)', type: 'text' },
            { key: 'Marketing Model', label: 'ชื่อรุ่นทางการตลาด', type: 'text' },
            { key: 'Product Group', label: 'กลุ่มสินค้า', type: 'text' },
            { key: 'Capacity', label: 'ความจุ', type: 'text' }, 
            { key: 'Color', label: 'สี', type: 'text' },
            { key: 'Image URL', label: 'รูปสินค้า', type: 'text' }, 
            { key: 'Price', label: 'ราคา', type: 'number' },
            { key: 'Original Price', label: 'ราคาเดิม (เว้นว่างถ้าไม่ลดราคา)', type: 'number' },
            { key: 'Stock', label: 'สต็อก', type: 'number' },
            { key: 'Unit', label: 'หน่วย', type: 'text' },
            { key: 'Category', label: 'หมวดหมู่', type: 'select', options: ['โมบาย', 'แท็บเล็ต', 'อุปกรณ์เสริม', 'สมาร์ทวอทช์', 'หูฟัง', 'ของแถมแบรนด์', 'ของแถมช่องทาง'] },
            { key: 'Status', label: 'สถานะ', type: 'select', options: ['เปิด', 'ปิด'] },
            { key: 'Channel', label: 'ช่องทางที่ขาย', type: 'multi_select_channel' },
            { key: 'Display', label: 'หน้าจอ (Display)', type: 'text' },
            { key: 'Processor', label: 'ชิปประมวลผล (Processor)', type: 'text' },
            { key: 'RAM', label: 'หน่วยความจำ (RAM)', type: 'text' },
            { key: 'Rear Camera', label: 'กล้องหลัง (Rear Camera)', type: 'text' },
            { key: 'Front Camera', label: 'กล้องหน้า (Front Camera)', type: 'text' },
            { key: 'Battery', label: 'แบตเตอรี่ (Battery)', type: 'text' },
            { key: 'OS', label: 'ระบบปฏิบัติการ (OS)', type: 'text' },
            { key: 'Connectivity', label: 'การเชื่อมต่อ (Connectivity)', type: 'text' },
            { key: 'Warranty', label: 'การรับประกัน (Warranty)', type: 'text' },
            { key: 'Launch Date', label: 'วันเปิดตัว (Launch Date)', type: 'text' }
          ]); break;
        case 'autopromotions':
          // ดรอปดาวน์หมวดหมู่: รวมหมวดที่รู้จัก (ตรงกับ Category ของ Products) + หมวดเดิมที่เคยบันทึกไว้ในชีตนี้อยู่แล้ว (เผื่อพิมพ์ค่าอื่นไว้ก่อนหน้า)
          // กันปัญหา select เด้งไปเลือกตัวเลือกแรกเงียบๆ ตอนเปิดฟอร์มแก้ไขแถวที่มีค่าไม่ตรงกับลิสต์ที่รู้จัก
          var apKnownCats = ['โมบาย', 'แท็บเล็ต', 'อุปกรณ์เสริม', 'สมาร์ทวอทช์', 'หูฟัง', 'ของแถมแบรนด์', 'ของแถมช่องทาง'];
          var apExisting = window.app.globalData.autoPromotions || [];
          var apCatOptions = Array.from(new Set([
            ...apKnownCats,
            ...apExisting.map(r => (r['Buy Category'] || '').toString().trim()),
            ...apExisting.map(r => (r['Get Discount Category'] || '').toString().trim())

  api: function(action, payload) {
    // google.script.run ไม่มี timeout ในตัว — ถ้า handler ไม่ถูกเรียกกลับ Promise จะค้างตลอดกาล
    const call = new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiHandler(action, payload, window.app.user);
    });
    const timeout = new Promise((_, reject) => {
      setTimeout(() => {
        const err = new Error('การเชื่อมต่อใช้เวลานานเกินไป กรุณาลองใหม่');
        err.isTimeout = true; // ให้ผู้เรียก (เช่น CHECKOUT) แสดงข้อความเฉพาะทางได้
        reject(err);
      }, 45000);
    });
    return Promise.race([call, timeout]);
  },

  // จำเฉพาะ Username ไว้ auto-fill ฟอร์ม login ครั้งถัดไป — ไม่เก็บรหัสผ่านอีกต่อไป (เซสชันอยู่ใน token 30 วันของ tg_pos_user อยู่แล้ว)
  // ข้อมูลเก่าที่เคยเก็บ {u,p} จะถูกลบ p ทิ้งทันทีที่เปิดหน้า login
  loadRememberedLogin: function() {
    try {
      const raw = localStorage.getItem('tg_pos_remember');
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (saved && saved.p !== undefined) localStorage.setItem('tg_pos_remember', JSON.stringify({ u: saved.u || '' }));
      const uEl = document.getElementById('loginUsername');
      const cEl = document.getElementById('loginRemember');
      if (uEl && saved.u) uEl.value = saved.u;
      if (cEl) cEl.checked = true;
    } catch (e) { /* localStorage บล็อก/ข้อมูลเสีย — ปล่อยฟอร์มว่างเฉยๆ ไม่ต้อง throw */ }
  },

  handleLogin: async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Wait...';
    try {
      const uVal = document.getElementById('loginUsername').value;
      const pVal = document.getElementById('loginPassword').value;
      const res = await this.api('LOGIN', { username: uVal, password: pVal });
      if(res && res.status === 'success') {
        // บันทึก/ลบ Username ที่จำไว้เฉพาะตอน login สำเร็จเท่านั้น
        const remember = document.getElementById('loginRemember');
        if (remember && remember.checked) localStorage.setItem('tg_pos_remember', JSON.stringify({ u: uVal }));
        else localStorage.removeItem('tg_pos_remember');
        window.app.user = res.user; localStorage.setItem('tg_pos_user', JSON.stringify(window.app.user));
        Swal.fire({icon: 'success', title: 'Welcome', text: res.user.Name, timer: 1500, showConfirmButton: false});
        window.app.renderLayout();
      } else {
        Swal.fire('Error', res ? res.message : 'Unknown Error', 'error');
        btn.disabled = false; btn.innerHTML = 'เข้าสู่ระบบ';
      }
    } catch (err) {
      Swal.fire('Error', err && err.message ? err.message : 'เชื่อมต่อระบบไม่สำเร็จ', 'error');
      btn.disabled = false; btn.innerHTML = 'เข้าสู่ระบบ';
    }
  },

  logout: function() {
    if(window.app.dashboard.refreshTimer) clearInterval(window.app.dashboard.refreshTimer);
    if(window.app.pos && window.app.pos.countdownInterval) clearInterval(window.app.pos.countdownInterval);
    window.app.user = null; window.app.clearSavedRoute_(); localStorage.removeItem('tg_pos_user'); sessionStorage.removeItem('tg_pos_user'); window.location.hash = ''; window.app.renderLogin();
    sessionStorage.removeItem('tg_popup_shown');

    if (window.app.pos) window.app.pos.cartData = [];

  openChangePassword: function() {
    Swal.fire({
      title: 'เปลี่ยนรหัสผ่าน',
      html: `
        <div class="space-y-4 text-left px-2">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">รหัสผ่านเดิม</label>
            <input type="password" id="cp-old" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="รหัสผ่านเดิม">
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">รหัสผ่านใหม่</label>
            <input type="password" id="cp-new" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="อย่างน้อย 4 ตัวอักษร">
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">ยืนยันรหัสผ่านใหม่</label>
            <input type="password" id="cp-confirm" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="พิมพ์รหัสผ่านใหม่อีกครั้ง">
          </div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: 'บันทึก',
      cancelButtonText: 'ยกเลิก',
      confirmButtonColor: '#254d71',
      preConfirm: () => {
        const oldPassword = document.getElementById('cp-old').value;
        const newPassword = document.getElementById('cp-new').value;
        const confirmPassword = document.getElementById('cp-confirm').value;
        if (!oldPassword || !newPassword || !confirmPassword) {
          Swal.showValidationMessage('กรุณากรอกข้อมูลให้ครบทุกช่อง');
          return false;
        }
        if (newPassword.length < 4) {
          Swal.showValidationMessage('รหัสผ่านใหม่ต้องมีความยาวอย่างน้อย 4 ตัวอักษร');
          return false;
        }
        if (newPassword !== confirmPassword) {
          Swal.showValidationMessage('รหัสผ่านใหม่และการยืนยันไม่ตรงกัน');
          return false;
        }
        return { oldPassword, newPassword };
      }
    }).then(async (result) => {
      if (!result.isConfirmed) return;
      window.app.showLoading('กำลังบันทึกข้อมูล...');
      try {
        const res = await window.app.api('CHANGE_PASSWORD', { oldPassword: result.value.oldPassword, newPassword: result.value.newPassword });
        Swal.close();
        if (res && res.status === 'success') {
          Swal.fire({ icon: 'success', title: 'เปลี่ยนรหัสผ่านสำเร็จ', showConfirmButton: false, timer: 1500 });
        } else {
          Swal.fire('ผิดพลาด', res ? res.message : 'Error', 'error');
        }
      } catch (e) {
        Swal.close();
        Swal.fire('ผิดพลาด', e.message || 'Error', 'error');
      }
    });
  },

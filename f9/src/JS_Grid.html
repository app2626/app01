<script>
// Split out of JS.html (core). Attaches to window.app; included by Index.html after JS and before JS_Boot.
window.app.grid = {
    TITLES: { Products: 'จัดการสินค้า', Branches: 'จัดการสาขา', Channels: 'จัดการช่องทางขาย', Members: 'จัดการสมาชิก', GiftMappings: 'จัดการชุดของแถม', AutoPromotions: 'จัดการโปรโมชั่นอัตโนมัติ', Promotions: 'จัดการส่วนลดและโปรโมชั่น', Interests: 'จัดการความสนใจ', Coupons: 'จัดการโค้ดส่วนลด', Orders: 'รายการจอง', InventoryLog: 'ประวัติสต๊อก', AuditLog: 'ประวัติการใช้งาน' },
    setPageSize: function(v) { const n = parseInt(v, 10); if (n > 0) { this.pageSize = n; this.renderPage(1); } },
    STATUS_TABLES: ['Products', 'GiftMappings', 'AutoPromotions', 'Promotions'],
    canBulkStatus: function() { return this.canBulk() && this.STATUS_TABLES.indexOf(this.tableName) > -1; },
    BULK_TABLES: ['Products', 'Branches', 'Channels', 'Members', 'GiftMappings', 'AutoPromotions', 'Promotions'],
    selected: {},
    canBulk: function() { return !this.isReadonly && this.BULK_TABLES.indexOf(this.tableName) > -1; },
    tableName: '', idField: '', columns: [], dataList: [], filteredDataList: [], currentPage: 1, pageSize: 20, isReadonly: false, sortCol: '', sortAsc: true,
    init: async function(table, idCol, cols, readonly=false) {
      this.tableName = table; this.idField = idCol; this.columns = cols; this.isReadonly = readonly; this.selected = {};
      const content = document.getElementById('page-content');
      const tmpl = document.getElementById('tmpl-datagrid');
      if(content && tmpl) content.innerHTML = tmpl.innerHTML;
      const btn = document.getElementById('gridAddBtn');
      if(btn) btn.style.display = (readonly || table==='Orders') ? 'none' : 'inline-flex';
      const ttl = this.TITLES[table] || table;
      const gt = document.getElementById('gridTitle'); if (gt) gt.textContent = ttl;
      const gc = document.getElementById('gridCrumb'); if (gc) gc.textContent = 'ข้อมูลระบบ > ' + ttl;
      const delBtn = document.getElementById('gridBulkDeleteBtn');
      if (delBtn) { const on = this.canBulk(); delBtn.classList.toggle('hidden', !on); }
      ['gridBulkOnBtn', 'gridBulkOffBtn'].forEach(id => { const b = document.getElementById(id); if (b) b.classList.toggle('hidden', !this.canBulkStatus()); });
      // ปุ่มเพิ่มข้อมูลของ Products เปิดฟอร์มเพิ่มสินค้าแบบหลาย SKU แทนฟอร์มแถวเดียวทั่วไป (ดู grid.handleAddClick)
      const addBtnIcon = document.getElementById('gridAddBtnIcon');
      const addBtnLabel = document.getElementById('gridAddBtnLabel');
      if (addBtnIcon && addBtnLabel) {
        if (table === 'Products') { addBtnIcon.className = 'fas fa-layer-group'; addBtnLabel.textContent = 'เพิ่มสินค้า'; }
        else { addBtnIcon.className = 'fas fa-plus'; addBtnLabel.textContent = 'เพิ่มข้อมูล'; }
      }
      // ปุ่มแก้ไขราคา & สต๊อกด่วน (Bulk Quick Edit) เฉพาะหน้า Products
      const bulkBtn = document.getElementById('gridBulkQuickBtn');
      if (bulkBtn) {
        if (table === 'Products' && !readonly) { bulkBtn.classList.remove('hidden'); bulkBtn.classList.add('flex'); }
        else { bulkBtn.classList.add('hidden'); bulkBtn.classList.remove('flex'); }
      }
      // ปุ่มนำเข้า CSV เฉพาะหน้า Products / Branches / Channels / Members / GiftMappings (Admin — server ตรวจสิทธิ์ซ้ำ)
      const impBtn = document.getElementById('gridImportBtn');
      if (impBtn) {
        if (['Products', 'Branches', 'Channels', 'Members', 'GiftMappings'].includes(table) && !readonly) { impBtn.classList.remove('hidden'); impBtn.classList.add('flex'); }
        else { impBtn.classList.add('hidden'); impBtn.classList.remove('flex'); }
      }
      // ปุ่ม Export CSV หน้า Orders และ Products — สลับ hidden/flex เป็นคู่ ห้ามให้สอง class อยู่พร้อมกัน
      const exBtn = document.getElementById('gridExportBtn');
      if(exBtn) {
        if (table === 'Orders' || table === 'Products') { exBtn.classList.remove('hidden'); exBtn.classList.add('flex'); }
        else { exBtn.classList.add('hidden'); exBtn.classList.remove('flex'); }
      }
      // ตัวกรอง ประเภทการจอง/สถานะออเดอร์/Category — เฉพาะหน้า Orders
      const filterBar = document.getElementById('gridFilterBar');
      if (filterBar) {
        if (table === 'Orders') { filterBar.classList.remove('hidden'); this.setupOrdersFilters(); }
        else { filterBar.classList.add('hidden'); }
      }

      let h = '<tr>';
      if (this.canBulk()) h += `<th class="cms-c-chk"><input type="checkbox" id="gridSelAll" aria-label="เลือกทั้งหน้า" onchange="window.app.grid.toggleAll(this.checked)"></th>`;
      this.columns.forEach(c => {
        if(c.type!=='hidden') h+=`<th onclick="window.app.grid.sortColumn('${c.key}')" class="cms-sortable${this.sortCol === c.key ? (this.sortAsc ? ' cms-asc' : ' cms-desc') : ''} ${c.resp || ''}">${c.label}</th>`;
      });
      if(!readonly) h += `<th class="cms-c-act">จัดการ</th>`;
      h += '</tr>'; 
      const head = document.getElementById('dataGridHead');
      if(head) head.innerHTML = h; 
      this.loadData();
    },
    // ตัวกรองหน้า Orders — ประเภทการจอง (Reservation Status), สถานะออเดอร์ (Order Status), Category (จาก SKU ผ่านชีต Products)
    setupOrdersFilters: function() {
      // ตัวเลือกต้องตรงกับค่าที่เก็บจริงในชีต (เหมือน options ของฟอร์มแก้ไข 'Reservation Status' ด้านบน)
      const resEl = document.getElementById('gridFilterResStatus');
      if (resEl) {
        resEl.innerHTML = '<option value="">ทั้งหมด</option>'
          + '<option value="จอง T (มีการจอง)">จอง T (มีการจอง)</option>'
          + '<option value="จอง F (สวมสิทธิ์การจอง)">จอง F (สวมสิทธิ์การจอง)</option>';
      }
      // สถานะออเดอร์ — flow เดียวกับที่ orderTimelineHtml/ฟอร์มแก้ไขใช้ (ชีต OrderStatus ถ้ามี ≥2 แถว ไม่งั้น fallback)
      const stEl = document.getElementById('gridFilterOrderStatus');
      if (stEl) {
        const options = window.app.getOrderStatusFlow().concat(['Cancelled']);
        stEl.innerHTML = '<option value="">ทั้งหมด</option>'
          + options.map(o => '<option value="' + window.app.esc(o) + '">' + window.app.esc(o) + '</option>').join('');
      }
      // Category — จากชีต Products ผูกกับ SKU ของแต่ละแถว Order (แถว DISCOUNT ไม่มี SKU สินค้าจริง จึงไม่เข้าเงื่อนไขนี้)
      const products = window.app.globalData.products || [];
      this.skuCategoryMap = {};
      const seenCat = {}; const cats = [];
      products.forEach(p => {
        if (p.SKU) this.skuCategoryMap[p.SKU] = (p['Category'] || '').toString().trim();
        const c = (p['Category'] || '').toString().trim();
        if (c && !seenCat[c]) { seenCat[c] = true; cats.push(c); }
      });
      const catEl = document.getElementById('gridFilterCategory');
      if (catEl) {
        catEl.innerHTML = '<option value="">ทั้งหมด</option>'
          + cats.map(c => '<option value="' + window.app.esc(c) + '">' + window.app.esc(c) + '</option>').join('');
      }
    },
    loadData: async function() {
      window.app.showLoading(); 
      try {
        const res = await window.app.api('GET_TABLE', { tableName: this.tableName }); 
        Swal.close();
        if(res && res.status === 'success') {
          this.dataList = res.data;
          // เดิมตั้ง filteredDataList = dataList ตรงๆ ไม่ผ่าน filter() — เรียก loadData() ซ้ำหลัง save/delete สำเร็จ (ยังอยู่หน้าเดิม)
          // จะล้างคำค้น/ตัวกรอง Orders (gridFilterResStatus ฯลฯ) ที่ผู้ใช้ตั้งไว้เงียบๆ ทั้งที่ UI ยังโชว์ค่าที่เลือกอยู่
          this.filter();
        }
        else { this.renderLoadError(res ? res.message : 'ไม่สามารถโหลดข้อมูลได้'); }
      } catch(e) { Swal.close(); this.renderLoadError(e.message); }
    },
    // แถวข้อความว่าง/ผิดพลาดในตาราง — ตารางกว้างมาก (Orders ~2,700px) ข้อความจัดกลางเซลล์จะไปอยู่นอกจอทางขวา
    // จึงตรึง (sticky) กล่องข้อความไว้ที่ส่วนที่มองเห็นของกรอบเลื่อน และกว้างเท่ากรอบนั้น
    // วัดความกว้างหลังจัดหน้าเสร็จ (ตอน render หน้าอาจยังไม่ได้แสดงเมนูข้าง) และวัดใหม่เมื่อปรับขนาดหน้าต่าง
    stateRow: function(inner) {
      const self = this;
      requestAnimationFrame(() => self.fitStateRow());
      // เมนูข้างเลื่อนเข้ามาแบบมี transition — ResizeObserver จับทุกครั้งที่กรอบตารางเปลี่ยนขนาด (กรอบสร้างใหม่ทุกครั้งที่เปิดหน้า)
      const wrap = document.querySelector('.cms-wrap');
      if (wrap && !wrap._fitObs && window.ResizeObserver) { wrap._fitObs = new ResizeObserver(() => self.fitStateRow()); wrap._fitObs.observe(wrap); }
      return '<tr><td colspan="' + this.visibleColCount() + '" class="cms-empty-cell"><div class="cms-empty-pin">' + inner + '</div></td></tr>';
    },
    fitStateRow: function() {
      const wrap = document.querySelector('.cms-wrap');
      const pins = document.querySelectorAll('#dataGridBody .cms-empty-pin');
      if (!wrap || !pins.length) return;
      const w = Math.max(240, wrap.clientWidth - 32) + 'px';
      pins.forEach(p => { p.style.width = w; });
    },
    // error state มาตรฐาน (5A.4) — แสดงในตารางพร้อมปุ่มลองใหม่ แทนการเด้ง Swal อย่างเดียว
    renderLoadError: function(msg) {
      const tbody = document.getElementById('dataGridBody');
      if (!tbody) { Swal.fire('Error', msg, 'error'); return; }
      tbody.innerHTML = this.stateRow(window.app.emptyState({
        icon: 'fa-exclamation-triangle',
        title: 'โหลดข้อมูลไม่สำเร็จ',
        subtitle: msg,
        actionLabel: 'ลองใหม่',
        onclick: 'window.app.grid.loadData()'
      }));
    },
    renderPage: function(page) {
      this.currentPage = page;
      const totalPages = Math.ceil(this.filteredDataList.length / this.pageSize) || 1;
      if (this.currentPage > totalPages) this.currentPage = totalPages;
      if (this.currentPage < 1) this.currentPage = 1;
      const start = (this.currentPage - 1) * this.pageSize;
      const pageData = this.filteredDataList.slice(start, start + this.pageSize);
      this.renderTable(pageData, start);
      
      const pgContainer = document.getElementById('gridPagination');
      if (pgContainer) {
        const cur = this.currentPage;
        let pg = '<button type="button" class="cms-pg" onclick="window.app.grid.renderPage(' + (cur - 1) + ')"' + (cur <= 1 ? ' disabled' : '') + '>ก่อนหน้า</button>';
        for (let q = Math.max(1, cur - 2); q <= Math.min(totalPages, cur + 2); q++) pg += '<button type="button" class="cms-pg' + (q === cur ? ' cms-pg-on' : '') + '" onclick="window.app.grid.renderPage(' + q + ')">' + q + '</button>';
        pg += '<button type="button" class="cms-pg" onclick="window.app.grid.renderPage(' + (cur + 1) + ')"' + (cur >= totalPages ? ' disabled' : '') + '>ถัดไป</button>';
        pgContainer.innerHTML = '<div>แสดง ' + (this.filteredDataList.length === 0 ? 0 : start + 1) + ' ถึง ' + Math.min(start + this.pageSize, this.filteredDataList.length) + ' จากทั้งหมด ' + this.filteredDataList.length + ' รายการ</div><div class="cms-pager">' + pg + '</div>';
      }
    },
    // จำนวนคอลัมน์ที่แสดงจริง (ใช้เป็น colspan ของ empty/error state)
    visibleColCount: function() {
      return this.columns.filter(c => c.type !== 'hidden').length + (this.isReadonly ? 0 : 1) + (this.canBulk() ? 1 : 0);
    },
    renderTable: function(data, startOffset) {
      startOffset = startOffset || 0;
      const tbody = document.getElementById('dataGridBody'); if(!tbody) return;
      if (data.length === 0) {
        const searchEl = document.getElementById('gridSearch');
        const hasSearch = !!(searchEl && searchEl.value.trim() !== '');
        let hasFilter = hasSearch;
        let clearAction = "document.getElementById('gridSearch').value='';window.app.grid.filter()";
        if (this.tableName === 'Orders') {
          const resEl = document.getElementById('gridFilterResStatus');
          const stEl = document.getElementById('gridFilterOrderStatus');
          const catEl = document.getElementById('gridFilterCategory');
          const hasSelectFilter = !!((resEl && resEl.value) || (stEl && stEl.value) || (catEl && catEl.value));
          hasFilter = hasSearch || hasSelectFilter;
          clearAction = "document.getElementById('gridSearch').value='';"
            + "var r=document.getElementById('gridFilterResStatus'); if(r) r.value='';"
            + "var s=document.getElementById('gridFilterOrderStatus'); if(s) s.value='';"
            + "var c=document.getElementById('gridFilterCategory'); if(c) c.value='';"
            + "window.app.grid.filter()";
        }
        tbody.innerHTML = this.stateRow(window.app.emptyState({
          icon: hasFilter ? 'fa-search' : 'fa-inbox',
          title: hasFilter ? 'ไม่พบข้อมูลที่ค้นหา' : 'ยังไม่มีข้อมูลในตารางนี้',
          subtitle: hasFilter ? 'ลองเปลี่ยนคำค้นหา หรือล้างตัวกรองเพื่อแสดงข้อมูลทั้งหมด' : 'เมื่อมีการบันทึกข้อมูลใหม่ รายการจะแสดงที่นี่',
          actionLabel: hasFilter ? 'ล้างตัวกรอง' : '',
          onclick: hasFilter ? clearAction : ''
        }));
        return;
      }
      let tbodyHtml = '';
      data.forEach((row, index) => {
        // ตำแหน่งจริงใน filteredDataList — index ภายในหน้าเคยทำให้เปิดแก้ผิดเรคอร์ดเมื่ออยู่หน้า 2+ หรือหลังค้นหา/เรียงลำดับ
        const absIndex = startOffset + index;
        let tr = '<tr' + (this.canBulk() && this.selected[String(row[this.idField] === undefined || row[this.idField] === null ? '' : row[this.idField])] ? ' class="cms-sel-row"' : '') + '>';
        if (this.canBulk()) {
          const rid = String(row[this.idField] === undefined || row[this.idField] === null ? '' : row[this.idField]);
          tr += `<td class="cms-c-chk"><input type="checkbox" class="grid-sel" aria-label="เลือกรายการ" data-id="${window.app.esc(rid)}" ${this.selected[rid] ? 'checked' : ''} onchange="window.app.grid.toggleOne(this)"></td>`;
        }
        this.columns.forEach(c => {
          if(c.type==='hidden') return; let val = window.app.esc(row[c.key] || '');
          if(c.key==='Password') val = '********';
          else if(c.key==='Contact Number' || c.key==='เบอร์โทรศัพท์' || c.key==='Phone') {
              if (String(val).length === 10) val = String(val).substring(0,3) + '-' + String(val).substring(3,6) + '-' + String(val).substring(6,10);
          }
          else if(c.key==='ID Card_Passport' || c.key==='ID Card / Passport') {
              if (String(val).length === 13) val = String(val).substring(0,1) + '-' + String(val).substring(1,5) + '-' + String(val).substring(5,10) + '-' + String(val).substring(10,12) + '-' + String(val).substring(12,13);
          }
          else if(c.key==='Order Status' || c.key==='Status') { 
              let clr = val==='เปิด'||val==='Completed'?'cms-b-green':(val==='Pending'?'cms-b-amber':'cms-b-gray'); 
              val=`<span class="cms-badge ${clr}">${val}</span>`; 
          }
          if(c.key==='Image URL' && val.length>30) val = val.substring(0,30)+'...';
          // Orders: ติด icon หน้าชื่อสินค้าให้แถวส่วนลด/ของแถม อ่านบิลหลายแถวต่อ OrderID ง่ายขึ้น
          // ของแถมดูจาก Unit Price=0 + Row Total=0 (processGift เขียนแบบนี้เสมอ) — ตัวเลขจากชีตอาจมี comma
          if(this.tableName === 'Orders' && c.key === 'Product Name') {
            const num = (k) => parseFloat(String(row[k] === undefined || row[k] === null ? '' : row[k]).replace(/,/g, '')) || 0;
            if(row.SKU === 'DISCOUNT') val = '<i class="fas fa-tag text-rose-500 mr-1.5" title="ส่วนลด" aria-label="ส่วนลด"></i>' + val;
            else if(num('Unit Price') === 0 && num('Row Total') === 0) val = '<i class="fas fa-gift text-emerald-500 mr-1.5" title="ของแถม" aria-label="ของแถม"></i>' + val;
          }
          tr += `<td class="${c.resp || ''}">${val}</td>`;
        });
        if(!this.isReadonly) {
            let act = `<button type="button" class="cms-ico" onclick="window.app.grid.editForm(${absIndex})" title="แก้ไข" aria-label="แก้ไขรายการ"><i class="fas fa-pen"></i></button>`;
            if (this.tableName === 'Orders') {
                const safeOrderId = window.app.esc(String(row.OrderID || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
                act += `<button type="button" class="cms-ico" onclick="window.app.grid.reprintOrder('${safeOrderId}')" title="พิมพ์ใบจอง" aria-label="พิมพ์ใบจอง"><i class="fas fa-print"></i></button>`;
            }
            if (!(window.app.user.Role === 'Manager' && this.tableName === 'Orders')) {
                const safeId = window.app.esc(String(row[this.idField] || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
                act+=`<button type="button" class="cms-ico cms-ico-red" onclick="window.app.grid.deleteRecord('${safeId}')" title="ลบ" aria-label="ลบรายการ"><i class="fas fa-trash"></i></button>`;
            }
            tr += `<td class="cms-c-act">${act}</td>`;
        }
        tr += '</tr>'; 
        tbodyHtml += tr;
      });
      tbody.innerHTML = tbodyHtml;
      this.syncSelection();
    },
    // ===== เลือกหลายรายการเพื่อลบ (เฉพาะตารางใน BULK_TABLES; server ตรวจสิทธิ์ Admin ซ้ำ) =====
    toggleOne: function(el) {
      const id = el.getAttribute('data-id');
      if (el.checked) this.selected[id] = true; else delete this.selected[id];
      this.syncSelection();
    },
    toggleAll: function(on) {
      document.querySelectorAll('#dataGridBody .grid-sel').forEach(cb => {
        cb.checked = on;
        const id = cb.getAttribute('data-id');
        if (on) this.selected[id] = true; else delete this.selected[id];
      });
      this.syncSelection();
    },
    clearSelection: function() {
      this.selected = {};
      document.querySelectorAll('#dataGridBody .grid-sel').forEach(cb => { cb.checked = false; });
      this.syncSelection();
    },
    syncSelection: function() {
      const n = Object.keys(this.selected).length;
      const dl = document.getElementById('gridBulkDeleteLabel');
      if (dl) dl.textContent = 'ลบรายการที่เลือก' + (n ? ' (' + n + ')' : '');
      // ปุ่มทำกับหลายรายการกดได้เมื่อเลือกแล้วเท่านั้น (ฟังก์ชันยังเช็ค ids.length === 0 ซ้ำ)
      ['gridBulkDeleteBtn', 'gridBulkOnBtn', 'gridBulkOffBtn'].forEach(id => { const b = document.getElementById(id); if (b) b.disabled = n === 0; });
      document.querySelectorAll('#dataGridBody .grid-sel').forEach(cb => { const tr = cb.closest('tr'); if (tr) tr.classList.toggle('cms-sel-row', cb.checked); });
      const all = document.getElementById('gridSelAll');
      if (all) {
        const boxes = document.querySelectorAll('#dataGridBody .grid-sel');
        const chk = Array.prototype.filter.call(boxes, b => b.checked).length;
        all.checked = boxes.length > 0 && chk === boxes.length;
        all.indeterminate = chk > 0 && chk < boxes.length;
      }
    },
    // เปิด/ปิดหลายรายการที่เลือก (เฉพาะตารางใน STATUS_TABLES; server ตรวจสิทธิ์ Admin ซ้ำ)
    setSelectedStatus: async function(status) {
      const ids = Object.keys(this.selected);
      if (!this.canBulkStatus()) return;
      if (ids.length === 0) { Swal.fire({ icon: 'info', title: 'ยังไม่ได้เลือกรายการ', text: 'ติ๊กเลือกรายการที่ต้องการก่อน', confirmButtonText: 'ตกลง' }); return; }
      const r = await Swal.fire({ title: status + ' ' + ids.length + ' รายการที่เลือก?', icon: 'question', showCancelButton: true, confirmButtonText: 'ยืนยัน' + status, cancelButtonText: 'ยกเลิก' });
      if (!r.isConfirmed) return;
      window.app.showLoading('กำลังเปลี่ยนสถานะ...');
      try {
        const res = await window.app.api('BULK_SET_STATUS', { tableName: this.tableName, idValues: ids, status: status });
        window.app.hideLoading();
        if (res && res.status === 'success') {
          this.selected = {};
          await window.app.refreshGlobalData();
          let msg = 'เปลี่ยนเป็น ' + res.newStatus + ' แล้ว ' + res.updated + ' รายการ';
          if (res.unchanged) msg += ' · เป็นสถานะนี้อยู่แล้ว ' + res.unchanged;
          if (res.notFound && res.notFound.length) msg += ' · ไม่พบ ' + res.notFound.length;
          Swal.fire({ icon: 'success', title: msg, showConfirmButton: false, timer: 1800 });
          this.loadData();
        } else Swal.fire('Error', res ? res.message : 'Error', 'error');
      } catch (e) { window.app.hideLoading(); Swal.fire('Error', e.message || 'Error', 'error'); }
    },
    deleteSelected: async function() {
      const ids = Object.keys(this.selected);
      if (!this.canBulk()) return;
      if (ids.length === 0) { Swal.fire({ icon: 'info', title: 'ยังไม่ได้เลือกรายการ', text: 'ติ๊กเลือกรายการที่ต้องการลบก่อน', confirmButtonText: 'ตกลง' }); return; }
      const r = await Swal.fire({ title: 'ลบ ' + ids.length + ' รายการที่เลือก?', text: 'การดำเนินการนี้ไม่สามารถย้อนกลับได้', icon: 'warning', showCancelButton: true, confirmButtonColor: '#e11d48', confirmButtonText: 'ลบ ' + ids.length + ' รายการ', cancelButtonText: 'ยกเลิก' });
      if (!r.isConfirmed) return;
      window.app.showLoading('กำลังลบ ' + ids.length + ' รายการ...');
      try {
        const res = await window.app.api('DELETE_RECORDS', { tableName: this.tableName, idValues: ids });
        window.app.hideLoading();
        if (res && res.status === 'success') {
          this.selected = {};
          await window.app.refreshGlobalData();
          let msg = 'ลบแล้ว ' + res.deleted + ' รายการ';
          if (res.protectedIds && res.protectedIds.length) msg += ' (ข้ามบัญชีของตัวเอง)';
          if (res.notFound && res.notFound.length) msg += ' · ไม่พบ ' + res.notFound.length + ' รายการ';
          Swal.fire({ icon: 'success', title: msg, showConfirmButton: false, timer: 1800 });
          this.loadData();
        } else Swal.fire('Error', res ? res.message : 'Error', 'error');
      } catch (e) { window.app.hideLoading(); Swal.fire('Error', e.message || 'Error', 'error'); }
    },
    filter: function() {
      const input = document.getElementById('gridSearch'); if(!input) return;
      const term = input.value.toLowerCase();
      let list = this.dataList.filter(row => JSON.stringify(Object.values(row)).toLowerCase().includes(term));
      if (this.tableName === 'Orders') {
        const resEl = document.getElementById('gridFilterResStatus');
        const stEl = document.getElementById('gridFilterOrderStatus');
        const catEl = document.getElementById('gridFilterCategory');
        const resVal = resEl ? resEl.value : '';
        const stVal = stEl ? stEl.value : '';
        const catVal = catEl ? catEl.value : '';
        if (resVal) {
          // Reservation Status ถูกเขียนแค่แถวแรกของแต่ละ OrderID เท่านั้น (processCheckout, Code.js) — แถวของแถม/ส่วนลดอื่นในบิลเดียวกันเป็นค่าว่าง
          // ต้อง join กลับด้วย OrderID เหมือน bookingSummary/branchBookingSummary/allBookingSummary ไม่งั้นกรองแล้วเหลือแค่แถวแรกของบิล ซ่อนแถวที่เหลือไปทั้งตารางและ CSV export
          const orderResStatusMap = {};
          this.dataList.forEach(o => { if (o['Reservation Status'] && o['Reservation Status'].toString().trim() !== '') orderResStatusMap[o.OrderID] = o['Reservation Status']; });
          list = list.filter(row => (row['Reservation Status'] || orderResStatusMap[row.OrderID] || '').toString().trim() === resVal);
        }
        if (stVal) list = list.filter(row => (row['Order Status'] || '').toString().trim() === stVal);
        if (catVal) list = list.filter(row => (this.skuCategoryMap || {})[row.SKU] === catVal);
      }
      this.filteredDataList = list;
      // เดิม filter() ไม่ apply sortCol/sortAsc ที่ผู้ใช้ตั้งไว้ต่อ — เรียง แล้วพิมพ์ค้นหา/เปลี่ยนตัวกรอง ทำให้ลำดับ sort หายเงียบๆ
      this.applyCurrentSort();
      this.renderPage(1);
    },
    // แยกออกจาก sortColumn เพื่อให้ filter()/loadData() เรียก apply sort เดิมซ้ำได้ ไม่ต้องคัดลอก comparator
    applyCurrentSort: function() {
      if (!this.sortCol) return;
      const colKey = this.sortCol;
      this.filteredDataList.sort((a,b) => {
        let valA = a[colKey] !== undefined && a[colKey] !== null ? a[colKey] : '';
        let valB = b[colKey] !== undefined && b[colKey] !== null ? b[colKey] : '';
        if(typeof valA === 'string') valA = valA.toLowerCase();
        if(typeof valB === 'string') valB = valB.toLowerCase();
        if (valA < valB) return this.sortAsc ? -1 : 1;
        if (valA > valB) return this.sortAsc ? 1 : -1;
        return 0;
      });
    },
    sortColumn: function(colKey) {
      if(this.sortCol === colKey) this.sortAsc = !this.sortAsc;
      else { this.sortCol = colKey; this.sortAsc = true; }
      this.applyCurrentSort();
      this.renderPage(1);
    },
    // 5A.3 — Order status timeline (read-only visual) แสดงหัว modal แก้ไข/ดูออเดอร์
    // flow อ่านจากชีต OrderStatus (เรียงตามแถว, ตัด Cancelled ออก) ถ้าชีตว่างใช้ flow มาตรฐาน
    orderTimelineHtml: function(data) {
      const stList = (window.app.globalData.orderStatuses || []).filter(s => s && (s['Status Name'] || '').toString().trim() !== '');
      const fallbackColors = { 'Pending': '#f59e0b', 'Confirmed': '#366891', 'Paid': '#10b981', 'Delivered': '#1e293b', 'Completed': '#10b981', 'Cancelled': '#f43f5e' };
      const colorOf = (name) => {
        const row = stList.find(s => (s['Status Name'] || '').toString().trim() === name);
        const c = row && row['Color Code'] ? row['Color Code'].toString().trim() : '';
        return c || fallbackColors[name] || '#366891';
      };
      const current = (data['Order Status'] || 'Pending').toString().trim();

      // Cancelled = สถานะแดงแยก ไม่อยู่ใน flow
      if (current === 'Cancelled') {
        return '<div class="sm:col-span-2 md:col-span-3"><div class="flex items-center gap-3 bg-rose-50 border border-rose-200 rounded-xl px-4 py-3">'
          + '<div class="w-8 h-8 shrink-0 rounded-full text-white flex items-center justify-center" style="background:' + window.app.esc(colorOf('Cancelled')) + '"><i class="fas fa-ban"></i></div>'
          + '<div><p class="text-sm font-bold text-rose-600">Cancelled — ออเดอร์นี้ถูกยกเลิก</p>'
          + '<p class="text-[11px] text-rose-400">รายการนี้ไม่อยู่ในขั้นตอนการดำเนินการ</p></div>'
          + '</div></div>';
      }

      let flow = window.app.getOrderStatusFlow();
      // สถานะปัจจุบันไม่อยู่ใน flow (เช่นระบบเก่าใช้ Completed) — ต่อท้ายเป็น step สุดท้ายให้ timeline ยังสะท้อนความจริง
      let curIdx = flow.indexOf(current);
      if (curIdx === -1) { flow = flow.concat([current]); curIdx = flow.length - 1; }

      let html = '<div class="sm:col-span-2 md:col-span-3"><div class="bg-slate-50 border border-slate-100 rounded-xl px-4 py-4 overflow-x-auto">'
        + '<div class="flex items-start min-w-max w-full">';
      flow.forEach((name, i) => {
        const color = window.app.esc(colorOf(name));
        const label = window.app.esc(name);
        if (i > 0) {
          const lineColor = i <= curIdx ? color : '#e2e8f0';
          html += '<div class="h-0.5 flex-1 min-w-[28px] mx-1.5 rounded self-start mt-3.5" style="background:' + lineColor + '"></div>';
        }
        let circle = '';
        if (i < curIdx) {
          circle = '<div class="w-7 h-7 rounded-full text-white flex items-center justify-center text-[10px]" style="background:' + color + '"><i class="fas fa-check"></i></div>';
        } else if (i === curIdx) {
          circle = '<div class="w-7 h-7 rounded-full text-white flex items-center justify-center text-[10px] font-bold" style="background:' + color + ';box-shadow:0 0 0 4px ' + color + '33"><i class="fas fa-circle text-[6px]"></i></div>';
        } else {
          circle = '<div class="w-7 h-7 rounded-full bg-white border-2 border-slate-200 flex items-center justify-center"><i class="fas fa-circle text-[6px] text-slate-200"></i></div>';
        }
        const labelClass = i === curIdx ? 'text-slate-800' : (i < curIdx ? 'text-slate-600' : 'text-slate-400');
        html += '<div class="flex flex-col items-center shrink-0 gap-1.5">' + circle + '<span class="text-[10px] font-bold ' + labelClass + '">' + label + '</span></div>';
      });
      html += '</div></div></div>';
      return html;
    },
    openForm: function(data = null) {

      this.editingData = data; // จำไว้ให้ saveForm รู้ว่ากำลังแก้ไขของเดิมหรือสร้างใหม่ (ใช้กันสร้างรหัสซ้ำทับของเดิม)
      delete window.app.pendingImageUploads.gridImage; // เปิดฟอร์มใหม่ทุกครั้ง — ล้างไฟล์รูปที่ค้างจากฟอร์มก่อนหน้า (ถ้ามี)

        // ถ้าเปลี่ยนค่า ID ตอนแก้ไข ระบบจะหาแถวเดิมไม่เจอ กลายเป็นสร้างแถวใหม่ซ้อนแทนที่จะอัปเดต (ค่าเดิมค้างเป็นขยะ)

            if(c.type === 'multi_select_brand_gifts' || c.type === 'multi_select_channel_gifts') allLabel = 'แจกทุกชิ้นในหมวดนี้ (*)';

                // ให้สิทธิ์เมนูนี้กับ role อื่นจึงเปิดหน้าได้แต่กดบันทึก/อัปโหลดอะไรไม่ได้เลย (UI หลอกลวง) — อย่าเสนอเป็นตัวเลือกให้เลือกได้

                     <div class="flex gap-2">
                       <input type="text" class="${inputClass}" id="field_${c.key}" value="${escVal}" placeholder="วางลิงก์รูป (URL)" oninput="const pv=document.getElementById('gridImgPreview'); if(pv){ if(this.value.trim()){ pv.src=window.app.formatImageUrl(this.value); pv.classList.remove('hidden'); } else { pv.classList.add('hidden'); } }">
                       <button type="button" id="gridImgUploadBtn" class="px-3 py-2 bg-white border border-slate-200 text-slate-600 text-xs font-bold rounded-xl hover:bg-slate-50 transition-colors shadow-sm whitespace-nowrap" onclick="document.getElementById('gridImgFileInput').click()"><i class="fas fa-upload mr-1"></i> อัปโหลดรูป</button>
                       <input type="file" id="gridImgFileInput" class="hidden" accept="image/png,image/jpeg,image/webp,image/gif" onchange="window.app.selectImageForUpload(this, 'gridImage', function(localUrl){ const pv=document.getElementById('gridImgPreview'); if(pv){ pv.src=localUrl; pv.classList.remove('hidden'); } window.app.toast('เลือกรูปแล้ว — จะอัปโหลดขึ้น Drive ตอนกดบันทึกข้อมูล'); })">
                     </div>
                     <img id="gridImgPreview" src="${previewSrc}" alt="ตัวอย่างรูปสินค้า" class="h-16 w-16 object-cover rounded-lg border border-slate-200 shadow-sm ${hasVal ? '' : 'hidden'}" onerror="this.classList.add('hidden')">
                   </div>`;
        }
        else inp='<input type="' + c.type + '" class="'+inputClass+'" id="field_' + c.key + '" value="' + escVal + '" ' + dis + '>';
        
        fHtml += '<div><label class="block text-[10px] font-bold text-slate-500 mb-1.5 uppercase tracking-wider">' + c.label + '</label>' + inp + '</div>';
      });
      f.innerHTML = fHtml;
      if(document.getElementById('formModalTitle')) document.getElementById('formModalTitle').innerText = data ? 'จัดการแก้ไขข้อมูลเอกสาร' : 'ลงทะเบียนบันทึกข้อมูลใหม่'; 
      window.app.showModal('formModal');
    },
    onProductChange: function(sel) {
      const o = sel.options[sel.selectedIndex]; if(!o) return;
      const sku = document.getElementById('field_SKU'); const pr = document.getElementById('field_Unit Price');
      if(sku) sku.value=o.getAttribute('data-sku'); if(pr) pr.value=o.getAttribute('data-price'); this.calcOrderTotal();
    },
    calcOrderTotal: function() {
      const elQty = document.getElementById('field_Qty');
      const elPrice = document.getElementById('field_Unit Price');
      const t = document.getElementById('field_Row Total'); 
      if(!elQty || !elPrice || !t) return;
      const q = parseFloat(elQty.value||0); const p = parseFloat(elPrice.value||0);
      t.value=q*p;
    },
    // Products เปิดฟอร์มแก้ไขแบบหลาย SKU (แก้ไขทั้ง Model เดียวกันในหน้าเดียว) แทนฟอร์มแถวเดียวทั่วไป
    editForm: function(index) {
      const row = this.filteredDataList[index];
      if (this.tableName === 'Products') { window.app.productGroup.openEdit(row['Model']); return; }
      this.openForm(row);
    },
    // ปุ่ม "เพิ่มข้อมูล" ของ Products เปิดฟอร์มเพิ่มสินค้าแบบหลาย SKU แทนฟอร์มแถวเดียวทั่วไป
    handleAddClick: function() {
      if (this.tableName === 'Products') window.app.productGroup.open();
      else this.openForm();
    },
    // รีปริ้นใบจอง (พิมพ์ย้อนหลัง) — Orders 1 ออเดอร์ = หลายแถวในชีต (สินค้าหลัก+ของแถม+ส่วนลด) ต้องรวมกลับเป็น pay object เดียวให้ printReceipt ใช้ได้
    // ใช้ this.dataList (ทั้งตาราง ไม่ผ่านค้นหา/แบ่งหน้า) แทนการยิง GET_TABLE ใหม่ — ข้อมูลที่โหลดไว้แล้วครบพอ
    reprintOrder: function(orderId) {
      const rows = this.dataList.filter(r => r.OrderID === orderId);
      if (rows.length === 0) return Swal.fire('ไม่พบข้อมูล', 'ไม่พบรายการของออเดอร์นี้ในตารางที่โหลดไว้', 'warning');
      const firstNonEmpty = (field) => { const r = rows.find(r => r[field] && String(r[field]).trim() !== ''); return r ? r[field] : ''; };
      const num = (row, key) => parseFloat(String(row[key] === undefined || row[key] === null ? '' : row[key]).replace(/,/g, '')) || 0;

      const cart = []; const discounts = [];
      rows.forEach(row => {
        if (row.SKU === 'DISCOUNT') {
          discounts.push({ name: row['Product Name'], value: Math.abs(num(row, 'Row Total')) });
        } else {
          const isGift = num(row, 'Unit Price') === 0 && num(row, 'Row Total') === 0;
          cart.push({ SKU: row.SKU, 'Product Name': row['Product Name'], Price: row['Unit Price'], qty: parseInt(row.Qty, 10) || 0, isGiftLine: isGift });
        }
      });

      const pay = {
        cart: cart,
        customerName: firstNonEmpty('Customer Name'),
        contactPhone: firstNonEmpty('Contact Number'),
        email: firstNonEmpty('Email'),
        idCard: firstNonEmpty('ID Card_Passport'),
        branch: firstNonEmpty('Branch Code') || rows[0]['Branch Code'],
        bkStaffName: firstNonEmpty('Staff'),
        receiptNo: firstNonEmpty('Receipt No'),
        depositAmount: firstNonEmpty('Deposit'),
        discounts: discounts,
        discount: discounts.reduce((s, d) => s + d.value, 0)
      };
      window.app.printReceipt(orderId, pay);
    },
    saveForm: async function() {
      // 5B.5 — disabled + spinner ระหว่างรอ API (กัน double-click ก่อน modal ปิด)
      const btnSave = document.querySelector('#formModal [onclick="window.app.grid.saveForm()"]');
      if (btnSave && btnSave.disabled) return;
      const restoreBtn = window.app.buttonBusy(btnSave) || function(){};

      const pay = {};

      this.columns.forEach(c => { 
        if (c.type.startsWith('multi_select_')) {
           let safeKey = c.key.replace(/\s+/g, '');
           let checked = Array.from(document.querySelectorAll(`.chk-group-${safeKey}:checked`)).map(el => el.value);
           if(c.type === 'multi_select_channel' && checked.includes('ALL')) pay[c.key] = 'ALL';
           else if(checked.includes('*')) pay[c.key] = '*';
           else pay[c.key] = checked.join(', ');
        } else {
           const el=document.getElementById('field_' + c.key); 
           if(el) pay[c.key]=el.value; 
        }
      });

      // ส่ง _rowIndex ของแถวเดิมไปด้วยตอนแก้ไข (ไม่ใช่ Orders — มี field '_rowIndex' hidden ของตัวเองอยู่แล้วในคอลัมน์ config) ให้ saveRecord (Code.js)
      // ใช้ชี้แถวที่จะอัปเดตตรงๆ แทนการไล่เทียบค่า ID เฉยๆ — กันกรณี ID ที่พิมพ์แก้ไขบังเอิญไปชนกับแถวอื่น
      if (this.editingData && this.tableName !== 'Orders') pay._rowIndex = this.editingData._rowIndex;

      // กันสร้างรายการใหม่ด้วยรหัสที่มีอยู่แล้ว — saveRecord ฝั่ง server เจอรหัสซ้ำจะ "อัปเดตทับ" ของเดิมเงียบๆ
      // (เช่น เพิ่มสินค้าใหม่แต่พิมพ์ SKU เดิม = สินค้าเดิมถูกเขียนทับหาย) — บล็อกไว้ตั้งแต่ฝั่งฟอร์ม (server เพิ่ง throw ด้วยเหมือนกันแล้ว เป็นแค่ fast-path UX)
      if (!this.editingData && this.tableName !== 'Orders') {
        const newIdVal = String(pay[this.idField] || '').trim();
        if (newIdVal && this.dataList.some(r => String(r[this.idField] || '').trim() === newIdVal)) {
          restoreBtn();
          Swal.fire('รหัสซ้ำ', 'มีรายการที่ใช้ ' + window.app.esc(this.idField) + ' "' + window.app.esc(newIdVal) + '" อยู่แล้ว — หากต้องการแก้ไขรายการเดิม กรุณากดปุ่มแก้ไขที่รายการนั้นแทน', 'warning');
          return;
        }
      }

      if (window.app.pendingImageUploads.gridImage) {
        try {
          const uploadedUrl = await window.app.flushImageUpload('gridImage');
          if (uploadedUrl) pay['Image URL'] = uploadedUrl;
        } catch (e) {
          restoreBtn();
          Swal.fire('ผิดพลาด', e.message || 'อัปโหลดรูปไม่สำเร็จ', 'error');
          return;
        }
      }

      window.app.hideModal('formModal');
      setTimeout(async () => {
         window.app.showLoading('กำลังบันทึกข้อมูล...');
         try {
           let res;
           if(this.tableName==='Orders') res = await window.app.api('UPDATE_FULL_ORDER', { data: pay });
           else res = await window.app.api('SAVE_RECORD', { tableName: this.tableName, idField: this.idField, data: pay });
           if(res && res.status==='success'){
             await window.app.refreshGlobalData();
             if (res.generatedPassword) {
               // สมาชิกใหม่เว้นรหัสผ่านว่าง — server สุ่มรหัสผ่านให้ ต้องโชว์ครั้งเดียวตอนนี้เพราะจะไม่ถูกส่งกลับมาอีก (rule 5)
               Swal.fire({ icon: 'success', title: 'สร้างสมาชิกสำเร็จ', html: 'รหัสผ่านที่สุ่มให้: <b>' + window.app.esc(res.generatedPassword) + '</b><br><span class="text-xs text-slate-500">กรุณาบันทึกไว้และแจ้งพนักงาน — จะไม่แสดงซ้ำอีก</span>' });
             } else {
               Swal.fire({ icon: 'success', title: 'อัปเดตข้อมูลเสร็จสิ้น', showConfirmButton: false, timer: 1500 });
             }
             this.loadData();
           } else Swal.fire('ผิดพลาด',res ? res.message : 'Error', 'error');
         } catch(e) { Swal.fire('ผิดพลาด', e.message || 'Error', 'error'); }
         finally { restoreBtn(); }
      }, 350);
    },
    deleteRecord: async function(id) {
      if((await Swal.fire({ title: 'คุณต้องการลบข้อมูลนี้?', text: "การดำเนินการนี้ไม่สามารถย้อนกลับได้ประจำระบบล็อกไฟล์", icon: 'warning', showCancelButton: true, confirmButtonColor: '#e11d48', confirmButtonText: 'ลบถาวร', cancelButtonText: 'ยกเลิก' })).isConfirmed){
        window.app.showLoading('กำลังลบข้อมูล...');
        try {
          const res = await window.app.api('DELETE_RECORD', { tableName:this.tableName, idField:this.idField, idValue:id });
          if(res && res.status==='success') { await window.app.refreshGlobalData(); Swal.fire({ icon: 'success', title: 'ลบข้อมูลสำเร็จแล้ว', showConfirmButton: false, timer: 1200 }); this.loadData(); } else Swal.fire('Error',res ? res.message : 'Error','error');
        } catch(e) { Swal.fire('Error', e.message || 'Error', 'error'); }
      }
    },
    // 5B.3 — export ตามที่กรอง/ค้น/เรียงอยู่ (filteredDataList ไม่ใช่ dataList) เป็น CSV ที่ Excel เปิดภาษาไทยถูก (BOM)
    // ปุ่ม "นำเข้า CSV" — สินค้าใช้ตัวนำเข้าเฉพาะ (หลาย SKU/ฟิลด์ร่วมของรุ่น) ตารางอื่นใช้ตัวนำเข้ากลาง window.app.importer
    handleImportClick: function() {
      if (this.tableName === 'Products') return window.app.productGroup.openImport();
      return window.app.importer.open(this.tableName);
    },
    exportCSV: function() {
      if (this.filteredDataList.length === 0) return Swal.fire('ไม่มีข้อมูล', 'ไม่มีรายการให้ export ตามตัวกรองปัจจุบัน', 'warning');
      const cols = this.columns.filter(c => c.type !== 'hidden').map(c => c.key);
      const escCell = (v) => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
      let csv = "\uFEFF" + cols.map(escCell).join(',') + '\r\n'; // BOM นำหน้าให้ Excel เปิดภาษาไทยถูก (escape ไว้ ไม่ฝังตัวอักษรล่องหนในซอร์ส)
      this.filteredDataList.forEach(row => { csv += cols.map(k => escCell(row[k])).join(',') + '\r\n'; });
      // ชื่อไฟล์ใช้วันที่ local — ห้าม toISOString (UTC ทำให้วันเลื่อนถอยหลังในโซน +7)
      const d = new Date();
      const fname = this.tableName.toLowerCase() + '_' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + '.csv';
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }
  };
</script>
